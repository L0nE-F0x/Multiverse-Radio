<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Multiverse Radio</title>
    <meta
      name="description"
      content="Endless radio from other dimensions. You work the night shift on the relay ship Nightjar: 42 stations, and pirates, beacons and secrets between them. Press play. It never runs out."
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Multiverse" />

    <!-- Social cards. The build makes these URLs absolute and copies this page to
         /station/<id>/ for every main station with that station's title, description and
         card (src/pwa/vite-plugins.mjs, scripts/share/). Cards: npm run share:cards -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Multiverse Radio" />
    <meta property="og:title" content="Multiverse Radio" />
    <meta
      property="og:description"
      content="You work the night shift on the relay ship Nightjar, listening in on 42 stations from other dimensions, and on the pirates, beacons and ghosts between them. Generative music, deadpan hosts. It never runs out."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The viewport of the relay ship Nightjar under an amber terminal readout: Multiverse Radio, 42 stations from other dimensions."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Multiverse Radio" />
    <meta
      name="twitter:description"
      content="The night shift on the relay ship Nightjar: 42 stations from other dimensions, and whatever is between them. Press play. It never runs out."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The viewport of the relay ship Nightjar under an amber terminal readout: Multiverse Radio, 42 stations from other dimensions."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Multiverse Radio needs JavaScript to warm up its tubes and tune into other dimensions.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
