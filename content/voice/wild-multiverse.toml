# Wild Multiverse — Sir Reginald Thistlewood, a very long way from a road.
# Hushed, reverent, deeply moved by every creature, including the ones trying to eat the
# crew. Pip is the camera operator and is having a difficult series.
station = "wild-multiverse"

[voices]
host = { voice = "bm_george", speed = 0.92, name = "Sir Reginald Thistlewood" }
pip = { voice = "am_liam", fx = "whisper", name = "Pip (Camera)" }

