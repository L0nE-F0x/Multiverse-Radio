# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "teodor-is-heard-08"
category = "story"
serial = { id = "teodor-is-heard", episode = 8 }
title = "Teodor Is Heard, Part Eight: The Relay Gull"
bed = "wind"
lines = [
  { say = "host", text = "Today, an expedition to the very edge of the dial, to film one of the rarest creatures in the multiverse. The relay keeper." },
  { say = "host", text = "Note the cardigan. Note the kettle, which is always on. Each night the keeper climbs his tower and calls a single question into the dark.", gap = 0.8 },
  { say = "teodor", text = "Is anyone receiving this.", gap = 1.2 },
  { say = "pip", text = "Sir Reginald. Something's coming. It's mostly beak." },
  { say = "host", text = "And here, at three o'clock precisely, the relay gull. Known to the keeper as Captain.", gap = 0.8 },
  { say = "host", text = "Each afternoon the gull arrives with small rolled pieces of paper in its beak. Messages. From listeners all across the dial. Replies.", gap = 1.0 },
  { say = "host", text = "Now, observe.", gap = 1.4 },
  { say = "pip", text = "He's eating them." },
  { say = "host", text = "He is eating them, Pip. Every one. For eleven years, the relay gull has carried replies to the relay keeper, and eaten them on the doorstep.", gap = 1.0 },
  { say = "host", text = "The keeper does not know. He pats the gull, and gives it a biscuit, and says, no post today, Captain.", gap = 1.4 },
  { say = "pip", text = "Should we tell him?" },
  { say = "host", text = "We are a nature documentary, Pip. We do not interfere.", gap = 1.6 },
  { say = "host", text = "Pip has gone to tell him.", gap = 1.0 },
  { say = "host", text = "Pip has interfered. Magnificently.", gap = 1.2 },
  { say = "teodor", text = "They're replies? All of them? For eleven years?", gap = 1.2 },
  { say = "teodor", text = "Captain. You absolute gull." },
]

