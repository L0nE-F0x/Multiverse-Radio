# Yesterday FM — 100.85, twenty-four hours ago.
#
# Gordon Ago broadcasts from yesterday. Everything he reports has already happened and
# turned out fine, more or less. The calendar is stuck on yesterday, the tea has already
# gone cold, the clock runs gently backwards, and the soft rock is golden. He can't tell
# you about tomorrow: he's only licensed for yesterday.
#
# The `news` kit chains a headline intro, one to three stories that are already over, and
# a sign-off with yesterday's weather.
station = "yesterday-fm"

[voices]
gordon = { voice = "am_onyx", speed = 0.92, name = "Gordon Ago" }
maggie = { voice = "af_sarah", fx = "phone", name = "Maggie, Worried About Tomorrow" }

[[show]]
id = "yesterday-morning"
name = "Yesterday Morning"
blurb = "The breakfast show from yesterday. The toast is already eaten. It was lovely."
start = 6
end = 10

[[show]]
id = "afternoon-before"
name = "The Afternoon Before"
blurb = "Gentle songs and reassuring news from a long, golden afternoon that has already ended well."
start = 14
end = 17

[[show]]
id = "last-night-tonight"
name = "Last Night, Tonight"
blurb = "Gordon goes through last night, hour by hour. Nothing bad happened in any of them."
start = 22
end = 2

