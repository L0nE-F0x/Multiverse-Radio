[[clip]]
id = "call-001"
category = "call"
title = "Maggie, Worried About Tomorrow"
lines = [
  { sfx = "phone-ring" },
  { say = "gordon", text = "Yesterday FM. You're on the air." },
  { say = "maggie", text = "Gordon, I've got a big day tomorrow, and I'm worried." },
  { say = "gordon", text = "I can't tell you about tomorrow, I'm afraid. I'm only licensed for yesterday." },
  { say = "maggie", text = "Oh." },
  { say = "gordon", text = "But I can tell you about yesterday. Yesterday, you were worried about today. And here you are, today, on the phone to the radio, making plans. You got through it." },
  { say = "maggie", text = "I suppose I did." },
  { say = "gordon", text = "Ring me the day after tomorrow. I'll tell you how it went." },
  { say = "maggie", text = "All right, Gordon. Thank you." },
