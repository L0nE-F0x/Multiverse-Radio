category = "weather"
title = "Yesterday's Weather, in Full"
lines = [
  { sting = "weather" },
  { say = "gordon", text = "Yesterday's weather, in full. The morning was grey, and then it made up its mind. Light winds from the west, which is where they'd been heading all along." },
  { say = "gordon", text = "In the afternoon, a cloud shaped like a dog went over Pell Street. Then it was evening, and then it was night, and then it was today.", gap = 0.8 },
  { say = "gordon", text = "And here we are." },
]

[[clip]]
id = "weather-002"
category = "weather"
