  { say = "hebblethwaite", text = "Vicar. It's Hebblethwaite." },
  { say = "host", text = "Ah, Mister Hebblethwaite. And how is the marrow?" },
  { say = "hebblethwaite", text = "Coming along, Vicar. I've had to move the greenhouse. Well. I've had to move the greenhouse off it." },
  { say = "host", text = "Will it be ready for the judging?" },
