  { say = "hebblethwaite", text = "Vicar. Can you hear that?" },
  { say = "host", text = "Hear what?" },
  { say = "hebblethwaite", text = "That's it growing.", gap = 1.2 },
  { say = "host", text = "Lovely, Mister Hebblethwaite. Lovely." },
  { sfx = "phone-hangup" },
]

