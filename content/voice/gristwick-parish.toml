# Gristwick Parish Radio — 103.45, Gristwick-under-Gristwick.
#
# Live coverage of the village fête, now in its three hundredth consecutive year. The
# Reverend Clement Ashby is vicar, commentator and tombola steward. He has declared the fête
# open every morning for three hundred years and would very much like, one day, to close it.
# The fête closes when the tombola has been drawn. The tombola has some way to go.
#
# Modular kits (the director chains open → 1–3 bodies → close):
#   results (sports) — from the judging marquee: marrow, tug of war, sponges, dog show
#   notices (psa)    — from the steps of the tea tent: lost children, raffle, lost property
# Running bits: Mr Hebblethwaite's marrow (size of a motor coach, has its own postcode); the
# Silver Band, nearly at the trio section; the tug of war, taken up in 1780; the urn.
# Cross-station: Biscuit from Lower Hollow wins the waggiest tail in absentia; the rain from
# Smoke Ring Trio's applause; Bev and her song.
station = "gristwick-parish"

[voices]
host = { voice = "bm_george", speed = 0.95, name = "Reverend Clement Ashby" }
pargeter = { voice = "bf_alice", name = "Mrs Pargeter, Head Judge" }
hebblethwaite = { voice = "bm_fable", fx = "phone", name = "Mr Hebblethwaite" }

[[show]]
id = "the-opening"
name = "The Opening of the Fête"
blurb = "Every morning the Reverend Ashby declares the fête open. Again. Live from the tea tent steps."
start = 8
end = 10

[[show]]
id = "evensong-results"
name = "Evensong and Results"
blurb = "The day's results from the judging marquee, the bells, and the band, nearly at the trio section."
start = 17
end = 19

[[show]]
id = "the-night-fete"
name = "The Night Fête"
blurb = "The fête doesn't close at night. Fairy lights, a lantern on the marrow, and the urn still on."
start = 23
end = 3

