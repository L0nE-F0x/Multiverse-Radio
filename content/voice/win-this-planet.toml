# Win This Planet! — 100.0, Studio Infinity, before a live studio audience of one.
#
# Chaz Brightley reads every question as if it were the final one. It never is. The
# questions are about the contestants themselves, and the contestants get them wrong:
# Unit Seven (a robot with no self found), Wendell (a nervous blob) and Grandma Hester
# (whose answer to everything is nineteen fifty-two; it is finally right at Halloween).
# The studio audience is Lorraine. She claps alone. Nobody has ever won the planet. The
# consolation prize is a toaster that wins you another toaster.
#
# The `quiz` kit chains a question, one to three attempts and the scores. Every question
# is an open question about yourself, so every wrong answer fits every question.
station = "win-this-planet"

[voices]
chaz = { voice = "am_puck", speed = 1.12, name = "Chaz Brightley" }
robot = { voice = "am_adam", fx = "robot", name = "Unit Seven" }
wendell = { voice = "am_echo", speed = 1.15, name = "Wendell, a Nervous Blob" }
hester = { voice = "bf_isabella", name = "Grandma Hester" }
lorraine = { voice = "af_bella", name = "Lorraine, the Studio Audience" }
announcer = { voice = "am_fenrir", fx = "trailer", name = "The Announcer" }

[[show]]
id = "primetime"
name = "Win This Planet!"
blurb = "The quiz where the questions are about you, and the answers are wrong. Live, before a studio audience of one."
start = 19
end = 22

[[show]]
id = "win-this-moon"
name = "Win This Moon!"
blurb = "The daytime spin-off. Smaller prizes, smaller stakes, the same three contestants."
start = 12
end = 15

[[show]]
id = "graveyard-round"
name = "The Graveyard Round"
blurb = "Late-night quizzing with the lights down and the buzzer muffled. The planet is asleep. Don't wake it."
start = 1
end = 4

