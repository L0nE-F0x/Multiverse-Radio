# Bedtime for Giants — 102.6, a bedroom the size of a valley.
#
# Nanny Bramblewick reads sleep stories to giants, very slowly, so the ends arrive gently.
# She has never once finished a story: nobody has stayed awake for one. Her regular
# listeners are Bartholomew (whose feet are in the next county) and Little Agnes (two
# hundred feet tall, with a village on her knee). Ambient station: voices are rare, long
# and soft, over sleep-ish beds.
#
# The `walk-home` kit chains the start of a giant's walk home, one to three things he
# passes on the way, and the moment he's nearly there. It never quite arrives.
station = "bedtime-for-giants"

[voices]
nanny = { voice = "bf_emma", speed = 0.82, name = "Nanny Bramblewick" }
bartholomew = { voice = "am_fenrir", speed = 0.85, fx = "giant", name = "Bartholomew, a Giant" }
agnes = { voice = "af_bella", speed = 0.85, fx = "giant", name = "Little Agnes, a Giant" }

[[show]]
id = "long-lullaby"
name = "The Long Lullaby"
blurb = "Slow stories for very large listeners, read until the last one drops off."
start = 21
end = 1

[[show]]
id = "very-early-stories"
name = "Very Early Stories"
blurb = "For giants who wake before the sun. It isn't morning yet. Roll over."
start = 3
end = 6

[[show]]
id = "afternoon-nap"
name = "The Afternoon Nap"
blurb = "A short story for a long nap. Giants nap for about a fortnight."
start = 13
end = 16

