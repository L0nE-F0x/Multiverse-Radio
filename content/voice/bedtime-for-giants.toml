# ── Stories ───────────────────────────────────────────────────────────────────

[[clip]]
id = "story-001"
category = "story"
title = "The Mountain Who Wanted a Hat"
bed = "wind"
lines = [
  { say = "nanny", text = "Once upon a time, there was a mountain who wanted a hat.", gap = 1.0 },
  { say = "nanny", text = "All the other mountains had snow on top, white and neat, like a good wool hat. But this was a low, round sort of mountain, and the snow never stayed. Every winter it slid off, and went to live in the valley." },
  { say = "nanny", text = "So the mountain asked the clouds. Excuse me, it said, in its slow, stony voice. Would one of you sit on my head? Just for a while?", gap = 0.8 },
  { say = "nanny", text = "And a small grey cloud, who had nowhere in particular to be, said: all right.", gap = 1.2 },
  { say = "nanny", text = "And it sat there, on the mountain's head, all afternoon, and all evening. And the mountain felt very smart, and very warm, and a little bit..." },
  { pause = 3.0 },
  { say = "nanny", text = "Oh. He's asleep.", gap = 1.0 },
  { say = "nanny", text = "Goodnight, Bartholomew. There's a cloud on your head, dear. Leave it. It's company." },
]

[[clip]]
id = "story-002"
category = "story"
title = "The Very Small Moon"
bed = "night"
lines = [
  { say = "nanny", text = "Once upon a time, a giant found a very small moon. It was sitting in a field, about the size of a turnip, glowing a little, and looking lost.", gap = 1.0 },
  { say = "nanny", text = "Are you a moon, said the giant. I'm trying to be, said the moon. But I've come down too far, and I don't know the way back up.", gap = 1.0 },
  { say = "nanny", text = "So the giant took it home in his pocket, and put it on the windowsill by his bed. And every night it glowed, just enough to see the edge of the quilt by." },
  { say = "nanny", text = "Some nights it was full, and some nights it was only a little slice, because it didn't want to be any trouble.", gap = 1.5 },
  { say = "nanny", text = "And the giant would look at the moon, and the moon would look at the giant, and they'd both think: well. This is nice. And slowly, very slowly, the giant's eyes..." },
  { pause = 3.0 },
  { say = "nanny", text = "There. Goodnight, Agnes. Leave the moon on." },
]

[[clip]]
id = "story-003"
category = "story"
title = "The Sheep Who Counted Back"
bed = "night"
lines = [
  { say = "nanny", text = "There was once a giant who couldn't sleep, so he counted sheep.", gap = 0.8 },
  { say = "nanny", text = "Now, sheep are very small, to a giant, so he needed a great many. He counted a thousand, and then ten thousand, and he wasn't the least bit tired. But the sheep were. They'd been going over that fence all night." },
  { say = "nanny", text = "So the oldest sheep, whose name was Margery, stopped at the top of the fence, and turned round, and began to count the giant.", gap = 1.2 },
  { say = "nanny", text = "One giant, said Margery.", gap = 1.5 },
  { say = "nanny", text = "One giant.", gap = 1.5 },
  { say = "nanny", text = "One giant.", gap = 1.5 },
  { say = "nanny", text = "It's very restful, being counted. It means somebody has noticed you're there, and that you're one, and that one is enough.", gap = 2.0 },
  { say = "nanny", text = "One giant.", gap = 2.5 },
  { say = "nanny", text = "Goodnight." },
]

[[clip]]
id = "story-004"
category = "story"
title = "The Giant Who Hid Too Well"
bed = "wind"
lines = [
  { say = "nanny", text = "Once there was a giant who loved hide and seek, but was very bad at it, being about the size of a hill.", gap = 0.8 },
  { say = "nanny", text = "He'd hide behind a forest, and his head would stick out of the top. He'd hide behind a lake, and everyone could see his knees.", gap = 1.0 },
  { say = "nanny", text = "So one day he lay down in a field, and kept very still. So still that grass grew on him. So still that a sheep wandered up his arm, and a little path wore across his tummy, and a family came and had a picnic on his knee." },
  { say = "nanny", text = "And nobody found him. Not for years. And he lay there, very happy, listening to the picnics.", gap = 2.0 },
  { say = "nanny", text = "He won, in the end. He's still winning, actually.", gap = 1.0 },
  { say = "nanny", text = "Shh. Don't tell anyone where he is." },
]

[[clip]]
id = "story-005"
category = "story"
title = "The Lighthouse Who Told Stories"
bed = "sea"
lines = [
  { say = "nanny", text = "There was once a lighthouse who told bedtime stories to the ships.", gap = 0.8 },
  { say = "nanny", text = "It didn't have a voice, so it told them with its light. One flash for each word. Very slowly. Out across the dark water.", gap = 1.2 },
  { say = "nanny", text = "Once.", gap = 2.0 },
  { say = "nanny", text = "Upon.", gap = 2.0 },
  { say = "nanny", text = "A.", gap = 2.0 },
  { say = "nanny", text = "Time.", gap = 2.0 },
  { say = "nanny", text = "It took a very long time to tell a story that way. The ships didn't mind. They rocked on the water, and watched the light come round, and waited for the next word, the way you wait for the next breath." },
  { say = "nanny", text = "Nobody ever found out how the stories ended. Not one ship. They were always asleep by the fourth word.", gap = 1.5 },
  { say = "nanny", text = "Very sensible, ships." },
]

[[clip]]
id = "story-006"
category = "story"
title = "The Giant's Slippers"
bed = "rain"
lines = [
  { say = "nanny", text = "A giant's slippers are very large, and very old, and very patient.", gap = 0.8 },
  { say = "nanny", text = "Every night they wait by the bed, side by side, like two warm boats tied up in a harbour. And every night, the giant steps out of them and climbs into bed, and the slippers stay where they are, keeping each other company." },
  { say = "nanny", text = "They talk a little, once the lights are out. The left one worries about the stairs. The right one says, he always manages. And he does.", gap = 1.2 },
  { say = "nanny", text = "And when the rain comes, like tonight, they listen to it on the window, and they think: we're inside. We're together. The feet will be back in the morning.", gap = 2.0 },
  { say = "nanny", text = "That's all slippers want, really." },
]

