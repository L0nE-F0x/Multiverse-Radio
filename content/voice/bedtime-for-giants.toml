category = "story"
kit = "walk-home"
part = "open"
bed = "night"
lines = [
  { say = "nanny", text = "Once, not very long ago, a giant set off home after a long day of being enormous." },
]

[[clip]]
id = "walk-001"
category = "story"
kit = "walk-home"
part = "body"
bed = "night"
lines = [
  { say = "nanny", text = "He walked past a forest so old it had forgotten it was a forest, and thought it was a crowd. A very tall, very quiet crowd, waiting for something nice to happen.", gap = 1.0 },
  { say = "nanny", text = "He tiptoed past. Giants can tiptoe. It takes about a week." },
]

[[clip]]
id = "walk-002"
category = "story"
kit = "walk-home"
part = "body"
bed = "night"
lines = [
  { say = "nanny", text = "He stepped over a river. It was a small river, and he was a large giant, so he stepped over it the way you would step over a ribbon.", gap = 1.0 },
  { say = "nanny", text = "The river said thank you. Rivers are very polite, if you don't stand in them." },
]

[[clip]]
id = "walk-003"
category = "story"
kit = "walk-home"
part = "body"
bed = "night"
lines = [
  { say = "nanny", text = "He passed a village with all its lights out but one. In the one lit window, a girl was reading under a blanket with a torch." },
  { say = "nanny", text = "He bent down, very slowly, and blew the curtains closed. Just a little breath. Like this.", gap = 2.0 },
  { say = "nanny", text = "Goodnight, girl with the torch.", fx = "whisper" },
]

[[clip]]
id = "walk-004"
category = "story"
kit = "walk-home"
part = "body"
bed = "night"
lines = [
  { say = "nanny", text = "An owl landed on his shoulder, and asked where he was going. Home, said the giant. The owl said that sounded nice, and stayed for the ride.", gap = 1.0 },
  { say = "nanny", text = "Owls are good company. They don't talk much. Now and then they say who, to keep you on your toes." },
]

[[clip]]
id = "walk-005"
category = "story"
kit = "walk-home"
part = "body"
bed = "night"
lines = [
  { say = "nanny", text = "The clouds came down low to see who was walking, and he walked right through them, and for a while he couldn't see his own feet.", gap = 1.0 },
  { say = "nanny", text = "That's all right, he thought. They know the way." },
]

[[clip]]
id = "walk-006"
category = "story"
kit = "walk-home"
part = "body"
bed = "night"
lines = [
  { say = "nanny", text = "He counted the stars as he walked. He got to eleven thousand, and lost his place, and had to start again.", gap = 1.0 },
  { say = "nanny", text = "He didn't mind. It's a good thing, to have something to count that never runs out." },
]

[[clip]]
id = "walk-close-1"
category = "story"
kit = "walk-home"
part = "close"
bed = "night"
lines = [
  { say = "nanny", text = "And by then, he was nearly home.", gap = 1.0 },
  { say = "nanny", text = "And so are you. Goodnight." },
]

[[clip]]
id = "walk-close-2"
category = "story"
kit = "walk-home"
part = "close"
bed = "night"
lines = [
  { say = "nanny", text = "And then he yawned. Such a big yawn that the wind turned round.", gap = 1.0 },
  { say = "nanny", text = "Goodnight, giant. Goodnight, you." },
]

[[clip]]
id = "walk-close-3"
category = "story"
kit = "walk-home"
part = "close"
bed = "night"
lines = [
  { say = "nanny", text = "We'll find out what happened next tomorrow.", gap = 1.0 },
  { say = "nanny", text = "We never do. Sleep well." },
]

