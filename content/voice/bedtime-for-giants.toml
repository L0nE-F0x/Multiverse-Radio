]

# ── Halloween ─────────────────────────────────────────────────────────────────

[[clip]]
id = "halloween-1"
category = "story"
title = "The Ghost Who Was Too Small"
bed = "wind"
dates = ["10-24", "10-25", "10-26", "10-27", "10-28", "10-29", "10-30", "10-31"]
lines = [
  { say = "nanny", text = "Once upon a time, a very small ghost went to haunt a giant.", gap = 0.8 },
  { say = "nanny", text = "It floated up the stairs, which took most of the night, and into the giant's bedroom, and it said: boo.", gap = 1.0 },
  { say = "nanny", text = "The giant didn't hear. So the ghost said it again, louder. Boo.", gap = 1.0 },
  { say = "nanny", text = "The giant opened one enormous eye, and looked at the ghost, and said: oh. A moth. And went back to sleep.", gap = 1.2 },
  { say = "nanny", text = "The ghost was very offended. But it was also very tired, after all those stairs, and the lampshade looked warm. So it curled up inside. Just for a minute." },
  { say = "nanny", text = "It lives there now. It keeps the light soft. Some nights it says boo, very quietly, to itself, just to keep its hand in.", gap = 1.5 },
  { say = "nanny", text = "Goodnight, little ghost." },
]

[[clip]]
id = "halloween-2"
category = "dj"
title = "A Sheet in the Valley"
dates = ["10-24", "10-25", "10-26", "10-27", "10-28", "10-29", "10-30", "10-31"]
lines = [
  { say = "nanny", text = "It's nearly Halloween, so if you see a very large sheet walking about the valley this week, please don't be frightened." },
  { say = "agnes", text = "Nanny? I can't find my nightie." },
  { say = "nanny", text = "That's only Agnes." },
]


# ══ v4: The Convergence ═══════════════════════════════════════════════════════
#
# Saturdays, 20:00 UTC: every station notices the same thing. One reaction per topic
# (SCHEMA.md, "The Convergence"); the director airs the _events open, then the tuned
# station's reaction, then the close.

[[clip]]
id = "convergence-missing-moon"
category = "event"
title = "The Convergence: A Moon Goes Missing"
event = "convergence"
kit = "missing-moon"
lines = [
  { say = "agnes", text = "Nanny, a moon's gone." },
  { say = "nanny", text = "Has it, dear?" },
  { say = "agnes", text = "Everyone says so." },
  { say = "nanny", text = "Then it's gone to bed. Which is where you are. Goodnight, Agnes." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
title = "The Convergence: Toast, Everywhere"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "bartholomew", text = "Nanny... I can smell toast." },
  { say = "nanny", text = "Everyone can, dear. Close your eyes, and it'll be breakfast in the morning." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
title = "The Convergence: The Song Nobody Can Finish"
event = "convergence"
kit = "the-song"
lines = [
  { say = "nanny", text = "There's a little song going round tonight. Nobody knows the end of it." },
  { say = "nanny", text = "Which is the very best kind, for bedtime. Shh." },
]

[[clip]]
id = "convergence-the-knock"
category = "event"
title = "The Convergence: Three Knocks"
event = "convergence"
kit = "the-knock"
lines = [
  { say = "nanny", text = "Three little knocks at the bedroom door. Nobody there." },
  { say = "nanny", text = "Just a dream, knocking a bit early. Let it in when you're ready, dear." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
title = "The Convergence: A Colour With No Name"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "nanny", text = "The sky went a colour just now, dears. There isn't a word for it." },
  { say = "nanny", text = "It's a colour for sleeping. You only see it with your eyes closed." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
title = "The Convergence: The Pigeon"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "agnes", text = "Nanny, there's a pigeon in the village. On my knee." },
  { say = "nanny", text = "Is it a nice pigeon?" },
  { say = "agnes", text = "It knows everyone." },
  { say = "nanny", text = "Then it can stay. Goodnight, pigeon." },
]
