  { say = "linda", text = "Seeking. The request line.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Placed by Bev, of the eastern Overlap. Bev writes. I am looking for a song. I heard it in a lift, eleven years ago, with a man called Stan, who cried at everything.", speed = 0.95, gap = 0.6 },
  { say = "linda", text = "Stan cried at weddings. Stan cried at adverts. Stan cried at a nice bridge in the rain. Stan cried when the lift doors opened, because he'd liked it in there.", speed = 0.95, gap = 0.6 },
  { say = "linda", text = "Stan is gone now. I would like to hear the song once more, on the radio, so that somebody cries at it again. Please call.", speed = 0.95, gap = 1.4 },
  { say = "rex", text = "Folks, I've got a request line on the lot. Barely used. I could do Bev a deal.", speed = 1.0 },
  { say = "linda", text = "No, Rex. Some things are for finding.", speed = 1.0, gap = 0.8 },
  { say = "linda", text = "We've had one reply, from the Multiverse Broadcast Authority. It says. The request line was never a telephone number. It was a man. His name is Teodor. He's at Relay Four. He's been trying to get through.", speed = 0.95, gap = 1.0 },
  { say = "rex", text = "The guy who asks if anyone's receiving?", speed = 1.0 },
  { say = "linda", text = "That's the guy, Rex.", speed = 1.0, gap = 1.0 },
  { say = "rex", text = "Folks. Somebody get that man a receiver. I'll do it at cost.", speed = 1.0 },
  { say = "linda", text = "That's the nicest thing you've ever said.", speed = 1.0 },
  { say = "rex", text = "Don't tell anyone.", speed = 1.0 },
]

