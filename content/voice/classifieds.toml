  { say = "linda", text = "Lost. One head. Answers to nothing, as it is a long way from its ears. If found, please return to the gentleman on the horse. He is very polite, and keeps bumping into things.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Found. A pumpkin on my doorstep with a face carved into it. The face is mine. I have not carved anything. It's a good likeness. I'd like to know who's been looking.", speed = 0.95, gap = 0.9 },
