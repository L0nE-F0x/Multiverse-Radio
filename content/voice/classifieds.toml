# ── Personals, lost and found, private sales ──────────────────────────────────

[[clip]]
id = "story-001"
category = "story"
title = "Personals, Lost and Found"
lines = [
  { sting = "chime" },
  { say = "rex", text = "And now, the personals, and the lost and found, read by Linda, who reads them slowly, because she says they deserve it. Linda?" },
  { say = "linda", text = "Thank you, Rex.", speed = 0.95, gap = 0.8 },
  { say = "linda", text = "Lost. One shadow. Answers to Greg. Last seen leaving without me. If found, please do not approach. Greg has made his choice.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "For sale. Haunted mirror. Shows you exactly as you are. Very upsetting. Make an offer.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Seeking. A tall, dark stranger to stand at the end of my garden. Must be patient. Must be quiet. I already have one. Looking for a second.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Found. A Tuesday. Mostly intact. Some damage to the afternoon. Claim at the front desk.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Free to a good home. My thoughts. Please take them. They are not house trained.", speed = 0.95, gap = 1.0 },
  { say = "rex", text = "Remember, folks. If you can't find it, it's probably in another reality. If you can find it, it probably isn't yours!" },
  { sting = "chime" },
]

[[clip]]
id = "story-002"
category = "story"
title = "The Personals"
lines = [
  { sting = "chime" },
  { say = "rex", text = "Personals time, folks! Linda?" },
  { say = "linda", text = "Seeking. A song. It goes dum, dum, da dum, and then a man cries. If you are this song, or know where it is, please call Bev. Bev has been looking for a long time.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Man, four seconds behind, seeks woman, four seconds ahead. Let's meet in the middle. I'll be there in a minute. You already are.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Lighthouse keeper at Relay Four seeks anyone. Anyone at all. Good listener. Has kettle.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Retired giant, gentle, seeks small friend for long walks. Will walk slowly. Will look where he's going. Has never once stepped on anybody, and would like that on the record.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Reflection, thirties, left handed, seeks a person who smiles first. Tired of always going second.", speed = 0.95, gap = 1.0 },
  { say = "rex", text = "Beautiful, Linda. Just beautiful.", speed = 1.0 },
  { say = "linda", text = "Thank you, Rex.", speed = 0.95 },
]

[[clip]]
id = "story-003"
category = "story"
title = "Lost and Found"
lines = [
  { sting = "chime" },
  { say = "rex", text = "Lost and found! Linda, what have we got?" },
  { say = "linda", text = "Lost. The thread. Of a conversation. Last seen at a dinner party, around the time somebody said, anyway. If found, please return it. We were getting somewhere.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Found. A key. It opens something. We have tried everything. It is not this. It is not that. It is possibly you.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Lost. My sense of direction. If found, please don't tell me where it is. I won't be able to get there.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Found. Half a Wednesday, in the back of a taxi. The driver says it was very quiet the whole way, and tipped well.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "Lost. A small dog, in a large reality. Answers to Pickle. Pickle does not know he is lost. Pickle thinks this is a walk. Pickle is having a lovely time.", speed = 0.95, gap = 1.0 },
  { say = "rex", text = "If you've lost it, folks, Alien Classifieds has probably found it! Or sold it. Probably sold it." },
]

[[clip]]
id = "story-004"
category = "story"
title = "Missed Connections"
lines = [
  { sting = "chime" },
  { say = "rex", text = "Missed connections, folks. Get your hankies out. Linda?" },
  { say = "linda", text = "You, on the bus that goes through every reality. Me, also on the bus, in seven of them. You smiled in three. Let's talk about the other four.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "You, standing in the rain in Precinct Nine with no umbrella, looking like you'd been doing it for years. Me, the umbrella. I'd like to try again.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "You, the man in the queue at the Bureau of Infinite Queues. Me, the woman standing in front of you, for thirty years. I'm so glad you finally said hello.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "You, a moon. Me, a man on a porch. You looked near me. I looked near you. Same time next month?", speed = 0.95, gap = 1.0 },
  { say = "rex", text = "Love, folks! It's out there! Possibly in a queue!" },
]

[[clip]]
id = "story-005"
category = "story"
title = "Still Lost: Greg"
lines = [
  { sting = "chime" },
  { say = "rex", text = "A quick one from the lost and found, folks, and it's an update.", speed = 1.05 },
  { say = "linda", text = "Still lost. One shadow. Answers to Greg. Last seen at the sea, sitting on the sand with his knees up, looking at the water.", speed = 0.95, gap = 0.8 },
  { say = "linda", text = "His person, Hollis, would like Greg to know that he isn't angry, that the porch light is on, and that he has been standing in the sun at noon every day, so there's room.", speed = 0.95, gap = 0.8 },
  { say = "linda", text = "Greg, if you're listening, you don't have to come back. But send a postcard. Hollis would like a postcard.", speed = 0.95, gap = 1.2 },
  { say = "rex", text = "Come on, Greg. Send the man a postcard.", speed = 1.0 },
]

[[clip]]
id = "story-006"
category = "story"
title = "Private Sales"
lines = [
  { sting = "chime" },
  { say = "rex", text = "Private sales, folks! No dealers! No Rex! Just honest people selling honest things! Linda?" },
  { say = "linda", text = "For sale. One staircase, slightly too long. Takes you one floor further than you need. You will not be told what's on that floor.", speed = 0.95, gap = 0.9 },
  { say = "linda", text = "For sale. Hot air balloon. Only flown once. Still flying. Please collect.", speed = 0.95, gap = 0.9 },
