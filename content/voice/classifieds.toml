# Alien Classifieds — 91.9, a strip mall at the edge of the map.
#
# Rex Bellows pitches everything like it's the last used planet on the lot. Linda from
# Accounts reads the small print, very fast, and has seen things in it. Linda reads the
# personals and the lost and found slowly, at her own speed, because she says they
# deserve it.
#
# Ads are category "ad"; personals, lost and found and private sales are "story" segments.
# Running gags: Greg the shadow and Hollis, Bev's song, Teodor at Relay Four, the geese
# owed to the Numbers Station, Grumbel's Ladders (and the Ambition, the one with no top).
station = "classifieds"

[voices]
rex = { voice = "am_puck", speed = 1.15, name = "Rex Bellows" }
linda = { voice = "af_jessica", speed = 1.35, name = "Linda from Accounts" }
road_man = { voice = "am_santa", name = "A Man Explaining a Road" }
grandparent = { voice = "bf_lily", fx = "phone", name = "A Grandparent" }

