  { say = "announcer", text = "Seven, seven, four geese, to any radio mast, by morning. Calm, counted, and wearing a little bow." },
  { say = "announcer", text = "Settle your account, and sleep at night again. Geese Express." },
  { say = "small_print", text = "Geese Express does not deliver ducks. If you were asked for ducks, please listen again." },
]

# ── Public service announcements ──────────────────────────────────────────────

[[clip]]
id = "psa-001"
category = "psa"
title = "If You Find a Shadow"
lines = [
  { say = "authority", text = "A message from the Multiverse Broadcast Authority." },
  { say = "authority", text = "If you find a shadow without a person, please do not step on it. Do not fold it. Do not try it on. Shadows are not lost property. They are on a journey. Leave a light on, and let it decide." },
  { say = "authority", text = "If the shadow answers to Greg, his person, Hollis, would like you to know the porch light is on." },
]

[[clip]]
id = "psa-002"
category = "psa"
title = "Between Stations"
lines = [
  { say = "authority", text = "The Multiverse Broadcast Authority reminds listeners that if you hear a voice between stations, asking whether anyone can hear them, it is polite to say yes.", gap = 0.7 },
  { say = "authority", text = "You don't have to say anything else. Yes is plenty." },
]

[[clip]]
id = "psa-003"
category = "psa"
title = "The Office of Fair Geese"
lines = [
  { say = "announcer_posh", text = "If you believe you may owe the Numbers Station geese, please don't panic. Have your geese ready, and calm." },
  { say = "announcer_posh", text = "Do not send ducks. Do not send swans. It isn't the same, and the swans don't like it." },
  { say = "announcer_posh", text = "This has been a message from the Office of Fair Geese." },
]

[[clip]]
id = "psa-004"
category = "psa"
title = "The Clocks Go Back"
lines = [
  { say = "authority", text = "Tonight, all clocks in the Overlap go back one hour. Please do not go back with them." },
  { say = "authority", text = "Last year, several people did. They're having a lovely time, but they've missed a lot." },
]

[[clip]]
id = "psa-005"
category = "psa"
title = "A Message from Your Future Self"
lines = [
  { say = "future_self", text = "Hi. This message is brought to you by your future self." },
  { say = "future_self", text = "We'd like you to drink a glass of water. We're very busy and don't have time to explain. Just the water, please.", gap = 0.6 },
  { say = "future_self", text = "Thank you. You'll thank us. Well. You'll thank you." },
]

[[clip]]
id = "psa-006"
category = "psa"
title = "Please Do Not Feed the Void"
lines = [
  { say = "announcer_soft", text = "Please do not feed the void. It doesn't need it, and it only encourages it." },
  { say = "announcer_soft", text = "If the void follows you home, do not make eye contact. Let it study. It has exams." },
]

[[clip]]
id = "psa-007"
category = "psa"
title = "About the Static"
lines = [
  { say = "authority", text = "A reminder from the Multiverse Broadcast Authority. The static between stations is not dangerous." },
  { say = "authority", text = "It is just everybody else, talking at once. If you listen carefully, some of it is about you. Most of it is nice." },
]

[[clip]]
id = "psa-008"
category = "psa"
title = "Check On Your Neighbors"
lines = [
  { say = "announcer_warm", text = "Check on your neighbors this winter. The ones upstairs, the ones downstairs, and the ones in the walls." },
  { say = "announcer_warm", text = "Especially the ones in the walls. Nobody ever checks on them. A small knock is fine. They'll knock back." },
]

[[clip]]
id = "psa-009"
category = "psa"
title = "Lost Something?"
lines = [
  { say = "authority", text = "Lost something? Before contacting the authorities, please check under the sofa, then the other dimension, then under the sofa again." },
  { say = "authority", text = "Ninety percent of lost items are found under the sofa. The rest are having a nice time elsewhere." },
]

[[clip]]
id = "psa-010"
category = "psa"
title = "Be Nice to the Sun"
daypart = "day"
lines = [
  { say = "announcer_bright", text = "The sun has been working very hard this week. It comes up every single morning, and nobody ever asks how it's doing." },
  { say = "announcer_bright", text = "If you see it today, give it a wave. It can't wave back. It hasn't got hands. But it'll know." },
]

[[clip]]
id = "psa-011"
category = "psa"
title = "You Are Allowed to Hang Up"
daypart = "night"
lines = [
  { say = "grenda", text = "Hello, love. Grenda here, from ninety seven point eight, with a little reminder." },
  { say = "grenda", text = "You're allowed to hang up on a problem. If it's serious, it'll ring back. And if you need someone to talk to in the meantime, the kettle's on." },
]

