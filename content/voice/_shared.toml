  { say = "announcer", text = "Spend it on a walk. Spend it asleep. Spend it doing absolutely nothing, which, let's be honest, is what you'd have done with it anyway." },
  { say = "small_print", text = "Recovered hours may be slightly used. Hours lost before the age of ten cannot be recovered. They were well spent." },
