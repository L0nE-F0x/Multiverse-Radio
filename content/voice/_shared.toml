# Shared pool: clips any station may air. Ads for ad breaks on music stations (15-35 s),
# public service announcements, and interrupts (3-12 s): bleed from other stations,
# emergency broadcast tests, and a faint voice at Relay Four asking if anyone can hear him.
#
# `stations` restricts a clip to the listed stations. Bleed from a station never airs on
# that station; loud bleeds stay off the ambient stations.
#
# Running gags shared with the talk stations: Grumbel's Ladders ("Up is a choice"),
# Greg the shadow and Hollis, Bev and the request line, Teodor at Relay Four, the geese
# owed to the Numbers Station, "more at eleven".
station = "_shared"

[voices]
grumbel = { voice = "am_eric", name = "Arnold Grumbel" }
announcer = { voice = "am_michael", name = "Announcer" }
announcer_warm = { voice = "af_heart", speed = 0.95, name = "Announcer" }
announcer_posh = { voice = "bm_fable", name = "Announcer" }
announcer_bright = { voice = "af_bella", speed = 1.05, name = "Announcer" }
announcer_fast = { voice = "am_puck", speed = 1.12, name = "Announcer" }
announcer_soft = { voice = "bf_isabella", speed = 0.92, name = "Announcer" }
announcer_slow = { voice = "af_sky", speed = 0.8, name = "Announcer" }
small_print = { voice = "af_kore", speed = 1.4, name = "Small Print" }
authority = { voice = "bm_fable", speed = 0.95, name = "Multiverse Broadcast Authority" }
future_self = { voice = "af_heart", name = "Your Future Self" }
operator = { voice = "af_alloy", fx = "phone", name = "Second Opinion Hotline" }
alarm = { voice = "af_sky", fx = "tiny", name = "The Polite Alarm Clock" }
ebs = { voice = "am_onyx", fx = "robot", name = "Emergency Broadcast System" }
teodor = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
hollis = { voice = "am_echo", fx = "radio", name = "Hollis" }
dale = { voice = "bm_george", name = "Dale Quarterly" }
chip = { voice = "am_fenrir", speed = 1.15, name = "Chip Thunderbuckle" }
grenda = { voice = "bf_emma", speed = 0.95, name = "Grenda" }
darlene = { voice = "af_alloy", name = "Darlene, the Everything Channel" }
linda = { voice = "af_jessica", speed = 1.35, name = "Linda from Accounts" }
counter = { voice = "af_kore", speed = 0.9, fx = "radio", name = "Numbers Station" }
faint = { voice = "af_nicole", fx = "whisper", name = "A Faint Voice" }

# ── Ads ───────────────────────────────────────────────────────────────────────

[[clip]]
id = "ad-001"
category = "ad"
title = "Grumbel's Ladders: The Lateral"
lines = [
  { say = "grumbel", text = "Hi. I'm Arnold Grumbel, of Grumbel's Ladders. For eleven generations, my family has made ladders that go up." },
  { say = "grumbel", text = "But not every move in life is up. Sometimes you need to go sideways. A new job, at the same level. A new flat, on the same floor. Next door, but nicer." },
  { say = "grumbel", text = "So we made the Lateral. It's a ladder, on its side. You walk across it." },
  { say = "grumbel", text = "Grumbel's Ladders. Up is a choice. So is sideways." },
]

[[clip]]
id = "ad-002"
category = "ad"
title = "Grumbel's Ladders: The Down Ladder"
lines = [
  { say = "grumbel", text = "Have you climbed too high? Said yes to everything, and now you're up there, and it's windy?" },
  { say = "grumbel", text = "The Grumbel's Down Ladder only goes one way, and it goes gently. One rung at a time, back to where your feet are." },
  { say = "grumbel", text = "There's no shame in coming down. My grandfather came down from the very top at ninety. He said the view from the bottom was better, because it had his family in it." },
  { say = "grumbel", text = "Grumbel's Ladders. Up is a choice." },
]

[[clip]]
id = "ad-003"
category = "ad"
title = "Grumbel's Ladders: The Step Stool"
lines = [
  { say = "grumbel", text = "Not every dream is a big dream. Some dreams are the top shelf.", gap = 0.6 },
  { say = "grumbel", text = "For those, there's the Grumbel's Step Stool. Two rungs. Very stable. It gets you to the biscuits and back, and it never once asks you why." },
  { say = "grumbel", text = "Grumbel's Ladders. Up is a choice. A little bit up is still up." },
]

[[clip]]
id = "ad-004"
category = "ad"
title = "Grumbel's Ladders: The Ambition"
lines = [
  { say = "announcer", text = "Introducing the Ambition, from Grumbel's Ladders. The ladder with no top." },
  { say = "grumbel", text = "Our test climber has been going for three years. Last month's postcard said, nice view, still going. This month's said, I can see everyone's house. Please tell my mother." },
  { say = "announcer", text = "The Ambition. For people who don't want to arrive. Grumbel's Ladders. Up is a choice." },
  { say = "small_print", text = "Grumbel's Ladders cannot guarantee a top, a bottom, or your mother." },
]

[[clip]]
