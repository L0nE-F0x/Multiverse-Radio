  { say = "host", text = "At the long table today, the children of the co-op took on the big question. Who owns the water?" },
  { say = "host", text = "They said the water belongs to the ice. The ice belongs to the rings. And the rings belong to nobody, because nobody can reach them.", gap = 0.6 },
  { say = "host", text = "I've been trying to say that for thirty years. They did it before pudding." },
]

[[clip]]
id = "dj-the-long-table-002"
category = "dj"
show = "the-long-table"
lines = [
