# ── Host links ────────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
title = "On the Off-Beat"
lines = [
  { say = "host", text = "The irrigation on this moon runs on the off-beat. It always has. Whoever built these pumps knew exactly what they were doing." },
  { say = "host", text = "Every second beat, a little water. Every second beat, a little bass. Everything on this moon grows on the off-beat. Including me." },
]

[[clip]]
id = "dj-002"
category = "dj"
title = "Two Weeks Ahead"
lines = [
  { say = "host", text = "People ask why our tomatoes are so big. Some of it is the low gravity. Most of it is the speaker stack." },
  { say = "host", text = "The tomatoes by the porch are two weeks ahead of the tomatoes by the office. Nobody is surprised. The office plays nothing all day. The office plays spreadsheets." },
]

[[clip]]
id = "dj-003"
category = "dj"
title = "A Letter on Very Nice Paper"
lines = [
  { say = "host", text = "A letter came up today from Clearline Holdings, three systems away. Very nice paper. It says the water that comes down off the rings belongs to them." },
  { say = "host", text = "Now. That ice was falling off those rings before there was paper. Before there were letters. It will still be falling after.", gap = 0.6 },
  { say = "host", text = "We wrote back. On a cabbage leaf. Here's a tune while it gets there." },
]

[[clip]]
id = "dj-004"
category = "dj"
title = "Greg in the Lettuce"
lines = [
  { say = "host", text = "Shade is precious on a greenhouse moon. So when a little shadow called Greg turned up and stood over the lettuce bed all afternoon, the lettuce was very grateful." },
  { say = "host", text = "He says he's on his way home, to a man called Hollis. He's welcome back any time. The spinach is jealous." },
]

[[clip]]
id = "dj-005"
category = "dj"
title = "Bev Rings the Pump House"
lines = [
  { say = "host", text = "Bev called again. She was looking for the request line. She got the pump house." },
  { say = "host", text = "Brother Amos took her request anyway. He can't play records down there, so he played it on the pipes. She says it wasn't her song. But the carrots haven't stopped talking about it." },
]

[[clip]]
id = "dj-006"
category = "dj"
daypart = "night"
title = "For the Night Shift"
lines = [
  { say = "host", text = "A word for the operator on the relay ship, passing over us in the night. We saw your running lights go across the ring." },
  { say = "host", text = "You've drifted a long way out to find us, out here on the edge of the dial. You're welcome. Wipe your feet. There's soil on everything." },
]

[[clip]]
id = "dj-007"
category = "dj"
title = "Sponsored by Grumbel's Ladders"
lines = [
  { say = "host", text = "This hour comes to you with the help of Grumbel's Ladders. In low gravity the runner beans grow straight up into the dark, and somebody has to go up after them." },
  { say = "host", text = "Grumbel's Ladders. Up is a choice. Some days, up is a bean." },
]

[[clip]]
id = "dj-008"
category = "dj"
title = "Mother Hale"
lines = [
  { say = "host", text = "Mother Hale has farmed this moon for sixty years. She says the secret is patience, good soil, and never arguing with a pumpkin that has decided to float." },
  { say = "host", text = "This one's for Mother Hale. Turn it up a little. She's in the far greenhouse, and she says the young ones play everything too quiet." },
]

[[clip]]
id = "dj-009"
category = "dj"
daypart = "day"
lines = [
  { say = "host", text = "Afternoon on the farm moon. Oldwater is high, the misters are turning in slow circles, and somewhere in greenhouse nine, a bee is flying sideways." },
  { say = "host", text = "Low gravity. She's doing her best. So are we all." },
]

# ── Ads and notices ───────────────────────────────────────────────────────────

[[clip]]
id = "ad-001"
category = "ad"
title = "The Ringside Seed Exchange"
lines = [
  { say = "host", text = "Bring a seed, take a seed. The Ringside Seed Exchange, behind the packing shed. Open whenever somebody is there, which is usually Mother Hale." },
  { say = "host", text = "No money changes hands. Money doesn't grow here. We tried. We planted some. Nothing came up but a letter from the bank.", gap = 0.6 },
  { say = "host", text = "The Ringside Seed Exchange. Everything you plant comes back. Mostly." },
]

[[clip]]
id = "psa-001"
category = "psa"
title = "Respect the Pipes"
lines = [
  { say = "host", text = "A notice from the Greenhouse Ring Co-operative. When the pumps are running, please don't stand on the pipes." },
  { say = "host", text = "When the pumps are not running, please also don't stand on the pipes. They're old. They've carried a great deal of water for a great many people. They've done enough.", gap = 0.6 },
  { say = "host", text = "Respect the pipes." },
]

