# Orbit Roots — 109.3, the Greenhouse Ring, Meridian Farm Moon.
#
# Sister Meridian hosts from a hand-painted shack with a speaker stack on the porch: farmer,
# selector and the moon's conscience. Warm, unhurried, funny without mocking anyone. The
# humour comes from the farm moon, never from the culture: no phonetic accents, no caricature.
#
# The world: long glass greenhouses under Oldwater, a ringed planet whose rings are ice. The
# water comes down off the rings; Clearline Holdings, three systems away, keeps writing to say
# they own it (on very nice paper). Low gravity: beans grow up into the dark, pumpkins float,
# bees fly sideways. The irrigation runs on the off-beat. The tomatoes by the speaker stack are
# two weeks ahead of the ones by the office.
#
# People: Brother Amos at the pump house, Mother Hale (sixty years farming), the children of
# the co-op. Cross-station: Greg the shadow (shade is precious here), Bev and the request line,
# Grumbel's Ladders. Resident artists in src/content/packs/v4b.ts.
station = "orbit-roots"

[voices]
host = { voice = "af_kore", speed = 0.95, name = "Sister Meridian" }
amos = { voice = "am_fenrir", speed = 0.92, fx = "radio", name = "Brother Amos, the Pump House" }

[[show]]
id = "first-light"
name = "First Light Irrigation"
blurb = "The misters come on across the whole ring. Crop reports, pump pressure and something gentle for the lettuce."
start = 5
end = 8

[[show]]
id = "the-long-table"
name = "The Long Table"
blurb = "Lunch in the packing shed: whatever is ripe, a crate to sit on, and a little talk about who owns the water."
start = 12
end = 14

[[show]]
id = "deep-roots"
name = "Deep Roots"
blurb = "The greenhouses are dark and the plants are sleeping. The bass goes down into the soil. The roots are awake."
start = 22
end = 2

