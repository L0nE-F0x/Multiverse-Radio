  { say = "host", text = "A moon has gone missing, they say. We checked. We're still here. Feet on the soil.", gap = 0.6 },
  { say = "host", text = "But if it was yours, and it's lost, the light's on in the greenhouse. Moons are welcome. Bring your own water." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "host", text = "The whole ring smells of toast. We don't make toast up here. We grow the wheat, and somebody else does the rest.", gap = 0.6 },
  { say = "host", text = "So somebody, somewhere, has finished the job. Give thanks." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
event = "convergence"
kit = "the-song"
lines = [
  { say = "host", text = "The harvest crew are all humming the same tune, and none of them can finish it. The sprinklers are humming it too.", gap = 0.6 },
  { say = "host", text = "Bev has rung the pump house to say it's her song. She's probably right." },
]

[[clip]]
id = "convergence-the-knock"
category = "event"
event = "convergence"
kit = "the-knock"
lines = [
  { say = "host", text = "Three knocks on the shack door, just now. Nobody there. Only the misters, and the ring.", gap = 0.8 },
  { say = "host", text = "If that was Clearline Holdings, we're out. In the fields. All of us. For years." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "host", text = "The sky above the greenhouses has gone a colour I don't have a word for. Every lettuce on the moon has turned to face it.", gap = 0.6 },
  { say = "host", text = "They know something. They're not saying." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "host", text = "A pigeon has walked into the shack. On a farm moon. It went straight to the seed trays, then looked at me like I owed it something.", gap = 0.6 },
  { say = "host", text = "Maybe I do. Help yourself, friend." },
]
