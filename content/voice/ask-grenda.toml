# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "bev-gets-her-song-01"
category = "story"
serial = { id = "bev-gets-her-song", episode = 1 }
title = "Bev Gets Her Song, Part One: Eleven Years"
bed = "rain"
lines = [
  { sfx = "phone-ring" },
  { say = "grenda", text = "Ask Grenda. You're on the air." },
  { say = "bev", text = "Hello, Grenda. It's Bev. You'll remember me. The song." },
  { say = "grenda", text = "Dum, dum, da dum. Of course I remember, love. How are you?" },
  { say = "bev", text = "It's eleven years this week, Grenda. Eleven years of ringing. I think I'm going to stop. Maybe it was never a song. Maybe it was just Stan." },
  { say = "grenda", text = "Tell me where you first heard it. You've never told me that." },
  { say = "bev", text = "In a lift. The Grand Overlap Hotel, lift number two. It got stuck between floors four and five, with me and a man I'd never met, for three hours.", gap = 0.8 },
  { say = "bev", text = "There was one song going round and round on the little speaker. By the second hour we were singing along. By the third, he'd asked me to dinner." },
  { say = "bev", text = "And when the doors finally opened, he cried. Stan cried at everything. Lifts. Bridges. Me.", gap = 1.0 },
  { say = "grenda", text = "Bev, love. That's not a lost song. That's a lift. Lifts don't go anywhere. Well. Up and down. But they stay in the building." },
  { say = "bev", text = "I never thought of that." },
  { say = "grenda", text = "So don't stop ringing. Ring differently. Go and find the lift." },
  { say = "bev", text = "At my age?" },
  { say = "grenda", text = "Especially at your age. Take a sandwich. And Bev? Ring me from the lift." },
  { sfx = "phone-hangup" },
]

[[clip]]
id = "teodor-is-heard-06"
category = "story"
serial = { id = "teodor-is-heard", episode = 6 }
title = "Teodor Is Heard, Part Six: The Request Line Was Mine"
bed = "wind"
lines = [
  { sfx = "beep" },
  { say = "teodor", text = "Is anyone receiving this. This is Relay Four. Grenda? Is that Grenda?" },
  { say = "grenda", text = "It's me, love. You've come through again." },
  { say = "teodor", text = "Only in bits. But something's changed. This week I heard a moon, some numbers, and a whale. Or a very large door." },
  { say = "grenda", text = "That'll be the whale. How does it feel?" },
  { say = "teodor", text = "Frightening. When nobody answered, it was sad, but it was simple. Now people are answering, and I don't know what to say back." },
  { say = "grenda", text = "Teodor, there's a lady called Bev who's been looking for the request line for eleven years. The news says the lift music used to come from you.", gap = 1.4 },
  { say = "teodor", text = "The request line. That was mine. That was my whole job, Grenda. People rang in, and I put their songs through. To lifts, and kitchens, and hospitals. Birthdays. Weddings. A lot of flute." },
  { say = "teodor", text = "Then the storm took the receiver, and I couldn't hear the requests any more. So I started asking if anyone was there." },
  { say = "grenda", text = "Eleven years." },
  { say = "teodor", text = "Has she really been ringing all that time?" },
  { say = "grenda", text = "Every station, love. Every night. Same as you.", gap = 1.0 },
  { say = "teodor", text = "Then I'd better get this fixed. Somebody's been waiting on me." },
  { say = "grenda", text = "Somebody's been waiting on both of you." },
  { sfx = "beep" },
]

[[clip]]
id = "greg-comes-home-11"
category = "story"
serial = { id = "greg-comes-home", episode = 11 }
title = "Greg Comes Home, Part Eleven: The Phone Box"
bed = "rain"
lines = [
  { sfx = "phone-ring" },
  { say = "grenda", text = "Ask Grenda, you're on the air." },
  { say = "greg", text = "Grenda. It's Greg. I'm in the phone box at the end of his road. I can see the porch light. I've been in here an hour." },
  { say = "grenda", text = "Oh, love. You're nearly there. What's stopping you?" },
  { say = "greg", text = "I've been to the sea. The moon. I played Sunball. I danced a polka. What if I'm not the same shape any more?" },
  { say = "grenda", text = "Nobody's the same shape after a year, Greg. That's what a year is for." },
  { say = "greg", text = "What if he doesn't fit me?" },
  { say = "grenda", text = "Then you'll both stretch a bit. That's what people do. Shadows too, I should think.", gap = 0.8 },
  { say = "greg", text = "And I was going to wait for noon. He stands in the sun at noon. But it's four in the morning." },
  { say = "grenda", text = "And what's on, love?" },
  { say = "greg", text = "The porch light.", gap = 1.2 },
  { say = "grenda", text = "Then you don't have to wait for noon. He's left you a sun. He's left it on every night since spring. Go and stand in it." },
  { say = "greg", text = "Will you stay on the line?" },
  { say = "grenda", text = "Till you're through the gate." },
  { pause = 2.0 },
  { say = "greg", text = "I'm through the gate." },
  { say = "grenda", text = "Go on, then." },
  { sfx = "phone-hangup" },
]

[[clip]]
id = "bev-gets-her-song-11"
category = "story"
serial = { id = "bev-gets-her-song", episode = 11 }
title = "Bev Gets Her Song, Part Eleven: Is This the Request Line?"
bed = "rain"
lines = [
  { sfx = "phone-ring" },
  { say = "grenda", text = "Ask Grenda. Bev? Is that you?" },
  { say = "bev", text = "It's me, love. You said to ring. Is it working?" },
  { say = "grenda", text = "I've got a gentleman on my other line. He's coming through a relay ship, a long way out, so he'll sound far away. Putting you through." },
  { sfx = "beep" },
  { say = "teodor_far", text = "This is Relay Four. Is anyone receiving this.", gap = 1.0 },
  { say = "bev", text = "Hello? Is this the request line?", gap = 1.6 },
  { say = "teodor_far", text = "Yes. Yes it is. I'm sorry it took so long. What can I play for you?" },
  { say = "bev", text = "It goes, dum, dum, da dum. And then, da da dum, da da. I heard it in a lift, a long time ago." },
  { say = "teodor_far", text = "Grand Overlap Hotel. Lift two. I remember putting it through. Hold on. Reel four. Track two, two, one." },
  { sfx = "tape-rewind" },
  { say = "teodor_far", text = "It's called Pleasant Interval.", gap = 1.4 },
  { say = "bev", text = "Oh.", gap = 0.8 },
  { say = "bev", text = "It was. It was a very pleasant interval." },
  { say = "teodor_far", text = "Would you like to make a dedication?" },
  { say = "bev", text = "For Stan. He's gone now. But he'd want to hear it. He'd want to cry at it." },
  { say = "teodor_far", text = "For Stan. I'll put it through at the top of the hour, to every station that'll take it. And every lift." },
  { say = "grenda", text = "Bev, love. You found it." },
  { say = "bev", text = "I didn't, Grenda. Everybody did." },
]

# ── Halloween (24 to 31 October) ──────────────────────────────────────────────

[[clip]]
id = "halloween-01"
category = "call"
title = "Bones, a Skeleton, at Halloween"
bed = "rain"
dates = ["10-24", "10-25", "10-26", "10-27", "10-28", "10-29", "10-30", "10-31"]
lines = [
  { sfx = "phone-ring" },
  { say = "grenda", text = "Ask Grenda. You're on." },
  { say = "bones", text = "Hello, Grenda. I'm a skeleton. Bones, my friends call me. It's that time of year again, and everybody's dressing up as me." },
  { say = "grenda", text = "And how does that make you feel, love?" },
  { say = "bones", text = "Seen, Grenda. Too seen. I'm usually inside somebody. Now I'm on every door in the street, with a little hat on." },
  { say = "grenda", text = "Bones, love, can I tell you why they dress up as you? Because you're the bit everybody's got in common. Underneath the hair and the hats and the worrying, everyone's a little bit you.", gap = 0.8 },
  { say = "grenda", text = "That isn't people making fun. That's family. Once a year, the whole street comes out dressed as its relatives." },
  { say = "bones", text = "I never thought of it like that." },
  { say = "grenda", text = "Go out tonight. Knock on a door. When they say what are you meant to be, say, yours." },
  { sfx = "phone-hangup" },
]

