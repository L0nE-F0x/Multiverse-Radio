# ── Calls kit: Grenda's advice (fits any problem) ─────────────────────────────

[[clip]]
id = "call-body-01"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Oh, love. Here's the first thing. You rang. That's the hard part done." },
  { say = "grenda", text = "Most people carry a thing like that around for years before they say it out loud, and you've just said it to the whole multiverse. I'm proud of you." },
]

[[clip]]
id = "call-body-02"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Can I tell you something I've learned, sitting in this chair? The strange part of a problem is never the problem. It's just the wrapping." },
  { say = "grenda", text = "Underneath, it's nearly always the same thing. Somebody wants to be noticed, and doesn't know how to ask." },
]

[[clip]]
id = "call-body-03"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Here's what I want you to do tonight. Put the kettle on. Make two cups, even if it's only you." },
  { say = "grenda", text = "Drink one, and let the other go cold beside you, like company. Then go to bed. It'll be smaller in the morning. They always are." },
]

[[clip]]
id = "call-body-04"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Now, I'm not going to tell you it's normal, love. It isn't. But you're not the first, and you won't be the last." },
  { say = "grenda", text = "Somewhere, in some reality, there's somebody with exactly your problem, ringing a lady exactly like me. We're all doing our best." },
]

[[clip]]
id = "call-body-05"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Be kind to it, whatever it is. I know that sounds daft. But most things that make a fuss are frightened, and most frightened things calm down when they're spoken to nicely." },
  { say = "grenda", text = "Try it for a week. Then ring me back." },
]

[[clip]]
id = "call-body-06"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Write it down, love. All of it. Then read it back in the morning, out loud, to the kettle." },
  { say = "grenda", text = "If it still sounds bad, ring me. If it sounds a bit silly, then it was a three in the morning problem, and you've already solved it, by sleeping." },
]

[[clip]]
id = "call-body-07"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Here's a question. If your best friend rang and told you this, what would you say to them? Go on. You'd be lovely about it, wouldn't you." },
  { say = "grenda", text = "You'd say, oh, that's hard, and you'd put the kettle on. Say that to yourself, love. You're allowed." },
]

[[clip]]
id = "call-body-08"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "You don't have to fix it tonight. That's the thing nobody tells you. Some problems aren't for fixing. They're for living next to." },
  { say = "grenda", text = "Like a noisy neighbour, or a tree that blocks the light. You find out what time it goes quiet, and you sit in the garden then." },
]

[[clip]]
id = "call-body-09"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Have you told anyone? Not me. Someone who'll see your face. Tell them tomorrow over a cup of tea, the way you'd mention the weather." },
  { say = "grenda", text = "You'll be amazed how many people say, oh. Me too." },
]

[[clip]]
id = "call-body-10"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Now, the practical bit. Leave a light on. Eat something warm. Open a window, even just a crack, so the room can breathe." },
  { say = "grenda", text = "Most of the time, love, a problem is just a room that hasn't been aired." },
]

[[clip]]
id = "call-body-11"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "I'll tell you what my mother told me. She said, Grenda, there's nothing so strange it can't be helped by a walk, a bath, or a biscuit." },
  { say = "grenda", text = "And if it's very strange, all three. In that order." },
]

[[clip]]
id = "call-body-12"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "It sounds to me like you've been very patient for a very long time. You're allowed to stop being patient for a bit, and say, actually, this is hard." },
  { say = "grenda", text = "Saying it doesn't make it worse, love. It just makes it true. And true is easier to carry." },
]

[[clip]]
id = "call-body-13"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "And try not to be cross with it. Whatever it is, it's part of your life now, and life's too short to be cross with the furniture." },
  { say = "grenda", text = "Give it a name, if it hasn't got one. It's very hard to be frightened of something called Colin." },
]

[[clip]]
id = "call-body-14"
category = "call"
kit = "calls"
part = "body"
bed = "rain"
lines = [
  { say = "grenda", text = "Remember, love, the night always feels like it's going to last forever. And then it's Tuesday." },
  { say = "grenda", text = "You don't have to know what to do. You just have to get to Tuesday. I'll be here till then." },
]

