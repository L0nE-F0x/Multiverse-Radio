# Ask Grenda — 97.8, Studio B, under hyperspace exit 4.
#
# Grenda is a warm, wise, multi-dimensional agony aunt who has heard everything twice.
# The rule for every call: the problem is deeply strange, the advice is genuinely kind
# and would work on an ordinary problem too. She calls people "love". Rain on the window.
#
# Several running gags land here: Hollis and his shadow Greg (both ring in, separately),
# Bev's song, Teodor at Relay Four finally getting an answer, Kim Harrowgate being
# handed things, the missing Tuesday, the ghost with the spoons, the whales being fine.
station = "ask-grenda"

[voices]
grenda = { voice = "bf_emma", speed = 0.95, name = "Grenda" }
other_grenda = { voice = "bf_emma", speed = 0.95, fx = "radio", name = "The Other Grenda" }
hollis = { voice = "am_echo", fx = "phone", name = "Hollis" }
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, a Shadow" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
desmond = { voice = "am_liam", fx = "phone", name = "Desmond" }
eleanor = { voice = "af_nicole", fx = "whisper", name = "Eleanor, a Ghost" }
tuesday = { voice = "am_eric", fx = "phone", name = "A Tuesday" }
giant = { voice = "am_fenrir", speed = 0.9, fx = "giant", name = "Bartholomew, a Giant" }
pip = { voice = "af_sky", fx = "tiny", name = "Pip, Who Lives in a Pocket" }
cellist = { voice = "am_liam", fx = "robot", name = "Cellist Unit Four" }
looper = { voice = "af_aoede", fx = "phone", name = "A Caller Stuck in a Day" }
whale = { voice = "am_onyx", speed = 0.82, fx = "giant", name = "A Whale, Lane Twelve" }
dark = { voice = "bm_fable", fx = "whisper", name = "The Dark" }
teodor = { voice = "bm_daniel", fx = "radio", name = "Teodor, Relay Four" }
kim = { voice = "af_sarah", fx = "phone", name = "Kim Harrowgate" }
fiona = { voice = "af_river", fx = "phone", name = "Fiona" }
walter = { voice = "bm_lewis", fx = "phone", name = "Walter" }

