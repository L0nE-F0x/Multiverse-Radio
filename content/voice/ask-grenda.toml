# ══ v4: The Convergence ═══════════════════════════════════════════════════════
#
# Saturdays, 20:00 UTC: every station notices the same thing. One reaction per topic
# (SCHEMA.md, "The Convergence"); the director airs the _events open, then the tuned
# station's reaction, then the close.

[[clip]]
id = "convergence-missing-moon"
category = "event"
title = "The Convergence: A Moon Goes Missing"
event = "convergence"
kit = "missing-moon"
lines = [
  { say = "grenda", text = "We've had a lot of calls tonight about a moon. One's gone, love, and nobody can agree which." },
  { say = "grenda", text = "When you've lost something and you're not sure what, go outside. Look up. Say hello to the ones that stayed." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
title = "The Convergence: Toast, Everywhere"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "grenda", text = "Everywhere smells of toast tonight. I've had calls from all over." },
  { say = "grenda", text = "Toast is what you make when there's nothing else in, and it's always enough. Make some, love. Two slices. Sit down with them." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
title = "The Convergence: The Song Nobody Can Finish"
event = "convergence"
kit = "the-song"
lines = [
  { say = "grenda", text = "Half the dial's got the same song stuck tonight, and nobody can finish it." },
  { say = "grenda", text = "Don't force it, love. Songs are like names. The moment you stop trying, it'll come to you. In the bath, probably. In about a week." },
]

[[clip]]
id = "convergence-the-knock"
category = "event"
title = "The Convergence: Three Knocks"
event = "convergence"
kit = "the-knock"
lines = [
  { say = "grenda", text = "Three knocks on the studio door, and nobody there. You've all had it too, I hear." },
  { say = "grenda", text = "My mum used to say, a knock with nobody behind it is a kindness on its way. Leave the door on the latch, love." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
title = "The Convergence: A Colour With No Name"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "grenda", text = "Did you see the sky, love? The colour nobody's got a word for?" },
  { say = "grenda", text = "You don't need a word for everything. Some things, you just stand at the window with, and then you put the kettle on." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
title = "The Convergence: The Pigeon"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "grenda", text = "There's a pigeon in Studio B. It walked in under the door. It seems to know me." },
  { say = "grenda", text = "It's done what everyone does in here. It's sat down, and looked at me, and waited. Go on, love. What's on your mind?" },
]


