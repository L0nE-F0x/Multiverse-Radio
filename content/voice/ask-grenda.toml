# ── v4: clues to The Switchboard (131.1). It answers if you tune 97.8, 89.3, then 114.8
#    (advice, the news, the traffic), holding each a moment, all within ninety seconds. ──

[[clip]]
id = "call-switchboard"
category = "call"
title = "Walter, and the Operator"
bed = "rain"
lines = [
  { say = "grenda", text = "Ask Grenda, go ahead." },
  { say = "walter", text = "Grenda, it's Walter again. My late wife, June, was a telephone operator. Nineteen forty six, the big board, the one that connected people between universes." },
  { say = "walter", text = "She used to say, if you ever need to reach somebody very far away, ring advice first. Then the news. Then the traffic. Quick as you like, and in that order." },
  { say = "grenda", text = "And did it work, love?" },
  { say = "walter", text = "She always got through. I've never tried. I'm frightened of who might answer." },
  { say = "grenda", text = "Someone polite, I'd expect. Operators always are. And Walter, you've already done the first bit. You rang advice.", gap = 0.8 },
  { say = "walter", text = "Oh. So I have." },
]
