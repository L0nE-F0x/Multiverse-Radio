[[clip]]
id = "the-kitchen-table-open"
category = "id"
show = "the-kitchen-table"
part = "open"
title = "Grenda's Kitchen Table"
lines = [
  { say = "grenda", text = "Good morning. This is Grenda's Kitchen Table. Pull up a chair, mind the cat, and bring your problem while it's still small." },
]

[[clip]]
id = "the-kitchen-table-01"
category = "dj"
show = "the-kitchen-table"
lines = [
  { say = "grenda", text = "Morning problems are lovely, love. They're small, and they've only just woken up, and they don't know yet what they want to be." },
  { say = "grenda", text = "Catch them early, with a bit of toast, and most of them turn into nothing at all." },
]

[[clip]]
id = "the-kitchen-table-02"
category = "dj"
show = "the-kitchen-table"
lines = [
