# Department of Hold Music — Pam (Automated), Bureau of Infinite Queues, Floor minus four.
# Courteous, politely menacing, and herself on hold since the Bronze Age. Hold
# announcements air over the music (over_music = true) and each one escalates on its own.
station = "hold-music"

[voices]
host = { voice = "af_alloy", name = "Pam (Automated)" }
supervisor = { voice = "af_alloy", speed = 0.92, fx = "robot", name = "Pam's Supervisor (Also Automated)" }
gareth = { voice = "am_adam", fx = "phone", name = "Gareth from Escalations" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
# v3: serial.
walter = { voice = "bm_lewis", fx = "phone", name = "Walter" }

