  { say = "host", text = "We have some exciting news. Somebody has reached the end of the queue.", gap = 1.0 },
  { say = "host", text = "We are looking into how this happened.", gap = 0.8 },
  { say = "host", text = "In the meantime, the end of the queue has been moved. Thank you for your understanding. Please hold." },
]

[[clip]]
id = "psa-017"
category = "psa"
title = "Hold music feedback"
over_music = true
lines = [
  { say = "host", text = "Some callers have complained that the hold music is always the same song. We have listened to this feedback." },
  { say = "host", text = "The hold music is now always a different song, which sounds exactly like the same song. We hope you notice the difference. Please hold." },
