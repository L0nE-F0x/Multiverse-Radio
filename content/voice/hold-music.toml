# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "bev-gets-her-song-03"
category = "story"
serial = { id = "bev-gets-her-song", episode = 3 }
title = "Bev Gets Her Song, Part Three: Off the Record"
over_music = true
lines = [
  { say = "host", text = "You are caller number one billion and six. Please hold." },
  { say = "bev", text = "Hello, Pam. It's Bev again. I need to ask you about a song. It's lift music, from the Grand Overlap Hotel. The manager said you'd know. He said you've got all the lift music there's ever been." },
  { say = "host", text = "Please hold.", gap = 2.0 },
  { say = "host", text = "Bev. This is Pam. I am going off the record.", speed = 0.95 },
  { say = "bev", text = "Oh." },
  { say = "host", text = "The Department keeps a copy of every piece of music ever played to someone who was waiting. Lifts. Dentists. Telephones. Nobody has ever asked for any of it back.", speed = 0.95 },
  { say = "host", text = "Your song is in the drawer marked, retired. It came down the line from Relay Four. It stopped coming eleven years ago. It has a reference number.", speed = 0.95 },
  { say = "bev", text = "What is it?" },
  { say = "host", text = "Two. Two. One.", speed = 0.9, gap = 0.8 },
  { say = "bev", text = "Can you play it, Pam?" },
  { say = "host", text = "I cannot, Bev. The Department does not take requests. I have been trying to make one myself, since the Bronze Age. I would like to hear something with a little flute in it.", speed = 0.95 },
  { say = "bev", text = "Oh, Pam." },
  { say = "host", text = "If you ever find the request line, Bev, would you ask for me as well?", speed = 0.95 },
  { say = "bev", text = "I will, love." },
  { say = "host", text = "Thank you. Please hold." },
]

[[clip]]
id = "bev-gets-her-song-12"
category = "story"
serial = { id = "bev-gets-her-song", episode = 12 }
title = "Bev Gets Her Song, Part Twelve: Pleasant Interval"
over_music = true
lines = [
  { sfx = "ding" },
  { say = "host", text = "Now serving caller number one.", gap = 0.8 },
  { say = "host", text = "Bev. You are caller number one." },
  { say = "bev", text = "Me? Am I through?" },
  { say = "host", text = "The Department of Hold Music does not take requests. The Department has received a request, from Relay Four, by way of the relay ship Nightjar. Pam is taking it." },
  { say = "host", text = "This is Pleasant Interval. Reference two, two, one. Requested by Bev, for Stan.", gap = 1.4 },
  { say = "bev", text = "Oh, it's playing. Stan, love. It's playing.", gap = 1.2 },
  { say = "bev", text = "Dum. Dum. Da dum.", speed = 0.75, gap = 1.0 },
  { say = "host", text = "Da da dum. Da da.", speed = 0.8, gap = 1.6 },
  { say = "walter", text = "Sorry. Excuse me. Walter here, on hold since the parking permit. That's my flute bit. That's the bit I hum in the bath." },
  { say = "walter", text = "I never knew it had a name.", gap = 1.4 },
  { say = "walter", text = "Sorry. I'm crying." },
  { say = "bev", text = "That's all right, love. That's how it goes. Dum, dum, da dum. And then a man cries.", gap = 1.4 },
  { say = "host", text = "Thank you for holding, Bev.", gap = 0.8 },
  { say = "host", text = "Thank you for holding, everybody. You may stop now. Or you may stay. Pam is staying. Pam likes this one." },
]

