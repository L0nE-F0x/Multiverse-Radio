# The Harbour — 140.0, where the Nightjar has been going all along. A secret station.
#
# HUSH grants this frequency at the end of the off-course arc (_ship.toml, arc step 7: "They've
# left a light on"), after seven night shifts. The Harbourmaster keeps a quiet harbour for
# relay ships and their operators: long piers of light, old relays asleep at their berths, an
# office with a warm window, a kettle that is always on. He knows HUSH of old, and he knew the
# operator before you (the one who left the blanket that smells of oranges).
#
# What it resolves, gently and never all at once: relay ships drift a long way between
# harbours, and every so often they come here to rest for a night, instruments down, while
# somebody else keeps watch. Then they go back out in the morning. They always do. HUSH didn't
# say where you were going because saying it too early felt like it might make it not be there.
#
# Mixed format (ambient piano between links). Callbacks: berth seven (Relay Seven), Teodor at
# Relay Four, the Last Lighthouse, oranges, "in your writing".
station = "the-harbour"

[voices]
harbourmaster = { voice = "am_santa", speed = 0.9, name = "The Harbourmaster" }
hush = { voice = "af_heart", speed = 0.95, fx = "ship", name = "HUSH" }

[[show]]
id = "evening-berths"
name = "Evening Berths"
blurb = "Ships come in out of the dark, one at a time, and the Harbourmaster talks them in."
start = 19
end = 23

[[show]]
id = "lights-on-the-water"
name = "Lights on the Water"
blurb = "The small hours at the Harbour. Old ships asleep at the piers, and someone keeping watch for them."
start = 23
end = 4

[[show]]
id = "the-morning-tide"
name = "The Morning Tide"
blurb = "Lines off at first light. Ships leave in the morning. They always do."
start = 4
end = 8

