  { say = "harbourmaster", text = "Relay ships drift a long way between harbours. Years, some of them. Nobody's meant to drift forever. Not even a ship.", gap = 0.7 },
  { say = "harbourmaster", text = "So they come here, for a night. Tie up. Turn the instruments down. Let somebody else keep watch for once.", gap = 0.7 },
  { say = "harbourmaster", text = "Then they go back out. That's all this is. A night off." },
]

