  { sfx = "chopping" },
  { say = "chef", text = "I cried about this onion on Saturday. Twice." },
  { say = "pip", text = "I'm not crying." },
  { say = "chef", text = "You will be. Wednesday. Something about a film." },
]

[[clip]]
id = "recipe-step-3"
category = "show"
kit = "recipe"
part = "body"
bed = "kitchen"
lines = [
  { say = "chef", text = "Season generously, with salt from the sea we'll be visiting in August." },
  { say = "pip", text = "Can I taste it?" },
  { say = "chef", text = "No need. I tasted it last week. A touch more pepper.", gap = 0.5 },
  { say = "chef", text = "No. Less. There. Perfect." },
]

