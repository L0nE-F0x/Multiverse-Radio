  { say = "pip", text = "There's nothing in the bowl, Chef." },
  { say = "chef", text = "Crack them anyway, Pip. Confidence." },
]

[[clip]]
id = "recipe-step-2"
category = "show"
kit = "recipe"
part = "body"
bed = "kitchen"
