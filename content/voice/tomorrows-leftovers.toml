# Tomorrow's Leftovers — 91.45, a test kitchen four days ahead of you.
#
# Chef Anselm Brodequin cooks with ingredients that don't exist yet, and tastes dishes
# before they're cooked. Pip, the sous-chef, lives in the present, which the chef finds
# quaint, and is always holding the wrong spoon. The oven timer counts up. Every dish on
# the programme is a leftover: they cook the leftovers first and the meal later.
#
# The `recipe` kit chains a recipe intro, one to three steps and a tasting. Steps never
# number themselves, so any order works.
station = "tomorrows-leftovers"

[voices]
chef = { voice = "bm_fable", name = "Chef Anselm Brodequin" }
pip = { voice = "af_nova", speed = 1.1, name = "Pip, the Sous-Chef" }
caller = { voice = "bf_lily", fx = "phone", name = "A Listener, Calling From Next Week" }
grumbel = { voice = "am_eric", name = "Arnold Grumbel" }

[[show]]
id = "breakfast-tomorrow"
name = "Breakfast Tomorrow"
blurb = "The most important meal of tomorrow, cooked this morning, so tomorrow you can have a lie-in."
start = 6
end = 10

[[show]]
id = "pip-cooks-today"
name = "Pip Cooks Today"
blurb = "Pip cooks with ingredients that already exist. Chef Brodequin watches, appalled."
start = 12
end = 15
host = "Pip, the Sous-Chef"

[[show]]
id = "midnight-larder"
name = "The Midnight Larder"
blurb = "Snacks for the small hours, prepared slightly before you get peckish."
start = 23
end = 3

