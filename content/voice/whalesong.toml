# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-01"
category = "story"
serial = { id = "greg-comes-home", episode = 1 }
title = "Greg Comes Home, Part One: The Stowaway Decides"
bed = "space"
lines = [
  { say = "host", text = "Captain's log. The stowaway in the observation lounge has asked to speak to me.", gap = 1.0 },
  { say = "host", text = "His name is Greg. He's a shadow. He came aboard in the spring, to see the whales. He has seen a great many whales.", gap = 1.0 },
  { say = "greg", text = "Captain. I'd like to get off." },
  { say = "host", text = "We're between galaxies, son. There isn't really an off." },
  { say = "greg", text = "I know. Sorry. It's just. One of the whales turned and looked at me today. For a very long time." },
  { say = "host", text = "They do that. I'm sure it was nothing.", gap = 0.8 },
  { say = "greg", text = "The others told me. She sings, and it takes a thousand years for anyone to hear it. And then a thousand more before anyone sings back.", gap = 1.0 },
  { say = "greg", text = "I don't want him to wait a thousand years." },
  { say = "host", text = "Who?" },
  { say = "greg", text = "Hollis. My person. I left without saying anything. He leaves the porch light on.", gap = 1.6 },
  { say = "host", text = "Well.", gap = 1.2 },
  { say = "host", text = "There's a comet coming through lane twelve tonight, heading back toward the inner dimensions. It has a beach on it. Stand by the airlock at four, and you could hop across." },
  { say = "greg", text = "Will you slow down for me?" },
  { say = "host", text = "Son, we go one galaxy a century. We're already slowed down.", gap = 1.2 },
  { say = "host", text = "And Greg. The whale who looked at you. She wasn't singing to you.", gap = 1.0 },
  { say = "host", text = "She was singing you home.", gap = 2.0 },
  { say = "host", text = "Captain's log, continued. The stowaway has left the ship. The whales are fine. I didn't ask. I could tell." },
]

[[clip]]
id = "teodor-is-heard-05"
category = "story"
serial = { id = "teodor-is-heard", episode = 5 }
title = "Teodor Is Heard, Part Five: Some Rush"
bed = "space"
lines = [
  { say = "host", text = "Captain's log. A faint signal on the long-range set, as there has been every night for eleven years. A man called Teodor, at Relay Four, asking if anyone can hear him.", gap = 1.0 },
  { say = "host", text = "The whales have been singing back to him since the first night. But his receiver is broken, and whale song travels slowly.", gap = 1.0 },
  { say = "host", text = "I've done the sums. At the speed of whale, their answer reaches him in nine hundred and eighty nine years.", gap = 1.6 },
  { say = "host", text = "That's too long.", gap = 1.4 },
  { say = "host", text = "This ship goes one galaxy a century. It always has. There's never been any rush out here.", gap = 1.2 },
  { say = "host", text = "There is now.", gap = 1.0 },
  { sfx = "whoosh" },
  { say = "host", text = "I've asked the whales to come in close, and sing into the hull, so we can carry it for them. It's the first time I've ever asked the whales anything.", gap = 1.4 },
  { say = "host", text = "They sang one long, low note. I'm choosing to take that as yes.", gap = 1.2 },
  { say = "host", text = "We're turning toward the edge of the dial. Two galaxies a century. Possibly three.", gap = 1.0 },
  { say = "host", text = "Hold on to your coffee. And Teodor, hold on. Help is coming. It's very large and very slow, but it's coming faster than it ever has." },
]

