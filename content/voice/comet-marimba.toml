# ── Host links ────────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
lines = [
  { sting = "weather" },
  { say = "host", text = "Surf report! Waves of pure time rolling in at three to four minutes, nice and glassy, with the occasional Tuesday breaking on the left." },
  { say = "host", text = "If you get caught in one, just relax. You'll come out last week. Totally fine." },
]

[[clip]]
id = "dj-002"
category = "dj"
lines = [
  { say = "host", text = "Hat update! We have lost eleven hats since breakfast. They're somewhere behind us now, in orbit." },
  { say = "host", text = "If you're further back on the comet and a sun hat hits you, that's ours. Keep it. Wear it with love." },
]

[[clip]]
id = "dj-003"
category = "dj"
