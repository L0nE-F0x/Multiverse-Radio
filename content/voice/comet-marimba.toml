[[clip]]
id = "dj-008"
category = "dj"
lines = [
  { say = "host", text = "Someone asked me how long I've been on vacation. You know when you go away, and you forget what day it is? I forgot what year it is. I forgot when I forgot." },
  { say = "host", text = "Best decision I ever made. I think. Here's a song!" },
]

[[clip]]
id = "dj-009"
category = "dj"
