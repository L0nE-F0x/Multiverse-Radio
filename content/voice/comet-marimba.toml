[[clip]]
id = "dj-007"
category = "dj"
daypart = "night"
lines = [
  { say = "host", text = "Night on the comet. The stars are streaking past so fast they look like rain. Warm rain. Lie back in the hammock and let it fall on you. Here's a slow one." },
