# Comet Marimba — Coco Halley, from a beach on the tail of a comet.
# Sunny, breezy, permanently on vacation. Running bits: surf reports for waves of pure
# time, hats lost to orbit, the crab with sunglasses who refuses every request.
station = "comet-marimba"

[voices]
host = { voice = "af_nova", speed = 1.05, name = "Coco Halley" }
crab = { voice = "am_puck", fx = "tiny", name = "DJ Sunglass Crab" }
bev = { voice = "bf_lily", fx = "phone", name = "Bev" }

