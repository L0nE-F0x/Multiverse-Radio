  { say = "host", text = "That's a no. He's an artist. Here's what he wants to play." },
]

[[clip]]
id = "dj-004"
category = "dj"
lines = [
  { say = "host", text = "This beach is sponsored by Grumbel's Ladders! Want to see over the tail? Grumbel's! Want to touch a passing star? Grumbel's!" },
  { say = "host", text = "Want to get back down safely? Grumbel's, probably! Up is a choice, everyone! Down is a vacation!" },
]

[[clip]]
id = "dj-005"
category = "dj"
daypart = "morning"
lines = [
  { say = "host", text = "Good morning, beach people! The sun's a friendly distance away, the hammock is stable, and someone has left a coconut in the ice tail to chill. It's going to be a great day! It's always a great day!" },
]

[[clip]]
id = "dj-006"
category = "dj"
daypart = "evening"
lines = [
  { say = "host", text = "The sun is setting! Well. We're leaving it behind. Same effect! Everybody turn around and wave goodbye to the sun! Bye, sun! See you in seventy-six years!" },
