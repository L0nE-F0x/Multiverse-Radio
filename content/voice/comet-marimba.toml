# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-02"
category = "story"
serial = { id = "greg-comes-home", episode = 2 }
title = "Greg Comes Home, Part Two: Hitching a Comet"
bed = "ocean"
lines = [
  { say = "host", text = "Okay, beach people! We picked up a passenger in lane twelve! He hopped across from a whale ship at four this morning! Say hi, Greg!" },
  { say = "greg", text = "Hello. Sorry. I'm very sandy." },
  { say = "host", text = "Everybody's sandy! That's the beach! Crab, get the man some sunglasses!" },
  { say = "crab", text = "Click.", gap = 0.5 },
  { say = "host", text = "The crab has given Greg sunglasses! The crab has never given anyone anything! Greg, that's huge!" },
  { say = "greg", text = "They're very small. They fit, though. When you're a shadow, everything fits." },
  { say = "host", text = "So where are you headed?" },
  { say = "greg", text = "Home. The eastern Overlap. Is the comet going that way?" },
  { say = "host", text = "Sort of! But we only come round every seventy six years, so you'll have to jump off at exactly the right moment. Too early, you're in space. Too late, you're in seventy six years.", gap = 0.8 },
  { say = "greg", text = "When's the right moment?" },
  { say = "host", text = "When the moon goes past on the left! Big grey one, sleepy face, speakers on it. Jump for the moon. The moon's always got room." },
  { say = "host", text = "Hey, Greg. Why did you leave, in the first place?" },
  { say = "greg", text = "He never went anywhere. I wanted to see things.", gap = 1.0 },
  { say = "greg", text = "I've seen things now. I want to tell him about them." },
  { say = "host", text = "That's the best reason to go home I've ever heard! And I've never gone home!", gap = 0.8 },
  { say = "host", text = "There it is! The moon! Go, Greg! Jump!" },
  { sfx = "whoosh" },
  { say = "host", text = "He's off! He's flying! He's waving! He's still wearing the crab's sunglasses!" },
  { say = "crab", text = "Keep them.", gap = 0.4 },
]

