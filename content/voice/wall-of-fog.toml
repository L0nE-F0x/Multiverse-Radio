# Wall of Fog — 98.25, a dimension made entirely of reverb.
#
# Ellis hosts: mumbles beautifully, has never finished a sentence, and everybody agrees with
# him anyway. Every sound here echoes forever, so old gigs, dropped spoons and soundchecks
# from 1991 are still coming round the back. The audience is three blurry shapes and a lamp.
#
# Running bits: the lamp (his best friend); pedals that make the other pedals further away;
# the one complete sentence Ellis has ever said (it's about water and backups). The captions
# carry the mumbles, so the ellipses are the jokes. Cross-station: Grandma Diesel from
# Waystation 9 delivered a truckload of fog.
station = "wall-of-fog"

[voices]
host = { voice = "am_echo", speed = 0.9, name = "Ellis" }
reverb = { voice = "am_echo", speed = 0.9, fx = "cave", name = "The Reverb" }

[[show]]
id = "soundcheck"
name = "Soundcheck"
blurb = "The soundcheck began in 1991. Some of it is still going. Join it."
start = 16
end = 19

[[show]]
id = "the-loud-quiet"
name = "The Loud Quiet"
blurb = "Very loud, then very, very quiet, then very loud. Ellis has notes. Nobody can read them."
start = 22
end = 2

[[show]]
id = "fogbound"
name = "Fogbound"
blurb = "The small hours, where the reverb is deepest and the lamp keeps watch."
start = 2
end = 6

