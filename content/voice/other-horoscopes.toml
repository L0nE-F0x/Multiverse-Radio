# Horoscopes for Other Universes — 95.65, the back room of a planetarium that isn't open.
#
# Madame Orrery reads for people born under stars you can't see from here. She is gentle,
# certain and specific, and has never been wrong in any universe she has checked. The signs
# of the other zodiac: The Teapot, The Ladder, The Single Sock, The Blinking Cat, The Spare
# Key, The Paper Boat, The Lamp Left On (and, once a year, The Lantern). She calls people
# "dear". Her crystal ball mostly shows static.
#
# The `reading` kit chains a sign, one to three readings and the lucky items. Readings are
# written for anyone, under any sign.
station = "other-horoscopes"

[voices]
orrery = { voice = "af_aoede", speed = 0.92, name = "Madame Orrery" }
teapot = { voice = "am_michael", fx = "phone", name = "Caller, a Teapot" }
sock = { voice = "af_river", fx = "phone", name = "Caller, a Single Sock" }

[[show]]
id = "morning-alignment"
name = "The Morning Alignment"
blurb = "Your day ahead, in every universe that has days."
start = 7
end = 10

[[show]]
id = "compatibility-hour"
name = "Compatibility Hour"
blurb = "Will a Teapot and a Ladder get along? Callers ask Madame Orrery about partners from other universes."
start = 19
end = 22

[[show]]
id = "night-shift-charts"
name = "Charts for the Night Shift"
blurb = "Readings for whoever is still awake: bakers, nurses, lighthouse keepers and relay operators."
start = 0
end = 4

