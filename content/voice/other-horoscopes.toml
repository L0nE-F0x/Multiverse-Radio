  { say = "sock", text = "Hello? I'm a Single Sock. I've been told the other sock is in another universe." },
  { say = "orrery", text = "It is, dear. I've seen it. It's under a radiator, in a universe very like this one. It's warm. It's thinking of you." },
  { say = "sock", text = "Should I go and get it?" },
  { say = "orrery", text = "No. Wear odd socks. It's how the multiverse knows you're keeping a place for someone." },
  { say = "sock", text = "Oh. Oh, that's nice.", gap = 0.6 },
