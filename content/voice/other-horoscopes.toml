  { sfx = "phone-ring" },
  { say = "orrery", text = "Compatibility Hour. Hello, dear." },
  { say = "teapot", text = "Hi, Madame Orrery. I'm a Teapot, and I've met someone lovely. But she's a Ladder." },
  { say = "orrery", text = "Oh, that's a beautiful match. A Teapot and a Ladder. That's a cup of tea, on a high shelf." },
  { say = "orrery", text = "Someone has to climb up for it. Someone has to be worth climbing for." },
  { say = "teapot", text = "Which one of us is which?" },
  { say = "orrery", text = "You take turns, dear. That's the whole secret. That's every secret, really.", gap = 0.6 },
  { sfx = "phone-hangup" },
]

[[clip]]
id = "show-compat-002"
category = "call"
show = "compatibility-hour"
title = "A Single Sock"
lines = [
