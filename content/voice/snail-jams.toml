# Shows, the dj kit (an opener, one to three slow observations, a hand-off), a serial
# episode and Halloween. Everything here is slow on purpose. The Patient Ones, the Moss
# Collective and the Lettuce Quartet are resident artists (src/content/packs/chill.ts).
# Existing clips above are rendered and deployed; only add.

