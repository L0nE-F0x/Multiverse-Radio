# Snail Jams — Shelley Shellbourne, from a garden where time is mostly optional.
# She speaks extremely slowly and is very proud of it. Running bits: live traffic on a
# single leaf, the slow-motion raindrop (a two-part story), requests from last month.
station = "snail-jams"

[voices]
host = { voice = "af_sky", speed = 0.78, name = "Shelley Shellbourne" }
# v3: serial.
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, a Shadow" }

