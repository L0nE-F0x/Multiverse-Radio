# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-05"
category = "story"
serial = { id = "greg-comes-home", episode = 5 }
title = "Greg Comes Home, Part Five: Half a Hat"
lines = [
  { say = "host", text = "We have a guest on the leaf.", gap = 0.8 },
  { say = "host", text = "He came through very fast this morning. Again. And this time, I called out. I said, slow down.", gap = 0.8 },
  { say = "host", text = "And he did.", gap = 1.0 },
  { say = "greg", text = "Hello. Sorry. I'm in a bit of a hurry. I'm going home." },
  { say = "host", text = "We'll fix that.", gap = 0.8 },
  { say = "host", text = "Last time you went past, you dropped something. We kept it for you. Under the mushroom.", gap = 0.8 },
  { say = "host", text = "Half a hat." },
  { say = "greg", text = "Oh. That's the shadow of half my hat. I've been wondering where it went." },
  { say = "host", text = "It's been very good. It didn't move at all.", gap = 0.8 },
  { say = "greg", text = "Why is everyone being so kind?" },
  { say = "host", text = "Because you're going home.", gap = 0.8 },
  { say = "host", text = "And the way home should be slow. So you notice it.", gap = 1.0 },
  { say = "greg", text = "How slow?" },
  { say = "host", text = "Stay for one song. Just one. Sit on the leaf." },
  { say = "greg", text = "Okay.", gap = 2.4 },
  { say = "host", text = "See?", gap = 0.8 },
  { say = "host", text = "Nothing happened.", gap = 0.8 },
  { say = "host", text = "Isn't it nice." },
  { say = "greg", text = "It is, actually." },
  { say = "host", text = "When it gets dark, the fireflies will light you to the edge of the garden. They don't offer that to just anyone.", gap = 0.8 },
  { say = "host", text = "Here's your song, Greg. Take your time." },
]

