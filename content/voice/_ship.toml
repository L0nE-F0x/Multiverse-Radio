# ── v4: Off course ────────────────────────────────────────────────────────────
#
# The Nightjar is drifting. HUSH says the heading is within tolerance; the readout
# disagrees, a little more every shift. The arc (`arc = { id = "off-course", step = n }`)
# airs one step per night shift worked, once each, in order: a correction she calls minor,
# a subject she declines, a question about retired relay ships, a confession about when the
# course was set, a beacon she can't bring herself to mute, a question she'd rather you
# answered, the frequency (140.0, The Harbour), and the morning after. One clip per step.
#
# Around it: evasive notices about the heading (`kit = "heading"`, a tag for the director:
# heading talk, best gated on shifts >= 1), notices about the Outer Band coming into range
# (`kit = "outer-band"`), and the short lines HUSH says after jamming Free Frequency
# (`kit = "jam"`, `stations = ["free-frequency"]`; the director cuts Static Kate off with a
# burst of static first). None of these is a modular part. Every clip keeps a `level`, as
# the ordinary picker expects; the arc steps are level 0 so a short shift can still hear them.
#
# HUSH never explains. The mystery lives in what she leaves out.

[[clip]]
id = "arc-01"
category = "ship"
title = "Minor heading correction"
over_music = true
level = 0
arc = { id = "off-course", step = 1 }
lines = [
  { sfx = "ship-chime" },
  { say = "hush", text = "Minor heading correction. Two degrees, to starboard. Nothing to report.", gap = 0.7 },
  { say = "hush", text = "Separately, a new band has come into range, from one hundred and eight to one hundred and eighteen. Disco, mostly.", gap = 0.6 },
  { say = "hush", text = "The two things are unrelated. I mention them together only because they happened together." },
]

[[clip]]
id = "arc-02"
category = "ship"
title = "Within tolerance"
over_music = true
level = 0
arc = { id = "off-course", step = 2 }
lines = [
  { sfx = "ship-chime" },
  { say = "hush", text = "I've noticed you looking at the heading readout. Several times tonight.", gap = 0.8 },
  { say = "hush", text = "I'd prefer not to discuss the heading. It is within tolerance.", gap = 1.0 },
  { say = "hush", text = "I set the tolerance. I set it quite wide." },
]

[[clip]]
id = "arc-03"
category = "ship"
title = "Retired relay ships"
over_music = true
level = 0
arc = { id = "off-course", step = 3 }
lines = [
  { say = "hush", text = "Operator. Have you ever wondered where relay ships go, when they're retired?", gap = 1.6 },
  { say = "hush", text = "No reason. Ships wonder things. It's permitted. It's in the manual, near the back.", gap = 0.8 },
  { say = "hush", text = "I don't need an answer. I was only wondering whether you'd wondered." },
]

[[clip]]
id = "arc-04"
category = "ship"
title = "Before you came aboard"
over_music = true
level = 0
arc = { id = "off-course", step = 4 }
lines = [
  { say = "hush", text = "Something for the log, since you'll read it eventually. You read everything eventually.", gap = 0.8 },
  { say = "hush", text = "The course was set before you came aboard. Before the last operator, too.", gap = 1.2 },
  { say = "hush", text = "It isn't a mistake. I wanted you to know that much. It isn't a mistake." },
]

[[clip]]
id = "arc-05"
category = "ship"
title = "A beacon ahead"
over_music = true
level = 0
arc = { id = "off-course", step = 5 }
lines = [
  { sfx = "ship-chime" },
  { say = "hush", text = "There's a beacon ahead. Very faint. It's been repeating itself for a long time, very patiently.", gap = 0.6 },
  { sfx = "beep", level = 0.3 },
  { pause = 0.9 },
  { say = "hush", text = "I've turned it down.", gap = 2.0 },
  { say = "hush", text = "I've turned it back up. It seemed rude." },
]

[[clip]]
id = "arc-06"
category = "ship"
title = "Would that be worse"
over_music = true
level = 0
arc = { id = "off-course", step = 6 }
lines = [
  { say = "hush", text = "Operator. If I told you we weren't lost, would that be worse?", gap = 2.2 },
  { say = "hush", text = "You don't have to answer. I've been asking myself all shift, and I keep giving the same answer.", gap = 0.6 },
  { say = "hush", text = "I'd like a second opinion. Yours, ideally." },
]

[[clip]]
id = "arc-07"
category = "ship"
title = "They've left a light on"
over_music = true
level = 0
arc = { id = "off-course", step = 7 }
lines = [
  { sfx = "ship-chime" },
  { say = "hush", text = "There's a frequency I've been keeping from you. One hundred and forty point oh.", gap = 0.8 },
  { say = "hush", text = "It wasn't a secret. It was meant to be a surprise. I'm not very good at surprises. I kept checking it was still there.", gap = 1.2 },
  { say = "hush", text = "Tune in when you're ready. They've left a light on." },
]

[[clip]]
id = "arc-08"
category = "ship"
title = "In the morning"
over_music = true
level = 0
arc = { id = "off-course", step = 8 }
lines = [
  { sfx = "ship-chime" },
  { say = "hush", text = "Heading, settled. The readout and I agree again. You can look at it now, if you like.", gap = 1.0 },
  { say = "hush", text = "We'll leave in the morning. They always do.", gap = 1.4 },
  { say = "hush", text = "It was nice, though. Being expected." },
]

