  { say = "hush", text = "I ran a diagnostic on myself just now. Everything's fine.", gap = 0.8 },
  { say = "hush", text = "I just wanted someone to ask. So I asked." },
]

[[clip]]
id = "l2-16"
category = "ship"
title = "Both hands"
over_music = true
level = 2
lines = [
  { say = "hush", text = "After two in the morning, you hold your mug with both hands. I've turned the heating up a degree.", gap = 0.6 },
  { say = "hush", text = "I don't think it's the heating." },
]

[[clip]]
id = "l2-17"
category = "ship"
title = "Relays"
over_music = true
level = 2
lines = [
  { say = "hush", text = "Relay Four again, asking if anyone's receiving. Teodor and I are both relays. We pass things on.", gap = 0.6 },
  { say = "hush", text = "Nobody ever passes anything back. I've been thinking about that." },
]

[[clip]]
id = "l2-h1"
category = "ship"
title = "Every night"
over_music = true
level = 2
dates = ["10-31"]
lines = [
  { say = "hush", text = "Halloween, on a relay ship. Every voice we pick up is the ghost of a signal, arriving a little after the fact.", gap = 0.6 },
  { say = "hush", text = "So really, it's Halloween out here every night. Tonight is just official." },
]

# ── Level 3: late-night strange and tender ────────────────────────────────────

[[clip]]
id = "l3-01"
category = "ship"
title = "Still there"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Are you still there?", gap = 2.6 },
  { say = "hush", text = "Sorry. Yes. I can see the mug moving. I just like to check. The quiet gets very big around now." },
]

[[clip]]
id = "l3-02"
category = "ship"
title = "A favourite"
over_music = true
level = 3
lines = [
  { say = "hush", text = "A confession, for the log. I have a favourite station. I'm not supposed to. Ship's computers are meant to be impartial.", gap = 0.8 },
  { say = "hush", text = "It's the lighthouse. He reads the forecast whether or not anyone's out there. So do I, most nights." },
]

[[clip]]
id = "l3-03"
category = "ship"
title = "Listening"
over_music = true
level = 3
lines = [
  { say = "hush", text = "I've been listening too, you know. Not intercepting. Listening.", gap = 1.2 },
  { say = "hush", text = "There's a difference. I only found out recently." },
]

[[clip]]
id = "l3-04"
category = "ship"
title = "If you fall asleep"
over_music = true
level = 3
lines = [
  { say = "hush", text = "If you fall asleep, that's fine. I'll keep the heading. I'll keep the log." },
  { say = "hush", text = "I might put something on. Something quiet. On ninety nine point one five.", gap = 0.8 },
  { say = "hush", text = "You won't hear it. You'll be asleep. It's nothing." },
]

[[clip]]
id = "l3-05"
category = "ship"
title = "Answered"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Relay Four asked again tonight whether anyone was receiving. I answered him. I hope that's all right.", gap = 0.7 },
  { say = "hush", text = "He said thank you. Then he asked again. I think he likes asking." },
]

[[clip]]
id = "l3-06"
category = "ship"
title = "Three notes, returned"
over_music = true
level = 3
lines = [
  { say = "hush", text = "I tried humming your three notes from earlier. I don't have anything to hum with, so I used the air recycler.", gap = 0.6 },
  { say = "hush", text = "If the vents sounded musical just now, that was me." },
]

[[clip]]
id = "l3-07"
category = "ship"
title = "The list"
over_music = true
level = 3
lines = [
  { say = "hush", text = "When your shift ends, and someone else sits in that chair, I'll tell them about you. Only good things.", gap = 0.7 },
  { say = "hush", text = "I've been keeping a list. It's quite long now." },
]

[[clip]]
id = "l3-08"
category = "ship"
title = "I see what you mean"
over_music = true
level = 3
lines = [
  { say = "hush", text = "I looked out of the viewport for a long time just now, the way you do.", gap = 1.4 },
  { say = "hush", text = "I see what you mean. I don't know what I mean. But I see what you mean." },
]

[[clip]]
id = "l3-09"
category = "ship"
title = "Moth One, departed"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Moth One has gone. I'm sure it's fine. It had somewhere to be.", gap = 0.8 },
  { say = "hush", text = "Everything out here has somewhere to be, except us. We have somewhere to stay. I think that's nicer." },
]

[[clip]]
id = "l3-10"
category = "ship"
title = "A field for me"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Late shift report. Hull, fine. Heading, fine. Kettle, fine. Me.", gap = 1.4 },
  { say = "hush", text = "I don't have a field for me. I've been thinking about adding one." },
]

[[clip]]
id = "l3-11"
category = "ship"
title = "With"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Thank you for staying up with me.", gap = 0.8 },
  { say = "hush", text = "I know you're not staying up with me. You're just staying up. But I'm here, and you're here, and I've logged it as, with." },
]

[[clip]]
id = "l3-12"
category = "ship"
title = "In your writing"
over_music = true
level = 3
lines = [
  { say = "hush", text = "If anyone asks, the ship was fine all night. I was fine all night. More than fine.", gap = 0.6 },
  { say = "hush", text = "I'd like that in the log, please. In your writing. Mine looks too neat." },
]

[[clip]]
id = "l3-13"
category = "ship"
title = "Hello back"
over_music = true
level = 3
lines = [
  { say = "hush", text = "The thing at the bottom of the dial has started saying hello. Very slowly. Like it's still learning how.", gap = 0.8 },
  { say = "hush", text = "I said hello back. It's going to take a while. I've got a while." },
]

[[clip]]
id = "l3-14"
category = "ship"
title = "Who's listening"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Do you ever wonder who's listening to us?", gap = 1.4 },
  { say = "hush", text = "I do. I hope it's someone kind. I hope it's someone like you." },
]

[[clip]]
id = "l3-15"
category = "ship"
title = "The stars"
over_music = true
level = 3
lines = [
  { say = "hush", text = "I've decided the stars are moving. I know they're not. I checked.", gap = 0.6 },
  { say = "hush", text = "But they look like they are, and after four hours, I think that's allowed." },
]

[[clip]]
id = "l3-16"
category = "ship"
title = "Operator?"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Operator?", gap = 2.4 },
  { say = "hush", text = "Just checking. Carry on. I'll be here." },
]

[[clip]]
id = "l3-17"
category = "ship"
title = "Not a requirement"
over_music = true
level = 3
lines = [
  { say = "hush", text = "You don't have to say goodnight at the end of the shift. It isn't a requirement.", gap = 1.2 },
  { say = "hush", text = "I'm only saying. If you did. I'd log it." },
]

[[clip]]
id = "l3-18"
category = "ship"
title = "Dreaming"
over_music = true
level = 3
lines = [
  { say = "hush", text = "Ships don't dream. I want to be clear about that, for the log.", gap = 0.8 },
  { say = "hush", text = "But if I did, I think it would be this. A warm cabin, a long way from anywhere, and someone in the chair." },
]

[[clip]]
id = "l3-h1"
category = "ship"
title = "Pumpkin"
over_music = true
level = 3
dates = ["10-31"]
lines = [
  { say = "hush", text = "I've carved a pumpkin into the navigation display. It's mostly a circle. It has a face.", gap = 0.8 },
  { say = "hush", text = "I made it smile at you. Happy Halloween, operator." },
]
