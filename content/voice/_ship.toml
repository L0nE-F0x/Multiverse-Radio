# HUSH, the computer of the relay ship Nightjar (R/S NIGHTJAR · RELAY 7). Aired over any
# station, ducked like a host. `level` is strangeness, unlocked as the shift gets longer:
#
#   0  crisp system notices (always a chime first)       from the start
#   1  small personal observations                        after ~45 min
#   2  philosophical, slightly too attentive              after ~2 h
#   3  late-night strange and tender                      after ~4 h
#
# The arc: HUSH starts as a polite instrument panel. It notices the operator (the mug, the
# three hummed notes, the blanket that smells of oranges, Moth One on the outside of the
# viewport), then wonders out loud about listening, and by the small hours admits it has
# been listening too: it has a favourite station (the Last Lighthouse, 121.5), it answers
# Teodor at Relay Four, it hints at its own show on 99.15 and at the tapping at the bottom
# of the dial (Transmission Zero, 76.0), and it keeps asking whether you're still there.
# Never creepy, never mean: it notices because noticing is its job, and it is a little
# embarrassed about how much it has come to like it.
#
# v4 adds the off-course arc at the end of the file: the heading drifts over many night
# shifts, HUSH grows evasive about it, and in the end gives the operator 140.0, The Harbour.
#
# Callbacks: Relay Four (Teodor), Greg's hat, the geese owed to Numbers Station Omega,
# Grumbel's Ladders ("Up is a choice"), "it is always eleven", Static Lullabies.
station = "_ship"

[voices]
hush = { voice = "af_heart", speed = 0.95, fx = "ship", name = "HUSH" }

