# ── Links, appeals and sponsors ───────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
lines = [
  { say = "gault", text = "I'm often asked why I've never closed a case. It's quite simple. Once a case is closed, it stops being a question and becomes a story." },
  { say = "gault", text = "Stories end. Questions keep you company." },
]

[[clip]]
id = "psa-001"
category = "psa"
title = "A Public Appeal"
lines = [
  { say = "gault", text = "A public appeal. If you see something unusual, say something vague. Something like: that's odd." },
  { say = "gault", text = "Then carry on with your evening. This has been a public appeal." },
]

[[clip]]
id = "ad-001"
category = "ad"
