  { say = "hollis", text = "Inspector, it's Hollis Fenn. I'm ringing about my shadow." },
  { say = "gault", text = "Greg." },
  { say = "hollis", text = "You know him?" },
  { say = "gault", text = "Everybody knows Greg, Mister Fenn. He's been seen on the moon. On a beach. At a recital. Every time, he looks a little happier." },
