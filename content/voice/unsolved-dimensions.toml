lines = [
  { say = "gault", text = "Unsolved Dimensions is sponsored by Grumbel's Ladders." },
  { say = "gault", text = "Eleven generations of ladders. Not one complaint. Not one incident. Not a single rung out of place." },
  { say = "gault", text = "Which is exactly what worries me. I have a file on them. It's very thin. I check it every night." },
  { say = "gault", text = "Grumbel's Ladders. Up is a choice. So, Mister Grumbel, is down." },
]

