# Unsolved Dimensions — 93.95, a basement archive of cases that never quite happened.
#
# Inspector Delphine Gault is grave, thorough and unbearably serious about crimes such as a
# moved teaspoon. She has never closed a case and has never wanted to. Constable Pike reads
# the lab results, which are always inconclusive. The goose is a suspect in everything and
# has asked for a solicitor. Rain on the blinds, a typewriter mid-sentence.
#
# The `case` kit chains a case opening, one to three pieces of evidence and "the case
# remains open". Evidence is written to fit any case.
station = "unsolved-dimensions"

[voices]
gault = { voice = "bf_alice", speed = 0.95, name = "Inspector Delphine Gault" }
pike = { voice = "bm_daniel", name = "Constable Pike" }
witness = { voice = "af_river", fx = "phone", name = "A Witness" }
hollis = { voice = "am_echo", fx = "phone", name = "Hollis" }

[[show]]
id = "morning-roll-call"
name = "Morning Roll Call"
blurb = "Inspector Gault reviews the overnight incidents. None of them have been solved. She is relieved."
start = 8
end = 10

[[show]]
id = "witness-hour"
name = "Witness Hour"
blurb = "Listeners ring in with information. The Inspector gently talks them out of it."
start = 19
end = 22

[[show]]
id = "cold-cases"
name = "Cold Cases, Warm Milk"
blurb = "The oldest files in the basement, reopened by lamplight and carefully left open."
start = 1
end = 5

