[[clip]]
id = "case-open-6"
category = "story"
kit = "case"
part = "open"
bed = "rain"
lines = [
  { sting = "crime" },
  { say = "gault", text = "Case file one hundred. Someone finished a jigsaw in the night. The jigsaw was not ours. Neither, it turns out, was the table." },
]

[[clip]]
id = "case-evidence-1"
category = "story"
kit = "case"
part = "body"
bed = "rain"
lines = [
  { say = "gault", text = "We found a single footprint at the scene. Size nine. Left foot.", gap = 0.6 },
  { say = "gault", text = "No right foot has ever been recovered. I've stopped looking. Some things walk alone." },
]

[[clip]]
id = "case-evidence-2"
category = "story"
kit = "case"
part = "body"
bed = "rain"
lines = [
  { say = "gault", text = "We spoke to the neighbours. They said it was a quiet dimension. They always say that." },
  { say = "gault", text = "Every dimension is quiet, until somebody moves something half an inch and doesn't say sorry." },
]

[[clip]]
id = "case-evidence-3"
category = "story"
kit = "case"
part = "body"
bed = "rain"
lines = [
  { say = "gault", text = "And then, of course, there is the goose. The goose was present. The goose is always present." },
  { say = "gault", text = "I asked the goose where it was on the night in question. The goose has asked for a solicitor." },
]

[[clip]]
id = "case-evidence-4"
category = "story"
kit = "case"
part = "body"
bed = "rain"
lines = [
  { say = "gault", text = "The dimension itself had no alibi. Asked where it was at the time of the incident, it said: everywhere." },
  { sfx = "typing" },
  { say = "gault", text = "A classic answer. Impossible to disprove. I wrote it down anyway." },
]

[[clip]]
id = "case-evidence-5"
category = "story"
kit = "case"
part = "body"
bed = "rain"
lines = [
  { say = "gault", text = "Forensics found traces of a substance on the handle. Jam. Strawberry. Possibly raspberry, with ambitions." },
  { say = "pike", text = "We sent it to the lab, Inspector." },
  { say = "gault", text = "And?" },
  { say = "pike", text = "The lab ate it." },
]

[[clip]]
id = "case-evidence-6"
category = "story"
kit = "case"
part = "body"
bed = "rain"
lines = [
  { say = "gault", text = "Our only witness was a standard lamp in the hallway. It was switched off at the time. When we switched it on, it had nothing to add." },
  { say = "gault", text = "Its testimony was, however, very illuminating. I won't apologise for that." },
]

[[clip]]
