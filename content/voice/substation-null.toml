# Substation Null — 111.1, the reactor room of the derelict freighter Diligence.
#
# Null hosts, barely: tempo counts, coolant readings, single words, long silences. Means every
# one of them. The deadpan minimalism is the joke, so most clips are short; the count is made
# up with idents, readings, the freighter's ancient and very thorough safety announcements
# (which Null answers in one word) and a few longer incident reports, in Null's own style.
#
# The `readings` kit chains "Readings.", one to three instrument readings and a sign-off.
# Running bits: the coolant (fine; stop asking); the reactor, dormant, with feelings; the glow
# stick on the console. Cross-station: Teodor at Relay Four, Bev and the request line,
# Grumbel's Ladders, Greg's show (Monday review: too loud).
station = "substation-null"

[voices]
host = { voice = "am_echo", speed = 0.9, name = "Null" }
safety = { voice = "af_sarah", speed = 1.05, fx = "megaphone", name = "Diligence Safety System" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
teodor = { voice = "bm_daniel", fx = "radio", name = "Teodor, Relay Four" }

[[show]]
id = "peak-load"
name = "Peak Load"
blurb = "The core at full output. A hundred and thirty-something beats a minute. Nobody talks. Least of all the host."
start = 0
end = 3

[[show]]
id = "cooldown"
name = "Cooldown"
blurb = "Steam, slower kicks, the crowd sitting on the pipes. The coolant is fine."
start = 5
end = 8

[[show]]
id = "maintenance-window"
name = "The Maintenance Window"
blurb = "Scheduled maintenance. Nothing is maintained. The music continues."
start = 13
end = 16

