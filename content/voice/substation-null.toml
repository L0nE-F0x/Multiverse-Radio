# ── Safety announcements (the freighter's, decades old) ──────────────────────

[[clip]]
id = "psa-001"
category = "psa"
title = "Coolant Is Not a Beverage"
lines = [
  { say = "safety", text = "Attention, crew of the Diligence. Coolant is not a beverage. It is blue, it glows, and it is served from a pipe. None of these things make it a beverage." },
  { say = "safety", text = "Thank you for your cooperation." },
  { pause = 1.2 },
  { say = "host", text = "Noted." },
]

[[clip]]
id = "psa-002"
category = "psa"
title = "The Reactor Is Dormant"
lines = [
  { say = "safety", text = "This is a reminder that the main reactor is in a dormant state. Dormant is not the same as asleep." },
  { say = "safety", text = "Please do not tuck the reactor in. Please do not read the reactor stories. The reactor does not require a goodnight." },
  { pause = 1.6 },
  { say = "host", text = "It liked the stories." },
]

[[clip]]
id = "psa-003"
category = "psa"
title = "Hazard Lighting"
lines = [
  { say = "safety", text = "Some sections of this vessel contain flashing hazard lights. These lights indicate an emergency." },
  { say = "safety", text = "They have indicated an emergency continuously for forty years. At this point, please treat them as decoration." },
  { pause = 1.2 },
  { say = "host", text = "Correct." },
]

[[clip]]
id = "psa-004"
category = "psa"
title = "Muster Stations"
lines = [
  { say = "safety", text = "In the event of an emergency, please proceed calmly to your nearest muster station. Your nearest muster station is the dance floor." },
  { say = "safety", text = "All muster stations are the dance floor. This was not the original plan." },
  { pause = 1.4 },
  { say = "host", text = "It is now." },
]

# ── Incident reports ──────────────────────────────────────────────────────────

[[clip]]
id = "story-001"
category = "story"
title = "Incident Report: The Glow Stick"
lines = [
  { say = "host", text = "Incident report.", gap = 1.0 },
  { say = "host", text = "Someone brought a glow stick. Green.", gap = 1.2 },
  { say = "host", text = "The reactor saw it. Core output rose by two percent.", gap = 1.4 },
  { say = "host", text = "The glow stick was asked to leave. It did not leave. It cannot walk.", gap = 1.4 },
  { say = "host", text = "It is now on the console. The reactor is calmer when it can see it.", gap = 1.6 },
  { say = "host", text = "Resolved." },
]

[[clip]]
id = "story-002"
category = "story"
title = "Incident Report: A Question"
lines = [
  { say = "host", text = "Incident report.", gap = 1.0 },
  { say = "host", text = "A man on the catwalk asked what kind of music this is.", gap = 1.4 },
  { say = "host", text = "I said, yes.", gap = 1.4 },
  { say = "host", text = "He left.", gap = 2.4 },
  { say = "host", text = "He came back.", gap = 1.4 },
  { say = "host", text = "He has not asked again.", gap = 1.2 },
  { say = "host", text = "He comes every night. He stands where he stood. He nods at me. I nod back.", gap = 1.4 },
  { say = "host", text = "That is the answer. Resolved." },
]

[[clip]]
id = "story-003"
category = "story"
title = "Incident Report: A Smile"
lines = [
  { say = "host", text = "Incident report. Hour three. Peak load.", gap = 1.0 },
  { say = "host", text = "A smile was observed in the crowd. Source unknown.", gap = 1.4 },
  { say = "host", text = "It spread.", gap = 1.8 },
  { say = "host", text = "By hour four, eleven smiles. Containment was not attempted.", gap = 1.6 },
  { say = "host", text = "Hour five. The smiles reached the catwalk. A man laughed out loud. The steam pipes rattled.", gap = 1.6 },
  { say = "host", text = "No damage. Some things should be allowed to vent.", gap = 1.4 },
  { say = "host", text = "Resolved." },
]

[[clip]]
id = "story-004"
category = "story"
title = "Incident Report: One Second"
lines = [
  { say = "host", text = "Incident report.", gap = 1.0 },
  { say = "host", text = "At two fourteen, the music stopped. For one second.", gap = 1.4 },
  { say = "host", text = "Nobody moved. Four hundred people, standing completely still in the dark, in a dead reactor, waiting.", gap = 1.8 },
  { say = "host", text = "It was the best second of the night.", gap = 1.4 },
  { say = "host", text = "The music came back. Four hundred people came back with it.", gap = 1.6 },
  { say = "host", text = "Cause of the stop: unknown. Will not be repeated.", gap = 1.6 },
  { say = "host", text = "Probably. Logged." },
]

