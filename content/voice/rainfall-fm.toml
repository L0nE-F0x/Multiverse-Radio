# Rainfall FM — Drizzle Montgomery, overnight from the Damp Dimension, Precinct 9.
# Running bits: rainfall totals read like football results, the sun as a rumour, the
# kettle, floating-umbrella etiquette, the terrifying Dry Place.
station = "rainfall-fm"

[voices]
host = { voice = "bf_isabella", speed = 0.92, name = "Drizzle Montgomery" }
# v3: serials.
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, a Shadow" }
teodor = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }
window_a = { voice = "af_river", fx = "distant", name = "Lantern Street" }
window_b = { voice = "am_eric", fx = "distant", name = "Lantern Street" }
window_c = { voice = "bf_lily", fx = "distant", name = "Lantern Street" }
window_d = { voice = "am_santa", fx = "distant", name = "Ferdinand, Tram Driver" }

