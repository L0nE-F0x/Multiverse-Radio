# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-04"
category = "story"
serial = { id = "greg-comes-home", episode = 4 }
title = "Greg Comes Home, Part Four: Nobody Here Has a Shadow"
bed = "rain"
lines = [
  { say = "host", text = "We've a visitor at the studio tonight. He came down through the only gap in the clouds we've had all year, on a moonbeam, and landed in the big puddle outside the bakery. It's Greg." },
  { say = "greg", text = "Hello. Sorry about the puddle." },
  { say = "host", text = "The puddle's fine, love. It's had worse. How are you finding Precinct Nine?" },
  { say = "greg", text = "Dark. Every time I go outside, I sort of disappear." },
  { say = "host", text = "That's the clouds. Nobody here has a shadow. You're the first one most of Precinct Nine has ever met." },
  { say = "greg", text = "People keep stopping to look at me." },
  { say = "host", text = "They think you're beautiful. Like a sunset that walks about.", gap = 1.0 },
  { say = "greg", text = "I need to get to the eastern Overlap. I'm going home. But I can't go anywhere without a light." },
  { say = "host", text = "Then take the night tram. Ferdinand drives it. The number nine has big front lamps, and they'll throw you all the way to the edge of the precinct." },
  { say = "greg", text = "Will he mind?" },
  { say = "host", text = "Ferdinand? He rings the bell for puddles, love. He'll be thrilled." },
  { sfx = "bell" },
  { say = "host", text = "That's him now. Go on. Sit up at the front, in the light." },
  { say = "greg", text = "Thank you, Drizzle." },
  { say = "host", text = "And Greg? Your fella's porch light. Is it on?" },
  { say = "greg", text = "Every night, they say." },
  { say = "host", text = "Then you'll be fine. Here's one for the road. It's wet." },
]

[[clip]]
id = "teodor-is-heard-10"
category = "story"
serial = { id = "teodor-is-heard", episode = 10 }
title = "Teodor Is Heard, Part Ten: Rain at Relay Four"
bed = "rain"
lines = [
  { say = "host", text = "It's nearly three in the morning, and Precinct Nine is doing something it's never done. Every window on Lantern Street is open. Every light is on." },
  { say = "host", text = "Teodor at Relay Four has a little crystal radio now. It can just about hear, if something carries the signal all the way out to him." },
  { say = "host", text = "And round here, love, we've got plenty of something that goes everywhere.", gap = 0.8 },
  { say = "host", text = "Rain. So at three o'clock, we're all going to lean out of our windows, say it into the rain, and let the rain take it. Here we go. Ferdinand's ringing the bell." },
  { sfx = "bell" },
  { say = "host", text = "Yes." },
  { say = "window_a", text = "Yes!" },
  { say = "window_b", text = "Yes, Teodor." },
  { say = "window_c", text = "Yes, love." },
  { say = "window_d", text = "Yes!" },
  { pause = 2.0 },
  { say = "teodor", text = "Relay Four. Night four thousand and forty. Something odd. It's raining here.", gap = 0.8 },
  { say = "teodor", text = "It never rains at Relay Four. And the rain is saying something. On the roof. On the window. On Captain, who is not pleased.", gap = 1.0 },
  { say = "teodor", text = "It sounds like. It sounds a lot like yes.", gap = 1.6 },
  { say = "host", text = "It is, love. It's from all of us. Close your windows, everybody. And Teodor? Put a towel down. It's our rain. It gets everywhere." },
]

