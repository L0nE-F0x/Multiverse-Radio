[[clip]]
id = "sports-007"
category = "sports"
title = "Post-Match Interview: The Ball"
bed = "crowd"
lines = [
  { say = "chip", text = "I'm down on the pitch with tonight's ball, the small, polite sun. Sun, congratulations on a terrific match!" },
  { say = "sun", text = "Thank you, Chip. I'd just like to thank both teams for kicking me so gently." },
  { say = "chip", text = "How did it feel out there?" },
  { say = "sun", text = "Warm." },
  { say = "chip", text = "There was that moment in the second half, when you went into the net, and the net caught fire! Talk us through that!" },
  { say = "sun", text = "I felt terrible. I always feel terrible about the net. I've sent it a card." },
  { say = "chip", text = "Any message for the fans?" },
  { say = "sun", text = "Please wear sun cream, and drink some water. And if anybody's thinking about me, at sunset, I'm fine. I'm just going round." },
  { say = "chip", text = "The sun, everybody! What a professional!" },
  { sfx = "applause", seconds = 2.5 },
]

[[clip]]
id = "sports-008"
category = "sports"
title = "Post-Match Interview: Number Zero"
bed = "stadium"
lines = [
  { sting = "sports" },
  { say = "chip", text = "Doug, what a debut! The late substitute, a shadow wearing number zero, no person attached, came on in the eightieth minute and changed the game!" },
  { say = "doug", text = "He played in the gaps, Chip. Went everywhere the light wasn't. I've never seen positioning like it." },
  { say = "chip", text = "I'm joined now by the player himself. Great game! What's your name?" },
  { say = "greg", text = "Greg." },
  { say = "chip", text = "Greg! Where did you learn to play like that?" },
  { say = "greg", text = "Under people. You learn a lot, under people." },
  { say = "chip", text = "That winning goal! You were behind the goalkeeper the whole time! He never saw you!" },
  { say = "greg", text = "Nobody ever looks behind them. I was behind someone for forty one years." },
  { say = "chip", text = "Any message for the fans?", gap = 1.0 },
  { say = "greg", text = "Tell Hollis I'm okay. Tell him I scored." },
  { say = "chip", text = "Who's Hollis?" },
  { say = "greg", text = "He'd know." },
  { say = "doug", text = "Chip, I think that's the shadow off the news." },
  { say = "chip", text = "Greg, everybody! A real shadow of a player! In a good way!" },
