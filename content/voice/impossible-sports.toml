  { say = "chip", text = "Folks, breaking news in the long jump! Ottoline Brisk, who took off in the qualifying round four hundred years ago, is about to pass directly over Coliseum Zero!" },
  { say = "doug", text = "Still airborne. Beautiful form. She's barely lost any height." },
