[[clip]]
id = "sports-004"
category = "sports"
title = "The Backwards Marathon"
bed = "crowd"
lines = [
  { sting = "sports" },
  { say = "chip", text = "We're live at the finish line for the annual Backwards Marathon, where the runners start at the finish and run the course in reverse, until they've un-run it!" },
  { say = "doug", text = "Beautiful event, Chip. Very hard on the knees. Backwards." },
  { say = "chip", text = "The runners are lining up at the finish now, wearing their medals, which they'll be handing back at the start! Doug, what makes a great backwards marathoner?" },
  { say = "doug", text = "Regret, mostly. You've got to want to go back. And you can't see where you're going. You can only see where you've been." },
  { say = "chip", text = "That's beautiful, Doug." },
  { say = "doug", text = "It's a hamstring injury, Chip, is what it is." },
  { say = "chip", text = "The favorite today is Pelham Ostrander, last year's winner, who finished so far behind everyone that he was back at the start before they began!" },
  { say = "doug", text = "Great sense of where he came from, Pelham." },
  { say = "chip", text = "The starter raises the pistol, which fires inward! And they're un-off!" },
  { sfx = "whoosh" },
  { say = "chip", text = "Look at them go! Look at them come back! I honestly don't know which it is!" },
]

