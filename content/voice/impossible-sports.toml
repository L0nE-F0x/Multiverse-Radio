# Impossible Sports Network — 100.4, Coliseum Zero, upper atmosphere.
#
# Chip Thunderbuckle does play-by-play: has never understood the rules, has never let that
# slow him down. Doug Steadman does color: a former professional at Cloudball, a sport
# that no longer exists. Bitter, precise, oddly moving.
#
# The sports: Sunball (the ball is a small, polite sun), Gravity Polo, the Backwards
# Marathon, Competitive Waiting, Mirror Tennis, Synchronized Existing, the Long Jump
# (still airborne), Hide and Seek (year forty one), Tug of War Against Time, Extreme
# Staring. Running gags: Greg the shadow plays a blinder, Bev rings the phone-in,
# the Grumbel's Ladders Halftime Report.
station = "impossible-sports"

[voices]
chip = { voice = "am_fenrir", speed = 1.15, name = "Chip Thunderbuckle" }
doug = { voice = "bm_lewis", name = "Doug Steadman" }
sun = { voice = "af_sky", fx = "tiny", name = "The Ball, a Small Sun" }
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, Number Zero" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
grumbel = { voice = "am_eric", name = "Arnold Grumbel" }
# v3: Halloween.
ghost = { voice = "bm_fable", fx = "ghost", name = "Old Wendell, a Ghost" }
teen = { voice = "am_puck", name = "A Teenager in a Sheet" }

