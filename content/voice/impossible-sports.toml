[[clip]]
id = "sports-001"
category = "sports"
title = "Sunball: Kickoff at Coliseum Zero"
bed = "stadium"
lines = [
  { sting = "sports" },
  { say = "chip", text = "Good evening, sports fans, and welcome to Coliseum Zero for tonight's Sunball! I'm Chip Thunderbuckle, alongside the great Doug Steadman. Doug, what a night!" },
  { say = "doug", text = "It's a night, Chip." },
  { say = "chip", text = "And here comes the ball! The ball tonight is a small, polite sun, roughly the size of a melon, and it is glowing beautifully!" },
  { say = "doug", text = "The sun's in good form this season. It's apologizing less." },
  { say = "chip", text = "The referee places it on the center spot! The players are in their oven mitts! And there's the whistle!" },
  { sfx = "beep" },
  { say = "chip", text = "And it's kicked! Oh! Oh, the sun says sorry! The sun has apologized to the boot! What a gesture!" },
  { say = "doug", text = "Old habit, that. They train it out of them in the junior leagues, but some suns just can't help it." },
  { say = "chip", text = "The Glow Wardens have it now, up the left wing, he's running, he's sweating, everybody's sweating, Doug, it's a sun!" },
  { say = "doug", text = "It's a hot sport, Chip. Always has been." },
  { say = "chip", text = "He shoots! It's in! It's a goal! The net is on fire! The net is always on fire! The groundskeeper is already bringing out a new one!" },
  { sfx = "applause", seconds = 2.5 },
  { say = "doug", text = "Lovely finish. Low, warm, right in the corner." },
]

[[clip]]
id = "sports-002"
category = "sports"
title = "Sunball: The Ball Sets"
bed = "stadium"
daypart = "evening"
lines = [
  { say = "chip", text = "We're into the second half here at Coliseum Zero, and Doug, something's happening to the ball!" },
  { say = "doug", text = "It's going down, Chip." },
  { say = "chip", text = "It's going down! The ball is sinking slowly toward the western goal line, and it's turning a gorgeous orange!" },
  { say = "doug", text = "That's a sunset. It does it every evening. Nobody ever schedules around it." },
  { say = "chip", text = "Can the players do anything?" },
  { say = "doug", text = "No. You can't kick a sun while it's setting, Chip. It's in the rulebook. It's the only thing in the rulebook." },
  { say = "chip", text = "Both teams are just standing there now! They're watching it! Some of them have taken their mitts off! A defender has put his arm round a striker!" },
  { say = "doug", text = "Gets everyone, a good sunset." },
  { say = "chip", text = "And it's gone. The ball has set. The stadium is dark. Ninety thousand fans, just sitting quietly in the dark.", speed = 1.0, gap = 1.6 },
  { say = "chip", text = "Doug, this is the best match I've ever seen.", speed = 1.0 },
  { say = "doug", text = "Play resumes at sunrise. Bring a coat." },
]

