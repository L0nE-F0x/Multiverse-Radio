[[clip]]
id = "sports-006"
category = "sports"
title = "Competitive Waiting: The Bureau Open, Day Nine Thousand"
bed = "fluorescent"
lines = [
  { sting = "sports" },
  { say = "chip", text = "We're live at the Bureau of Infinite Queues for day nine thousand of the Bureau Open, the most grueling event in Competitive Waiting!" },
  { say = "doug", text = "It's a mental game, Chip. Always has been." },
  { say = "chip", text = "Two competitors remain! In the blue chair, Agatha Venn, who has been waiting since she was eleven! In the orange chair, the challenger, a man named Clive, who came in to ask for directions!" },
  { say = "doug", text = "Clive's got no business being here, Chip. And yet." },
  { say = "chip", text = "And the take a number display has changed! It now reads four billion and six!", gap = 1.0 },
  { say = "chip", text = "Neither competitor has reacted! Neither competitor has reacted! What composure!" },
  { say = "doug", text = "Look at Agatha's hands. Folded. Still. She's not even holding a magazine. That's thirty years of discipline, that is." },
  { say = "chip", text = "Clive has picked up a magazine! It's from eleven years ago! He's reading about a holiday he will never take!" },
  { say = "doug", text = "Rookie error. Once you're reading, you're waiting for the magazine to end. Different event entirely." },
  { say = "chip", text = "We'll be back with more waiting in about four years!" },
