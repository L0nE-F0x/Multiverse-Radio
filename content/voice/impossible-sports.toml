[[clip]]
id = "sports-011"
category = "sports"
title = "Mirror Tennis: The Reflection Takes a Point"
bed = "crowd"
lines = [
  { sting = "sports" },
  { say = "chip", text = "Folks, something historic is happening at the Mirror Tennis Open! For three hundred years, every match in this sport has been a draw, because you play against your own reflection!" },
  { say = "doug", text = "Same shots. Same speed. Same score. Purest sport there is, Chip." },
  { say = "chip", text = "But tonight Vivian Hale is serving for the match, and Doug, her reflection is not serving!" },
  { say = "doug", text = "Her reflection is tying its shoelace." },
  { say = "chip", text = "Vivian serves! The reflection isn't even looking! It's in! It's an ace! Vivian Hale has beaten her own reflection!" },
  { say = "doug", text = "No, Chip. Look at the scoreboard." },
  { say = "chip", text = "The scoreboard says, the reflection, one! The reflection has won the point! The reflection was tying its shoelace, and won the point!" },
  { say = "doug", text = "Because it didn't care, Chip. First time in three hundred years someone on that court didn't care. Vivian cared too much. She always has." },
  { say = "chip", text = "That's very deep, Doug." },
  { say = "doug", text = "I've been there. Not in tennis. But I've been there." },
  { say = "chip", text = "The reflection is leaving the court! It's going for a sandwich! Vivian is still standing there! Vivian is reflecting!" },
]

[[clip]]
id = "sports-012"
category = "sports"
title = "Doug's Corner: The Last Game of Cloudball"
bed = "wind"
lines = [
  { say = "doug", text = "This is Doug's Corner. Chip's getting a sandwich.", gap = 0.8 },
  { say = "doug", text = "People ask me what Cloudball was. It's hard to explain, now. You'd need a sky like the ones we used to have." },
  { say = "doug", text = "The goals were clouds. They drifted. You'd get the ball, look up, and the goal would be over the next valley, so you'd run. Whole games happened miles from where they started." },
  { say = "doug", text = "I played centre half for the Lowland Mists for eleven seasons. Never won a thing. Didn't matter. You were up in the hills with your mates, chasing weather.", gap = 0.8 },
  { say = "doug", text = "The last game was in the summer of the long drought. We kicked off under one cloud. By half time it was getting thin. By the eightieth minute, you could see through it." },
  { say = "doug", text = "And then it was gone. The sky went clear, and stayed clear. Nowhere to score.", gap = 1.6 },
  { say = "doug", text = "We stood there for a bit. Nobody blew the whistle. Somebody's dad brought out oranges.", gap = 1.0 },
  { say = "doug", text = "Anyway. It's a sun for a ball now. Fine. Good sport. Very bright." },
  { say = "doug", text = "But if you ever see a big, slow cloud going over a field, and you feel like running after it, for no reason. That's Cloudball. You're playing. Go on.", gap = 0.8 },
  { say = "doug", text = "Back to Chip." },
]

[[clip]]
id = "sports-013"
category = "sports"
title = "Synchronized Existing: The Final"
bed = "crowd"
lines = [
  { sting = "sports" },
  { say = "chip", text = "It's the final of Synchronized Existing, folks, and the pair from the Overlap are on the mat!" },
  { say = "doug", text = "Lovely pair. Twins. Well. The same person, twice. Which helps." },
  { say = "chip", text = "And they're existing! Look at them exist! Total commitment! They are both, very clearly, here!" },
  { say = "doug", text = "Bit of a wobble in the second minute there, Chip. One of them thought about lunch." },
  { say = "chip", text = "Is that a deduction?" },
  { say = "doug", text = "Half a point. You can't be thinking about lunch while existing at this level. It's just the existing. Nothing else." },
  { say = "chip", text = "The routine's over! The judges are scoring! Nine point five! Nine point five! And a seven, from the judge who also thought about lunch!" },
  { say = "doug", text = "Hypocritical. But that's judging." },
  { say = "chip", text = "What a performance! Doug, could you do that?" },
  { say = "doug", text = "Chip, I've been existing for fifty eight years. Never once been scored. That's the difference between amateurs and professionals." },
]

[[clip]]
id = "sports-014"
category = "sports"
title = "The Sports Phone-In: Bev"
bed = "stadium"
lines = [
  { sting = "sports" },
  { say = "chip", text = "It's the Sports Phone-In! Lines are open! Caller, you're on the Impossible Sports Network!" },
  { say = "bev", text = "Hello? Is this the request line?" },
  { say = "chip", text = "This is the Sports Phone-In! Do you have a sports question?" },
  { say = "bev", text = "Well, I'm looking for a song. It goes dum, dum, da dum. And then a man cries." },
  { say = "chip", text = "Bev, is that a chant? Doug, is that a terrace chant?" },
  { say = "doug", text = "Sing it again, Bev." },
  { say = "bev", text = "Dum. Dum. Da dum.", speed = 0.8, gap = 1.0 },
  { say = "doug", text = "That's every final I ever played in, Bev. That's not a song. That's the sound of the last whistle." },
  { say = "bev", text = "Oh. Well, can you play it?" },
  { say = "chip", text = "Bev, I'll do you one better! Ninety thousand fans, are you ready? On three! Dum, dum, da dum!" },
  { sfx = "applause", seconds = 3.0 },
  { say = "bev", text = "Oh, that's lovely. That's not it. But that's lovely." },
]

[[clip]]
id = "sports-015"
category = "sports"
title = "Gravity Polo: The Flip"
bed = "stadium"
lines = [
  { sting = "sports" },
  { say = "chip", text = "Gravity Polo, folks, third chukka, and the Upward Falcons are pressing!" },
  { say = "doug", text = "Gravity flips every chukka in this sport, Chip. Any minute now." },
  { say = "chip", text = "Falcons on the attack, the rider's lining up the shot, he swings, and", cut = 0.92 },
  { sfx = "whoosh" },
  { say = "chip", text = "And gravity's flipped! Gravity has flipped! The horses are on the ceiling! The players are on the ceiling! The crowd is on the ceiling, and the crowd is loving it!" },
  { say = "doug", text = "Well, the crowd hasn't got a choice, Chip." },
  { say = "chip", text = "The ball is falling upward toward the Wolves' goal, it's going in, it's going in, oh, it's stuck in the floodlights!" },
  { say = "doug", text = "That happens. The lights are the floor now." },
  { say = "chip", text = "Doug, as a former professional, what's the trick to Gravity Polo?" },
  { say = "doug", text = "Same as any sport, Chip. Keep your hat on, and know which way is down. And if you don't know, ask the horse. The horse always knows." },
]

