# Piano for Empty Rooms — 93.05, the unvisited wing.
#
# The Caretaker speaks rarely and softly, as if asked not to disturb the rooms. Every piece is
# dedicated to a room nobody has entered yet. The grand piano plays itself; he listens from
# the corridor. The door at the back of the music room is open about an inch.
#
# Running bits: rooms that have never been told what they're for; dusting the light, not the
# dust; footprints in the east room (now a visited room, taken off the schedule); the door
# that is either an invitation or a draught. Keep it spare: short sentences, long rests.
station = "piano-empty-rooms"

[voices]
host = { voice = "bm_lewis", speed = 0.85, name = "The Caretaker" }

[[show]]
id = "dust-sheets"
name = "Dust Sheets"
blurb = "The furniture is covered for the night. Slow piano for the drawing room, the hall and the chairs."
start = 20
end = 23

[[show]]
id = "unvisited-hours"
name = "The Unvisited Hours"
blurb = "The quietest hours, in the quietest rooms. Nobody comes. Everything is ready."
start = 1
end = 5

[[show]]
id = "first-light"
name = "First Light in the East Wing"
blurb = "Morning sun across bare floorboards, and the piano a little brighter for it."
start = 6
end = 9

