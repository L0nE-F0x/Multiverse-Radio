]

[[clip]]
id = "dj-002"
category = "dj"
daypart = "evening"
title = "The Guest Room"
lines = [
  { say = "host", text = "This one is for the guest room. It's been made up for a guest for a very long time. Fresh sheets every Sunday. A glass of water on the nightstand." },
  { say = "host", text = "The guest hasn't come. The room isn't upset. It's ready. That's all." },
]

[[clip]]
id = "dj-003"
category = "dj"
lines = [
  { say = "host", text = "I don't go into the rooms. I'm not supposed to. I sit outside, in the corridor, and the piano plays, and I listen at the doors." },
  { say = "host", text = "It's a good arrangement. Nobody disturbs anybody." },
]

[[clip]]
id = "dj-004"
category = "dj"
lines = [
  { say = "host", text = "The piano is playing itself again tonight. It doesn't need me. I've been told I'm not needed, by several people, quite kindly." },
  { say = "host", text = "I come anyway. Someone should hear it." },
]

[[clip]]
id = "dj-005"
category = "dj"
title = "The Ballroom"
lines = [
  { say = "host", text = "There's a ballroom on the fourth floor. Sprung floor. Chandeliers. A little balcony for the band. Nobody has ever danced there. Not once." },
  { say = "host", text = "The floor is perfect. Not a single scuff. This is a waltz for it. You don't have to dance. Neither does the floor." },
]

[[clip]]
id = "dj-006"
category = "dj"
title = "Footprints in the East Room"
lines = [
  { say = "host", text = "Something happened in the east wing this week. Footprints, in the dust. One person. To the window, and back. They stood at the window for a while, I think. Long enough to see the garden.", gap = 1.0 },
  { say = "host", text = "We've taken the east room off the schedule. It's a visited room now. It'll be all right. It looked out of the window too." },
]

[[clip]]
id = "dj-007"
category = "dj"
lines = [
  { say = "host", text = "People ask what a caretaker does, in rooms nobody uses. Mostly, I dust the light." },
  { say = "host", text = "It comes in through the tall windows and lies on the floorboards, and the dust settles in it. I don't move the dust. I just make sure the light is still there in the morning." },
]

[[clip]]
id = "dj-008"
category = "dj"
title = "The Room Behind the Bookcase"
lines = [
  { say = "host", text = "This piece is for the room behind the bookcase. Nobody has found it. I know it's there, because the corridor is three feet longer than the rooms add up to." },
  { say = "host", text = "I haven't looked. It's not my place. But it deserves music, the same as the others." },
]

[[clip]]
id = "dj-009"
category = "dj"
title = "The Door"
lines = [
  { say = "host", text = "The door at the back of the music room is open about an inch. It has been since I came here. I've never closed it." },
  { say = "host", text = "I don't know if it's an invitation or a draught. I've decided it's both. That seems kindest." },
]

[[clip]]
id = "dj-010"
category = "dj"
daypart = "morning"
lines = [
  { say = "host", text = "Morning, now. The light is coming round the east side. In a minute it will reach the piano, and the piano will play a little brighter." },
  { say = "host", text = "It always does. It doesn't know it does. Don't tell it." },
]

[[clip]]
id = "dj-011"
category = "dj"
daypart = "night"
title = "For the Night Watch"
lines = [
  { say = "host", text = "If you're the one on the ship, on the night watch. I expect there's a room aboard that nobody uses. A storeroom. A spare cabin. A cupboard with one chair in it." },
  { say = "host", text = "This one is for it. Leave the door the way you found it." },
]

[[clip]]
id = "dj-012"
category = "dj"
title = "The Waiting Room"
lines = [
  { say = "host", text = "This is for a waiting room, in a station that was built, and finished, and never opened. Rows of benches. A clock that somebody winds." },
  { say = "host", text = "Nobody is waiting there. Which, if you think about it, is the best kind of waiting room." },
]

[[clip]]
id = "dj-013"
category = "dj"
title = "A New Attic"
lines = [
  { say = "host", text = "This one is for the attic of a house on a road that was only finished last week. Nobody has been up the ladder yet. It's warm up there, and quiet, and it smells of new wood." },
  { say = "host", text = "One day there'll be boxes. Not yet." },
]

