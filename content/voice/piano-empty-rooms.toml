# ── The Unvisited Hours (1–5) ─────────────────────────────────────────────────

[[clip]]
id = "id-unvisited-hours"
category = "id"
show = "unvisited-hours"
part = "open"
lines = [
  { say = "host", text = "It's the middle of the night. This is the Unvisited Hours. Nobody will come now. We can all relax." },
]

[[clip]]
id = "dj-unvisited-hours-001"
category = "dj"
show = "unvisited-hours"
lines = [
  { say = "host", text = "At this hour the house makes small sounds. The pipes. The stairs settling. A window easing in its frame." },
  { say = "host", text = "People think a house is quiet when it's empty. It isn't. It's just talking to itself, now that it can." },
]

[[clip]]
id = "dj-unvisited-hours-002"
category = "dj"
show = "unvisited-hours"
lines = [
  { say = "host", text = "Three in the morning. Every room in the wing is empty, every door closed, except the one. The piano is playing for all of them at once." },
  { say = "host", text = "That takes some doing. It manages." },
]

