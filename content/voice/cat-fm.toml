# Cat FM — 92.25, a warm windowsill, briefly.
#
# A radio station run entirely by a cat: Gloria, the station manager. Dennis (the intern)
# is nominally in charge. He announces her programming decisions as they happen and
# apologises for most of them. Long silences, sudden enthusiasm, things knocked off the
# desk. The mug is always at the very edge.
#
# The `decision` kit chains Dennis noticing, one to three of Gloria's decisions and a
# sheepish hand-back to the music.
station = "cat-fm"

[voices]
dennis = { voice = "am_liam", name = "Dennis (the intern)" }
caller = { voice = "af_alloy", fx = "phone", name = "A Listener With a Cat" }
grumbel = { voice = "am_eric", name = "Arnold Grumbel" }

[[show]]
id = "morning-window"
name = "The Morning Window"
blurb = "Gloria watches the birds. Dennis does the commentary. The birds are not aware."
start = 7
end = 10

[[show]]
id = "sunbeam-show"
name = "The Sunbeam Show"
blurb = "Broadcasting live from wherever the patch of sunlight is on the carpet."
start = 13
end = 16

[[show]]
id = "three-am-zoomies"
name = "The Three AM Zoomies"
blurb = "The station manager runs from one end of the studio to the other, at full speed, for reasons."
start = 2
end = 4

