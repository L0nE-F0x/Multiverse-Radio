# ── The Interval ──────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
lines = [
  { say = "interval", text = "There is a glass on the table that has been falling for as long as I have lived here.", gap = 1.2 },
  { say = "interval", text = "It hasn't reached the floor. I don't think it wants to. I wouldn't either." },
]

[[clip]]
id = "dj-002"
category = "dj"
lines = [
  { say = "interval", text = "The dust in the moonlight hasn't moved since I arrived. Every speck is exactly where it was.", gap = 1.0 },
  { say = "interval", text = "I've named some of them. Not all. I'm pacing myself." },
]

[[clip]]
id = "dj-003"
category = "dj"
lines = [
  { say = "interval", text = "People ask what I do in here. I wait.", gap = 1.2 },
  { say = "interval", text = "Not for anything. Waiting is simply what the inside of a minute feels like." },
]

[[clip]]
id = "dj-004"
category = "dj"
lines = [
  { say = "interval", text = "There's a clock on the wall with its second hand caught halfway.", gap = 1.0 },
  { say = "interval", text = "I've grown fond of it. It's trying very hard." },
]

[[clip]]
id = "dj-005"
category = "dj"
lines = [
  { say = "interval", text = "If you came here to put something off, you're welcome. This is the place for it.", gap = 1.0 },
  { say = "interval", text = "Everything you're putting off is out there, in the next minute. It will keep." },
]

[[clip]]
id = "dj-006"
category = "dj"
lines = [
  { say = "interval", text = "The next minute knocks, now and then. Very politely.", gap = 1.0 },
  { say = "interval", text = "I tell it, soon. It goes away, and comes back, and it is always the same knock." },
]

[[clip]]
id = "dj-007"
category = "dj"
lines = [
  { say = "interval", text = "Everyone awake at three thirty three thinks they are the only one.", gap = 1.0 },
  { say = "interval", text = "They're all in here. A little way apart, like strangers in a waiting room. Hello, all of you." },
]

[[clip]]
id = "dj-008"
category = "dj"
lines = [
  { say = "interval", text = "I counted the minute once, from the inside. It took years.", gap = 1.2 },
  { say = "interval", text = "It came to sixty. I was a little disappointed. I had hoped for sixty one." },
]

[[clip]]
id = "dj-009"
category = "dj"
lines = [
  { say = "interval", text = "In here, the kettle never boils, and never goes cold.", gap = 1.0 },
  { say = "interval", text = "It's the most restful thing I know. I think the kettle agrees." },
]

[[clip]]
id = "dj-010"
category = "dj"
lines = [
  { say = "interval", text = "If you fall asleep in here, you won't miss anything.", gap = 1.2 },
  { say = "interval_low", text = "Nothing happens. That's the gift." },
]

[[clip]]
id = "dj-011"
category = "dj"
title = "The Ship"
lines = [
  { say = "interval", text = "Your ship keeps very good time. Tell her she needn't, in here.", gap = 1.0 },
  { say = "interval", text = "Tell her the Interval says hello. She'll pretend she doesn't remember me. Ships are like that." },
]

[[clip]]
id = "dj-012"
category = "dj"
lines = [
  { say = "interval", text = "When you go, it will be three forty six. You'll have been here thirteen minutes, and also no time at all.", gap = 1.0 },
  { say = "interval", text = "Both are true. Take whichever you need." },
]

[[clip]]
id = "dj-the-minute-1"
category = "dj"
show = "the-minute"
lines = [
  { say = "interval", text = "It's nearly the end of the minute. It is always nearly the end of the minute.", gap = 1.2 },
  { say = "interval", text = "Come back tomorrow, at the same time. It will be the same time." },
]

[[clip]]
id = "news-001"
category = "news"
title = "The News, from Inside the Minute"
lines = [
  { say = "interval", text = "The news, from inside the minute.", gap = 1.4 },
  { say = "interval", text = "Nothing has happened. Nothing is about to.", gap = 1.4 },
  { say = "interval", text = "That is all the news. It is good news. It will be good news again tomorrow, at the same time, for the same reasons." },
]

[[clip]]
id = "weather-001"
category = "weather"
title = "Weather, Inside the Minute"
lines = [
  { say = "interval", text = "Weather, inside the minute.", gap = 1.0 },
  { say = "interval", text = "Still. Moonlight from the left, at the usual angle. Dust, suspended. No wind.", gap = 1.0 },
  { say = "interval", text = "A small chance of the second hand moving.", gap = 1.6 },
  { say = "interval", text = "It won't." },
]

[[clip]]
id = "psa-001"
category = "psa"
title = "Time Check"
lines = [
  { say = "interval", text = "Time check. It is three thirty three, and some of the way to three thirty four.", gap = 1.0 },
  { say = "interval", text = "I won't say how far. It's rude to ask a minute its age." },
]

