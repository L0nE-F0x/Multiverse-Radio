# The Minute Between — 133.3, the gap between 3:33 and 3:34. A secret station.
#
# On air only from 03:33 to 03:46 local; static at this frequency the rest of the night.
# The Interval lives inside the minute: a room between two clock ticks, dust hanging in the
# moonlight, a glass that has been falling for as long as anyone remembers, a clock with its
# second hand caught halfway. Ambient: voices are rare, short and calm, slightly amused that
# you found the door. Thirteen minutes of airtime a night, all of which are the same one.
#
# The Convergence (Saturdays, 20:00 UTC) can only reach in here when that happens to be 03:33
# somewhere; the reactions are written for it anyway, and they arrive late and frozen.
station = "minute-between"

[voices]
interval = { voice = "bf_lily", speed = 0.82, name = "The Interval" }
interval_low = { voice = "bf_lily", speed = 0.8, fx = "whisper", name = "The Interval" }

[[show]]
id = "the-minute"
name = "The Minute"
blurb = "Thirteen minutes from the inside of one. Take your time. There is plenty, all of it the same."
start = 3
end = 4

