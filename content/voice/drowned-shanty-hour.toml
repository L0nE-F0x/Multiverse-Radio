# The Drowned Shanty Hour — 96.55, the good ship Damp Regret, below the waterline.
#
# Captain Ezra Wetherell leads a translucent crew in shanties about events that haven't
# happened yet. They have been at sea since before there was water. The ship is fine. (The
# ship is not fine.) Old Pettibone plays accordion on a barrel; young Tobias, the cabin boy,
# is four hundred and twelve; the lookout went to look out in 1840.
#
# Running bits: "the ship is fine"; shanties about future wrecks; the cook's sea soup; the sea
# area forecast (Regret, Dismay, Lower Dismay, the Bottom). Cross-station: Greg the shadow
# seen at sea, Hollis.
station = "drowned-shanty-hour"

[voices]
host = { voice = "bm_daniel", speed = 0.95, name = "Captain Ezra Wetherell" }
crew = { voice = "bm_fable", speed = 0.95, fx = "ghost", name = "The Crew" }

[[show]]
id = "the-dog-watch"
name = "The Dog Watch"
blurb = "The short evening watches: working songs, mended nets and the cook's sea soup."
start = 16
end = 20

[[show]]
id = "low-tide"
name = "Low Tide"
blurb = "The quiet watch. Slow shanties, lanterns low, and a crew that can't remember its last dry sock."
start = 1
end = 5

[[show]]
id = "forenoon-watch"
name = "The Forenoon Watch"
blurb = "Morning songs to stamp the damp out of the deck. Breakfast is ship's biscuit. It's soft."
start = 8
end = 12

