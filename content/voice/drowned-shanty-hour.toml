# ── Host links ────────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
title = "Before the Water"
lines = [
  { say = "host", text = "When we set sail, there was no sea. People forget that. We had the ship, we had the crew, we had the songs. We just didn't have anywhere to put them." },
  { say = "host", text = "So we sailed anyway, across nothing, singing. Water turned up about a week later. Wonderful timing. We were very pleased." },
]

[[clip]]
id = "dj-002"
category = "dj"
title = "The Wreck of the Margaret Ann"
lines = [
  { say = "host", text = "This next shanty is about the wreck of the Margaret Ann, which will happen in the year two thousand and ninety one. Terrible business. Lovely tune." },
  { say = "host", text = "If you're on the Margaret Ann, or know anyone who will be, maybe sing along. It might help. It won't. But it might." },
]

[[clip]]
id = "dj-003"
category = "dj"
title = "The Ship Is Fine"
lines = [
  { say = "host", text = "A word from the bridge. Some of you have written in with concerns about the ship. Let me reassure you. The ship is fine." },
  { say = "host", text = "She's lower in the water than she was. She's lower than the water, technically. But she's fine. Bail if you like. It's soothing." },
]

[[clip]]
id = "dj-004"
category = "dj"
title = "Old Pettibone"
lines = [
  { say = "host", text = "That was Old Pettibone on the accordion. He's sat on that barrel since the Long Calm. The squeezebox has a leak, but then, so does everything." },
  { say = "host", text = "Nobody's asked him what's in the barrel. Nobody wants to know. It's the only dry thing on the ship." },
]

[[clip]]
id = "dj-005"
category = "dj"
title = "Roll Call"
lines = [
  { say = "host", text = "Roll call, for the listeners. Bosun?" },
  { say = "crew", text = "Aye!" },
  { say = "host", text = "Cook?" },
  { say = "crew", text = "Aye!" },
  { say = "host", text = "Lookout?", gap = 1.4 },
  { say = "host", text = "The lookout went to look out in eighteen forty, and we haven't seen him since. Which, in fairness, means he's doing it properly." },
]

[[clip]]
id = "dj-006"
category = "dj"
daypart = "evening"
title = "Sea Soup"
lines = [
  { say = "host", text = "Supper tonight is the cook's sea soup. It's made of the sea. We have a great deal of sea, and the cook is nothing if not resourceful." },
  { say = "host", text = "Seconds are available. Seconds are always available. Seconds are, in a sense, all around us." },
]

[[clip]]
id = "dj-007"
category = "dj"
lines = [
  { say = "host", text = "Our cabin boy, young Tobias, turns four hundred and twelve next week. He's still the cabin boy. Promotion's slow at sea." },
  { say = "host", text = "I've told him. Keep your head down, sing your heart out, and in another couple of centuries you'll make deckhand." },
]

[[clip]]
id = "dj-008"
category = "dj"
daypart = "night"
title = "Ahoy, the Nightjar"
lines = [
  { say = "host", text = "Ahoy, the Nightjar. Relay Seven. We see your lamp up there above the fog, on the night watch, same as us. Long watches, empty seas, and a radio for company." },
  { say = "host", text = "Different ship. Same job. This one's for you." },
]

[[clip]]
id = "dj-009"
category = "dj"
daypart = "morning"
lines = [
  { say = "host", text = "Morning, all. The sun's up, somewhere above us. We can see it through the water, a little wobbling coin." },
  { say = "host", text = "Crew's on deck, stamping out the damp. Let's have a working song to get the blood going. Not that there's much of it left." },
]

[[clip]]
id = "dj-010"
category = "dj"
title = "A Shadow on the Water"
lines = [
  { say = "host", text = "The watch reported a shadow on the water last night, with no ship above it, moving east. Small fellow. Wearing a hat. I hailed him. He said his name was Greg, and he was seeing the world." },
  { say = "host", text = "Fair enough. That's what the sea's for. Hollis, if you're listening, he looked well. Sunburnt, for a shadow." },
]

[[clip]]
id = "dj-011"
category = "dj"
title = "Haul Away"
lines = [
  { say = "host", text = "When I say haul, you say away. Haul!" },
  { say = "crew", text = "Away!" },
  { say = "host", text = "Haul!" },
  { say = "crew", text = "Away!" },
  { say = "host", text = "Lovely. We're not hauling anything. We've nothing to haul. But it does the lungs good. Next song." },
]

# ── Weather ───────────────────────────────────────────────────────────────────

[[clip]]
id = "weather-001"
category = "weather"
title = "The Sea Area Forecast"
bed = "sea"
lines = [
  { say = "host", text = "And now the sea area forecast, issued by the Damp Regret at an hour nobody asked for.", gap = 0.7 },
  { say = "host", text = "Regret. Damp, becoming damper. Moderate, occasionally good, then poor.", gap = 0.6 },
  { say = "host", text = "Dismay. Fog. Fog later. Then more fog, from the earlier fog.", gap = 0.6 },
  { say = "host", text = "Lower Dismay. Wet. Very wet. Sea state, everywhere.", gap = 0.6 },
  { say = "host", text = "The Bottom. Calm. Quite calm. Visibility, none, but there's nothing to see.", gap = 0.8 },
  { say = "host", text = "That's the forecast. Mind the wet." },
]

