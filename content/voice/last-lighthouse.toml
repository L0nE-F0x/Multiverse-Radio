# ── The forecast for the impossible seas ──────────────────────────────────────

[[clip]]
id = "weather-001"
category = "weather"
title = "The Forecast for the Impossible Seas"
bed = "sea"
lines = [
  { say = "keeper", text = "And now the forecast for the impossible seas, issued from the Last Lighthouse at the usual hour.", gap = 0.8 },
  { say = "keeper", text = "There are warnings of gales in Gannet's Regret, Outer Soup, and Inner Soup.", gap = 0.9 },
  { say = "keeper", text = "Lesser Marrow, Greater Marrow. Southwesterly, four or five, backing sideways later. Rain, then memories. Moderate or good.", gap = 0.9 },
  { say = "keeper", text = "The Tuesday Reach. Northerly, three, becoming Wednesday. Fair. Good, occasionally very good.", gap = 0.9 },
  { say = "keeper", text = "Outer Soup, Inner Soup. Gale eight, stirring clockwise. Thick. Visibility, a spoon's length." },
]

[[clip]]
id = "weather-002"
category = "weather"
title = "The Forecast for the Impossible Seas"
bed = "sea"
lines = [
  { say = "keeper", text = "Far Nonsuch, Near Nonsuch. Variable, two, from no direction in particular. Fog patches, some of them shaped like people you used to know. Poor, becoming kind.", gap = 0.9 },
  { say = "keeper", text = "Lullaby Bank. Westerly, one or two, humming. Showers of moths. Good.", gap = 0.9 },
  { say = "keeper", text = "Thimble. Calm. Very small. Visibility, the whole of Thimble.", gap = 0.9 },
  { say = "keeper", text = "Mothering Sound. Easterly, five, tucking in later. Drizzle. Moderate." },
]

[[clip]]
id = "weather-003"
category = "weather"
title = "The Forecast for the Impossible Seas"
bed = "sea"
lines = [
  { say = "keeper", text = "The Spindles. Northwesterly, six, spinning. Squally, with occasional wool. Moderate, occasionally tangled.", gap = 0.9 },
  { say = "keeper", text = "Velvet Deep. Southerly, three. Dark, but in a nice way. Good.", gap = 0.9 },
  { say = "keeper", text = "Hesitation. Wind, possibly. Weather, perhaps. Visibility, it depends.", gap = 0.9 },
  { say = "keeper", text = "Saltlight. Easterly, four. Bright, with stars below the surface. Excellent." },
]

[[clip]]
id = "weather-004"
category = "weather"
title = "The Forecast for the Impossible Seas"
bed = "sea"
lines = [
  { say = "keeper", text = "North Elsewhere, South Elsewhere. Westerly, veering to somebody else's west. Rain, elsewhere. Good, here.", gap = 0.9 },
  { say = "keeper", text = "The Quiet Rows. Calm. Silent. Visibility good, but nobody is looking.", gap = 0.9 },
  { say = "keeper", text = "Old Pardon. Northeasterly, five, forgiving later. Showers, then clear. Good.", gap = 0.9 },
  { say = "keeper", text = "Biscuit Shoals. Southwesterly, three. Crumbly. Moderate. Mariners are advised to dunk with care." },
]

[[clip]]
id = "weather-005"
category = "weather"
title = "The Forecast for the Impossible Seas"
bed = "sea"
lines = [
  { say = "keeper", text = "The Mirrorline. Wind from the left, which is also the right. Fair, reflected. Visibility, both ways.", gap = 0.9 },
  { say = "keeper", text = "Underneath. No wind. No weather. Nobody has been. Good.", gap = 0.9 },
  { say = "keeper", text = "Dimity. Easterly, two. Lace fog in places. Moderate or good.", gap = 0.9 },
  { say = "keeper", text = "Wren. Westerly, one. Small and brave. Good." },
]

[[clip]]
id = "weather-006"
category = "weather"
title = "The General Synopsis"
bed = "sea"
lines = [
  { say = "keeper", text = "The general synopsis, at midnight.", gap = 0.9 },
  { say = "keeper", text = "Low, Lesser Marrow, nine hundred and ninety, moving slowly toward a decision.", gap = 0.8 },
  { say = "keeper", text = "High, Saltlight, one thousand and thirty, staying where it is, as it always does.", gap = 0.8 },
  { say = "keeper", text = "A ridge of good intentions extends across the Quiet Rows, and is expected to hold." },
]

[[clip]]
id = "weather-007"
category = "weather"
title = "Reports from the Lights"
bed = "sea"
lines = [
  { say = "keeper", text = "And now the reports from the lights, at midnight.", gap = 0.9 },
  { say = "keeper", text = "The Last Lighthouse. Southwesterly, three. Clear. One thousand and twelve, steady. One keeper, awake.", gap = 1.2 },
  { say = "keeper", text = "The lighthouse at Candlemouth. No report.", gap = 0.8 },
  { say = "keeper", text = "There has been no report from Candlemouth for some years. I read its name anyway. Somebody should." },
]

[[clip]]
id = "weather-008"
category = "weather"
