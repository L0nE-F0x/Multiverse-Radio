  { say = "keeper", text = "Gannet's Regret. Northerly, five, apologising later. Showers. Moderate.", gap = 0.9 },
  { say = "keeper", text = "Yarrow Gap. Southeasterly, four. Rain, with the smell of a garden somewhere. Good.", gap = 0.9 },
  { say = "keeper", text = "Dimity. Calm. Mist, lifting by morning. Good.", gap = 0.9 },
  { say = "keeper", text = "Starboard of Everything. Variable. Who can say. Who can say." },
