# The Last Lighthouse — 121.5, a rock between dimensions, out on the deep band. A secret station.
#
# The Keeper reads the forecast for the impossible seas every night, to nobody, just in case,
# and keeps a logbook. Ambient: voices are rare, slow and steady, over waves and the beam.
# The sea areas are all invented and recur, so regular listeners learn them:
#   Lesser Marrow, Greater Marrow, the Tuesday Reach, Far and Near Nonsuch, Lullaby Bank,
#   Thimble, Gannet's Regret, Outer and Inner Soup, the Spindles, Mothering Sound, Velvet Deep,
#   Hesitation, Saltlight, North and South Elsewhere, the Quiet Rows, Old Pardon, Biscuit
#   Shoals, the Mirrorline, Underneath, Dimity, Wren, Candlemouth.
# Callbacks: the Nightjar (HUSH's favourite station is this one; the Keeper has noticed the
# ship listening), the time signal, a message in a bottle.
station = "last-lighthouse"

[voices]
keeper = { voice = "bm_lewis", speed = 0.88, name = "The Keeper" }

[[show]]
id = "the-night-forecast"
name = "The Night Forecast"
blurb = "The forecast for the impossible seas, read at the usual hour for anyone who might be out there."
start = 23
end = 2

[[show]]
id = "the-keepers-log"
name = "The Keeper's Log"
blurb = "Entries from the logbook of the Last Lighthouse, read slowly, by lamplight."
start = 2
end = 6

