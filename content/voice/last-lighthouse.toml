bed = "sea"
lines = [
  { say = "keeper", text = "And the forecast for inshore waters, from the rock to the end of the light.", gap = 0.9 },
  { say = "keeper", text = "Westerly, two. The waves are coming in, as they do, and going out again, as they also do. Visibility, as far as the beam.", gap = 0.9 },
  { say = "keeper", text = "That is the forecast. Good night, to anyone out there." },
]

[[clip]]
id = "weather-009"
category = "weather"
title = "The Forecast for the Impossible Seas"
bed = "sea"
