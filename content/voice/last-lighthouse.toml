# ── The logbook ───────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
title = "Logbook"
bed = "sea"
lines = [
  { say = "keeper", text = "Logbook. The light was lit at dusk, as usual. No ships passed.", gap = 0.9 },
  { say = "keeper", text = "One reflection of a ship passed, and waved. I waved back. Entered it anyway." },
]

[[clip]]
id = "dj-002"
category = "dj"
title = "Logbook"
bed = "sea"
lines = [
  { say = "keeper", text = "Logbook. A gull came to the window and stayed for the whole forecast.", gap = 0.9 },
  { say = "keeper", text = "It did not leave a name. Gulls never do. It is welcome back." },
]

[[clip]]
id = "dj-003"
category = "dj"
title = "Logbook"
bed = "sea"
lines = [
  { say = "keeper", text = "Logbook. Received a faint signal tonight, from a relay ship. The Nightjar.", gap = 0.9 },
  { say = "keeper", text = "Somebody up there is listening. I read the forecast a little more carefully." },
]

[[clip]]
id = "dj-004"
category = "dj"
title = "Logbook"
bed = "sea"
show = "the-keepers-log"
lines = [
  { say = "keeper", text = "Logbook. Polished the lens. Wound the clock. Made the tea. Read the forecast. Nobody came.", gap = 1.0 },
  { say = "keeper", text = "It was a good night. They are all good nights, when nobody is in trouble." },
]

[[clip]]
id = "dj-005"
category = "dj"
title = "Logbook"
bed = "sea"
lines = [
  { say = "keeper", text = "Logbook. The sea was very calm tonight, and very far down. I think it is shy.", gap = 0.9 },
  { say = "keeper", text = "I have stopped looking at it directly. It seems to prefer that." },
]

[[clip]]
id = "dj-006"
category = "dj"
title = "Logbook"
bed = "sea"
show = "the-keepers-log"
lines = [
  { say = "keeper", text = "Logbook. Ninety thousand nights, give or take. I have not missed one.", gap = 1.0 },
  { say = "keeper", text = "I do not say that to boast. I say it so that someone knows." },
]

[[clip]]
id = "dj-007"
category = "dj"
title = "Logbook"
bed = "sea"
lines = [
  { sfx = "splash", level = 0.5 },
  { say = "keeper", text = "Logbook. A bottle washed up with a message in it. The message said, is anyone there.", gap = 1.0 },
  { say = "keeper", text = "I have written, yes, on the back, and put it back in the sea. It will get there." },
]

[[clip]]
id = "dj-008"
category = "dj"
title = "Logbook"
bed = "sea"
lines = [
  { say = "keeper", text = "Logbook. Heard the time signal through the static tonight. Set the clock by it. It was wrong.", gap = 0.9 },
  { say = "keeper", text = "I set it anyway. It is good to agree with somebody." },
]

[[clip]]
id = "dj-009"
category = "dj"
title = "Logbook"
bed = "sea"
show = "the-keepers-log"
lines = [
  { say = "keeper", text = "Logbook. The beam went round eleven thousand times tonight. I counted the first hundred, and then I just watched.", gap = 1.0 },
  { say = "keeper", text = "Some things are better watched than counted." },
]

[[clip]]
id = "dj-010"
category = "dj"
title = "Logbook"
bed = "sea"
lines = [
  { say = "keeper", text = "Logbook. Something tapped at the bottom of the radio band again. A hello, I think, very slow.", gap = 1.0 },
  { say = "keeper", text = "I tapped back on the desk. I don't know if it carries. It seemed only right." },
