[[clip]]
id = "story-001"
category = "story"
title = "The First Ship"
bed = "sea"
lines = [
  { say = "keeper", text = "I am sometimes asked, by nobody, why I keep the light when no ships come.", gap = 1.2 },
  { say = "keeper", text = "On the first night, there was a ship. One small ship, with a lantern at the bow, a long way out, in weather.", gap = 1.0 },
  { say = "keeper", text = "It saw the light. And it turned. And it went home safely.", gap = 1.4 },
  { say = "keeper", text = "I never saw it again. That is how you know it worked.", gap = 1.4 },
  { say = "keeper", text = "So I keep the light. In case. Just in case.", gap = 1.0 },
  { sfx = "foghorn", level = 0.5 },
]
