# The Switchboard — 131.1, the Central Exchange between every universe. A secret station.
#
# Found by ringing advice, then the news, then the traffic (97.8, 89.3, 114.8, each held a
# couple of seconds, within ninety); after that it's on the dial like any discovered secret.
# The Operator has connected calls between universes since 1946: crisp, discreet, has heard
# everything, repeats nothing. Most of the airtime is the board itself: modular `calls`
# segments, an open (she plugs a cord in), one to three overheard snatches of strangers'
# calls between universes (bodies: tender, absurd, a little sad), and a close ("Your party
# has hung up."). Bodies are separate calls, so any two can follow each other.
#
# The `found-*` links welcome a listener who has just found the exchange; they also stand
# on their own. Callbacks: the Nightjar (HUSH rings now and then and never says much), the
# lighthouse, Gristwick.
station = "the-switchboard"

[voices]
operator = { voice = "bf_alice", speed = 0.95, name = "The Operator" }
op_line = { voice = "bf_alice", speed = 0.95, fx = "phone", name = "The Operator" }
