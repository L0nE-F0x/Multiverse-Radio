# Multiverse-wide events (EVENT_IDS in src/broadcast/types.ts). Seeded from UTC, so every
# listener on every station hears the same event at the same instant. Clips are written to
# work on any station: hosts from all over the dial (cameos from the roster) are caught up
# in it wherever you happen to be tuned.
#
#   dimensional-storm   hosts struggle on through a storm that blows them across the band
#   emergency-broadcast the Emergency Multiverse Broadcast System test (or not a test)
#   the-hum             the hum, and the polite non-mention afterwards
#   station-swap        hosts wake up on the wrong station and carry on regardless
#   signal-from-beyond  an unknown voice on every frequency at once
#   time-slip           the last minute replays, slightly wrong
#   convergence         v4: every station notices the same thing (open and close per kit here;
#                       each station's own script holds its reaction)
station = "_events"

[voices]
authority = { voice = "bm_fable", speed = 0.95, name = "Multiverse Broadcast Authority" }
embs = { voice = "am_onyx", fx = "robot", name = "Emergency Multiverse Broadcast System" }
dale = { voice = "bm_george", name = "Dale Quarterly" }
kim = { voice = "af_sarah", fx = "phone", name = "Kim Harrowgate" }
skip = { voice = "am_puck", speed = 1.08, name = "Skip Daley" }
barnaby = { voice = "bm_fable", speed = 0.88, name = "Barnaby Velvet" }
chip = { voice = "am_fenrir", speed = 1.15, name = "Chip Thunderbuckle" }
doug = { voice = "bm_lewis", name = "Doug Steadman" }
pam = { voice = "af_alloy", name = "Pam (Automated)" }
grenda = { voice = "bf_emma", speed = 0.95, name = "Grenda" }
reginald = { voice = "bm_george", speed = 0.92, name = "Sir Reginald Thistlewood" }
counter = { voice = "af_kore", speed = 0.9, fx = "radio", name = "The Counter" }
rosalind = { voice = "bf_lily", fx = "cb", name = "Big Rosalind" }
mongoose = { voice = "am_echo", fx = "cb", name = "Midnight Mongoose" }
captain_hum = { voice = "am_onyx", speed = 0.85, fx = "distant", name = "Captain Hum" }
maureen = { voice = "af_river", name = "Maureen Pettigrew" }
gault = { voice = "bf_alice", speed = 0.95, name = "Inspector Delphine Gault" }
velocity = { voice = "am_michael", speed = 1.08, name = "Velocity Jones" }
gordon = { voice = "am_onyx", speed = 0.92, name = "Gordon Ago" }
johnny = { voice = "am_santa", speed = 1.08, name = "Johnny Mirror" }
ynnhoj = { voice = "am_santa", speed = 1.02, fx = "distant", name = "Ynnhoj" }
shelley = { voice = "af_sky", speed = 0.78, name = "Shelley Shellbourne" }
eventually = { voice = "af_heart", speed = 0.92, name = "DJ Eventually" }
octavia = { voice = "bf_isabella", speed = 0.9, name = "Octavia Lowe" }
chaz = { voice = "am_puck", speed = 1.12, name = "Chaz Brightley" }
visitor = { voice = "af_nicole", speed = 0.85, fx = "ghost", name = "Unknown Signal" }
visitors = { voice = "am_onyx", speed = 0.8, fx = "alien", name = "Unknown Signal" }
# v4: HUSH closes the Convergence with a log entry from the Nightjar.
hush = { voice = "af_heart", speed = 0.95, fx = "ship", name = "HUSH" }

