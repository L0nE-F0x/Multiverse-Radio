# ── The Convergence (v4) ──────────────────────────────────────────────────────
#
# Saturdays, 20:00 UTC: every station notices the same thing. The topic rotates weekly
# through six kits; the event airs an open from here, the tuned station's own reaction, and
# a close from here. Opens are the Multiverse Broadcast Authority's bulletin to every
# frequency at once; most closes are HUSH's log entry from the Nightjar, a few are the
# Authority standing everyone down. Three of each per kit, so the same topic six weeks
# later sounds different. Opens and closes are written to fit any reaction in between.

[[clip]]
id = "conv-moon-open-1"
category = "event"
event = "convergence"
kit = "missing-moon"
part = "open"
title = "A Moon Is Missing"
lines = [
  { sfx = "beep", level = 0.5 },
  { say = "authority", text = "This is the Multiverse Broadcast Authority, on every frequency at once. A moon has gone missing.", gap = 0.5 },
  { say = "authority", text = "Everyone agrees that one is gone. Nobody agrees which." },
]

[[clip]]
id = "conv-moon-open-2"
category = "event"
event = "convergence"
kit = "missing-moon"
part = "open"
title = "Count Your Moons"
