# Bubble Economy FM — 90.55, Marina City Nine, where it is always Friday night in 1986.
#
# Kiko Starlight hosts: endlessly upbeat, has announced "the weekend starts now" every night
# for forty years and been right every time. Nobody in the city has had a Monday since 1986.
#
# Running bits: the Marina Index only goes up; the bubble is literal, so nothing sharp near
# the waterfront (and the pin amnesty); property costs sunsets and compliments; the man
# taping the station since 1986; the Overtime Boys' duet that never ends. Resident artists in
# src/content/packs/v3a.ts (Lisa Lagoon, the Overtime Boys, Sayuri Seaside...).
station = "bubble-economy"

[voices]
host = { voice = "af_kore", speed = 1.05, name = "Kiko Starlight" }

[[show]]
id = "friday-night-drive"
name = "Friday Night Drive"
blurb = "Top down, tape deck up, the bay on your left forever. The weekend starts now, and keeps starting."
start = 18
end = 22

[[show]]
id = "after-hours-marina"
name = "After Hours Marina"
blurb = "Slow jams for the last train, and the one after that. Still Friday. Softer."
start = 23
end = 3

[[show]]
id = "saturday-never-comes"
name = "Saturday Never Comes"
blurb = "The breakfast show for a city with no Saturday morning. Blinds down, sunglasses on."
start = 6
end = 10

