# The Atomic Bachelor Pad — 115.6, a split-level home of tomorrow, Lot Twelve, Futureville.
#
# Monty Stereo hosts: a hi-fi salesman turned host who explains which speaker each instrument is
# in with the reverence of a sommelier. The show is a high-fidelity demonstration: the bongos
# travel to your left speaker, the orchestra has played table tennis across his living room
# since 1961, and the theremin is, in his professional opinion, in the hallway.
#
# The room: the Futureville Fidelity Console, Model Twelve (eleven feet of walnut), two
# enormous speakers, a chalk mark on the carpet (the listening position), a starburst clock, a
# rocket on the horizon. The neighbours at Lot Eleven. Sponsor: Starburst Hi-Fi, on the Atomic
# Parkway. Cross-station: Grumbel's Ladders; on Mondays, a review of Greg's Sunday show (days).
# Resident artists in src/content/packs/v4b.ts. Write "left" and "right" in lower case: capitals
# get spelled out by the voice, and "theremin" is fine (scripts/voice/lexicon.toml fixes how Kokoro says it).
station = "atomic-bachelor-pad"

[voices]
host = { voice = "am_eric", speed = 1.0, name = "Monty Stereo" }
console = { voice = "am_onyx", speed = 1.0, fx = "robot", name = "The Console" }

[[show]]
id = "morning-calibration"
name = "Morning Calibration"
blurb = "Before coffee, before the newspaper, before anything: we tune the room."
start = 7
end = 9

[[show]]
id = "stereo-at-six"
name = "Stereo at Six"
blurb = "Cold martinis, warm valves, and the speakers exactly the right distance apart. Pairings by Monty."
start = 18
end = 20

[[show]]
id = "sunken-lounge"
name = "The Sunken Lounge"
blurb = "Three carpeted steps down into the best seat in Futureville. Strings, after ten, when they've had time to breathe."
start = 21
end = 24

