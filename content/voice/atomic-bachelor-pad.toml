# ── Stereo test kit (open, one to three bodies, close) ───────────────────────

[[clip]]
id = "stereo-test-open-01"
category = "psa"
kit = "stereo-test"
part = "open"
lines = [
  { say = "host", text = "Ladies and gentlemen, this is a stereo test. Please put down your drink, find the chalk mark on the carpet, and sit on it." },
]

[[clip]]
id = "stereo-test-body-01"
category = "psa"
kit = "stereo-test"
part = "body"
lines = [
  { say = "host", text = "This is the left speaker. Hello.", gap = 0.8, pan = -1.0 },
  { say = "host", text = "This is the right speaker. Hello.", gap = 0.8, pan = 1.0 },
  { say = "host", text = "If those both came from the same place, please call a professional." },
]

[[clip]]
id = "stereo-test-body-02"
category = "psa"
kit = "stereo-test"
part = "body"
lines = [
  { say = "host", text = "You will now hear a single bongo, placed precisely in the centre. If it seems to come from your kitchen, then there is a bongo in your kitchen. Please deal with that separately." },
]

[[clip]]
id = "stereo-test-body-03"
category = "psa"
kit = "stereo-test"
part = "body"
lines = [
  { say = "host", text = "Next, a test of depth. Here is a cymbal, very far away. Further. Further still.", gap = 0.8 },
  { say = "host", text = "That cymbal is now in the next county. Your speakers are working beautifully." },
]

[[clip]]
id = "stereo-test-body-04"
category = "psa"
kit = "stereo-test"
part = "body"
lines = [
  { say = "host", text = "Finally, a test of silence. Please listen carefully." },
  { pause = 2.5 },
  { say = "host", text = "That was high fidelity silence, in stereo. Some of you heard the left half. Well done." },
]

[[clip]]
id = "stereo-test-close-01"
category = "psa"
kit = "stereo-test"
part = "close"
lines = [
  { say = "host", text = "That concludes the stereo test. You may relax. Not too much. Mind your posture." },
]

