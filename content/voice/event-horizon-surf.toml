# ── The surf report ───────────────────────────────────────────────────────────

[[clip]]
id = "weather-001"
category = "weather"
title = "The Surf Report"
bed = "ocean"
lines = [
  { say = "host", text = "Here's your full Event Horizon surf report.", gap = 0.6 },
  { say = "host", text = "North beach, four to six years, clean and glassy, with a light offshore pull toward the singularity. Slight spaghettification on the inside. Experienced surfers only." },
  { say = "host", text = "South beach, two years, choppy, with a strong time rip near the pier. If you see yourself paddling back out, don't wave. It only confuses him." },
  { say = "host", text = "The Point is closed. The Point is now, technically, inside.", gap = 0.6 },
  { say = "host", text = "Wind, light and leaning. Water temperature, lovely, then infinite. Have fun out there, be safe, and say your goodbyes." },
]

