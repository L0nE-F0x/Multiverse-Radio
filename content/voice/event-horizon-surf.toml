# Event Horizon Surf Report — 101.75, the beach at the edge of a black hole.
#
# Dash Coriolis hosts: sun-bleached, sunny, reports wave heights in years, and is always about
# to paddle out (he never does; he just likes holding the board). Bonnie is the lifeguard in
# the leaning tower: she has never rescued anyone, but she waves goodbye beautifully.
#
# Running bits: nothing comes back (the tide went out in 1959); time dilation (Kai's nine
# hundred year ride, the listener whose kids are now older than him); the four sunsets; the
# NO RETURNS flag. Cross-station: Grumbel's Ladders ("In is a decision").
station = "event-horizon-surf"

[voices]
host = { voice = "am_michael", speed = 1.08, name = "Dash Coriolis" }
bonnie = { voice = "af_bella", name = "Bonnie, Lifeguard" }

[[show]]
id = "dawn-patrol"
name = "Dawn Patrol"
blurb = "Early sets, an empty beach, and a sunrise that takes the long way round the hole."
start = 5
end = 9

[[show]]
id = "the-long-sunset"
name = "The Long Sunset"
blurb = "All four sunsets, back to back, with spring reverb."
start = 17
end = 21

[[show]]
id = "night-session"
name = "Night Session"
blurb = "Slow waves under the glow of the ring. Leashes on."
start = 22
end = 2

