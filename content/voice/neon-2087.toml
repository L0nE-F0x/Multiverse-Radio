# Neon 2087 — Velocity Jones, Timeline 2087-B (the cool one).
# Running bits: total sincerity about mundane things being rad, the car with too many
# wheels that never reaches the horizon, palm trees with elbows, the future that already
# happened.
station = "neon-2087"

[voices]
host = { voice = "am_michael", speed = 1.08, name = "Velocity Jones" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }

