# ══ v4: The Convergence ═══════════════════════════════════════════════════════
#
# Saturdays, 20:00 UTC: every station notices the same thing. One reaction per topic
# (SCHEMA.md, "The Convergence"); the director airs the _events open, then the tuned
# station's reaction, then the close.

[[clip]]
id = "convergence-missing-moon"
category = "event"
title = "The Convergence: A Moon Goes Missing"
event = "convergence"
kit = "missing-moon"
lines = [
  { say = "host", text = "Okay, so a moon's missing, and nobody knows which one. And honestly? That's rad." },
  { say = "host", text = "Somewhere out there, a moon just took the night off. Windows down. Respect. This one's for the moon." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
title = "The Convergence: Toast, Everywhere"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "host", text = "Is that toast? Everywhere smells like toast right now, and I just want to say, that is so rad." },
  { say = "host", text = "Toast. The most underrated breakfast in history. Golden. Reliable. Butter it while it's hot, everybody." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
title = "The Convergence: The Song Nobody Can Finish"
event = "convergence"
kit = "the-song"
lines = [
  { say = "host", text = "Everybody's got the same song stuck in their head, and nobody can finish it." },
  { say = "host", text = "I've been humming it on the boulevard for an hour. The palm trees with elbows are swaying to it. They don't know the end either." },
]

[[clip]]
id = "convergence-the-knock"
category = "event"
title = "The Convergence: Three Knocks"
event = "convergence"
kit = "the-knock"
lines = [
  { say = "host", text = "Three knocks on the studio door. I opened it. Nobody. Just the boulevard, and the neon, humming." },
  { say = "host", text = "Whoever you are, that was a great knock. Very confident. Ten out of ten." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
title = "The Convergence: A Colour With No Name"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "host", text = "The sky just went a colour. Not pink. Not purple. A brand new one." },
  { say = "host", text = "We don't have a word for it in twenty eighty-seven. We don't even have a synth that makes that sound. Yet." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
title = "The Convergence: The Pigeon"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "host", text = "A pigeon just walked into the studio with the attitude of somebody who's been here before." },
  { say = "host", text = "It's sitting on the console like it owns the place. Maybe it does. Pigeon, you are welcome on Neon twenty eighty-seven, any time." },
