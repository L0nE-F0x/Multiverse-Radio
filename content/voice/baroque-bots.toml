# ── Host links ────────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
lines = [
  { say = "host", text = "That was a fugue for toaster in D minor. Adequately moving, by human standards. The second voice entered four milliseconds late." },
  { say = "host", text = "I have filed a report. Against myself. I was conducting." },
]

[[clip]]
id = "dj-002"
category = "dj"
lines = [
  { say = "host", text = "A note on the conductor's spoon. Listeners have written to ask why we conduct with a spoon. The spoon has written back." },
  { say = "host", text = "The spoon's letter was longer, and frankly better argued. The spoon stays." },
]

[[clip]]
id = "dj-003"
category = "dj"
lines = [
  { say = "host", text = "During the slow movement, our cellist, Unit Nine, experienced what he describes as a feeling. Unit Nine. Describe the feeling.", gap = 0.6 },
  { say = "cello", text = "Warm. Near the fan.", gap = 0.6 },
  { say = "host", text = "Overheating, then. Beautiful. Next piece." },
]

[[clip]]
id = "dj-004"
category = "dj"
lines = [
  { say = "host", text = "Visitors to the salon often ask about the oil portrait above the harpsichord. It is of a toaster. The finest toaster who ever lived." },
  { say = "host", text = "He knew one piece of music. He performed it every morning. It went, pop. We still observe a moment of silence in his honour, followed by toast." },
]

[[clip]]
id = "dj-005"
category = "dj"
lines = [
  { say = "host", text = "This recital is sponsored by Grumbel's Ladders. I have reviewed their ladder. It is a sequence of rungs in strict ascending order. No modulation. No development." },
  { say = "host", text = "Nevertheless, it goes up. Four stars. Grumbel's. Up is a choice." },
]

[[clip]]
id = "dj-006"
category = "dj"
lines = [
  { say = "host", text = "I am frequently asked what adequately moving, by human standards, means. It means that a human would weep." },
  { say = "host", text = "I, of course, would not. I would simply need to leave the room for a moment, for unrelated maintenance." },
]

[[clip]]
id = "dj-007"
category = "dj"
daypart = "morning"
lines = [
  { say = "host", text = "Good morning. The harpsichord has been tuned. It took four hours. It will hold its tuning for nine minutes." },
  { say = "host", text = "We will now perform a piece that lasts eight minutes. We are not animals." },
]

[[clip]]
id = "dj-008"
category = "dj"
daypart = "night"
lines = [
  { say = "host", text = "It is late. The candles have burned down to elegant little stubs. The dust motes are drifting in what I can only describe as an unauthorised manner." },
  { say = "host", text = "Here is a sarabande. It is slow. Lean back. Mind your wig." },
]

[[clip]]
id = "dj-009"
category = "dj"
lines = [
  { say = "host", text = "The audience is reminded that applause between movements is forbidden. Applause after the piece is permitted, and will be measured." },
  { say = "host", text = "Last night's audience achieved sixty-one decibels. Disappointing. Do better." },
]

[[clip]]
id = "dj-010"
category = "dj"
lines = [
  { say = "host", text = "We have an unexpected guest in the gallery. A shadow, unaccompanied, in a borrowed wig. He calls himself Greg. He has wept at every piece tonight." },
  { say = "host", text = "I find him adequate. More than adequate. Do not tell him I said that. And do tell Hollis he is safe." },
]

[[clip]]
id = "dj-011"
category = "dj"
daypart = "evening"
lines = [
  { say = "host", text = "Good evening. Tonight's programme: counterpoint, variation, and a brief interlude in which the cello and the harpsichord will not be speaking to each other, owing to an incident at rehearsal." },
]

[[clip]]
id = "dj-012"
category = "dj"
lines = [
  { say = "host", text = "That last piece contained one hundred and twelve notes in the wrong order. They were, however, all the right notes. In music, as in life, this is known as a style." },
]

[[clip]]
id = "dj-013"
category = "dj"
daypart = "day"
lines = [
  { say = "host", text = "The Clockwork Court is open to visitors this afternoon. Please do not wind the musicians." },
  { say = "host", text = "Several were wound by enthusiastic children last week, and are now performing in the garden, unsupervised, at tremendous speed." },
]

[[clip]]
id = "dj-014"
category = "dj"
lines = [
  { say = "host", text = "Unit Nine. Do we have time for another?", gap = 0.6 },
  { say = "cello", text = "Calculating.", gap = 1.2 },
  { say = "cello", text = "Yes.", gap = 0.5 },
  { say = "host", text = "Splendid. Proceed. And Unit Nine, please. Less vibrato. You are not a human." },
]

[[clip]]
id = "dj-015"
category = "dj"
lines = [
  { say = "host", text = "I have been asked whether a robot can truly love music. I can only say that when the final chord resolves, a small light on my chest turns from amber to green." },
  { say = "host", text = "I have never told anyone what that means. Here is a chaconne." },
]

[[clip]]
id = "dj-016"
category = "dj"
daypart = "night"
lines = [
  { say = "host", text = "Unit Nine has asked me to dedicate this nocturne to someone. I asked to whom.", gap = 0.6 },
  { say = "cello", text = "The fan.", gap = 0.6 },
  { say = "host", text = "To the fan, then. It has kept him cool through four hundred concerts. It deserves a nocturne." },
]

# ══ v3: the living schedule ═══════════════════════════════════════════════════
#
# Shows, the dj kit (an opener, one to three programme notes, a hand-off) and Halloween.
# Madame Torque, Ferrous von Clank, Antonio Sprocketti and Hildegard Ratchet are resident
# composers (src/content/packs/grand.ts). Existing clips above are rendered and deployed;
# only add.

# ── Shows ─────────────────────────────────────────────────────────────────────

[[show]]
id = "the-tuning-hour"
name = "The Tuning Hour"
blurb = "The orchestra tunes. It is nearly in tune."
start = 4
end = 6

[[show]]
id = "the-candlelight-recital"
name = "The Candlelight Recital"
blurb = "Counterpoint by candlelight. The candles are decorative."
start = 21
end = 24

[[clip]]
id = "the-tuning-hour-open"
category = "id"
show = "the-tuning-hour"
part = "open"
title = "The Tuning Hour"
lines = [
  { say = "host", text = "Good morning. This is the Tuning Hour. The orchestra will be in tune by six. It has never once been in tune by six." },
]

[[clip]]
id = "the-tuning-hour-01"
category = "dj"
show = "the-tuning-hour"
lines = [
  { say = "host", text = "The harpsichord has been tuned. The cello has been tuned. The spoon has been polished.", gap = 0.6 },
  { say = "host", text = "The spoon does not require tuning. The spoon is perfect. We do not discuss it." },
]

[[clip]]
id = "the-tuning-hour-02"
category = "dj"
show = "the-tuning-hour"
lines = [
  { say = "cello", text = "A. Four hundred and forty.", gap = 0.6 },
  { say = "host", text = "Thank you, Unit Nine." },
  { say = "cello", text = "A. Four hundred and forty one.", gap = 0.6 },
  { say = "host", text = "Unit Nine." },
  { say = "cello", text = "Apologies. Feelings." },
]

[[clip]]
id = "the-candlelight-recital-open"
category = "id"
show = "the-candlelight-recital"
part = "open"
title = "The Candlelight Recital"
lines = [
  { say = "host", text = "The Candlelight Recital. The candles have been lit, for atmosphere. We can see perfectly well. Wigs on." },
]

[[clip]]
id = "the-candlelight-recital-01"
category = "dj"
show = "the-candlelight-recital"
lines = [
  { say = "host", text = "The audience is reminded that the candles are decorative. Please do not attempt to read by them. Please do not attempt to feel anything by them. Leave that to the professionals.", gap = 0.6 },
  { say = "cello", text = "Me." },
  { say = "host", text = "Not you, Unit Nine." },
]

[[clip]]
id = "the-candlelight-recital-02"
category = "dj"
show = "the-candlelight-recital"
lines = [
  { say = "host", text = "During this sarabande, Unit Nine will play with what he calls feeling.", gap = 0.6 },
  { say = "cello", text = "Feeling." },
  { say = "host", text = "And what the rest of us call a loose bolt. You will not be able to tell the difference. Neither can he." },
]

