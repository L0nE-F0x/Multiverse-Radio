# Baroque Robot Philharmonic — Maestro Unit Seven, the Clockwork Court of
# Seventeen-Hundred-and-Never. Pompous robotic critic: everything is "adequately moving,
# by human standards". Running bits: the conductor's spoon, Unit Nine the cellist (who
# keeps having what he calls feelings and the Maestro calls overheating), the portrait of
# the toaster, measured applause.
station = "baroque-bots"

[voices]
host = { voice = "bm_daniel", speed = 0.98, name = "Maestro Unit Seven" }
cello = { voice = "am_adam", speed = 0.9, fx = "robot", name = "Unit Nine (Cello)" }

