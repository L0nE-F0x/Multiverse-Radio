  { say = "host", text = "A note on Madame Torque. She wrote this piece in a single afternoon, and spent the next eleven years apologising for the second movement. She need not have. It is merely adequate." },
]

[[clip]]
id = "dj-body-02"
category = "dj"
kit = "dj"
part = "body"
lines = [
  { say = "host", text = "Ferrous von Clank asked that his music be performed slightly faster than written, as he wrote it while running late. We have honoured his wishes. The cellist is out of breath. The cellist does not breathe." },
]

[[clip]]
id = "dj-body-03"
category = "dj"
kit = "dj"
part = "body"
lines = [
  { say = "cello", text = "Maestro." },
  { say = "host", text = "Yes, Unit Nine." },
  { say = "cello", text = "I liked that one.", gap = 0.8 },
  { say = "host", text = "Liking is not in your specification." },
  { say = "cello", text = "I know.", gap = 1.0 },
  { say = "host", text = "Nor is it in mine. Next piece." },
]

[[clip]]
id = "dj-body-04"
category = "dj"
kit = "dj"
part = "body"
lines = [
  { say = "host", text = "Antonio Sprocketti is the only composer at Court to have written a concerto for toaster. It has one note. The note is pop. The orchestra waits nine minutes for it. It is worth it." },
]

[[clip]]
id = "dj-body-05"
category = "dj"
kit = "dj"
part = "body"
lines = [
  { say = "host", text = "The portrait of the toaster above the harpsichord has been cleaned. He looks well. He looks, if I may say so, warm." },
]

[[clip]]
id = "dj-body-06"
category = "dj"
kit = "dj"
part = "body"
lines = [
  { say = "host", text = "Hildegard Ratchet composed only in the key of whatever room she was in. This piece was written in a kitchen. You can hear the kettle in the slow movement. It is the best part." },
]

[[clip]]
