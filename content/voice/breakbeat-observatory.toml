# Breakbeat Observatory — 94.8, Mount Subwoofer Observatory, where the telescopes are subwoofers.
#
# MC Parallax hosts: fast, cosmic, measures everything in light years, sends shout-outs to
# galaxies by name (all invented). Doctor Ferrin is the lone astronomer in the dome: headphones
# on, notebook out, logs every drop, has never once nodded her head.
#
# Running bits: the bass moves nearby stars (and apologies to their planets); listeners so far
# away they'll hear this set in thirty thousand years; Doctor Ferrin's head, which does not nod
# (until it does). Cross-station: Teodor at Relay Four.
station = "breakbeat-observatory"

[voices]
host = { voice = "am_fenrir", speed = 1.1, name = "MC Parallax" }
ferrin = { voice = "bf_alice", speed = 0.95, name = "Doctor Ferrin" }

[[show]]
id = "the-drop-zone"
name = "The Drop Zone"
blurb = "Peak-time drum and bass under an open dome. Expect seismic activity and minor stellar drift."
start = 20
end = 23

[[show]]
id = "light-cone"
name = "Late Night Light Cone"
blurb = "Everything played tonight leaves at the speed of light and doesn't slow down. Neither do we."
start = 23
end = 3

[[show]]
id = "closing-the-dome"
name = "Closing the Dome"
blurb = "The last tunes before sunrise, when the sun gets too loud to compete with."
start = 4
end = 7

