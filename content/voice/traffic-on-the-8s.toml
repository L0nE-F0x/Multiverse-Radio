# ── Space weather (standalone) ────────────────────────────────────────────────

[[clip]]
id = "weather-001"
category = "weather"
title = "Solar Wind"
lines = [
  { say = "rita", text = "The weather for drivers. A brisk solar wind from the east, gusting to strong around the big yellow star at junction two." },
  { say = "rita", text = "High-sided vessels, take care. Small ones, hold on to something. Anything with a sail, you'll be in the next system by tea time, and you won't have enjoyed it." },
]

[[clip]]
id = "weather-002"
category = "weather"
title = "Meteor Showers"
lines = [
  { say = "rita", text = "Scattered meteor showers over the Interchange this evening, heavier towards the bypass, where nobody is going anywhere anyway." },
  { say = "rita", text = "Wipers on. And if one lands on your bonnet, it's yours. That's the law out here. Finders keepers." },
  { say = "buzz", text = "Rita, one just went past the pod. Didn't indicate. They never indicate." },
]

[[clip]]
id = "weather-003"
category = "weather"
title = "Fog in the Nebula"
daypart = "night"
lines = [
  { say = "rita", text = "Thick fog in the Varn Nebula overnight. Visibility down to about a planet's length." },
  { say = "rita", text = "Dipped headlights, please. Full beam just lights the fog up, and then the fog wants to talk to you about it." },
  { say = "rita", text = "It's lonely, the fog. It means well. Just don't encourage it. Clearing by morning, or by the morning after." },
]

[[clip]]
id = "weather-004"
category = "weather"
title = "A Front of Tuesdays"
daypart = "morning"
lines = [
  { say = "rita", text = "This morning, a slow-moving front of Tuesdays is pushing in from the timelines. Expect it to feel like Tuesday for most of the day, even where it isn't." },
  { say = "rita", text = "Clearing to Wednesday by the evening, for most of you. Some of you will be in Tuesday till the weekend. Sorry." },
]

# ── Desk chatter ──────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
title = "Thirty One Years in the Pod"
lines = [
  { say = "rita", text = "Buzz, how long have you been up there now?" },
  { say = "buzz", text = "Thirty one years, Rita. I land on my birthday. They bring me a cake and a fresh flask." },
  { say = "rita", text = "And then?" },
  { say = "buzz", text = "And then I go back up. Somebody's got to watch it not move." },
]

[[clip]]
id = "dj-002"
category = "dj"
title = "Never Seen It Move"
lines = [
  { say = "rita", text = "People ask me what it's like to report on traffic that has never once moved." },
  { say = "rita", text = "And I say, it's like any other job. You turn up. You look at it. You tell people how it is. And every ten minutes you hope, just a little, that this is the time." },
]

[[clip]]
id = "dj-003"
category = "dj"
title = "Ten Minutes"
lines = [
  { say = "rita", text = "Ten minutes is a long time in traffic. It's also no time at all. I've done a few million of them now." },
  { say = "rita", text = "My advice? Bring a sandwich. Bring two. Bring somebody to share the second one with." },
]

[[clip]]
id = "dj-004"
category = "dj"
title = "The Old Switchboard"
lines = [
  { say = "buzz", text = "Rita, you ever hear the one about the old switchboard?" },
  { say = "rita", text = "Which one?" },
  { say = "buzz", text = "Story goes there's an operator out past the edge of the dial, still putting calls through. She answers if you ring advice, then the news, then the traffic. In that order. Hold each line a moment." },
  { say = "rita", text = "We're the traffic, Buzz." },
  { say = "buzz", text = "I know. I always wondered who was ringing." },
]

[[clip]]
id = "dj-005"
category = "dj"
daypart = "night"
title = "To the Relay Ship"
lines = [
  { say = "rita", text = "A message for the relay ship on the Outer Band tonight. Buzz can see your running lights from the pod." },
  { say = "rita", text = "You're drifting across three lanes. We're not complaining. There's nobody in them. Just, wherever you're headed, indicate. It's polite." },
]

[[clip]]
id = "dj-006"
category = "dj"
title = "The Flask"
lines = [
  { say = "buzz", text = "Rita, my flask's empty." },
  { say = "rita", text = "We'll send one up, Buzz." },
  { say = "buzz", text = "How long?" },
  { say = "rita", text = "Well. It'll have to go round by the bypass." },
  { pause = 1.0 },
  { say = "buzz", text = "I'll ration the biscuits." },
]

