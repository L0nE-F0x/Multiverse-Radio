# Traffic on the 8s — 114.8, the traffic desk high above the Great Wormhole Interchange.
#
# Rita Gridley is brisk, cheerful and has never seen traffic move. She reports it anyway,
# every ten minutes, with total commitment. Captain Buzz Ferraro circles the junction in
# the traffic pod and has done for thirty one years; he comes in on the radio. The bypass
# has been jammed since the Big Bang. The front car is waiting for the lights to change.
# The lights haven't been invented yet.
#
# The `traffic` kit (category weather) is the report the director airs at every local
# minute ending in 8: open × 1–3 incidents × close. Opens never name the minute. Incidents
# are written to stand alone in any order.
#
# Switchboard clue (dj-004): the operator answers if you ring advice, then the news, then
# the traffic (97.8 → 89.3 → 114.8). Callbacks: Waystation Nine's sideways road, the space
# whales of the Drift, Grumbel's Ladders, a relay ship drifting across the Outer Band.
station = "traffic-on-the-8s"

[voices]
rita = { voice = "af_jessica", speed = 1.08, name = "Rita Gridley" }
buzz = { voice = "am_puck", fx = "radio", name = "Captain Buzz Ferraro" }
commuter = { voice = "am_eric", fx = "phone", name = "A Commuter" }
commuter2 = { voice = "bf_lily", fx = "phone", name = "A Commuter" }
voiceover = { voice = "am_michael", speed = 1.1, name = "Advert" }
driver = { voice = "am_adam", speed = 1.05, fx = "cb", name = "Arterial Driver" }
driver2 = { voice = "am_liam", speed = 1.0, fx = "cb", name = "Bypass Driver" }
toll = { voice = "af_sarah", speed = 1.0, fx = "radio", name = "Toll Operator" }
phantom = { voice = "bf_isabella", speed = 0.92, fx = "radio", name = "A Phantom Passenger" }

[[show]]
id = "morning-crawl"
name = "The Morning Crawl"
blurb = "Rush hour, every hour from seven, with Rita at the desk and Buzz over the junction. Nobody is late. Everybody is late."
start = 7
end = 10

[[show]]
id = "evening-crawl"
name = "The Evening Crawl"
blurb = "The homeward jam, live. The same cars as this morning, facing the other way."
