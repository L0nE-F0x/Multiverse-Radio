# Island Time Observatory — 113.8, Tide Hill, an island that drifted out of time.
#
# Professor Easy hosts from the observatory at the top of the hill: astronomer, timekeeper and
# selector, who has measured time very carefully for forty years and concluded it is optional.
# Slow, kind, amused. No phonetic accents and no caricature: the joke is the island's time.
#
# The world: two suns that set at different speeds (Sooner and Later), three tide markers on
# the beach that have not agreed since 1983, when the island drifted out of time. Nobody has
# been late since: when you arrive, that's when it was. The post brings letters before they're
# written. Miss Dorothy's Half Past Bar, under a clock that has said "half past" for forty years.
#
# Cross-station: Greg the shadow asks the time, Teodor at Relay Four on the big dish, Grumbel's
# Ladders (up to the telescope). Resident artists in src/content/packs/v4b.ts.
station = "island-time"

[voices]
host = { voice = "am_liam", speed = 0.9, name = "Professor Easy" }
dorothy = { voice = "af_aoede", speed = 0.92, name = "Miss Dorothy, the Half Past Bar" }

[[show]]
id = "morning-eventually"
name = "Morning, Eventually"
blurb = "The breakfast show. It starts when the kettle does, and the kettle is thinking about it."
start = 9
end = 12

[[show]]
id = "slow-sunset"
name = "The Slow Sunset"
blurb = "Sooner goes down. Later takes three hours about it. Find a chair facing west and stay in it."
start = 17
end = 21

[[show]]
id = "lying-down-astronomy"
name = "Lying Down Astronomy"
blurb = "The dome is open, the hammock is strung, and the telescope is pointed roughly up."
start = 23
end = 3

