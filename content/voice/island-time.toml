# ── Host links ────────────────────────────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
title = "Time Is Optional"
lines = [
  { say = "host", text = "I have measured time on this island for forty years. With clocks, with sundials, with the tide, and with a very patient tortoise." },
  { say = "host", text = "My conclusion, published this morning, is that time is optional. The paper isn't finished. It doesn't need to be." },
]

[[clip]]
id = "dj-002"
category = "dj"
title = "Sooner and Later"
lines = [
  { say = "host", text = "The two suns are setting again. The quick one went down an hour ago. The slow one is still thinking it over." },
  { say = "host", text = "Here we call them Sooner and Later. Most people on the island set their watches by Later. Most people on the island don't wear a watch." },
]

[[clip]]
id = "dj-003"
category = "dj"
title = "Nineteen Eighty Three"
lines = [
  { say = "host", text = "In nineteen eighty three, the island drifted out of time. Nobody noticed for a week. Then somebody went down to catch the ferry, and found it had already arrived. Every day. For good." },
  { say = "host", text = "Since then, nobody has been late. When you get here, that's when it was." },
]

[[clip]]
id = "dj-004"
category = "dj"
title = "The Post"
lines = [
  { say = "host", text = "The post came this morning, with a letter from me that I haven't written yet. It's very good. I'm looking forward to writing it." },
  { say = "host", text = "I'll send it off next week, and it will get here this morning. That's the island postal service. Quick, in its own way." },
]

[[clip]]
id = "dj-005"
category = "dj"
title = "Greg Asks the Time"
lines = [
  { say = "host", text = "A shadow came up the hill to the observatory last night, asking the time. Said his name was Greg, and he had to get home to somebody called Hollis." },
  { say = "host", text = "I told him the truth. Here, it's whenever you arrive. He said that was the kindest thing anybody had told him all trip." },
]

[[clip]]
id = "dj-006"
category = "dj"
title = "Sponsored by Grumbel's Ladders"
lines = [
  { say = "host", text = "The observatory runs on goodwill, mangoes, and Grumbel's Ladders, which is how I get up to the telescope." },
  { say = "host", text = "Grumbel's Ladders. Up is a choice. On Tide Hill, so is when." },
]

[[clip]]
id = "dj-007"
category = "dj"
daypart = "night"
title = "For the Night Shift"
lines = [
  { say = "host", text = "A word for the operator on the relay ship. Your heading is moving a little every night. I can see it from here, through the big lens." },
  { say = "host", text = "Don't worry. On this island, nobody is ever off course. You just arrive somewhere you weren't expecting, and it turns out you were." },
]

[[clip]]
id = "dj-008"
category = "dj"
title = "Relay Four on the Big Dish"
lines = [
  { say = "host", text = "Faint signal on the big dish tonight. A man called Teodor, on Relay Four, asking if anybody can hear him." },
  { say = "host", text = "We can, Teodor. We heard you in nineteen eighty three as well. Same message. Still lovely. Here's a slow one for you." },
]

[[clip]]
id = "dj-009"
category = "dj"
daypart = "day"
title = "Half Past"
lines = [
  { say = "host", text = "Afternoon at the beach bar. The clock behind the counter has said half past for forty years. Nobody has ever asked half past what." },
  { say = "host", text = "It would be rude. The clock is doing its best. So is Miss Dorothy." },
  { say = "dorothy", text = "I heard that, Professor. It's half past. Drink your juice." },
]

[[clip]]
id = "dj-010"
category = "dj"
title = "The Time Signal"
lines = [
  { say = "host", text = "And now, the observatory time signal. At the third pip, it will be precisely whenever you like." },
  { sfx = "pips" },
  { pause = 0.6 },
  { say = "host", text = "Set your watch by that. Or don't. It really doesn't mind." },
]

