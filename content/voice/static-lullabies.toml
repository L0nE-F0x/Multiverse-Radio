# Static Lullabies — The Listener, from the gap between stations.
# Ambient: voices are rare, hushed and kind. The Listener may be the static itself.
# Bits: the three-eyed cat on the television, the snow that briefly smiles, the thing
# under the bed (also asleep). Light callbacks: Greg and Hollis's porch light, Teodor.
station = "static-lullabies"

[voices]
host = { voice = "af_nicole", speed = 0.85, name = "The Listener" }
hush = { voice = "af_nicole", speed = 0.85, fx = "whisper", name = "The Listener" }

# ── Idents ────────────────────────────────────────────────────────────────────

[[clip]]
id = "id-001"
category = "id"
lines = [
  { say = "host", text = "Static Lullabies.", gap = 0.8 },
  { say = "hush", text = "Shh. You're doing fine." },
]

[[clip]]
id = "id-002"
category = "id"
lines = [
  { say = "host", text = "Eighty-seven point seven. The gap between stations. All tucked in." },
]

[[clip]]
id = "id-003"
category = "id"
daypart = "night"
lines = [
  { say = "host", text = "Static Lullabies.", gap = 0.8 },
  { say = "host", text = "I'll keep the light on." },
]

[[clip]]
id = "id-004"
category = "id"
lines = [
  { say = "host", text = "This is Static Lullabies. Nobody needs anything from you right now." },
]

[[clip]]
id = "id-005"
category = "id"
