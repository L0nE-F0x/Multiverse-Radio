# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "teodor-is-heard-02"
category = "story"
serial = { id = "teodor-is-heard", episode = 2 }
title = "Teodor Is Heard, Part Two: The Static Says Yes"
bed = "static"
lines = [
  { say = "host", text = "Someone far away is asking if anyone can hear him.", gap = 1.2 },
  { say = "teodor", text = "Is anyone receiving this. This is Relay Four.", gap = 1.4 },
  { say = "hush", text = "I can, Teodor. I always could.", gap = 1.2 },
  { say = "host", text = "But he can't hear me. His receiver is broken. All he hears is the static.", gap = 1.0 },
  { say = "host", text = "And I am the static.", gap = 1.6 },
  { say = "hush", text = "So I'm going to try something. I'm going to be very, very quiet. Quieter than I've ever been. So that, just for a second, the static says something.", gap = 2.4 },
  { say = "teodor", text = "Night four thousand and two. Captain came at three. Mostly beak. Made tea.", gap = 1.0 },
  { say = "teodor", text = "The static was very soft tonight. Softer than usual. For a moment, I thought it said,", gap = 1.6 },
  { say = "hush", text = "Yes.", gap = 1.8 },
  { say = "teodor", text = "Probably the kettle.", gap = 1.8 },
  { say = "host", text = "It wasn't the kettle.", gap = 1.0 },
  { say = "hush", text = "Goodnight, Teodor. Go to sleep. I'll keep the line warm." },
]

[[clip]]
id = "greg-comes-home-12"
category = "story"
serial = { id = "greg-comes-home", episode = 12 }
title = "Greg Comes Home, Part Twelve: The Porch Light"
bed = "night"
lines = [
  { say = "host", text = "It's four in the morning.", gap = 1.2 },
  { say = "host", text = "In a small house in the eastern Overlap, the porch light is on. It has been on every night since spring. The bulb has been changed twice.", gap = 1.0 },
  { say = "host", text = "Hollis is asleep in the chair by the window. He meant to stay up. He always means to.", gap = 1.4 },
  { say = "hush", text = "Shh. There's someone at the gate.", gap = 1.4 },
  { say = "host", text = "There's nobody there. That's how you know.", gap = 1.4 },
  { say = "host", text = "He comes up the path very slowly, into the porch light. And because the light is on, he's there. Long, and thin, and a little bit tired.", gap = 1.0 },
  { say = "host", text = "He doesn't knock. Shadows can't. He lies down on the boards by the door, the way he used to, and waits for somebody to move.", gap = 2.0 },
  { say = "hollis", text = "Oh.", gap = 1.2 },
  { say = "hollis", text = "There you are.", gap = 1.2 },
  { say = "greg", text = "Sorry I'm late.", gap = 1.4 },
  { say = "hollis", text = "You're not late. I left the light on.", gap = 1.8 },
  { say = "host", text = "Hollis takes the hat down from the hook by the door, and puts it on. And there on the porch boards, so does Greg.", gap = 1.8 },
  { say = "hush", text = "He's home.", gap = 1.4 },
  { say = "host", text = "They'll leave the light on anyway. For the next one." },
]

