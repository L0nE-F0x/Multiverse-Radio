# ── Test card ─────────────────────────────────────────────────────────────────

[[clip]]
id = "test-tone-001"
category = "psa"
title = "Test Transmission"
lines = [
  { say = "testcard", text = "This is a test transmission. Normal programmes will resume shortly.", gap = 1.2 },
  { say = "testcard", text = "They have been resuming shortly for some time. Please be patient. They are nearly ready." },
]

[[clip]]
id = "test-tone-002"
category = "psa"
title = "Test Transmission"
lines = [
  { say = "testcard", text = "The tone you are hearing is one thousand cycles per second.", gap = 0.8 },
  { say = "testcard", text = "Please adjust your set until the tone sounds friendly." },
]

[[clip]]
id = "test-tone-003"
category = "psa"
title = "Test Card"
lines = [
  { say = "testcard", text = "The picture on your screen is a test card. It shows a bowl of fruit, a grey scale, and a small, brave dog.", gap = 0.8 },
  { say = "testcard", text = "Adjust your set until the dog looks confident." },
]

[[clip]]
id = "test-tone-004"
category = "psa"
title = "Test Transmission"
lines = [
  { say = "testcard", text = "This is a test transmission, from the gap between stations.", gap = 0.8 },
  { say = "testcard", text = "Nothing is wrong. Nothing is on. Those are different things, and both of them are fine." },
]

[[clip]]
id = "test-tone-005"
category = "psa"
title = "Test Transmission"
daypart = "night"
lines = [
  { say = "testcard", text = "This is a test transmission. If you are still watching this at this hour, the test is going very well.", gap = 0.8 },
  { say = "testcard", text = "Thank you for your help. The dog says thank you too." },
]
