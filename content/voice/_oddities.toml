# Voices heard on the oddities between stations (ODDITY_IDS in src/broadcast/types.ts).
#
# Each clip id starts with the oddity it belongs to, so the director can pick by prefix:
#   time-signal-*      the time signal announcer (over the time-signal recipe)
#   distress-beacon-*  faint distress messages, never dark: everyone is fine, mostly embarrassed
#   stuck-loop-*       Ray Bellamy's one link, stuck on loop since 1974, on an old record
#   test-tone-*        the test card announcer, for the test tone
station = "_oddities"

[voices]
clock = { voice = "bm_fable", speed = 0.9, fx = "radio", name = "Time Signal" }
testcard = { voice = "bf_alice", speed = 0.92, fx = "radio", name = "Test Transmission" }
ray = { voice = "am_michael", speed = 1.05, fx = "vinyl", name = "Ray Bellamy (1974)" }
marjorie = { voice = "bf_isabella", fx = "distant", name = "Pleasure Boat Marjorie" }
beacon = { voice = "af_kore", speed = 0.92, fx = "robot", name = "Automatic Beacon" }
balloon = { voice = "am_puck", fx = "distant", name = "Balloon Persistence" }
skipper = { voice = "bm_daniel", fx = "radio", name = "Unknown Vessel" }

# ── Time signal ───────────────────────────────────────────────────────────────

[[clip]]
id = "time-signal-001"
category = "psa"
title = "Time Signal"
lines = [
  { say = "clock", text = "At the final pip, it will be exactly now. Precisely now. Now, give or take." },
  { sfx = "pips" },
]

[[clip]]
id = "time-signal-002"
category = "psa"
title = "Time Signal"
lines = [
  { say = "clock", text = "At the long tone, it will be later than you think, but not as late as you feared." },
  { sfx = "pips" },
]

[[clip]]
id = "time-signal-003"
category = "psa"
title = "Time Signal"
lines = [
  { say = "clock", text = "Following the pips, it will be one second later than it was a second ago. This service is provided free, as it always has been." },
  { sfx = "pips" },
]

[[clip]]
id = "time-signal-004"
category = "psa"
title = "Time Signal"
lines = [
  { say = "clock", text = "At the sixth pip, the time in every dimension will be slightly different. Please set your clock to whichever one you like best." },
  { sfx = "pips" },
]

[[clip]]
id = "time-signal-005"
category = "psa"
title = "Time Signal"
lines = [
  { say = "clock", text = "At the tone, it will be eleven o'clock on Every Possible News. It is always eleven o'clock there. Elsewhere, please use your judgement." },
  { sfx = "pips" },
]

# ── Distress beacon ───────────────────────────────────────────────────────────

[[clip]]
id = "distress-beacon-001"
category = "interrupt"
title = "Pleasure Boat Marjorie"
bed = "sea"
lines = [
  { sfx = "morse", seconds = 1.5, level = 0.5 },
  { say = "marjorie", text = "Mayday, mayday, mayday. This is the pleasure boat Marjorie. We are not in danger." },
  { say = "marjorie", text = "We are lost, and we have run out of biscuits. If anyone is passing, could they bring biscuits. Over." },
]

[[clip]]
id = "distress-beacon-002"
category = "interrupt"
title = "Survey Ship Pemberton"
lines = [
  { sfx = "morse", seconds = 1.5, level = 0.5 },
  { say = "beacon", text = "Automatic beacon. Distress level, mild. The crew of the survey ship Pemberton are locked out of the bridge." },
  { say = "beacon", text = "They are fine. They are having a picnic. Please send a locksmith, at your leisure." },
]

[[clip]]
id = "distress-beacon-003"
category = "interrupt"
title = "Balloon Persistence"
bed = "wind"
lines = [
  { say = "balloon", text = "Pan pan. This is the hot air balloon Persistence. Our situation is stable, and has been for nine years." },
  { say = "balloon", text = "We are drifting gently over a dimension made of cloud. Please do not rescue us. We only wanted to say hello." },
]

[[clip]]
id = "distress-beacon-004"
category = "interrupt"
title = "A Red Balloon"
lines = [
  { sfx = "morse", seconds = 1.5, level = 0.5 },
  { say = "beacon", text = "Beacon, automatic. Somebody has let go of a balloon. It is red. It is rising steadily. It is safe, and very happy." },
  { say = "beacon", text = "This beacon is tied to the string. Hello from the balloon." },
]

[[clip]]
id = "distress-beacon-005"
category = "interrupt"
title = "Unknown Vessel"
bed = "sea"
lines = [
  { say = "skipper", text = "S. O. S. Repeat, S. O. S. This is a small boat in a large sea. Correction. A large boat, in a small sea." },
  { say = "skipper", text = "We have run aground on all sides at once. Nobody is hurt. Everybody is embarrassed. Please advise." },
]

