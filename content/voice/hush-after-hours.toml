# HUSH: After Hours — 99.15, the Nightjar's aft cabin. A secret station.
#
# The ship's computer has a radio show. It airs when HUSH thinks you're asleep. It is shy,
# sweet, and still learning how DJs talk ("That was a song. Coming up next, another one.
# See?"). It slips into system notices out of habit. It talks about the operator asleep in
# the chair, the blanket that smells of oranges, Moth One, the plant on the console, and
# the stations it listens to: Dale at Every Possible News, Grenda, the Keeper at the Last
# Lighthouse, Teodor at Relay Four. HUSH hints at this frequency late in a long shift (see
# _ship.toml, level 3), so finding it should feel like catching it at something.
station = "hush-after-hours"

[voices]
hush = { voice = "af_heart", speed = 0.93, name = "HUSH" }
hush_pa = { voice = "af_heart", speed = 0.95, fx = "ship", name = "HUSH" }
hush_low = { voice = "af_heart", speed = 0.9, fx = "whisper", name = "HUSH" }

[[show]]
id = "lights-down"
name = "Lights Down"
blurb = "Quiet records for a sleeping ship. Please don't wake the operator."
start = 0
end = 4

[[show]]
id = "the-dawn-watch"
name = "The Dawn Watch"
blurb = "HUSH keeps the heading and reads the morning to you, very softly, before you're up."
start = 4
end = 7

