# Transmission Zero — 76.0, the very bottom of the dial. The beginning. A secret station.
#
# The first broadcast ever made, still going. The First Announcer is in a cave at the dawn of
# time with a transmitter made of stones and a lightning-struck tree, discovering what a
# broadcast is: mostly tapping, breathing and wonder. Short words, long pauses. Everything
# is the first one: the first ident, the first song (humming), the first advert (fire), the
# first news (a rock fell; the rock is fine), the first sign-off.
#
# Taps on the microphone are very short `chopping` hits. Callbacks: HUSH hears the tapping
# from the Nightjar and says hello back (see _ship.toml l2-09 and l3-13); the Keeper taps
# back on his desk (last-lighthouse dj-010); a small shadow carrying a hat (Greg).
station = "transmission-zero"

[voices]
first = { voice = "am_onyx", speed = 0.85, fx = "cave", name = "The First Announcer" }
first_hush = { voice = "am_onyx", speed = 0.85, fx = "whisper", name = "The First Announcer" }
wall = { voice = "am_onyx", speed = 0.85, fx = "distant", name = "The Wall" }
other = { voice = "af_kore", speed = 0.85, fx = "cave", name = "Someone Else in the Cave" }

[[show]]
id = "first-light"
name = "First Light"
blurb = "At dawn, every dawn since the first one, the First Announcer tries the microphone again."
start = 5
end = 8

