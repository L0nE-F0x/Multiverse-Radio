# Plant FM — 106.0, a sunny greenhouse windowsill.
#
# Programming for houseplants. The host, Fern, is a plant. She speaks once in a long while,
# slowly, and mostly about light. The cactus wears headphones for the bass; he has no ears;
# nobody brings it up. The orchid on the top shelf always gets the light first. Ambient
# station: voices are rare, short and very slow, with room to grow between the words.
#
# The `light` kit is the light report: an opener, one to three sources of light, and a
# sign-off.
station = "plant-fm"

[voices]
fern = { voice = "af_kore", speed = 0.78, name = "Fern" }
cactus = { voice = "am_michael", speed = 0.85, name = "The Cactus" }

[[show]]
id = "first-light"
name = "First Light"
blurb = "Fern describes the light as it arrives, a very little at a time."
start = 5
end = 8

[[show]]
id = "full-sun"
name = "Full Sun"
blurb = "The brightest hours, celebrated very quietly by everyone on the windowsill."
start = 11
end = 15

[[show]]
id = "dark-hours"
name = "The Dark Hours"
blurb = "For plants at night: rest, respiration, and growing a little while nobody is looking."
start = 22
end = 5

