# Waystation 9 CB — 97.4, the truck stop at the crossroads of several realities.
#
# Big Rosalind runs dispatch from the diner: knows every driver's handle and every road's
# mood, and does not trust the sideways road. On the channel (CB fx): Midnight Mongoose, who
# has driven this stretch since it was a river, and Grandma Diesel, eighty-four, fastest on
# the network, hauls weather. Dolores pours the coffee. The roads go up, down and sideways.
#
# Modular kit: roads (weather) — the road report: open × 1–3 roads × close.
# Serial: "the-new-guy", three episodes — a rookie without a handle until the road picks one.
# Cross-station: compost for the Gristwick marrow; a load of fog for Wall of Fog; Teodor at
# Relay Four on the long range.
station = "waystation-9"

[voices]
host = { voice = "bf_lily", name = "Big Rosalind" }
mongoose = { voice = "am_echo", fx = "cb", name = "Midnight Mongoose" }
diesel = { voice = "af_alloy", fx = "cb", name = "Grandma Diesel" }
rookie = { voice = "am_puck", fx = "cb", name = "The New Guy" }

[[show]]
id = "graveyard-shift"
name = "The Graveyard Shift"
blurb = "Long-haul chatter through the dead hours. Big Rosalind on the coffee, Midnight Mongoose on the old river road."
start = 0
end = 4

[[show]]
id = "dawn-run"
name = "The Dawn Run"
blurb = "Night convoy in, day convoy out, and bacon for everyone."
start = 5
end = 8

[[show]]
id = "supper-at-the-crossroads"
name = "Supper at the Crossroads"
blurb = "Drivers pull in, swap stories and argue about the sideways road."
start = 18
end = 21

