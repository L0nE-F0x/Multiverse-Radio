# ── Chatter ───────────────────────────────────────────────────────────────────

[[clip]]
id = "chat-001"
category = "dj"
title = "Forty Tonne of Tuesday"
lines = [
  { say = "host", text = "Mongoose, what are you hauling tonight?" },
  { sfx = "squelch" },
  { say = "mongoose", text = "Same as always, Rosalind. Forty tonne of Tuesday, northbound." },
  { say = "host", text = "Fragile?" },
  { say = "mongoose", text = "Says so on the side. Hit a pothole on the Down Road last month, and a whole town got two Tuesdays. Nobody was happy." },
  { say = "host", text = "Drive careful, Mongoose." },
]

[[clip]]
id = "chat-002"
category = "dj"
title = "Grandma Diesel Passes"
lines = [
  { sfx = "squelch" },
  { say = "mongoose", text = "Rosalind, you seen Grandma Diesel tonight?" },
  { say = "host", text = "Seen her? She came through here four minutes ago doing a hundred and ten. Knitting." },
  { sfx = "squelch" },
  { say = "diesel", text = "Hundred and twelve, dear. And it's a cardigan." },
  { say = "mongoose", text = "She's... she's behind me, Rosalind." },
  { say = "diesel", text = "Not any more, pet." },
]

[[clip]]
id = "chat-003"
category = "dj"
title = "Weather in the Back"
lines = [
  { sfx = "squelch" },
  { say = "diesel", text = "Rosalind, I'll need a wide berth on the Up Road. I've got a thunderstorm in the back, and it's getting restless." },
  { say = "host", text = "How restless?" },
  { say = "diesel", text = "Rattling the doors since the county line. I've put the radio on for it. It likes the slow ones." },
  { say = "host", text = "Copy that. All drivers, Grandma Diesel's coming through with weather. Pull over and put your hoods up." },
]

[[clip]]
id = "chat-004"
category = "dj"
title = "Since It Was a River"
lines = [
  { sfx = "squelch" },
  { say = "mongoose", text = "You know, Rosalind, I been driving this stretch since it was a river." },
  { say = "host", text = "I know, Mongoose." },
  { say = "mongoose", text = "Used to row it. Had a little boat. Then one spring the water just got up and left, and they paved it over, and I thought, well. I know the way." },
  { say = "host", text = "You still steer round the rocks." },
  { say = "mongoose", text = "Rocks are still there, Rosalind. You just can't see them." },
  { sfx = "squelch" },
]

[[clip]]
id = "chat-005"
category = "dj"
title = "The Sideways Road"
lines = [
  { say = "host", text = "A word about the sideways road. I don't trust it. It knows where you're going before you do, and it gets there first, and it waits for you." },
  { say = "host", text = "Drivers, if you must take the sideways road: eyes front, doors locked, and don't, whatever you do, let it choose the radio station." },
]

[[clip]]
id = "chat-006"
category = "dj"
title = "Compost for Gristwick"
lines = [
  { say = "host", text = "All drivers, oversized load on the Down Road tonight. Forty tonne of compost, bound for Gristwick. For one marrow." },
  { sfx = "squelch" },
  { say = "mongoose", text = "One marrow, Rosalind?" },
  { say = "host", text = "One marrow. Second load this week. It's got its own postcode, Mongoose. It eats well." },
  { say = "mongoose", text = "Copy. I'll pull in and let it by." },
]

[[clip]]
id = "chat-007"
category = "dj"
title = "The Fog Delivery"
lines = [
  { sfx = "squelch" },
  { say = "diesel", text = "Rosalind, I've dropped that load of fog off at the shoegaze place." },
  { say = "host", text = "How'd it go?" },
  { say = "diesel", text = "Lovely boy on the stage. Mumbled at me for ten minutes. I agreed with everything." },
  { say = "host", text = "Everybody does, Grandma." },
]

[[clip]]
id = "chat-008"
category = "dj"
daypart = "night"
title = "For the Night Shift"
lines = [
  { say = "host", text = "And the Nightjar's on the channel again. Night operator, we can see your running lights over the crossroads." },
  { say = "host", text = "You want coffee, you'll have to come down. We don't deliver up. Well. Grandma Diesel does. But she charges." },
]

[[clip]]
id = "chat-009"
category = "dj"
title = "Relay Four on the Long Range"
lines = [
  { sfx = "squelch" },
  { say = "mongoose", text = "Rosalind, I keep picking up a fella on the long range. Teodor. Relay Four. Asking if anybody can hear him." },
  { say = "host", text = "We hear him, Mongoose. Everybody does. Say hello." },
  { say = "mongoose", text = "Teodor, this is Midnight Mongoose, on the old river road. We hear you, friend. Ten four." },
  { sfx = "squelch" },
]

# ── Serial: the new guy (one episode a day) ───────────────────────────────────

[[clip]]
id = "serial-new-guy-001"
category = "dj"
title = "The New Guy"
serial = { id = "the-new-guy", episode = 1 }
lines = [
  { sfx = "squelch" },
  { say = "rookie", text = "Uh. Waystation Nine, this is... um. This is the new guy." },
  { say = "host", text = "Evening, new guy. Got a handle yet?" },
  { say = "rookie", text = "Not yet. I was thinking... Thunder Hawk?" },
  { say = "host", text = "No." },
  { say = "rookie", text = "Night Wolf?" },
  { say = "host", text = "No." },
  { say = "rookie", text = "What about..." },
  { say = "host", text = "You don't pick your handle, sweetheart. The road picks it. Just drive." },
]

[[clip]]
id = "serial-new-guy-002"
category = "dj"
title = "The New Guy Takes the Sideways Road"
serial = { id = "the-new-guy", episode = 2 }
lines = [
  { say = "host", text = "New guy, what's your twenty?" },
  { sfx = "squelch" },
  { say = "rookie", text = "I took the sideways road, Rosalind. I think... I think I'm in last Thursday." },
  { say = "host", text = "I told you about the sideways road." },
  { say = "rookie", text = "You did." },
  { sfx = "squelch" },
  { say = "diesel", text = "Welcome to the network, Thursday." },
  { say = "host", text = "There it is. The road's picked it. That's your handle now. Thursday." },
  { say = "rookie", text = "...Copy that.", name = "Thursday" },
]

[[clip]]
id = "serial-new-guy-003"
category = "dj"
title = "Thursday's First Fragile Load"
serial = { id = "the-new-guy", episode = 3 }
lines = [
  { say = "host", text = "Thursday, what are you hauling?" },
  { sfx = "squelch" },
  { say = "rookie", text = "First fragile load, Rosalind. A whole crate of first impressions.", name = "Thursday" },
  { say = "host", text = "Steady with those. You only get the one go." },
  { say = "rookie", text = "Copy that. Thursday out.", name = "Thursday" },
  { sfx = "squelch" },
  { say = "host", text = "Listen to him. Thursday out. Proud of you, kid." },
]

