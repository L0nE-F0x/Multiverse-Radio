# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "bev-gets-her-song-09"
category = "show"
serial = { id = "bev-gets-her-song", episode = 9 }
title = "Bev Gets Her Song, Part Nine: Hello, Night Shift"
lines = [
  { sting = "id" },
  { say = "jace", text = "Mara, the phone's ringing." },
  { say = "mara", text = "I know. I answered it four seconds ago. It's Bev." },
  { say = "bev", text = "Hello, loves. Is this the request line?" },
  { say = "jace", text = "It's still Dimension Hop, Bev. But we've been following. The lift, the numbers, Doug. Everyone's been following." },
  { say = "bev", text = "They all say the request line is a man at Relay Four. But his line's broken. He can talk, but he can't hear." },
  { say = "mara", text = "Then you need a relay. Something in between, to carry it both ways." },
  { say = "jace", text = "Like what?" },
  { say = "mara", text = "Like a ship. A relay ship, out past the edge of the dial, listening to all of us. With someone on the night shift." },
  { say = "jace", text = "Is there one?" },
  { say = "mara", text = "There's one listening right now, Jace. I can see it four seconds from now. It's called the Nightjar.", gap = 1.2 },
  { say = "mara", text = "Hello, night shift." },
  { say = "jace", text = "Mara, who are you talking to?" },
  { say = "mara", text = "The person with their hand on the dial. Hi. Don't touch it for a bit. Bev needs you." },
  { say = "bev", text = "Hello, night shift. If you can, love, put me through to Relay Four. I'll wait. I'm very good at waiting." },
  { say = "jace", text = "She really is." },
]

[[clip]]
id = "teodor-is-heard-11"
category = "show"
serial = { id = "teodor-is-heard", episode = 11 }
title = "Teodor Is Heard, Part Eleven: Relay Seven"
lines = [
  { sting = "id" },
  { say = "jace", text = "Mara, there's something on the line. It's very faint." },
  { say = "teodor", text = "This is Relay Four. I can hear you. A little. I've got a crystal now." },
  { say = "mara", text = "Teodor! Hi! You sound like you're in a biscuit tin." },
  { say = "teodor", text = "I can hear the stations in bits now. But I need a relay, to reach everyone at once. There used to be seven of us." },
  { say = "jace", text = "What happened to the others?" },
  { say = "teodor", text = "One, Two and Three were switched off. Five fell in the sea. Six is a cafe now. And Seven just went. Nobody knows where." },
  { say = "mara", text = "I know where. Seven's a ship. It drifts about past the edge of the dial, listening to everybody. It's got someone on the night shift and everything." },
  { say = "teodor", text = "Relay Seven is still running?" },
  { say = "mara", text = "Point your antenna up and to the left. Bit more. Bit more." },
  { say = "jace", text = "Mara, how do you know which way is left from Relay Four?" },
  { say = "mara", text = "I don't, Jace. But he's going to try it, and in four seconds, it's going to work.", gap = 1.8 },
  { say = "teodor", text = "There's a light on my board. The Relay Seven light. It hasn't been on in eleven years." },
  { say = "mara", text = "Told you. Not tonight, Teodor. Tomorrow. Put the kettle on, and get some sleep." },
]

[[clip]]
id = "greg-comes-home-13"
category = "show"
serial = { id = "greg-comes-home", episode = 13 }
title = "Greg Comes Home, Part Thirteen: Two Shapes"
lines = [
  { sting = "id" },
  { say = "mara", text = "Listener mail, Jace. And look. It's a postcard. From the sea." },
  { say = "jace", text = "There's no writing on it." },
  { say = "mara", text = "Hold it up to the light." },
  { say = "jace", text = "Oh. There's two shapes. A man, sitting on the sand with his knees up. And right next to him, a bit to the left, the same shape again. Flat." },
  { say = "mara", text = "That's Hollis and Greg." },
  { say = "jace", text = "They went to the sea? Together?" },
  { say = "mara", text = "He took him somewhere nice, Jace. First time in forty one years." },
  { say = "jace", text = "There's something written at the bottom, really small. Hollis must have done it." },
  { say = "mara", text = "Read it." },
  { say = "jace", text = "Having a lovely time. He was very small at noon. We stayed till four, so he could stretch out. Leaving the porch light on anyway. For the next one.", speed = 0.92, gap = 1.2 },
  { say = "mara", text = "Jace, you're going to cry in about four seconds." },
  { say = "jace", text = "I'm not going to cry." },
  { pause = 2.0 },
  { say = "jace", text = "Why is it so nice? It's two shapes.", speed = 0.92 },
  { say = "mara", text = "It's the space between them, Jace. There isn't any." },
]

