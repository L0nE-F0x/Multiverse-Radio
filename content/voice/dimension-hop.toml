# Dimension Hop — 94.4, a rift between two garages.
#
# Jace is from a reality much like ours and tries to explain normal things; it never goes
# well. Mara is from a reality where everyone rolls instead of walking, everything on her
# side of the rift is gently upside-down, and she lives four seconds in the future.
# The engine of most bits: Jace describes something ordinary, Mara reframes it as either
# terrifying or beautiful.
#
# Recurring segments: Listener Mail, Normal or Not Normal. Running gags from other
# stations: Greg the shadow, Bev's song, Grenda, the deer on Interstate Zero.
station = "dimension-hop"

[voices]
jace = { voice = "am_michael", name = "Jace" }
mara = { voice = "af_bella", name = "Mara" }
# v3: serials.
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
teodor = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }

