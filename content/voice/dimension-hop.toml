  { say = "mara", text = "Who's in charge?" },
  { say = "jace", text = "Nobody." },
  { say = "mara", text = "And if somebody pushes in?" },
  { say = "jace", text = "Everyone sighs. Quite loudly." },
  { say = "mara", text = "Not normal. That's a choir, Jace. You're all in a choir and you don't know it." },
