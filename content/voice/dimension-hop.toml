  { say = "mara", text = "Why would you say sorry?" },
  { say = "jace", text = "I don't know. It just comes out." },
  { say = "mara", text = "So when you get hurt, you apologise to the thing that hurt you." },
  { say = "jace", text = "Mostly." },
  { say = "mara", text = "Jace. That's the kindest, saddest thing your reality does. Normal. Sorry. Normal." },
