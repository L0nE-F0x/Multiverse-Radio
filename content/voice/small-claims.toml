# Small Claims of the Multiverse — 110.2, Courtroom Four of the Interdimensional Small
# Claims Tribunal, live from the bench.
#
# Judge Alvarez-Penhallow presides over the smallest claims in the largest jurisdiction:
# precise, unflappable, quietly delighted by nonsense, and fair to everyone, including the
# weather. Clerk Odell reads the cases in the tone of a shipping forecast. Mr. Lusk
# appears for plaintiffs, Ms. Castellane for the defence; Bailiff Mutch keeps order. The
# gavel is a foley tap (`chopping`, a single short knock).
#
# The `case` kit chains the clerk's claim, one to three bodies (testimony, objections,
# exhibits) and a ruling. Bodies never name the case; rulings fit any case and are funny
# on their own. A weekly show, Landmark Rulings (Fridays), retells the court's great
# precedents.
station = "small-claims"

[voices]
judge = { voice = "bf_isabella", speed = 0.95, name = "Judge Alvarez-Penhallow" }
odell = { voice = "am_adam", speed = 0.92, name = "Clerk Odell" }
lusk = { voice = "bm_fable", name = "Mr. Lusk, for the Plaintiff" }
castellane = { voice = "af_aoede", name = "Ms. Castellane, for the Defence" }
plaintiff = { voice = "am_michael", name = "The Plaintiff" }
defendant = { voice = "af_nicole", name = "The Defendant" }
expert = { voice = "bm_lewis", name = "An Expert Witness" }
dimension = { voice = "am_onyx", fx = "giant", name = "A Dimension" }
small = { voice = "af_sky", fx = "tiny", name = "A Very Small Party" }
mutch = { voice = "am_eric", name = "Bailiff Mutch" }

[[show]]
id = "petty-sessions"
name = "Petty Sessions"
blurb = "The morning list: fences, borrowed hours and the odd cloud. Clerk Odell reads; the Judge takes notes in green ink."
start = 9
end = 12

[[show]]
id = "the-late-list"
name = "The Late List"
blurb = "Cases heard after hours, for parties who only exist at night. Noise complaints from the void a speciality."
start = 22
end = 1

[[show]]
id = "landmark-rulings"
name = "Landmark Rulings"
blurb = "Fridays: the Judge revisits the great precedents of the Tribunal. The tide. The last biscuit. The two Tuesdays."
start = 20
end = 21
days = [5]

