  { say = "expert", text = "Your Honour, in my professional opinion, the item in question belongs to whoever is holding it, unless somebody else is also holding it, in which case it belongs to the situation." },
  { say = "judge", text = "And who owns the situation?" },
  { say = "expert", text = "Nobody, Your Honour. That's why we're all here." },
