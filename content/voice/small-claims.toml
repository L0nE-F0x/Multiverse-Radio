# ── Landmark Rulings (Fridays, 20–21) ─────────────────────────────────────────

[[clip]]
id = "show-landmark-open"
category = "id"
show = "landmark-rulings"
part = "open"
lines = [
  { sting = "fanfare" },
  { say = "odell", text = "It's Friday, and this is Landmark Rulings. The great precedents of the Tribunal, revisited from the bench." },
]

[[clip]]
id = "show-landmark-001"
category = "story"
show = "landmark-rulings"
title = "The Sea against the Shore"
bed = "hall"
lines = [
  { say = "judge", text = "Landmark ruling number one. The Sea, against the Shore. The oldest case on our books." },
  { say = "odell", text = "The Sea claimed the beach. The Shore claimed the beach. The beach declined to give evidence, and simply lay there." },
  { say = "judge", text = "Counsel for the Sea argued that the beach was wet, and wet things are the Sea's. Counsel for the Shore argued that the beach was sandy, and sandy things are the Shore's." },
  { say = "judge", text = "The court ruled that the wet bit belongs to the Sea, and the dry bit belongs to the Shore, and the bit in between belongs to whoever is standing on it at the time, eating an ice cream." },
  { sfx = "chopping", seconds = 0.1 },
  { say = "odell", text = "The ruling stands to this day, Your Honour. Twice a day, it's tested." },
]

[[clip]]
id = "show-landmark-002"
category = "story"
show = "landmark-rulings"
title = "In the Matter of the Last Biscuit"
bed = "hall"
lines = [
  { say = "judge", text = "Landmark ruling number two. In the matter of the last biscuit." },
  { say = "odell", text = "Eleven parties, Your Honour, from four dimensions, all of whom had been offered the last biscuit, and all of whom had said, oh, no, you have it." },
  { say = "judge", text = "The biscuit sat on the plate for nine years. It became a landmark in its own right. People came to see it." },
  { say = "judge", text = "The court ruled that the last biscuit belongs to whoever did not ask for it. Since nobody had, it belonged to everybody, and was broken into eleven pieces, by the Bailiff, very carefully." },
  { say = "odell", text = "Mutch still talks about it, Your Honour." },
  { say = "judge", text = "So do I, Odell. So do I." },
]

[[clip]]
id = "show-landmark-003"
category = "story"
show = "landmark-rulings"
title = "Tuesday against Tuesday"
bed = "hall"
lines = [
  { say = "judge", text = "Landmark ruling number three. Tuesday, against Tuesday." },
  { say = "odell", text = "A week in the Grey Reach was found to contain two Tuesdays. Each claimed to be the real one. Each had its own weather, its own bin day, and its own very strong opinion." },
  { say = "judge", text = "The week asked the court to choose. The court declined. You cannot ask a week to choose between its days. It's cruel. And the days can hear you." },
  { say = "judge", text = "The court ruled that the week may keep both Tuesdays, on condition that it treat them equally, and that Wednesday be told gently." },
  { sfx = "chopping", seconds = 0.1 },
  { say = "odell", text = "Wednesday took it very well, Your Honour. All things considered." },
]

