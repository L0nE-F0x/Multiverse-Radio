  { say = "plaintiff", text = "Your Honour, I have never been so inconvenienced in all my dimensions. And I have a great many dimensions." },
  { say = "plaintiff", text = "I want it noted that I was there first. I was there first in every version of events. I have the versions here, in a folder." },
  { say = "judge", text = "The court will take the folder. The court notes the folder is also a dimension. Please don't put it down near the others." },
]

