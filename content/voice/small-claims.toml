  { say = "odell", text = "Which voice, Your Honour?" },
  { say = "judge", text = "That one, Odell. Like a forecast for a sea that isn't there." },
  { say = "odell", text = "Moderate, Your Honour. Becoming good." },
]

[[clip]]
