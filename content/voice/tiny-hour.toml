# ── Songs, spoken as rhymes ───────────────────────────────────────────────────

[[clip]]
id = "song-001"
category = "dj"
title = "The Hoover Song"
lines = [
  { say = "pim", text = "Song time! This one's about the hoover. Sing along, very quietly.", gap = 0.8 },
  { say = "pim", text = "Here comes the hoover, hum, hum, hum." },
  { say = "pim", text = "Under the thimble, quick as a crumb." },
  { say = "pim", text = "Hold on to something, hold on tight." },
  { say = "pim", text = "The hoover goes by, and we're all right!", gap = 0.8 },
  { say = "pim", text = "Well done! Is everybody still here? Good." },
]

[[clip]]
id = "song-002"
category = "dj"
