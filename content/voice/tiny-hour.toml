# The Tiny Hour — 104.35, a studio inside a matchbox.
#
# Auntie Pim, about two centimetres tall, presents a children's programme for very small
# listeners: songs (spoken as rhymes), crafts made from things the big people dropped, and
# how to avoid being hoovered. Dot the ladybird puppet helps, and has very neat edges.
# Listeners' ages are given in days.
#
# The `craft` kit chains Crafty Corner's craft of the day, one to three steps and the
# show-a-grown-up finish. Steps fit any craft and any order.
station = "tiny-hour"

[voices]
pim = { voice = "af_sky", speed = 1.05, name = "Auntie Pim" }
dot = { voice = "af_jessica", fx = "tiny", name = "Dot, the Ladybird" }

[[show]]
id = "good-morning-small-ones"
name = "Good Morning, Small Ones"
blurb = "Breakfast with Auntie Pim: one oat each, a song, and the day's safety tip."
start = 7
end = 9

[[show]]
id = "crafternoon"
name = "Crafternoon"
blurb = "Crafts for very small hands, made from things the big people dropped."
start = 14
end = 17

[[show]]
id = "very-small-hours"
name = "The Very Small Hours"
blurb = "For very small listeners who can't sleep. The clock is very loud from down here."
start = 1
end = 5

