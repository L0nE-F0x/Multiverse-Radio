[[clip]]
id = "craft-step-3"
category = "show"
kit = "craft"
part = "body"
bed = "room"
lines = [
  { say = "pim", text = "Time for cutting! Never use the big people's scissors. They're the size of a bridge. Ask a ladybird instead. Ladybirds have very neat edges. Dot?" },
  { say = "dot", text = "Snip!" },
  { say = "pim", text = "Thank you, Dot!" },
]

[[clip]]
id = "craft-step-4"
category = "show"
kit = "craft"
part = "body"
bed = "room"
lines = [
  { say = "pim", text = "Made a mistake? That's all right! Blow on it, gently." },
  { say = "pim", text = "At our size, everything blows away if you ask it nicely. Even mistakes." },
]

[[clip]]
id = "craft-step-5"
category = "show"
kit = "craft"
