[[clip]]
id = "song-004"
category = "dj"
title = "One Raindrop"
lines = [
  { say = "pim", text = "One raindrop, big as a ball," },
  { say = "pim", text = "rolled down the window and paid us a call." },
  { say = "pim", text = "We said hello, and it said splash," },
  { sfx = "splash" },
  { say = "pim", text = "and off it went, in a silver flash." },
