  { say = "pim", text = "They don't mean harm, they don't look down," },
  { say = "pim", text = "they're only big shoes, walking round." },
]

[[clip]]
id = "song-003"
category = "dj"
title = "The Crumb Song"
lines = [
  { say = "pim", text = "Everybody knows this one! The Crumb Song!", gap = 0.6 },
  { say = "pim", text = "I found a crumb, a crumb, a crumb," },
  { say = "pim", text = "it's twice as big as my left thumb." },
  { say = "pim", text = "I'll share it out with all my friends," },
  { say = "pim", text = "and that's the way the crumb song ends!" },
  { say = "dot", text = "Again!" },
