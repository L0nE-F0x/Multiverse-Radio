# ── Safety tips and letters ───────────────────────────────────────────────────

[[clip]]
id = "psa-001"
category = "psa"
title = "Auntie Pim's Safety Tip: The Hoover"
lines = [
  { say = "pim", text = "Auntie Pim's safety tip! If you hear a big hum getting nearer, that's the hoover." },
  { say = "pim", text = "Get under a chair, hold on to a rug tassel, and think heavy thoughts. Bricks. Mondays. Very full suitcases." },
]

[[clip]]
id = "psa-002"
category = "psa"
title = "Auntie Pim's Safety Tip: The Cat"
lines = [
  { say = "pim", text = "Auntie Pim's safety tip! If a cat looks at you, don't run. Cats love it when you run." },
  { say = "pim", text = "Stand very still, and look like a button. Cats aren't interested in buttons. Not for long, anyway." },
]

[[clip]]
id = "dj-001"
category = "dj"
title = "Letters and Drawings"
lines = [
  { say = "pim", text = "Thank you to Ottilie, aged four days, for her drawing. It's a dot. It's a lovely dot. It's up on the fridge, which, for us, is a sort of mountain." },
  { say = "pim", text = "And happy birthday to Benedict, who is six minutes old today! Well done, Benedict!" },
]

