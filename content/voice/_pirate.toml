# The pirate pool: generic DJs, idents, adverts and warnings for every generated pirate
# station on the dial (ids `pirate-<frequency>`, named by `pirateIdentity()` in
# src/content/pirates.ts). Nothing here ever names a station, so any clip fits any pirate.
#
# The DJs (all captioned "Pirate DJ", so they sit under any generated host name):
#   gravel   – thirty one years in a shed, world-weary, secretly sentimental
#   sunny    – broadcasting from her nan's loft; relentlessly upbeat; cousin Derek pedals the generator
#   quiet    – whispers so the detector vans can't find her
#   posh     – a disinherited gentleman pirate in a rowing boat, still getting into it
#   rookie   – first night on air, very nervous, very kind
#   oldtimer – fifty years on the wrong frequency, on a thin AM line
#   trucker  – on CB from a lay-by between two realities
#   kid      – supposedly doing homework
#
# Callbacks: Teodor at Relay Four, Bev and the request line, Grumbel's Ladders (a bloke
# round the back sells the seconds), the Multiverse Broadcast Authority and its vans.
# Shout-outs name other pirates that `pirateIdentity()` can actually generate, so with
# luck a listener finds them.
station = "_pirate"

[voices]
gravel = { voice = "am_fenrir", speed = 0.92, name = "Pirate DJ" }
sunny = { voice = "af_bella", speed = 1.08, name = "Pirate DJ" }
quiet = { voice = "af_nicole", fx = "whisper", name = "Pirate DJ" }
posh = { voice = "bm_fable", speed = 0.95, name = "Pirate DJ" }
rookie = { voice = "am_liam", speed = 1.05, name = "Pirate DJ" }
oldtimer = { voice = "bm_lewis", fx = "radio", name = "Pirate DJ" }
trucker = { voice = "am_echo", fx = "cb", name = "Pirate DJ" }
kid = { voice = "am_puck", speed = 1.1, name = "Pirate DJ" }
hawker = { voice = "am_eric", speed = 1.08, name = "Advert" }
hawker_low = { voice = "am_eric", fx = "whisper", name = "Advert" }
smooth = { voice = "bf_isabella", speed = 0.95, name = "Advert" }
small_print = { voice = "af_jessica", speed = 1.35, name = "Small Print" }
lorna = { voice = "af_sarah", fx = "phone", name = "Lorna" }
caller = { voice = "af_river", fx = "phone", name = "Caller" }
inspector = { voice = "bm_daniel", fx = "phone", name = "Caller" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
authority = { voice = "bm_daniel", fx = "megaphone", name = "Multiverse Broadcast Authority" }

