  { say = "dale", text = "We have sad news tonight. The word whom has died, peacefully, in its sleep, at the age of nine hundred and twelve.", gap = 0.7 },
  { say = "dale", text = "Whom was a quiet word. It never pushed itself forward. Most people, if we're honest, were never quite sure when to use it, and so, eventually, they didn't." },
  { say = "dale", text = "It is survived by who, which never really understood it, and by a small number of very careful letters to the editor." },
  { say = "dale", text = "Whom will be missed. By whom, we're not sure.", gap = 0.6 },
  { say = "dale", text = "The funeral is on Friday. Please don't bring flowers. Bring a semicolon, if you still have one. It's what whom would have wanted." },
