  { say = "dale", text = "The Office of Fair Geese reports that the Numbers Station received four geese this week, all from one woman, who says she doesn't think she owed any, but wanted to be on the safe side." },
  { say = "dale", text = "The Numbers Station has thanked her. In numbers.", gap = 0.7 },
]

[[clip]]
id = "news-body-11"
category = "news"
kit = "news"
part = "body"
title = "The Deer Watches the Traffic"
lines = [
  { say = "dale", text = "Traffic is moving on Interstate Zero for the first time in nine days. Kim is at the roadside. Kim?" },
  { say = "kim", text = "Dale, the cars are going past slowly, and the polite deer is standing on the verge, watching them go. It looks very proud of everyone." },
  { say = "kim", text = "A driver has just handed me a sandwich out of his window. He said, for the deer. The deer doesn't want it. I'm eating it, Dale.", gap = 0.6 },
  { say = "dale", text = "Thank you, Kim.", gap = 0.7 },
]

[[clip]]
id = "news-body-12"
category = "news"
kit = "news"
part = "body"
title = "Silence Rallies"
lines = [
  { say = "dale", text = "Business. Shares in silence rose sharply this afternoon, after a long period of saying nothing." },
  { say = "dale", text = "Analysts say silence remains undervalued. Silence declined to comment, which analysts describe as very much its strength.", gap = 0.7 },
]

[[clip]]
id = "news-body-13"
category = "news"
kit = "news"
part = "body"
title = "A Bench, Early"
lines = [
  { say = "dale", text = "A bench in Founders Park has been dedicated to a man who is still very much alive. He says he is touched, and comes to sit on it every afternoon, to see how it's doing." },
  { say = "dale", text = "The plaque reads, he liked this bench. He says it's accurate.", gap = 0.7 },
]

[[clip]]
id = "news-body-14"
category = "news"
kit = "news"
part = "body"
title = "The Tuesday Goes Home"
lines = [
  { say = "dale", text = "The Tuesday found in a drainage ditch last spring has been claimed. Kim Harrowgate is with its owners. Kim?" },
  { say = "kim", text = "Dale, I'm with a family in the eastern Overlap who have finally got their Tuesday back. They're having it now. It's a little damp. The afternoon still has bite marks." },
  { say = "kim", text = "They've handed me a piece of it. It's about twenty past two. It's lovely, Dale.", gap = 0.7 },
]

[[clip]]
id = "news-body-15"
category = "news"
kit = "news"
part = "body"
title = "The Sun, as an Exam Subject"
lines = [
  { say = "dale", text = "Education. Schools in the Damp Dimension have added a new subject, the sun, which most pupils have never seen." },
  { say = "dale", text = "The first exam was this morning. Most pupils drew a lamp. One drew a very confident orange. He has been given top marks, and a hat.", gap = 0.7 },
]

[[clip]]
id = "news-body-16"
category = "news"
kit = "news"
part = "body"
title = "Cat Elected"
lines = [
  { say = "dale", text = "Local government. A cat in the eastern Overlap has been elected to the parish council, after nobody else stood." },
  { say = "dale", text = "In his first meeting he knocked the agenda off the table and slept through the budget. Colleagues describe it as the most productive session in years.", gap = 0.7 },
]

[[clip]]
id = "news-body-17"
category = "news"
kit = "news"
part = "body"
title = "The Landing on the Ambition"
lines = [
  { say = "dale", text = "In Lower Stilt, a man has spent the week climbing a Grumbel's Ambition, the ladder with no top. Kim?" },
  { say = "kim", text = "Dale, he's shouted down that there isn't a top, which we knew. But he says there's a very nice landing about halfway up, with a chair. He's having a sit down." },
  { say = "kim", text = "He's lowered a basket. Someone has put a sandwich in it. Up is a choice, he says. So is staying where you are.", gap = 0.7 },
]

[[clip]]
id = "news-body-18"
category = "news"
kit = "news"
part = "body"
title = "A New Star"
lines = [
  { say = "dale", text = "Astronomy. A new star has been reported, low in the sky over the eastern Overlap." },
  { say = "dale", text = "On closer inspection it is a porch light. Astronomers say they have decided to count it anyway.", gap = 0.7 },
]

[[clip]]
id = "news-body-19"
category = "news"
kit = "news"
part = "body"
title = "Backwards, Both Ways"
lines = [
  { say = "dale", text = "The arts. The Mirror World's national gallery has opened an exhibition of paintings of our world. Critics there describe our world as charming, but backwards." },
  { say = "dale", text = "Critics here have described the exhibition as charming, but backwards. Both sides are delighted.", gap = 0.7 },
]

[[clip]]
id = "news-body-20"
category = "news"
kit = "news"
part = "body"
title = "Somebody at Nobody's Bakery"
lines = [
  { say = "dale", text = "Nobody's Bakery, which sells bread that nobody made, has been found to have somebody in it. Kim?" },
  { say = "kim", text = "Dale, I'm in the bakery with a woman in an apron, covered in flour. She says she's been doing it every night for thirty years." },
  { say = "baker", text = "I don't mind the name. I'd just like someone to say thank you, now and then." },
  { say = "kim", text = "She's handed me a loaf. It's warm, and it sings when you squeeze it. Thank you, Maureen.", gap = 0.7 },
]

[[clip]]
id = "news-body-21"
category = "news"
kit = "news"
part = "body"
title = "A Man Who Likes It at Lost and Found"
lines = [
  { say = "dale", text = "The Overlap Lost and Found desk reports a record week. Nine hundred umbrellas, four hundred gloves, and a man who says he isn't lost, he just likes it there." },
  { say = "dale", text = "He has been given a chair and a ticket. Staff say he's no trouble, and very good at finding things.", gap = 0.7 },
]

