  { say = "dale", text = "The Sunball season continues, with the ball, a small and polite sun, said to be in good form and apologizing less." },
  { say = "dale", text = "And the world hide and seek championship has entered its forty first year, with the defending champion still not found. Officials say they are not worried. Officials say she is very good." },
  { say = "dale", text = "For full results, ask Chip Thunderbuckle on the Impossible Sports Network. And then ask somebody else." },
]

[[clip]]
id = "news-024"
category = "news"
title = "Library Book Returned Early"
lines = [
  { sting = "news" },
  { say = "dale", text = "A man in the eastern Overlap has been fined for returning a library book that has not yet been written." },
  { say = "dale", text = "The library says the book is overdue, in the sense that the author is." },
  { say = "dale", text = "The man, who asked not to be named, says he enjoyed the book, but found the ending rushed, and has left a note in the margin asking the author to take her time." },
  { say = "librarian", text = "We don't mind early returns, as such. We mind that he's folded the corner of page two hundred, and she hasn't got there yet. It'll be a shock for her." },
  { say = "dale", text = "The author has been informed, and says she will take it under advisement. Eventually." },
]

# ── Weather and traffic ───────────────────────────────────────────────────────

[[clip]]
id = "weather-001"
category = "weather"
title = "Weather and Traffic Across All Timelines"
over_music = true
lines = [
  { say = "dale", text = "Time now for weather and traffic, across all timelines. Here's Skip Daley. Skip?" },
  { say = "skip", text = "Thanks, Dale! Well, it's a beautiful night across most of the timelines. In the northern realities, clear skies and a light breeze. In the southern realities, the sky is looking back at you, so give it a wave!" },
  { say = "skip", text = "Out west, expect scattered Tuesdays, mostly in the afternoon." },
  { say = "skip", text = "And a heads up for commuters. There's a ten mile backup on Interstate Zero, where traffic is being held up by a single, very polite deer. Nobody wants to go first!" },
  { say = "dale", text = "Skip. What about the weekend?" },
  { say = "skip", text = "The weekend has been cancelled, Dale! But the weekday is being extended, so that's nice!", gap = 0.8 },
  { say = "dale", text = "Thank you, Skip." },
]

[[clip]]
id = "weather-002"
category = "weather"
title = "Morning Commute"
daypart = "morning"
over_music = true
lines = [
  { say = "skip", text = "Good morning, commuters! Traffic and travel across all timelines, brought to you by Grumbel's Ladders. When the road won't go, go up!" },
  { say = "skip", text = "On Interstate Zero, the polite deer is still there, and it's now been joined by a second, equally polite deer. They've both been saying after you since about four this morning. Expect delays!" },
  { say = "skip", text = "The hour between nine and ten is jammed solid, so if you can, skip it entirely and take ten fifteen instead. It's lovely. It's practically empty." },
  { say = "skip", text = "And if you're traveling backward today, please allow extra time. You'll need it. You'll have already needed it!" },
]

[[clip]]
id = "weather-003"
category = "weather"
title = "A Warm Front of Nostalgia"
over_music = true
lines = [
  { say = "skip", text = "Weather time! A warm front of nostalgia is moving in from the west tonight, bringing light reminiscing, scattered photo albums, and in some areas, the smell of a house you lived in as a kid." },
  { say = "skip", text = "That should clear by morning, leaving mild regret, with patches of feeling fine about it, actually." },
  { say = "skip", text = "Further north, a cold snap of common sense. Bundle up! Make good choices!" },
  { say = "skip", text = "Overnight lows of around minus one feeling. Highs tomorrow, a pleasant seven or eight out of ten." },
  { say = "dale", text = "Thank you, Skip. I'll be wearing a coat." },
  { say = "skip", text = "Good call, Dale!" },
]

[[clip]]
id = "weather-004"
category = "weather"
title = "Outlook for the Damp Dimension"
over_music = true
lines = [
  { say = "dale", text = "Skip, what's the outlook for the Damp Dimension?" },
  { say = "skip", text = "Dale, it's going to rain! That's not a forecast. That's a culture!" },
  { say = "skip", text = "Rain has been falling over Precinct Nine for about four thousand years, and our models show it continuing for at least the next four thousand. After that, the models get a bit sad and stop." },
  { say = "skip", text = "Look out for rain coming up from the puddles late tonight. That's normal there. The locals call it giving back." },
  { say = "skip", text = "And my friend Drizzle over at Rainfall FM tells me she's got a new umbrella. Her first one in eleven years. It's yellow!" },
  { say = "dale", text = "Good for Drizzle." },
]

[[clip]]
id = "weather-005"
category = "weather"
title = "The Pollen Count"
daypart = "day"
over_music = true
lines = [
  { say = "skip", text = "Allergy sufferers, I'm sorry to say the pollen count is high today. The pollen count is very high. The pollen count has taken the high ground and is refusing to negotiate!" },
  { say = "skip", text = "Experts say the pollen isn't hostile. It's just very, very committed to the idea of more flowers." },
  { say = "skip", text = "The ultraviolet index is a four. Ultraviolet is optional this week, so wear it if you like." },
  { say = "dale", text = "Skip, did you say the pollen is negotiating?" },
  { say = "skip", text = "No, Dale. It's refusing to. It's got a list of demands. It's mostly bees." },
]

[[clip]]
id = "weather-006"
category = "weather"
title = "Tides and Space Weather"
daypart = "night"
over_music = true
lines = [
  { say = "skip", text = "Your late night tide report! High tide tonight at about eleven. It'll go out at four, and come back at six, with a friend." },
  { say = "skip", text = "Space weather now. The sun is having a big week, folks. Some flares, some moods. Give it space. It'll come around. It always comes around, that's kind of its whole thing!" },
  { say = "skip", text = "And on the comet beach, surf's up! Waves of pure time, three to four minutes high. If you wipe out, you'll be fine, you'll just be a little bit earlier." },
  { say = "dale", text = "Thank you, Skip. Somebody tell the sun we're thinking of it." },
]

[[clip]]
id = "weather-007"
category = "weather"
title = "Fog"
over_music = true
lines = [
  { say = "dale", text = "Skip, what's the weather doing?" },
  { say = "skip", text = "Dale, I honestly don't know. The forecast is fog, so I can't see it." },
  { say = "dale", text = "Is there anything you can tell us?" },
  { say = "skip", text = "I can tell you it's very nice in here! It's soft, it's quiet, and somebody's left a bicycle. I think it's my bicycle. I think I've been in here since Tuesday." },
  { say = "skip", text = "The fog should lift by morning, at which point I'll be able to tell you what the weather was." },
  { say = "dale", text = "Skip, are you broadcasting from inside the fog?" },
  { say = "skip", text = "I'm broadcasting from the fog, Dale, or the fog is broadcasting from me. Honestly, it's hard to say. Back to you!" },
]

[[clip]]
id = "weather-008"
category = "weather"
title = "The Deer Has Gone First"
over_music = true
lines = [
  { say = "skip", text = "Traffic update! The deer on Interstate Zero has finally gone first!" },
  { say = "skip", text = "Repeat, the deer has gone first! After nine days of saying after you, it simply looked both ways, nodded to the traffic, and stepped off the road." },
  { say = "skip", text = "Unfortunately, everyone was so moved that nobody has moved. Traffic is now held up by about four thousand people being very proud of a deer." },
  { say = "dale", text = "Skip, is the deer all right?" },
  { say = "skip", text = "The deer is great, Dale! It's in a field! It's having the best day of its life!" },
]

[[clip]]
id = "weather-009"
category = "weather"
title = "Evening Drive Time"
daypart = "evening"
over_music = true
lines = [
  { say = "skip", text = "Evening drive time! Traffic across all timelines is brought to you by Grumbel's Ladders. Up is a choice!" },
  { say = "skip", text = "Westbound lanes on the Overlap Bypass are moving well, and so, unusually, is the road. It's drifted about forty feet to the left, so steer to match!" },
  { say = "skip", text = "There's a slowdown on the bridge to yesterday. Everyone wants to go back. Nobody's allowed. Please turn around safely." },
  { say = "skip", text = "And there's a stalled moment at the junction of Fourth and Forever. Crews are on the scene, trying to get it going again with a gentle cough." },
  { say = "skip", text = "Otherwise, a smooth ride home, folks. Wave at the other versions of you in the next lane!" },
]

[[clip]]
id = "weather-010"
category = "weather"
title = "The Long Range Forecast"
over_music = true
lines = [
  { say = "dale", text = "Skip. The long range forecast." },
  { say = "skip", text = "Sure thing, Dale! Next week, mild. The week after, mild, with some feelings. The month after that, honestly, Dale, a lot can happen." },
  { say = "skip", text = "Next year looks lovely. There's a stretch in the spring where it's warm and nobody's in a hurry. Mark your calendars." },
  { say = "skip", text = "And in about forty years there's a really nice Thursday. I won't tell you why. You'll know it when you're in it.", gap = 0.8 },
  { say = "dale", text = "Thank you, Skip. I'll look forward to that Thursday." },
]

