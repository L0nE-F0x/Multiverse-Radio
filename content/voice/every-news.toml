# ── News ──────────────────────────────────────────────────────────────────────

[[clip]]
id = "news-001"
category = "news"
title = "The Thing in Your Attic"
lines = [
  { sting = "news" },
  { say = "dale", text = "Good evening, or whatever it is where you are. This is Every Possible News. I'm Dale Quarterly, and this is the news, from wherever you are.", gap = 0.7 },
  { say = "dale", text = "Our top story. Scientists in Dimension Four B have confirmed that the thing in your attic is, in fact, you, from next Tuesday." },
  { say = "dale", text = "Officials say there is no cause for alarm, and ask that you stop going up there, because you are making yourself uncomfortable.", gap = 0.7 },
  { say = "dale", text = "In economic news, the price of gravity rose sharply this afternoon, before falling, as is its nature.", gap = 0.7 },
  { say = "dale", text = "Residents across the eastern Overlap report that the moon has been looking at them. A spokesperson for the moon declined to comment, but continued looking.", gap = 0.7 },
  { say = "dale", text = "And finally. A man has been named employee of the month for the four hundredth consecutive month. He does not work here. We are looking into it.", gap = 0.8 },
  { say = "dale", text = "That's the news. More at eleven. It is always eleven." },
]

[[clip]]
id = "news-002"
category = "news"
title = "Live from the Collapse"
lines = [
  { sting = "news" },
  { say = "dale", text = "Our top story tonight: the collapse. For more, we go live to Kim Harrowgate, who is standing in it. Kim?", gap = 0.5 },
  { say = "kim", text = "Thanks, Dale. I'm here at the scene, which is also, technically, every scene." },
  { say = "kim", text = "Authorities tell me the collapse began at approximately four in the afternoon, and has since begun at several other times as well. Residents are being told to remain calm, or, failing that, to remain." },
  { say = "dale", text = "Kim, is anyone hurt?", gap = 0.4 },
  { say = "kim", text = "Dale, nobody here has the concept of hurt. It's actually very nice. A man just handed me a soup. I don't know why. I'm going to eat it." },
  { say = "dale", text = "Kim, please don't eat the soup.", gap = 0.3 },
  { say = "kim", text = "Back to you, Dale.", cut = 0.8 },
  { sfx = "zap", seconds = 0.5 },
  { pause = 0.6 },
  { say = "dale", text = "We appear to have lost Kim. Our thoughts are with the soup." },
]

[[clip]]
id = "news-003"
category = "news"
title = "Shadow Seen in Founders Park"
lines = [
  { sting = "news" },
  { say = "dale", text = "A shadow has been seen in Founders Park without a person attached. Kim Harrowgate is there now. Kim?" },
  { say = "kim", text = "Dale, I'm standing next to the bench where the shadow was last seen. It sat here most of the afternoon, feeding pigeons that weren't there." },
  { say = "kim", text = "Witnesses say it seemed calm, and a little taller than when it left home." },
  { say = "dale", text = "Do we know whose shadow it is?" },
  { say = "kim", text = "We do, Dale. It answers to Greg. It belongs to a Mister Hollis Fenn of the eastern Overlap, who has been without a shadow since a Tuesday in the spring." },
  { say = "kim", text = "Mister Fenn has asked me to say, on air, that he isn't angry. And that the porch light is on." },
  { say = "dale", text = "Has anyone tried to approach it?" },
  { say = "kim", text = "A park keeper tried, Dale. Greg simply stepped into the shade of an oak tree and was, for all practical purposes, the oak tree." },
  { say = "kim", text = "Oh. Someone has just handed me a flashlight. I don't think I should use it. Back to you." },
  { say = "dale", text = "Thank you, Kim. We've been asked to repeat that. The porch light is on." },
]

[[clip]]
id = "news-004"
category = "news"
title = "The Numbers Station Is Owed Geese"
lines = [
  { sting = "news" },
  { say = "dale", text = "The Numbers Station at one hundred and six point six has announced, once again, that it is owed geese." },
  { say = "dale", text = "It has not said by whom. It has not said how many. It has said seven, seven, four, which experts believe is either the amount, the deadline, or simply something it likes to say." },
  { say = "dale", text = "Goose farmers report record demand. Geese themselves report feeling watched." },
  { say = "dale", text = "We reached a debt counselor in the eastern Overlap." },
  { say = "expert", text = "My advice is, if you think you might owe the Numbers Station geese, you probably do. Don't send ducks. It knows the difference. It always knows the difference." },
  { say = "dale", text = "Listeners who believe they may owe geese are asked to have them ready, and to keep them calm." },
]

[[clip]]
id = "news-005"
category = "news"
title = "The Markets"
lines = [
  { sting = "news" },
  { say = "dale", text = "And now, the markets." },
  { say = "dale", text = "Tuesday futures closed slightly up, on rumors that Tuesday might actually happen this week." },
  { say = "dale", text = "The exchange rate between today and tomorrow is holding steady at one to one, though analysts warn that tomorrow is starting to look expensive." },
  { say = "dale", text = "Gravity rose, then fell. Gravity always does that. We have asked it to stop." },
  { say = "dale", text = "Shares in Grumbel's Ladders climbed. It's what they're for." },
  { say = "dale", text = "And the central bank of the Overlap has cut interest in everything to zero. The bank says it is not worried. The bank says it is mostly just bored.", gap = 0.6 },
  { say = "dale", text = "That's the markets. Hold on to something." },
