# Every Possible News — 89.3, the newsroom at the intersection of all timelines.
#
# Dale Quarterly anchors: unflappable to the point of concern. Kim Harrowgate is in the
# field, always standing in it, and people keep handing her things. Skip Daley does weather
# and traffic across all timelines and is far too cheerful about it.
#
# Running gags (shared with other stations): "It is always eleven." The polite deer on
# Interstate Zero. Greg, the shadow who left Hollis Fenn. Bev, looking for the request
# line. Teodor at Relay Four. The Numbers Station is owed geese. Sponsor: Grumbel's
# Ladders ("Up is a choice").
station = "every-news"

[voices]
dale = { voice = "bm_george", name = "Dale Quarterly" }
kim = { voice = "af_sarah", fx = "phone", name = "Kim Harrowgate" }
skip = { voice = "am_puck", speed = 1.08, name = "Skip Daley" }
# Guests and people on the street. Most come down Kim's line, so they get the phone too.
street_m = { voice = "am_eric", fx = "phone", name = "Passer-by" }
street_kid = { voice = "af_kore", fx = "kid", name = "Young Man" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
old_man = { voice = "am_santa", fx = "phone", name = "Man in the Queue" }
moon = { voice = "bm_daniel", fx = "phone", name = "Spokesperson for the Moon" }
expert = { voice = "bf_alice", fx = "phone", name = "Debt Counselor" }
doctor = { voice = "bf_emma", fx = "phone", name = "A Doctor" }
employee = { voice = "am_onyx", name = "Employee of the Month" }
ghost = { voice = "af_nicole", fx = "whisper", name = "A Ghost" }
grumbel = { voice = "am_eric", name = "Arnold Grumbel" }
librarian = { voice = "bf_lily", fx = "phone", name = "A Librarian" }
candidate = { voice = "am_michael", name = "The Candidate" }
teodor = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }
# v3: serials and the new segments.
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, a Shadow" }
manager = { voice = "bm_lewis", fx = "phone", name = "Hotel Manager" }
engineer = { voice = "af_river", fx = "phone", name = "Broadcast Engineer" }
grenda = { voice = "bf_emma", speed = 0.95, fx = "radio", name = "Grenda" }
