[[clip]]
id = "news-008"
category = "news"
title = "The Queue Reaches the Sea"
lines = [
  { sting = "news" },
  { say = "dale", text = "The queue at the Bureau of Infinite Queues has today reached the sea. Kim Harrowgate is at the back of it. Kim?" },
  { say = "kim", text = "Dale, I'm at the very end of the queue, which as of this morning is standing in about four inches of water. The queue began, as far as anyone knows, before chairs." },
  { say = "kim", text = "With me is a gentleman who has been waiting longer than most. Sir, what are you queueing for?" },
  { say = "old_man", text = "I don't remember. But I'm close. I can feel it." },
  { say = "kim", text = "How long have you been here?" },
  { say = "old_man", text = "My grandfather held my place, and his mother held his. We take turns sitting down. It's very organized." },
  { say = "kim", text = "And how's morale?" },
  { say = "old_man", text = "Oh, wonderful. You meet people. My wife was standing in front of me for thirty years before I said hello." },
  { say = "kim", text = "Dale, someone has just handed me a ticket. It says, number nine billion and four." },
  { say = "dale", text = "Hold on to that, Kim. It's a good number." },
]

