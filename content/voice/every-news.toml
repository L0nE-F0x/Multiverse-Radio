[[clip]]
id = "news-006"
category = "news"
title = "A Word from the Moon"
lines = [
  { sting = "news" },
  { say = "dale", text = "Residents across all timelines continue to report that the moon is looking at them. Tonight, for the first time, the moon has sent a spokesperson. He joins us by phone." },
  { say = "moon", text = "Thank you, Dale. I'd like to begin by saying that the moon is not looking at you." },
  { say = "dale", text = "Then what is it doing?" },
  { say = "moon", text = "The moon is looking near you. There's a difference." },
  { say = "dale", text = "Many listeners say they can feel it." },
  { say = "moon", text = "The moon has a lot of feelings, Dale. Some of them land on people. It isn't personal. It's tidal." },
  { say = "dale", text = "Does the moon have a message for our listeners?" },
  { say = "moon", text = "It does. The moon says, sleep well. The moon says, you look nice from up here. The moon says, close your curtains if you'd like, but it will know.", gap = 0.8 },
  { say = "dale", text = "That was a spokesperson for the moon. The moon continues to look near you." },
]

