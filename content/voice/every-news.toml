# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "teodor-is-heard-01"
category = "story"
serial = { id = "teodor-is-heard", episode = 1 }
title = "Teodor Is Heard, Part One: The Receiver"
lines = [
  { sting = "news" },
  { say = "dale", text = "Night four thousand and one at Relay Four, and tonight, at last, an explanation." },
  { say = "dale", text = "Engineers at the Multiverse Broadcast Authority have examined the signal from the relay at the far edge of the dial. Teodor's transmitter is in perfect working order. It is his receiver that is broken." },
  { say = "dale", text = "It failed in a storm, eleven years ago. Since then, Teodor has been able to ask, but not to hear. Every yes said to him in eleven years has gone nowhere.", gap = 0.8 },
  { say = "dale", text = "Kim Harrowgate is at the Authority. Kim?" },
  { say = "kim", text = "Dale, I'm with an engineer who has listened to Relay Four every night for a decade." },
  { say = "engineer", text = "The signal's beautiful. You can hear his kettle. He puts it on every time he asks, in case somebody comes round." },
  { say = "kim", text = "Can his receiver be fixed?" },
  { say = "engineer", text = "Not from here. Somebody would have to get a yes through the hard way. Louder, or closer, or stranger." },
  { say = "kim", text = "Dale, someone's just handed me a piece of paper. It just says, yes. People have been leaving them on the doorstep here for years. There are thousands.", gap = 0.8 },
  { say = "dale", text = "We'll keep trying, then. Teodor, if you're listening, and you are. Yes." },
  { sfx = "beep" },
  { say = "teodor", text = "Is anyone receiving this. This is Relay Four. The kettle's on." },
  { say = "dale", text = "We know, Teodor. We know." },
]

[[clip]]
id = "bev-gets-her-song-02"
category = "story"
serial = { id = "bev-gets-her-song", episode = 2 }
title = "Bev Gets Her Song, Part Two: Lift Number Two"
lines = [
  { sting = "news" },
  { say = "dale", text = "A woman who has spent eleven years looking for a song has asked us for help. Her name is Bev. She heard it once, in a lift. Kim Harrowgate is in the lift. Kim?" },
  { say = "kim", text = "Dale, I'm in lift number two at the Grand Overlap Hotel, which has been out of order for eleven years. Someone has just handed me the out of order sign. With me is the manager." },
  { say = "manager", text = "It was a lovely lift. It had carpet. It had a little seat. It had the music." },
  { say = "kim", text = "Where did the music come from?" },
  { say = "manager", text = "Down the line from Relay Four, like every lift in the Overlap. Requests, birthdays, a little flute in the afternoons. Then one spring night the line went quiet, and every lift went silent at once." },
  { say = "kim", text = "Eleven years ago?" },
  { say = "manager", text = "Eleven years ago." },
  { say = "dale", text = "Kim, is Bev there?" },
  { say = "bev", text = "I'm here, love. In the corner. This is the one. Between floors four and five. Three hours we were stuck in here, me and my Stan." },
  { say = "kim", text = "Bev, did you know the music came from Relay Four?" },
  { say = "bev", text = "Relay Four? Isn't that the man who keeps asking if anyone can hear him?", gap = 0.8 },
  { say = "dale", text = "It is. Teodor, if you're listening, a lady would like a word. Back to you, Kim." },
  { say = "kim", text = "I'm handing this sign back, Dale. Out of order. Hopefully not for much longer." },
]

[[clip]]
id = "greg-comes-home-10"
category = "story"
serial = { id = "greg-comes-home", episode = 10 }
title = "Greg Comes Home, Part Ten: The Long Bridge"
bed = "wind"
lines = [
  { sting = "news" },
  { say = "dale", text = "A shadow has been sighted on the long bridge into the eastern Overlap, heading east at about four in the afternoon. Kim Harrowgate is on the bridge. Kim?" },
  { say = "kim", text = "Dale, I'm halfway across, and so is he. At this time of day he's about forty feet long, so he's technically on both banks at once." },
  { say = "dale", text = "Is it Greg?" },
  { say = "kim", text = "It's Greg. He's let me walk beside him, as long as I don't stand in his light. Greg, why so slowly?" },
  { say = "greg", text = "I want to get there at noon. He stands in the sun at noon. So there's room." },
  { say = "kim", text = "Greg, it's four o'clock. That's twenty hours." },
  { say = "greg", text = "I was behind him for forty one years. I can wait twenty hours in front.", gap = 1.0 },
  { say = "kim", text = "Dale, the sun's going down. He's getting thinner. I can barely see him." },
  { say = "greg", text = "I can't walk in the dark. Nobody tells you that, about being a shadow." },
  { say = "kim", text = "Somebody has just handed me a flashlight. Dale, the last time I was handed a flashlight near Greg, I didn't use it." },
  { say = "dale", text = "Use it, Kim.", gap = 1.0 },
  { say = "kim", text = "He's back. He's very long. He's pointing straight down the road into the eastern Overlap." },
  { say = "greg", text = "Could you walk with me? Just to the end of the bridge?" },
  { say = "kim", text = "Dale, I'm going to walk a shadow home.", gap = 0.8 },
  { say = "dale", text = "Take as long as you need, Kim. The porch light is on. And for the next mile or so, so is Kim." },
]

