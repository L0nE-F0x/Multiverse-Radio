[[clip]]
id = "news-012"
category = "news"
title = "Vox Pop: The End of the World"
lines = [
  { sting = "news" },
  { say = "dale", text = "With the end of the world scheduled, once again, for later this week, we sent Kim Harrowgate out to ask people how they feel about it. Kim?" },
  { say = "kim", text = "Thanks, Dale. I'm on the high street. Sir, how do you feel about the end of the world?" },
  { say = "street_m", text = "Which one?" },
  { say = "kim", text = "The one on Thursday." },
  { say = "street_m", text = "Oh, that one. I'm against it. I've got a dentist appointment on Friday and I'd like to cancel it myself." },
  { say = "kim", text = "Thank you. Ma'am? How do you feel about the end of the world?" },
  { say = "bev", text = "Is this the request line?" },
  { say = "kim", text = "No, ma'am, it's the news." },
  { say = "bev", text = "Oh. Well, while I have you. It goes dum, dum, da dum. And then a man cries." },
  { say = "kim", text = "I don't think I know that one." },
  { say = "bev", text = "Nobody does, dear. That's the problem." },
  { say = "kim", text = "And you, young man?" },
  { say = "street_kid", text = "I think it'll be fine. It always ends on a Thursday, and then on Friday it's still there." },
  { say = "kim", text = "There you have it, Dale. Cautious optimism, and a song." },
]

