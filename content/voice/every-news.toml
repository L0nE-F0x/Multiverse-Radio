event = "convergence"
kit = "the-knock"
lines = [
  { say = "dale", text = "There has been a knock at the newsroom door. Three knocks. We have checked. There is nobody there." },
  { say = "dale", text = "Stations across the dial report the same. The door has been asked to comment. It has declined." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
title = "The Convergence: A Colour With No Name"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "dale", text = "For a few seconds, the sky was a colour our science desk cannot name. Kim?" },
  { say = "kim", text = "Dale, it was like... I haven't got it. Somebody's just handed me a paint chart. It's none of these." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
title = "The Convergence: The Pigeon"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "dale", text = "A pigeon has walked into the newsroom. Sources say the same pigeon is in every studio on the dial." },
  { say = "dale", text = "It has nodded at me twice, as if we went to school together. We did not. More at eleven." },
]


# ── v4: Monday review of The Quiet Corner with Greg (92.6, Sundays at two) ──

[[clip]]
id = "quiet-corner-review"
category = "dj"
title = "Review: The Quiet Corner with Greg"
days = [1]
lines = [
  { say = "dale", text = "Arts. Early on Sunday morning, the Lounge at the End of Time broadcast the first Quiet Corner with Greg, a shadow. Our critic listened at full volume, with the windows shut." },
  { say = "dale", text = "Her review reads, in full: bold, spare, I think he said hello. Four stars." },
