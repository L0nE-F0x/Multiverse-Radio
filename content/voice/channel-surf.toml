[[clip]]
id = "show-003"
category = "show"
title = "Daytime"
daypart = "day"
lines = [
  { sfx = "zap" },
  { say = "judge", text = "The defendant is charged with three counts of being emotionally unavailable to a houseplant. How do you plead?" },
  { say = "defendant", text = "It's a fern, your honor. It never asked.", cut = 0.93 },
  { sfx = "zap" },
  { say = "fitness", text = "And reach! Reach up! Reach for a shelf in a different reality! Grab whatever's on it! Don't look at it! Put it in your pocket! And breathe!" },
  { sfx = "zap" },
