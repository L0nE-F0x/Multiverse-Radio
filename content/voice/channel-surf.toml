  { sfx = "zap" },
  { say = "fitness", text = "And reach! Reach up! Reach for a shelf in a different reality! Grab whatever's on it! Don't look at it! Put it in your pocket! And breathe!" },
  { sfx = "zap" },
  { say = "chef", text = "Now pop that in the oven at a low heat, for about four hundred years, or until golden. And here's one I made earlier. Much earlier." },
  { sfx = "zap" },
