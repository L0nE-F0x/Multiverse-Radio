# Channel Surf — 103.0, the couch at the center of everything.
#
# There is no host. Somebody is holding the remote, and they will not stop pressing it.
# Every clip is a channel-flipping collage: { sfx = "zap" } between fragments, and `cut`
# to chop a line off mid-sentence. The main joke engine is juxtaposition: one channel
# asks, the next channel accidentally answers.
#
# Recurring channels: Tidewater Manor (soap: Lorraine and Vincent, who went to get milk),
# the Everything Channel (shopping: Trent and Darlene, currently selling a single stair),
# Chef Ingrid (recipes that take centuries), a nature narrator, Professor Pockets and
# Little Nothing (kids' TV), Judge Wexley, the For the Car game show (Bev is the
# returning champion). Someone on the Couch occasionally says something.
station = "channel-surf"

[voices]
surf = { voice = "am_michael", name = "Channel Surf" }
couch = { voice = "am_echo", speed = 0.95, name = "Someone on the Couch" }
