[[clip]]
id = "show-009"
category = "show"
title = "History and Mystery"
lines = [
  { sfx = "zap" },
  { say = "history", text = "In the year of the long Tuesday, the spoon had not yet been invented. People ate soup by looking at it very hard." },
  { sfx = "zap" },
  { say = "lieutenant", text = "Captain, we've found a planet made entirely of spoons." },
  { say = "captain", text = "Is it inhabited?" },
  { say = "lieutenant", text = "Only by soup, sir.", cut = 0.9 },
  { sfx = "zap" },
  { say = "antiques", text = "Now, this vase is quite remarkable. Where did you get it?" },
  { say = "owner", text = "From my grandfather's grandson." },
  { say = "antiques", text = "That's you." },
  { say = "owner", text = "It is me, yes. I bought it on Tuesday.", cut = 0.93 },
  { sfx = "zap" },
  { say = "trailer", text = "This autumn. A detective. A missing sock. And a dryer that knows too much." },
  { sfx = "zap" },
  { say = "nature", text = "The sock, during its great migration, leaves its partner behind and travels alone to a warmer dimension. Nobody knows why. The sock does not look back." },
  { sfx = "zap" },
  { say = "history", text = "And that is why, to this day, nobody in the Overlap fully trusts a dryer." },
  { sfx = "zap" },
]

