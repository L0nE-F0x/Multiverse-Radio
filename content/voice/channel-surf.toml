  { say = "contestant", text = "Is there a D in it?", cut = 0.9 },
  { sfx = "zap" },
  { say = "nature", text = "And here, at the back of the fridge, a jar of something, untouched for many years. It has developed its own customs." },
  { sfx = "zap" },
]

[[clip]]
id = "show-004"
category = "show"
title = "The Everything Channel"
lines = [
  { sfx = "zap" },
