  { say = "judge", text = "The witness will describe the man she saw." },
  { say = "witness", text = "He was average height, average build, and he had the face of somebody who'd just remembered he left the oven on." },
  { say = "judge", text = "That's everyone, madam.", cut = 0.9 },
  { sfx = "zap" },
  { say = "nature", text = "The common oven, left on, will wait for its owner for many hours, quietly, warmly, and without resentment." },
  { sfx = "zap" },
  { say = "detective", text = "We've got a body. Rectangular. Chrome. Four slots. Somebody unplugged it." },
  { sfx = "zap" },
  { say = "judge", text = "This court finds the defendant not guilty, but a little bit weird. Case dismissed." },
  { sfx = "gong" },
  { sfx = "zap" },
]

