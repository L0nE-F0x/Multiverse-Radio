# ══ v4: The Quiet Corner with Greg ═══════════════════════════════════════════
#
# Sundays, 02:00-03:00 local. Greg, the shadow at the end of the bar, gets a show. He
# speaks so softly that nobody can hear it (whisper fx; the director should air his clips
# well under the music). If you strain, it's very sweet. On Mondays, hosts elsewhere on the
# dial review it. Last Call now runs midnight to two, so the shows don't overlap.

[[show]]
id = "the-quiet-corner"
name = "The Quiet Corner with Greg"
blurb = "Sundays, two till three. Greg, a shadow, says a few things very softly from the end of the bar. Lean in."
start = 2
end = 3
host = "Greg, a Shadow"
days = [0]

[[clip]]
