  { say = "gilbert", text = "I am not.", gap = 0.6 },
  { say = "host", text = "He is." },
]

[[clip]]
id = "dj-004"
category = "dj"
lines = [
  { say = "host", text = "To the gentleman in booth four: your tab is still open. It has been open since the formation of the first galaxies. We don't mind in the least." },
  { say = "host", text = "We simply think it's worth mentioning, as the galaxies are now leaving." },
]

[[clip]]
id = "dj-005"
category = "dj"
lines = [
  { say = "host", text = "The microphone on our little stage is empty tonight, as it is every night. We keep the spotlight on, just in case. Someone might come. Someone always might come." },
  { say = "host", text = "Until then, here's a real heartbreaker." },
]

[[clip]]
id = "dj-006"
category = "dj"
