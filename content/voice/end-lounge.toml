# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-08"
category = "story"
serial = { id = "greg-comes-home", episode = 8 }
title = "Greg Comes Home, Part Eight: Last Call"
bed = "room"
lines = [
  { say = "host", text = "The shadow at the end of the bar is back. Greg. A dry ginger, Gilbert." },
  { say = "gilbert", text = "Already poured." },
  { say = "host", text = "You're on your way home, I'm told. The whole dial's talking about it.", gap = 0.6 },
  { say = "greg", text = "I'm losing my nerve, Barnaby." },
  { say = "host", text = "Well, you've come to the right place. Everybody here lost theirs eons ago. We keep them behind the bar.", gap = 0.8 },
  { say = "greg", text = "What if he's got a new one? There's a man on the radio who sells replacement shadows. A ballroom dancer. A basketball player." },
  { say = "host", text = "Darling. A man doesn't leave the porch light on for a basketball player.", gap = 1.2 },
  { say = "greg", text = "What if I've been gone too long?" },
  { say = "gilbert", text = "Eleven billion years of last calls. Nobody has ever regretted going home.", gap = 1.0 },
  { say = "host", text = "That's the most Gilbert has said in a century. I'd listen to him." },
  { say = "greg", text = "Can I pay my tab?" },
  { say = "gilbert", text = "Paid." },
  { say = "host", text = "Paid? By whom?" },
  { say = "gilbert", text = "The gentleman in booth four." },
  { say = "host", text = "Booth four has never paid for anything. Not since the first galaxies." },
  { say = "gilbert", text = "He says, for the lad going home.", gap = 1.2 },
  { say = "host", text = "Then go, darling. Go before the next song. It's a real heartbreaker, and you'll only stay to hear it." },
  { say = "greg", text = "Thank you, Barnaby. Thank you, Gilbert.", gap = 1.2 },
  { say = "host", text = "Goodnight, Greg. Here's a real heartbreaker. For everyone who's still deciding." },
]

[[clip]]
id = "bev-gets-her-song-08"
category = "story"
serial = { id = "bev-gets-her-song", episode = 8 }
title = "Bev Gets Her Song, Part Eight: The Space After the Third Note"
bed = "room"
lines = [
  { sfx = "phone-ring" },
  { say = "host", text = "A call in the last booth. Bev, darling. I hear you've got the whole tune now." },
  { say = "bev", text = "Both halves, love. The void gave me the second bit. But it still hasn't got a name, and nobody can play it for me." },
  { say = "host", text = "Bev, the microphone on our little stage has been empty for eleven billion years. The spotlight's always on. It's been waiting for someone.", gap = 0.8 },
  { say = "host", text = "Would you sing it for us?" },
  { say = "bev", text = "Oh, I couldn't." },
  { say = "gilbert", text = "You could." },
  { say = "host", text = "Gilbert has spoken. Go on, darling." },
  { say = "bev", text = "Dum. Dum. Da dum.", speed = 0.75, gap = 2.4 },
  { say = "bev", text = "I'm sorry. I'm sorry, love. I can't do the next bit. I've gone.", gap = 1.4 },
  { say = "bev", text = "Oh.", gap = 1.0 },
  { say = "bev", text = "Oh, that's why he cried. It isn't the song. It's the gap. There's a little gap after the third note, and you have to wait in it, and you don't know what's coming next.", gap = 1.0 },
  { say = "host", text = "And that's where he was." },
  { say = "bev", text = "That's where he was. Every time.", gap = 1.6 },
  { say = "host", text = "Bev. That is a real heartbreaker. And I have never meant it more." },
  { say = "gilbert", text = "Ice?" },
  { say = "bev", text = "Go on, then, love." },
]

