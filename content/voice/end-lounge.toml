# The Lounge at the End of Time — Barnaby Velvet, last booth, Heat Death Boulevard.
# Running bits: every song is "a real heartbreaker" (and he means it), last call for
# eleven billion years, the open tab, stars going out through the big window, the empty
# microphone, Gilbert the octopus bartender. Greg drinks here.
station = "end-lounge"

[voices]
host = { voice = "bm_fable", speed = 0.88, name = "Barnaby Velvet" }
gilbert = { voice = "bm_lewis", speed = 0.95, name = "Gilbert (Bartender)" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
# v3: serial.
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, a Shadow" }

