show = "the-quiet-corner"
lines = [
  { say = "greg", text = "Hollis left the porch light on for eleven years. For me.", speed = 0.9, gap = 1.2 },
  { say = "greg", text = "I've been thinking about what I could leave on, for somebody else.", speed = 0.9, gap = 1.6 },
  { say = "greg", text = "So. There's a light on, in the corner. It's very small. It's yours. You don't have to come in. It's just on.", speed = 0.9, gap = 1.2 },
]

[[clip]]
id = "the-quiet-corner-03"
category = "dj"
show = "the-quiet-corner"
lines = [
  { say = "greg", text = "Something I know, from being a shadow.", speed = 0.9, gap = 1.2 },
  { say = "greg", text = "You're never really on your own. There's always something near you, keeping your shape.", speed = 0.9, gap = 1.6 },
  { say = "greg", text = "Even at night. Especially at night. That's when we're everywhere.", speed = 0.9, gap = 1.2 },
]

[[clip]]
id = "the-quiet-corner-04"
category = "dj"
show = "the-quiet-corner"
lines = [
  { say = "greg", text = "Gilbert asked what I'd like to play. I said, something you have to lean in for.", speed = 0.9, gap = 1.2 },
  { say = "greg", text = "He said, at the end of time, everything is something you have to lean in for.", speed = 0.9, gap = 1.6 },
  { say = "greg", text = "He's right. So. Lean in. This one's soft.", speed = 0.9, gap = 1.2 },
]

[[clip]]
id = "the-quiet-corner-05"
category = "dj"
show = "the-quiet-corner"
lines = [
  { say = "greg", text = "News from home. Hollis and I walked to the shops on Tuesday.", speed = 0.9, gap = 1.2 },
  { say = "greg", text = "At about four in the afternoon, I was very long. Right across the road. He said I looked tall.", speed = 0.9, gap = 1.6 },
  { say = "greg", text = "It's the nicest thing anybody has ever said to me. I wanted to tell someone.", speed = 0.9, gap = 1.2 },
]

[[clip]]
id = "the-quiet-corner-06"
category = "dj"
show = "the-quiet-corner"
lines = [
  { say = "greg", text = "If you're the only one still listening, thank you.", speed = 0.9, gap = 1.2 },
  { say = "greg", text = "I know it's hard to hear me. I'm not very good at loud.", speed = 0.9, gap = 1.6 },
  { say = "greg", text = "But I'm very good at staying. I'll be here till three. Then I'll walk you to the door.", speed = 0.9, gap = 1.2 },
]

[[clip]]
id = "the-quiet-corner-07"
category = "dj"
show = "the-quiet-corner"
lines = [
  { say = "greg", text = "A message for the operator on the Nightjar.", speed = 0.9, gap = 1.2 },
  { say = "greg", text = "You keep a light on for a lot of people, out there. Somebody should keep one on for you.", speed = 0.9, gap = 1.6 },
  { say = "greg", text = "So I have. It's the little one, by the door. Goodnight, operator.", speed = 0.9, gap = 1.2 },
]

[[clip]]
id = "the-quiet-corner-close"
category = "id"
title = "The Quiet Corner with Greg"
part = "close"
show = "the-quiet-corner"
lines = [
  { say = "host", text = "That was The Quiet Corner, with Greg. I didn't catch a single word, darling, and I've never been so moved." },
  { say = "gilbert", text = "He tipped well." },
  { say = "host", text = "Same time next Sunday." },
]
