kit = "count"
part = "body"
lines = [
  { say = "host", text = "Hour three million, four hundred and six thousand, and twelve. Still Saturday." },
  { say = "host", text = "The ice in my lemonade has started to think about melting. Only thinking. I'll keep you posted." },
]

[[clip]]
id = "count-002"
category = "dj"
kit = "count"
part = "body"
lines = [
  { say = "host", text = "We have now been dancing for three million, four hundred thousand hours. That's about three hundred and eighty years, give or take a slow song." },
  { say = "host", text = "And nobody in this room looks a day over Saturday." },
]

[[clip]]
