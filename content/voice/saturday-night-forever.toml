# Saturday Night Forever — 108.4, the Starlite Rollerdrome, Saturday night, 1977, still.
#
# Donna Midnight hosts: warm, glamorous, endlessly patient. One Saturday night never ended
# and she counts its hours with pride (somewhere past three million, four hundred thousand).
# The crowd stopped asking what time it is long ago. Rollo is the rink guard with the whistle.
#
# Running bits: the clock over the rink with no hands (voted off in hour forty); the conga
# line that left in hour nine hundred and is still out there; Brenda and Lou's first date,
# which started in hour six; Sunday, which nobody believes in; the snack bar's one hot dog.
# The `count` kit chains Donna's time check, one to three hour counts and a sign-off.
# Cross-station: Bev and the request line, Grumbel's Ladders, Greg's show (Monday review).
# Resident artists in src/content/packs/v4a.ts (Velveteen Moss, the Midnight Hustle Orchestra...).
station = "saturday-night-forever"

[voices]
host = { voice = "af_bella", speed = 1.0, name = "Donna Midnight" }
rollo = { voice = "am_puck", speed = 1.0, name = "Rollo, the Rink Guard" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
announcer = { voice = "am_michael", speed = 1.05, name = "Announcer" }
grumbel = { voice = "am_eric", name = "Arnold Grumbel" }

[[show]]
id = "the-hustle-hour"
name = "The Hustle Hour"
blurb = "Peak time on the rink. Line dances, hustle lessons and a crowd that last looked at a clock in 1977."
start = 21
end = 24

[[show]]
id = "couples-skate"
name = "Couples Skate"
blurb = "Lights down, slow songs, and the mirror ball turning just for two. Counter-clockwise, please."
start = 0
end = 3

[[show]]
id = "breakfast-at-the-rink"
name = "Breakfast at the Rink"
blurb = "The morning show from a night that never ended. Pancakes at the snack bar, under the mirror ball."
start = 7
end = 10

