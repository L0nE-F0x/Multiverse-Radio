# ══ v4: The Convergence ═══════════════════════════════════════════════════════
#
# Saturdays, 20:00 UTC: every station notices the same thing. One reaction per topic
# (SCHEMA.md, "The Convergence"); the director airs the _events open, then the tuned
# station's reaction, then the close.

[[clip]]
id = "convergence-missing-moon"
category = "event"
title = "The Convergence: A Moon Goes Missing"
event = "convergence"
kit = "missing-moon"
lines = [
  { say = "host", text = "Word on the dial. A moon gone missing." },
  { say = "host", text = "Not this one. I'm standing on it." },
  { say = "echo", text = "Standing on it." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
title = "The Convergence: Toast, Everywhere"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "host", text = "Smell of toast. Everywhere. Even up here." },
  { say = "host", text = "No air on the moon. Still smell it. Heavy." },
  { say = "echo", text = "Heavy." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
title = "The Convergence: The Song Nobody Can Finish"
event = "convergence"
kit = "the-song"
lines = [
  { say = "host", text = "Everybody's got the same tune. Nobody's got the end." },
  { say = "host", text = "So dub it. Take the end out. Nobody notices." },
  { say = "echo", text = "Nobody notices." },
]

[[clip]]
id = "convergence-the-knock"
category = "event"
title = "The Convergence: Three Knocks"
event = "convergence"
kit = "the-knock"
lines = [
  { say = "host", text = "Three knocks on the airlock." },
  { say = "host", text = "Nobody out there. Nobody's ever out there. Respect." },
  { say = "echo", text = "Respect." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
title = "The Convergence: A Colour With No Name"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "host", text = "Earth just went a colour. Not blue. Not green. Something else." },
  { say = "host", text = "Pointed the stack at it. Bass, four hundred percent. It went back to blue." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
title = "The Convergence: The Pigeon"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "host", text = "A pigeon. On the moon. Walked in through the airlock." },
  { say = "host", text = "Nodded at me like it knew the tune. Respect, pigeon." },
  { say = "echo", text = "Respect, pigeon." },
]
