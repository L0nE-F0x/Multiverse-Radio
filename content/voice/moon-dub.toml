# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-03"
category = "story"
serial = { id = "greg-comes-home", episode = 3 }
title = "Greg Comes Home, Part Three: A Ride on the Moonlight"
bed = "space"
lines = [
  { say = "host", text = "Shadow came down off a comet this morning. Landed soft. Low gravity.", gap = 1.0 },
  { say = "host", text = "Greg. Back again. Sound guy.", gap = 0.8 },
  { say = "greg", text = "Just passing through. I'm going home." },
  { say = "host", text = "Respect.", gap = 1.2 },
  { say = "greg", text = "I'm very sharp up here." },
  { say = "host", text = "No air. Nothing to blur you. Sharpest you'll ever be.", gap = 1.0 },
  { say = "greg", text = "Can I send a message? To Hollis? On the echo?" },
  { say = "host", text = "Say it into the stack. It'll go down to Earth, and come back. Eleven seconds.", gap = 0.8 },
  { say = "greg", text = "Hollis. It's me. I'm coming home.", gap = 1.2 },
  { say = "greg", text = "How do I get down from here? There's no ladder long enough." },
  { say = "host", text = "Grumbel's would disagree.", gap = 1.0 },
  { say = "host", text = "No. You go the old way. Moonlight. Every night the moon throws light down to Earth. Shadows have been riding it forever. Nobody checks tickets.", gap = 1.0 },
  { say = "greg", text = "Where does it land?" },
  { say = "host", text = "Tonight? Precinct Nine. One gap in the clouds all year, and it's tonight. That's luck.", gap = 1.2 },
  { say = "greg", text = "Coming home.", fx = "cave", name = "Echo", gap = 1.0 },
  { say = "host", text = "There it is. Echo came back.", gap = 0.8 },
  { say = "host", text = "Earth heard you, Greg." },
  { say = "greg", text = "One more tune before I go?" },
  { say = "host", text = "One more tune.", gap = 1.4 },
  { say = "echo", text = "One more tune." },
]

[[clip]]
id = "teodor-is-heard-03"
category = "story"
serial = { id = "teodor-is-heard", episode = 3 }
title = "Teodor Is Heard, Part Three: The Moon Says Yes"
bed = "space"
lines = [
  { say = "host", text = "Long-range set. Faint.", gap = 1.0 },
  { say = "relay4", text = "Is anyone receiving this. This is Relay Four.", gap = 1.2 },
  { say = "host", text = "Moon hears you, Teodor. Always has.", gap = 1.0 },
  { say = "host", text = "But his receiver's broke. News said so. He talks out. Nothing comes in.", gap = 1.2 },
  { say = "host", text = "So. Turn the stack round. Point it at the edge of the dial. All of it.", gap = 1.0 },
  { say = "host", text = "Bass travels. Bass goes through walls. Bass goes through broken things.", gap = 1.0 },
  { say = "host", text = "Everybody on the crater. On three. One. Two.", gap = 0.8 },
  { say = "host", text = "Yes.", speed = 0.75, gap = 2.0 },
  { say = "host", text = "Eleven seconds. Wait for it.", gap = 3.0 },
  { say = "relay4", text = "Relay Four. Night four thousand and nine. Something strange. Just now I heard a voice. Very deep. Very far away.", gap = 1.0 },
  { say = "relay4", text = "It said yes.", gap = 1.2 },
  { say = "relay4", text = "Either that was the moon, or I'm coming down with something.", gap = 1.2 },
  { say = "host", text = "That was the moon, Teodor.", gap = 1.4 },
  { say = "echo", text = "The moon." },
]

