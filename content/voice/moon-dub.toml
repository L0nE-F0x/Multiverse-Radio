# Moon Dub Sound System — Selector Crater, Tranquility Base Annex.
# Says very little, means all of it. Every shout-out echoes back eleven seconds later,
# which in practice means echoes turn up in the wrong clip, out of context.
station = "moon-dub"

[voices]
host = { voice = "am_fenrir", speed = 0.92, name = "Selector Crater" }
echo = { voice = "am_fenrir", speed = 0.92, fx = "cave", name = "Echo" }
teodor = { voice = "am_eric", speed = 0.9, fx = "radio", name = "Faint voice" }
# v3: serials. (relay4 matches Teodor's voice on the other stations.)
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, a Shadow" }
relay4 = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }

