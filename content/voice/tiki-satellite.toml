# Tiki Satellite — 112.0 ("one hundred and twelve megacycles"), the Lagoon Deck of Orbital
# Station Seven, the space station of tomorrow as imagined in 1958. It still believes it's 1958.
#
# Lyle Mercury hosts: smooth, courteous, sunny, puzzled by nothing, and completely sure that
# by 1965 every family will live in orbit. The relief crew is expected any day now. The house
# band are the Orbiteers: Miss Vera Voss on theremin (plays without touching anything, which the
# engineers find reassuring), and Howard on the bird calls (there are no birds in orbit).
#
# Running bits: a sunrise every ninety minutes (sixteen a day, toasted every one); a lagoon that
# goes round the wheel; predictions for the wonderful world of 1965, read with total
# confidence; retro-future ads (Halcyon Atomics, the Floating Pineapple). Cross-station: Greg
# the shadow, Grumbel's Ladders. Resident artists in src/content/packs/v4b.ts.
station = "tiki-satellite"

[voices]
host = { voice = "am_michael", speed = 0.98, name = "Lyle Mercury" }

[[show]]
id = "breakfast-in-orbit"
name = "Breakfast in Orbit"
blurb = "The breakfast pill, a sunrise every ninety minutes, and a little vibraphone to start the day of tomorrow."
start = 7
end = 10

[[show]]
id = "cocktail-hour"
name = "The Cocktail Hour of Tomorrow"
blurb = "Zero-gravity cocktails on the Lagoon Deck. Hold your drink with both hands. It will try to leave."
start = 17
end = 20

[[show]]
id = "moonlight-lagoon"
name = "Moonlight on the Lagoon Deck"
blurb = "The lagoon goes round the wheel, the moon goes round the Earth, and the theremin goes round the room."
start = 22
end = 2

