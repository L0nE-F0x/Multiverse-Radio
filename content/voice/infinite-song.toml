[[clip]]
id = "call-001"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "marek", text = "Hi, Ambrose. I'm on verse four million and ninety. I fell asleep around verse eighty, and I'm catching up." },
  { say = "ambrose", text = "Not to worry. The song waits for no one, but it does repeat itself a bit. You'll have caught up by Thursday." },
]

[[clip]]
id = "call-002"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "gwen", text = "My grandmother's grandmother's grandmother heard verse one. She always said it was about a boat." },
  { say = "ambrose", text = "A lot of people's grandmothers say that. The archive is unclear. There's definitely a boat by verse eleven. Before that, it's mostly someone tuning up." },
]

[[clip]]
id = "call-003"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "hopeful", text = "Is the chorus coming back? I've been told there's a chorus." },
  { say = "ambrose", text = "There is a chorus. It was last heard in verse nine hundred thousand and six. Experts believe it's due.", gap = 0.6 },
  { say = "ambrose", text = "Experts have believed that for some time." },
]

[[clip]]
id = "call-004"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "drummer", text = "My band wants to cover it. How long have we got?" },
  { say = "ambrose", text = "How long have any of us got, really? Start at the first verse. Let us know how you get on.", gap = 0.6 },
  { say = "ambrose", text = "Or your grandchildren can." },
]

[[clip]]
id = "call-005"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "teodor", text = "Can anyone hear me? This is Teodor. Relay Four." },
  { say = "ambrose", text = "We can hear you, Teodor. Which verse are you on?" },
  { say = "teodor", text = "Two thousand and six. The signal is very slow out here." },
  { say = "ambrose", text = "Then you've a lovely few million ahead of you, Teodor. Don't skip anything." },
]

[[clip]]
id = "call-006"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "bev", text = "Hello, love. Is this the request line?" },
  { say = "ambrose", text = "It is, Bev. Though we only have the one song." },
  { say = "bev", text = "Oh, that's all right. Could you play it?" },
  { say = "ambrose", text = "We're playing it now, Bev." },
  { say = "bev", text = "Lovely. I'll wait for my bit." },
]

[[clip]]
id = "call-007"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "lionel", text = "Ambrose, I think you've miscounted. I make it verse four million, one hundred and eleven." },
  { say = "ambrose", text = "Do you. Well. I've been counting since I was six." },
  { say = "lionel", text = "So have I." },
  { pause = 1.5 },
  { say = "ambrose", text = "Let's call it a hundred and eleven and a half, Lionel." },
]

[[clip]]
id = "call-008"
category = "call"
kit = "calls"
part = "body"
lines = [
  { say = "toby", text = "Mister Long, what happens at the end?" },
  { say = "ambrose", text = "Nobody knows, Toby. Some people think it never ends. Some think it ends and starts again." },
  { say = "ambrose", text = "I think it ends when the last person stops listening. So I try never to stop." },
]

