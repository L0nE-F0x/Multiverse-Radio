# The Infinite Song — 105.4, the stage where it started.
#
# One song, playing since the beginning of time. Ambrose Long has counted the verses since
# he was six and is mostly sure of the number (verse four million, one hundred and twelve,
# give or take). The band are very old; their beards are out of the stage door. Old
# Wendeline keeps the beat. The chorus was last heard at verse nine hundred thousand and six
# and is believed to be due. There is a boat in most verses. Callers ring in to say which
# verse they're on.
#
# The `calls` kit chains Ambrose picking up, one to three callers and back to the song.
station = "infinite-song"

[voices]
ambrose = { voice = "am_eric", speed = 0.95, name = "Ambrose Long" }
marek = { voice = "am_michael", fx = "phone", name = "Marek, Catching Up" }
gwen = { voice = "bf_lily", fx = "phone", name = "Gwendolyn, Third Generation" }
hopeful = { voice = "af_river", fx = "phone", name = "A Caller Waiting for the Chorus" }
drummer = { voice = "am_puck", fx = "phone", name = "A Drummer in a Young Band" }
teodor = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
lionel = { voice = "am_santa", fx = "phone", name = "Lionel, Also Counting" }
toby = { voice = "am_puck", fx = "kid", name = "Toby, Aged Nine" }
shower = { voice = "af_kore", fx = "phone", name = "A Listener in the Overlap" }
listener = { voice = "af_sarah", fx = "phone", name = "A Caller With Good Ears" }
ephraim = { voice = "am_onyx", fx = "ghost", name = "Ephraim, Backing Vocals" }

[[show]]
id = "morning-verse"
name = "The Morning Verse"
blurb = "Where the song has got to, for people just waking up. You've missed a lot. It's fine."
start = 6
end = 9

[[show]]
id = "chorus-watch"
name = "Chorus Watch"
blurb = "Listeners report signs of the chorus. It's due. It has been due for some time."
start = 15
end = 18

[[show]]
id = "night-verses"
name = "The Night Verses"
blurb = "Ambrose counts the overnight verses under his breath, so as not to lose his place."
start = 0
end = 5

