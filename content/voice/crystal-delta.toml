# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "teodor-is-heard-09"
category = "story"
serial = { id = "teodor-is-heard", episode = 9 }
title = "Teodor Is Heard, Part Nine: A Crystal for Relay Four"
bed = "cave-drip"
lines = [
  { say = "miner", text = "Found one." },
  { say = "host", text = "The tiny miner has found a crystal.", gap = 0.3 },
  { say = "refract", text = "The crystal has found a tiny miner." },
  { say = "miner", text = "It hums. At Relay Four.", gap = 1.0 },
  { say = "host", text = "He's right. Listen. I'm holding it up to the microphone.", gap = 1.4 },
  { say = "teodor", text = "Is anyone receiving this. Relay Four.", gap = 1.2 },
  { say = "host", text = "It's picking him up all on its own. No wires. No power. Just a little stone that wants to listen.", gap = 0.3 },
  { say = "refract", text = "Just a little listen that wants to stone." },
  { say = "host", text = "That's all a crystal radio is. The simplest receiver there is. It only needs somebody who wants to hear.", gap = 0.8 },
  { say = "host", text = "Teodor's receiver broke eleven years ago. Tiny miner, could we send him this one?" },
  { say = "miner", text = "Gull." },
  { say = "host", text = "The gull who visits Relay Four at three o'clock. Captain. He's here. He's been on the big chandelier all afternoon, looking at the tea.", gap = 0.3 },
  { say = "refract", text = "He's been on the big tea all afternoon, looking at the chandelier." },
  { say = "miner", text = "He'll take it. For a biscuit." },
  { say = "host", text = "Give him two. One for the journey. And tie it on very tight. Captain eats the post." },
  { sfx = "whoosh" },
  { say = "host", text = "There he goes. Out past the big chandelier, toward the edge of the dial.", gap = 1.0 },
  { say = "host", text = "Teodor. Something's coming. It's mostly beak." },
]

