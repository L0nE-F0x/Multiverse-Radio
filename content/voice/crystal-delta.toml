# Crystal Radio Delta — Prism, from Refraction Point Seven.
# Every sentence refracts into a second, slightly different sentence (same voice, cave
# reverb). The tiny miner sips tea and occasionally finds things.
station = "crystal-delta"

[voices]
host = { voice = "af_aoede", name = "Prism" }
refract = { voice = "af_aoede", speed = 1.04, fx = "cave", name = "Prism" }
miner = { voice = "am_puck", fx = "tiny", name = "The Tiny Miner" }
# v3: serial.
teodor = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }

