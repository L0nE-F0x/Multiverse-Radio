# The Velvet Collapse — 116.5, the Velvet Lounge, Casino Ultima, in orbit round a dying red giant.
#
# Baron Velour hosts (and plays bass): smooth, unbothered, regards the nightly supernova as a
# lighting cue. Odette runs the roulette table and takes bets on the end of the world. The
# star is Old Ruby: enormous, red, and touchy about her size. Every night at four o'clock
# local she goes supernova; by about half past five she has pulled herself back together.
#
# The night is built from the shows: The Final Hour (3–4) escalates towards it, and The
# Collapse (4–6) opens at four sharp with the countdown itself (the director airs a show's
# opener at the top of its first hour), then the white-out and the morning after.
# The `bets` kit chains Odette opening the table, one to three wagers and "no more bets".
#
# Running bits: the roulette wheel that is only red; the silver-jacket man who bets every night
# that the star won't go; the band in sunglasses; stardust in the gift shop. Cross-station:
# Bev and the request line, Grumbel's Ladders, Greg's show (Monday review).
station = "velvet-collapse"

[voices]
host = { voice = "bm_daniel", speed = 0.96, name = "Baron Velour" }
odette = { voice = "bf_lily", speed = 1.0, name = "Odette, the Croupier" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
announcer = { voice = "am_michael", speed = 1.05, name = "Announcer" }
grumbel = { voice = "am_eric", name = "Arnold Grumbel" }

[[show]]
id = "the-velvet-hour"
name = "The Velvet Hour"
blurb = "Slow funk, low lights and a red giant in the window. Dinner is served with sunglasses."
start = 21
end = 24

[[show]]
id = "the-final-hour"
name = "The Final Hour"
blurb = "The countdown to four o'clock. The star swells, the bets close, the band plays faster."
start = 3
end = 4

[[show]]
id = "the-collapse"
name = "The Collapse"
blurb = "Supernova at four sharp. White light, a short silence, and then, somehow, breakfast."
start = 4
end = 6

