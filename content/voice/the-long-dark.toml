lines = [
  { say = "announcer", text = "At four o'clock, the lights came back on. Gently. Haskett brought them up slowly, a ring at a time, like opening curtains on somebody you love." },
  { sfx = "typing" },
  { say = "calder", text = "Report. Case of the lights on Ring Four. Cause, a neighbour. Resolution, a treaty. One hour of dark, nightly. Status." },
  { pause = 0.8 },
  { say = "calder", text = "Closed." },
  { say = "calder", text = "I looked at that word a long time. Eleven years on Penumbra Station, and it's the first case I ever closed where nobody went to a cell, and everybody went to bed." },
