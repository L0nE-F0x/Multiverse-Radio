  { say = "wren", text = "So we have. I'm so sorry. I think that might be me." },
  { say = "calder", text = "You stopped the lift?" },
  { say = "wren", text = "Not on purpose. I have that effect on lifts. And lamps. And the occasional clock. Would you like a mint? It's going to be a while." },
  { say = "calder", text = "How long a while?" },
  { say = "wren", text = "Until one of us says something true. Lifts are very old-fashioned about it." },
  { pause = 1.5 },
  { say = "calder", text = "I'm tired. I've been tired for eleven years." },
  { sfx = "ding" },
  { say = "wren", text = "There. Ring Three. Mind how you go." },
  { say = "announcer", text = "The Lift. A short play, by the Penumbra Players. It's shorter than most lifts." },
]

