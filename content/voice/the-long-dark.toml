# The Long Dark — 112.9, radio theatre from Studio B, performed by the Penumbra Players.
#
# A serialised space-noir. Penumbra Station is the last lit place before the Long Dark, a
# stretch of nothing so wide that light gives up halfway across. Detective Ines Calder
# works nights; the lights keep going out. Mr. Wren, in a grey coat, appears in every
# episode, somewhere he can't possibly be, and is always terribly sorry about it.
#
# Cast: the Announcer (recaps, cliffhangers, sponsor reads); Calder; Mr. Wren; Dov Haskett,
# who tends the Lamp (the station's great glass furnace) and talks to it; Mags, who has
# kept the Lumen Bar lit for forty years; Station Master Ashby; Captain Vance of the supply
# ship Tern; and, once, a small one of the dark.
#
# The arc (`serial = the-long-dark`, fourteen episodes, one a night, two or three clips
# each, scene changes between clips): the lights are leaving the station. Wren turns out to
# be the neighbour. The Long Dark is a home, the station was built in its doorway, and its
# light has kept the family awake for forty years. Ashby shouts at the dark with
# floodlights; the Lamp gives out; Calder goes next door; the station learns that you
# need the dark to see a light. Episode thirteen signs the treaty of the Lumen Bar (one
# dark hour a night); fourteen is the first Long Dark Hour, and ends with Ring Four going
# out and a polite voice saying "excuse me", which is how episode one begins.
#
# Every episode after the first opens with the Announcer's "previously on". Standalone
# recaps (`recap-*`) are vague enough to air on any night. Stings: `crime` is the organ
# stab, `halloween` the unresolved chord for the big cliffhangers. Lights out is a `zap`.
station = "the-long-dark"

[voices]
announcer = { voice = "bm_george", speed = 0.95, name = "The Announcer" }
calder = { voice = "af_sarah", name = "Detective Ines Calder" }
wren = { voice = "am_fenrir", speed = 0.9, name = "Mr. Wren" }
haskett = { voice = "bm_lewis", name = "Dov Haskett" }
mags = { voice = "bf_emma", name = "Mags" }
ashby = { voice = "am_michael", name = "Station Master Ashby" }
vance = { voice = "af_nova", fx = "radio", name = "Captain Vance" }
small = { voice = "af_sky", fx = "ghost", name = "A Small One" }
ruddle = { voice = "bf_lily", name = "Mrs. Ruddle, Foley" }

