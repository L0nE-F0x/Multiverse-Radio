# ── Episode 8: Full Bright ────────────────────────────────────────────────────

[[clip]]
id = "ep-08-a"
category = "show"
title = "Episode Eight: Full Bright"
serial = { id = "the-long-dark", episode = 8 }
bed = "fluorescent"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Mags confessed to forty years of selling the dark hour. Station Master Ashby declared it trading with the enemy, and ordered the floodlights on. Every one. All night." },
  { say = "announcer", text = "Episode eight. Full Bright.", gap = 0.8 },
  { say = "calder", text = "Two days at full bright. Nobody on the station has slept. You can't. It comes through your eyelids. It comes through the pillow." },
  { say = "calder", text = "The chapel's hydroponics wilted on the first afternoon. The miners on Ring Four have started wearing their welding goggles to breakfast. Mags can't tell when to close, so she hasn't." },
  { say = "calder", text = "And everybody's cross. Not angry. Cross. The way you are when you've been at a party too long, and you can't find your coat." },
  { say = "calder", text = "You'd think more light would make it easier to see. It doesn't. It just makes everything look like evidence." },
  { say = "haskett", text = "She's running hot, Detective. Hotter every hour. I've got my hand on the glass and I can't keep it there." },
  { say = "calder", text = "Can you turn it down?" },
  { say = "haskett", text = "Ashby's got the key to the governor. On a chain. Round his neck. He sleeps in it. Well. He would, if anybody could sleep." },
]

[[clip]]
id = "ep-08-b"
category = "show"
title = "Episode Eight: Full Bright"
serial = { id = "the-long-dark", episode = 8 }
bed = "fluorescent"
lines = [
  { say = "announcer", text = "That night, Detective Calder sat in her office, with the blinds down, and the light coming through them anyway. And somebody knocked. Not on the door. On the window." },
  { say = "calder", text = "My office window looks out on the Long Dark. There's nothing out there to knock with." },
  { pause = 1.0 },
  { say = "calder", text = "I lifted the blind. Out past the glare, just where the light gave up, stood Mister Wren. Outside. On nothing. Hat in his hand." },
  { say = "wren", text = "I'm so sorry to bother you, Detective. I did try the door. It's very bright, at the door.", fx = "distant" },
  { say = "calder", text = "What do you want?" },
  { say = "wren", text = "The children can't sleep.", fx = "distant" },
  { say = "calder", text = "Children?" },
  { say = "wren", text = "Mine. And a great many others. Your light comes right through our walls, you see. Like a neighbour's party that never ends. We've been lying awake forty years.", fx = "distant" },
  { say = "wren", text = "Would you ask him to turn it down? Just a little. Just for an hour. I'd ask myself, but he never opens the letters.", fx = "distant" },
  { say = "calder", text = "And if he won't?" },
  { say = "wren", text = "Then I'm afraid the Lamp will decide for him. She's ever so tired.", fx = "distant" },
]

[[clip]]
id = "ep-08-c"
category = "show"
