# ── Episode 5: The Station Master's Torch ─────────────────────────────────────

[[clip]]
id = "ep-05-a"
category = "show"
title = "Episode Five: The Station Master's Torch"
serial = { id = "the-long-dark", episode = 5 }
bed = "cave-drip"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Dov Haskett was suspended. With his last key, Detective Calder opened the Old Spur, and found every light that had ever gone out on Penumbra Station, labelled and kept. And Station Master Ashby found her." },
  { say = "announcer", text = "Episode five. The Station Master's Torch.", gap = 0.8 },
  { say = "calder", text = "You collected them." },
  { say = "ashby", text = "Not me. Not only me. Every station master since the first. It's part of the job. Nobody tells you, when you take it. You find out on your first Sunday." },
  { say = "calder", text = "Why?" },
  { say = "ashby", text = "Because they're the evidence, Calder. Every bulb on that shelf went out for no reason. And every ten years, the station master gets one of these." },
  { say = "calder", text = "A letter." },
  { say = "ashby", text = "Go on. Read it. You'll know the hand." },
  { say = "wren", text = "Dear Sirs. Forgive me for writing. Your lights are in our living room. The children cannot sleep. We have been very patient. We will continue to be. Yours, with the greatest respect. W.", fx = "whisper" },
  { say = "ashby", text = "Four of those. Forty years. Every one more polite than the last. Do you know how frightening that is, Detective? A politeness that keeps getting worse?" },
]

[[clip]]
id = "ep-05-b"
category = "show"
title = "Episode Five: The Station Master's Torch"
serial = { id = "the-long-dark", episode = 5 }
bed = "hall"
lines = [
  { say = "ashby", text = "My predecessors ignored them. Sensible. You don't move a station because the dark has a complaint." },
  { say = "calder", text = "And the lights?" },
  { say = "ashby", text = "Dimmer every decade. You won't have noticed. Nobody does. You only notice when you dig out an old photograph and wonder why everybody in it is squinting." },
  { say = "ashby", text = "My father was station master before me. He used to say the first lamp they lit out here could be seen from the inner worlds. Now you can barely see it from the dock." },
  { say = "ashby", text = "Forty years, Calder, and this station has been fading like an old photograph. And every ten years, a letter, thanking us for our patience." },
  { say = "calder", text = "So what's your plan, sir?" },
  { say = "ashby", text = "The supply ship. The Tern. Due in four days. In her hold, ten thousand floodlights. I ordered them myself. Out of my own budget, and some of somebody else's." },
  { say = "ashby", text = "We are going to light this station so bright they'll see it from the inner worlds. We are going to show it that we're here." },
  { say = "calder", text = "You want to shout at the dark." },
  { say = "ashby", text = "I want it to know we're here." },
  { pause = 1.0 },
  { say = "calder", text = "Sir. I think it knows." },
  { sting = "crime" },
]

[[clip]]
id = "ep-05-c"
category = "show"
title = "Episode Five: The Station Master's Torch"
serial = { id = "the-long-dark", episode = 5 }
bed = "fluorescent"
lines = [
  { say = "announcer", text = "Four nights later. The communications room on Ring One. Dov Haskett, who was not supposed to be there, was there." },
  { say = "haskett", text = "Don't tell Ashby. I had a spare key. I always have a spare key." },
  { say = "calder", text = "Is that her?" },
