# ── Episode 7: What Mags Sold ─────────────────────────────────────────────────

[[clip]]
id = "ep-07-a"
category = "show"
title = "Episode Seven: What Mags Sold"
serial = { id = "the-long-dark", episode = 7 }
bed = "room"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. The Tern came in blind, with ten thousand floodlights, every one unscrewed half a turn. And in the Lumen Bar, in the dark, Mags held a coin for something she hadn't sold." },
  { say = "announcer", text = "Episode seven. What Mags Sold.", gap = 0.8 },
  { say = "mags", text = "Opening night. Forty years ago. Last customer gone, I'm wiping down, and there he is at the end of the bar. Grey coat. Glass of water. Sorry to trouble me." },
  { say = "mags", text = "And he says..." },
  { say = "wren", text = "I'd like to buy an hour of dark, please. Just the one. Every night. From three until four. If it's no trouble.", fx = "ghost" },
  { say = "calder", text = "And you said yes." },
  { say = "mags", text = "I was nineteen. He was polite. I said yes to a lot of polite things at nineteen. So every night, at three, I turn everything off, and I sit with him in the dark." },
  { say = "calder", text = "What do you do?" },
  { say = "mags", text = "We talk. He tells me about his family. Very large. Very quiet. They live in the Long Dark, and they've not had a proper night's sleep since the station was built." },
  { say = "calder", text = "And what do you get?" },
  { say = "mags", text = "The lights in here have never failed. Not once. Except when he needs to knock." },
]

[[clip]]
id = "ep-07-b"
category = "show"
title = "Episode Seven: What Mags Sold"
serial = { id = "the-long-dark", episode = 7 }
bed = "hall"
lines = [
  { say = "calder", text = "And tonight's coin?" },
  { say = "mags", text = "He wants the station's dark hour, Ines. All of it. Every ring. Every corridor. One hour a night. He's never asked for that before." },
  { say = "mags", text = "And I don't think it's mine to sell." },
  { say = "announcer", text = "It wasn't. It was Station Master Ashby's. And within the hour, he had heard all of it." },
  { say = "ashby", text = "Forty years. Forty years, she's been trading with it. In my station. Over my bar." },
  { say = "calder", text = "It's her bar, sir." },
  { say = "ashby", text = "It is trading with the enemy, Calder. Every night. While the rest of us sat in our cabins wondering why the corridors kept getting dimmer, she was selling it the dark by the hour." },
  { say = "calder", text = "She was keeping the bar lit, sir. The one place on this station that never failed. You drink there yourself. Every Friday. Third stool." },
  { say = "calder", text = "He's not an enemy, sir. He's a neighbour. With a noise complaint. Forty years of it, written in his best hand." },
  { say = "ashby", text = "Then let's give the neighbour something to complain about." },
  { pause = 0.8 },
  { say = "ashby", text = "Haskett. Yes, I know you're there. I can hear you breathing behind the filing cabinet. Get the Tern's floodlights screwed in. Every one. Tonight." },
