  { say = "calder", text = "What boundary?" },
  { say = "wren", text = "The one your station is standing on, Detective. Rather heavily. In its outdoor shoes." },
  { say = "calder", text = "The station's been here forty years." },
  { say = "wren", text = "Yes. We've been very patient. We've written. Several times. In our best hand." },
  { say = "calder", text = "Written to whom?" },
  { say = "wren", text = "Ah. I'm afraid that's my match. They don't last, out here. Do forgive me." },
  { pause = 1.5 },
