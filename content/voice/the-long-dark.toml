  { say = "announcer", text = "Previously, on The Long Dark. Station Master Ashby confessed to forty years of polite letters, and ordered ten thousand floodlights. The supply ship Tern came to deliver them. And her lights went out, one by one, while a man in a grey coat waved from her hull." },
