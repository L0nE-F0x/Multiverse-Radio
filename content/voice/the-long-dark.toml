lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Two days at full bright. Mister Wren knocked on Calder's window from the outside, hat in hand, and asked for one hour. And in the Lamp Room, the Lamp ran past the red." },
  { say = "announcer", text = "Episode nine. The Lamp Gives Out.", gap = 0.8 },
  { say = "calder", text = "She didn't explode. I'd braced for it. We all had." },
  { say = "calder", text = "She just stopped. The way somebody very tired stops, at the end of a long day, when they finally sit down and don't get up." },
  { pause = 1.5 },
  { say = "calder", text = "And Penumbra Station went dark. Not a blackout. Not eleven minutes. Dark." },
  { say = "haskett", text = "Oh, old girl. Oh, I'm sorry." },
  { say = "ashby", text = "Batteries. The air recyclers have batteries. How long?" },
  { say = "haskett", text = "Air for days. Heat for hours. It'll get cold, sir. Then it'll get colder." },
  { say = "calder", text = "Can she be restarted?" },
  { say = "haskett", text = "By hand. From the core. Down the long ladder. In the dark. And I'd need my torch to work, and look." },
  { sfx = "zap" },
  { say = "haskett", text = "Nothing. Brightwick's Everlasting, and nothing. The dark's having all of it. Every scrap." },
]

[[clip]]
id = "ep-09-b"
category = "show"
title = "Episode Nine: The Lamp Gives Out"
serial = { id = "the-long-dark", episode = 9 }
bed = "space"
lines = [
  { say = "announcer", text = "They went down anyway. Calder and Haskett, hand over hand, down the long ladder to the core, with the cold coming up to meet them." },
  { say = "calder", text = "Halfway down, Haskett stopped. I nearly stood on his hands." },
  { say = "haskett", text = "Detective. Listen." },
  { pause = 1.5 },
  { say = "wren", text = "Pardon me.", fx = "whisper" },
  { say = "small", text = "Sorry. Sorry.", fx = "whisper" },
  { say = "wren", text = "Mind the step. Do mind the step.", fx = "whisper" },
  { say = "calder", text = "The station was full. In the dark, all around us, on the ladder, in the corridors, the station was full of people. Quiet people. Lots of them. Apologising." },
  { say = "calder", text = "It was like walking into a party you weren't invited to, in a house you thought was yours." },
  { say = "haskett", text = "Detective. Who are they?" },
  { say = "calder", text = "Neighbours." },
  { say = "haskett", text = "How many?" },
  { say = "calder", text = "All of them, I think. Keep climbing." },
  { pause = 1.0 },
  { say = "announcer", text = "The core. The very bottom of Penumbra Station. Where the Lamp keeps its great glass heart, cold now, and still." },
  { say = "calder", text = "There was a light down there. Small. A single match." },
  { say = "calder", text = "And sitting at the Lamp's controls, in a grey coat, one hand flat on the glass, was a man I'd seen in forty years of photographs." },
  { say = "haskett", text = "Get your hand off her." },
  { say = "wren", text = "Oh, Mister Haskett. Forgive me. I've been keeping her warm for you. She doesn't like to be alone in the dark. Not after all this time." },
  { say = "wren", text = "Neither, I think, do you." },
  { pause = 1.0 },
  { say = "wren", text = "Good evening, Detective. I'm so glad you came down. I think it's time we talked properly. Don't you?" },
  { sting = "halloween" },
  { say = "announcer", text = "Mister Wren has the Lamp. Tomorrow night, on The Long Dark." },
]

# ── Episode 10: Terms ─────────────────────────────────────────────────────────

[[clip]]
id = "ep-10-a"
category = "show"
title = "Episode Ten: Terms"
serial = { id = "the-long-dark", episode = 10 }
bed = "space"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. The Lamp gave out, and Penumbra Station went dark, and filled with quiet strangers saying sorry on the stairs. At the bottom of it all, keeping the Lamp warm, sat Mister Wren." },
  { say = "announcer", text = "Episode ten. Terms.", gap = 0.8 },
  { say = "wren", text = "Let me tell you where you are, Detective. You're in a doorway." },
  { say = "calder", text = "Whose?" },
  { say = "wren", text = "Ours. The Long Dark isn't empty. It never was. It's a house. A very large one. Very quiet. We like it quiet. We are, I'm afraid, a family of light sleepers." },
  { say = "wren", text = "And forty years ago, somebody built a lighthouse in our front hall. And then lit it. And then never, ever turned it off." },
  { say = "calder", text = "And the lights going out?" },
  { say = "wren", text = "I have never taken anything that wasn't already leaving. Light leaks, Detective. It goes out through every crack. I've only been gathering it up. It seemed so wasteful, just letting it go." },
  { say = "haskett", text = "You took the bulbs." },
  { say = "wren", text = "Only the ones that had finished. Somebody upstairs kept them. Labelled. I always thought that was rather sweet." },
  { pause = 1.0 },
  { say = "calder", text = "Can she be restarted?" },
  { say = "wren", text = "Oh, yes. She's only sleeping. Mister Haskett knows how. And I'll hold the match for him. If." },
  { say = "calder", text = "If." },
  { say = "wren", text = "If you'll come and see. Just for a moment. Out there. Next door." },
  { say = "wren", text = "Then you can come back and tell them. And they'll believe you, Detective, because you're you. Nobody on this station has ever believed me. I'm far too polite. It makes people nervous." },
  { say = "haskett", text = "Detective, you can't." },
  { say = "calder", text = "And if I don't come back?" },
  { say = "wren", text = "Then I shall be very, very sorry. But you will. I'll walk you to the door myself. I always see my guests to the door." },
  { pause = 1.2 },
  { say = "calder", text = "Haskett. If I'm not back in an hour, light a match." },
  { say = "haskett", text = "Nothing lights, Detective." },
  { say = "calder", text = "Then try anyway. Somebody should be trying, when I get back." },
]

[[clip]]
id = "ep-10-b"
category = "show"
title = "Episode Ten: Terms"
serial = { id = "the-long-dark", episode = 10 }
bed = "wind"
lines = [
  { say = "announcer", text = "The outer airlock of Ring Four. The last door on Penumbra Station. On the other side of it, there has never been anything at all." },
  { sfx = "alarm" },
  { say = "calder", text = "Haskett held the match. Nothing lit. He held it anyway. Ashby stood behind him with his hands in his pockets, saying nothing, which for Ashby was a speech." },
  { say = "ashby", text = "Calder. If it's a trick." },
  { say = "calder", text = "Then you'll have the station back, sir, and one less detective to argue with. Either way, you win something." },
  { say = "wren", text = "After you. No, please. I insist." },
  { sfx = "whoosh" },
  { say = "calder", text = "I'd expected cold. I'd expected the kind of nothing that pulls the breath out of you. I'd expected stars, or no stars, and the long fall." },
  { pause = 1.0 },
  { say = "calder", text = "I hadn't expected carpet." },
  { say = "calder", text = "Thick. Soft. Underfoot, in the black, as far as I could feel. And air, warm air, smelling of rain on old books, and somebody's supper, and sleep." },
  { say = "wren", text = "Detective Ines Calder. Welcome to the Long Dark." },
  { pause = 0.8 },
  { say = "wren", text = "Please. Do wipe your feet." },
  { sting = "halloween" },
  { say = "announcer", text = "Detective Calder has stepped into the Long Dark. Tomorrow night, on The Long Dark." },
]

# ── Episode 11: Next Door ─────────────────────────────────────────────────────

[[clip]]
id = "ep-11-a"
category = "show"
title = "Episode Eleven: Next Door"
serial = { id = "the-long-dark", episode = 11 }
bed = "space"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Mister Wren offered to help restart the Lamp, on one condition: that Detective Calder come and see. She went through the last door on Penumbra Station. And found carpet." },
  { say = "announcer", text = "Episode eleven. Next Door.", gap = 0.8 },
  { say = "wren", text = "Do keep your voice down. Most of them are asleep. Some of them for the first time in forty years. Since your Lamp went out." },
  { say = "calder", text = "I couldn't see a thing. And yet, after a while, I could tell where things were. The way you know your own house at night. Here a chair. Here a step. Here, somebody breathing, slow and deep." },
  { say = "calder", text = "It went on forever. Room after room, without walls. A whole family, I thought. No. A whole town of them. Lying in the dark, the way the dark is supposed to be lain in." },
  { say = "wren", text = "It's not much. But it's ours. We were here before the stars, you know. We've watched every one of them come on. We were very polite about it. We didn't say a word." },
  { say = "calder", text = "But the station." },
  { say = "wren", text = "The station was close. That's all. Stars are a long way off. Your Lamp was in the hall. It's always the neighbours, isn't it? Never the city. Always the house next door." },
  { pause = 1.0 },
  { say = "small", text = "Is that one of the bright ones?" },
  { say = "wren", text = "Hush, little one. It's all right. She's a detective." },
  { say = "small", text = "What's a detective?" },
  { say = "wren", text = "Someone who wants to know why. Like you, at bedtime." },
  { say = "small", text = "Are you going to put the light back on?" },
  { say = "calder", text = "Are you scared of the light?" },
  { say = "small", text = "Mama says the bright ones never sleep. That's why they're so cross all the time." },
  { pause = 1.0 },
  { say = "calder", text = "I laughed. I couldn't help it. I'd been cross for eleven years and never once thought to blame the lights." },
  { say = "small", text = "You can have this. It's for the dark. So you can find your way back. Hold it tight." },
  { say = "calder", text = "Something small and cool in my palm. A pebble, I think. Smooth as a coin." },
  { say = "wren", text = "We tell them stories about you, you know. The great bright station that never sleeps. They're terrified of you. And, I think, a little bit in love." },
]

[[clip]]
id = "ep-11-b"
category = "show"
title = "Episode Eleven: Next Door"
serial = { id = "the-long-dark", episode = 11 }
bed = "wind"
lines = [
  { say = "announcer", text = "Back on Penumbra Station, Dov Haskett had been trying. He'd said he would. Nothing lit. Nothing lit. And then, after forty minutes, something did." },
  { sfx = "zap" },
  { say = "calder", text = "Behind us, the airlock blazed. The Lamp, roaring back to life, all of her at once, straight through the open door." },
  { say = "small", text = "Too bright! Too bright!" },
  { say = "wren", text = "Close your eyes, little one. Close them tight. Turn round. There. There. Count to a hundred, the way we practised.", fx = "whisper" },
  { say = "calder", text = "All around me the dark flinched. I felt it, the way you feel a whole room take a breath. Things woke, and turned their faces away." },
  { say = "wren", text = "Oh dear. Oh, Mister Haskett. I did say an hour." },
  { sfx = "door-creak" },
  { say = "calder", text = "And the door, my door, the last door on Penumbra Station, began to close. Not slammed. Eased shut. The way you close a door on a room full of sleeping people." },
  { say = "calder", text = "Wren. Wren, I'm on the wrong side." },
  { say = "wren", text = "Yes. I'm so sorry. I'm afraid you are." },
  { sting = "halloween" },
  { say = "announcer", text = "Detective Calder is shut out in the Long Dark. Tomorrow night, on The Long Dark." },
]

# ── Episode 12: The Wrong Side of the Door ────────────────────────────────────

[[clip]]
id = "ep-12-a"
category = "show"
title = "Episode Twelve: The Wrong Side of the Door"
serial = { id = "the-long-dark", episode = 12 }
bed = "space"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Next door, Detective Calder met a small one who was frightened of the light, and was given a pebble to find her way. Then the Lamp came back, too soon, too bright. And the door closed, with Calder on the wrong side." },
  { say = "announcer", text = "Episode twelve. The Wrong Side of the Door.", gap = 0.8 },
  { say = "calder", text = "I wasn't frightened. That surprised me. I sat down on the carpet in the dark, and Wren sat down beside me, and neither of us said anything for a while." },
  { say = "wren", text = "They'll want to find you. They'll turn every light on to look." },
  { say = "calder", text = "And they won't see a thing." },
  { say = "wren", text = "No. You can't find a light in the light. Nobody ever learns that until they need to." },
  { sfx = "whoosh" },
  { say = "calder", text = "Far off, something went past. A ship. Long and old, with every window lit, moving slow and sure, the way you walk home along a road you know." },
  { say = "calder", text = "Where's that one going?" },
  { say = "wren", text = "Home, I think. The old relay ships come through here, now and then. They get called, eventually. Somebody leaves a light on for them, further along." },
  { say = "calder", text = "I thought you didn't like lights." },
  { say = "wren", text = "I don't mind one. A light for somebody who's coming home. It's forty years of eleven hundred that keeps a person up." },
]

[[clip]]
id = "ep-12-b"
category = "show"
title = "Episode Twelve: The Wrong Side of the Door"
serial = { id = "the-long-dark", episode = 12 }
bed = "room"
lines = [
  { say = "announcer", text = "Meanwhile, on Penumbra Station. The Lumen Bar. Every light on full. Three people, and a great deal of blame." },
  { say = "haskett", text = "I thought she was in trouble. Forty minutes. I thought, she's in trouble, she needs a light. So I gave her one." },
  { say = "mags", text = "You gave her a blindfold, Dov. You can't find a light in the light. You need dark to see one. That's the whole point of a light." },
  { say = "ashby", text = "We are not turning the station off. If we go dark, we lose." },
  { say = "mags", text = "Lose what, Corvin? Forty years of not sleeping? Your squint? Your temper?" },
  { say = "ashby", text = "My station." },
  { say = "mags", text = "It was never yours, love. It was always in somebody's hall. We've just been very loud guests." },
  { pause = 1.5 },
  { say = "ashby", text = "One hour." },
  { say = "mags", text = "Say it again." },
  { say = "ashby", text = "One hour. All of it. Every ring. And if she isn't out there, Mags, I'll never forgive any of us." },
  { pause = 1.0 },
  { say = "announcer", text = "And so, at three in the morning, Mags reached under the bar, as she had every night for forty years, and turned off the lights of the Lumen Bar." },
  { sfx = "zap" },
  { say = "announcer", text = "Then Ring One." },
  { sfx = "zap" },
  { say = "announcer", text = "Then Ring Two. Ring Three. Ring Four." },
  { sfx = "zap" },
  { pause = 1.5 },
  { say = "announcer", text = "For the first time, on purpose, Penumbra Station went dark. Eleven hundred people stood at the windows, and looked out, and waited." },
  { say = "haskett", text = "Nothing. Nothing. There's nothing out there." },
  { say = "mags", text = "Give it a minute. Your eyes have been shouting for forty years. Let them stop." },
  { pause = 2.0 },
  { say = "ashby", text = "There. There. Low down. On the left." },
  { say = "announcer", text = "A light. Tiny. Far out in the Long Dark. Somebody holding up a match, and waving." },
  { pause = 1.0 },
  { say = "announcer", text = "And then the match went out." },
  { sting = "halloween" },
  { say = "announcer", text = "Is Calder on her way home? Tomorrow night, on The Long Dark." },
]

# ── Episode 13: The Treaty of the Lumen Bar ───────────────────────────────────

[[clip]]
id = "ep-13-a"
category = "show"
title = "Episode Thirteen: The Treaty of the Lumen Bar"
serial = { id = "the-long-dark", episode = 13 }
bed = "wind"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Detective Calder, shut out in the Long Dark, watched an old ship go home. On the station, Station Master Ashby turned out the lights. And far out in the dark, a match was lit. And went out." },
  { say = "announcer", text = "Episode thirteen. The Treaty of the Lumen Bar.", gap = 0.8 },
  { say = "calder", text = "It was only a match. They don't last, out there. Wren had said so." },
  { say = "wren", text = "That was the last of my matches, I'm afraid. We'll have to do the rest by feel. Hold the pebble. It knows the way." },
  { say = "calder", text = "We walked. The pebble went warm when I turned the right way, and cool when I didn't. It's the strangest compass I've ever held, and the only one that's never been wrong." },
  { sfx = "alarm" },
  { sfx = "door-creak" },
  { say = "haskett", text = "Detective! Oh, Detective. Mind the step. Mind the step." },
  { say = "calder", text = "Haskett, you're hugging me." },
  { say = "haskett", text = "I'm aware. I'll stop in a minute." },
  { pause = 1.0 },
  { say = "announcer", text = "And there, on the threshold of the last door, in a grey coat, with his hat in his hands, stood Mister Wren. He did not step inside." },
  { say = "wren", text = "May I come in? I've never actually been invited." },
]

[[clip]]
id = "ep-13-b"
category = "show"
title = "Episode Thirteen: The Treaty of the Lumen Bar"
serial = { id = "the-long-dark", episode = 13 }
bed = "room"
lines = [
  { say = "announcer", text = "The Lumen Bar. Five people round a single table, by the light of one small lamp, turned very low. Mags poured. Nobody drank." },
  { say = "calder", text = "Here are the terms. Every night, one hour of dark. Full dark. Every ring, every corridor, every window. From three until four." },
  { say = "wren", text = "And in return, the light stops leaving. I'll stop gathering it. The Lamp gets an hour's rest a night. She's earned it." },
  { say = "haskett", text = "She has. She has, sir." },
  { say = "wren", text = "And next door gets one hour of proper sleep. Just one. You'd be amazed what one hour does. It's the difference between a neighbour and a stranger." },
  { say = "ashby", text = "And if we refuse?" },
  { say = "wren", text = "Then nothing, Station Master. Nothing at all. I'll keep writing. Very politely. Forever." },
  { pause = 1.5 },
  { say = "ashby", text = "That's worse." },
  { say = "wren", text = "I know. I'm so sorry." },
  { pause = 1.0 },
  { sfx = "typing" },
  { say = "announcer", text = "Missus Ruddle typed it up on the bar's old machine. One page. Five signatures. It is the shortest treaty ever signed, and possibly the most polite." },
  { say = "ashby", text = "What do we call you? For the paperwork." },
  { say = "wren", text = "Ah. I'm afraid Wren is the only part of it you could pronounce. The rest goes on rather a long time, and most of it is silence." },
  { say = "ashby", text = "Wren it is." },
  { say = "announcer", text = "Station Master Ashby signed in full. Mags signed with a flourish. Haskett signed for himself, and, in brackets, for the Lamp. Calder signed last. And Mister Wren signed with one letter. Very neat." },
  { say = "mags", text = "When does it start?" },
  { say = "wren", text = "Tonight, if you'll have it. At three." },
  { sfx = "bell" },
  { pause = 1.0 },
  { say = "announcer", text = "And at three o'clock, Penumbra Station turned out every one of its lights. Not because they failed. Not because it was told. Because it had promised." },
  { sting = "halloween" },
  { say = "announcer", text = "The first Long Dark Hour has begun. Tomorrow night, the final episode of The Long Dark." },
]

# ── Episode 14: The Long Dark Hour ────────────────────────────────────────────

[[clip]]
id = "ep-14-a"
category = "show"
title = "Episode Fourteen: The Long Dark Hour"
serial = { id = "the-long-dark", episode = 14 }
bed = "room"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Detective Calder came home by the light of a pebble. Around a table in the Lumen Bar, five people signed the most polite treaty ever written. And at three o'clock, the lights went out, on purpose." },
  { say = "announcer", text = "The final episode. The Long Dark Hour.", gap = 0.8 },
  { say = "calder", text = "Everyone went to the windows. Nobody told them to. Eleven hundred people, in their dressing gowns and their goggles and their good coats, pressed up against the glass." },
  { say = "calder", text = "For a minute, there was nothing. Then our eyes stopped shouting. And then we saw them." },
  { say = "calder", text = "Stars. Thousands of them. Tens of thousands. Out past the Long Dark, all along the far edge, where we'd been told for forty years that there was nothing at all." },
  { say = "calder", text = "They'd been there the whole time. We'd just been too bright to see them." },
  { pause = 1.2 },
  { say = "ashby", text = "Forty years. Forty years I've been station master, and I've never once seen a star from this station." },
  { say = "mags", text = "Here, Corvin. Have a hanky. It's dark. Nobody's looking." },
  { say = "haskett", text = "Sleep, old girl. Go on. I'm here. I'll wake you at four." },
  { pause = 1.0 },
  { say = "announcer", text = "At the window at the end of Ring Four, where a corridor ends in a wall, Detective Calder found Mister Wren. He was looking out, the way you look out at your own garden after a long time away." },
  { say = "wren", text = "Listen." },
  { say = "calder", text = "I can't hear anything." },
  { say = "wren", text = "Exactly. That's them, sleeping. Forty years. You've no idea what you've given them." },
  { say = "wren", text = "Here. For the hour. I always pay." },
  { say = "calder", text = "The coin. Black, with no shine on it. Keep it, Wren." },
  { say = "wren", text = "Then I shall owe you. I don't like owing, Detective. I'll be back to settle it." },
  { say = "calder", text = "When?" },
  { say = "wren", text = "When the lights go out, of course. Isn't that always when?" },
  { pause = 1.0 },
  { say = "calder", text = "I looked down at the coin in my hand. When I looked up, the window was just a window. And the stars were very bright." },
]

[[clip]]
id = "ep-14-b"
category = "show"
title = "Episode Fourteen: The Long Dark Hour"
serial = { id = "the-long-dark", episode = 14 }
