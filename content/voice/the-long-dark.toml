[[clip]]
id = "ep-07-c"
category = "show"
title = "Episode Seven: What Mags Sold"
serial = { id = "the-long-dark", episode = 7 }
bed = "cockpit"
lines = [
  { say = "announcer", text = "Midnight. The Lamp Room. Ten thousand floodlights wired into every ring, and one switch to throw." },
  { say = "haskett", text = "Sir, I'm asking you as a man who's tended her forty years. If we put this much through her, the Lamp will burn out." },
  { say = "ashby", text = "Then she burns out bright." },
  { say = "haskett", text = "She's not a firework, sir. She's the only thing keeping us warm. You don't make a fire burn brighter by sitting on it." },
  { say = "ashby", text = "Forty years we've been asking it nicely, Haskett. Forty years of patience, and four polite letters, and a station you can't see from the dock. I'm done asking." },
  { say = "ashby", text = "Throw the switch, Haskett." },
  { say = "calder", text = "Haskett. Don't." },
