  { pause = 1.0 },
  { say = "wren", text = "Excuse me.", fx = "whisper" },
  { say = "announcer", text = "On Penumbra Station, the lights still go out, now and then. Somebody is always very sorry about it. And somebody always picks up the phone." },
  { say = "announcer", text = "The Long Dark will return. From the beginning. As it always does." },
  { sting = "crime" },
]

