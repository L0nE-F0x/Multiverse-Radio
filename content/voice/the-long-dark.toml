category = "show"
title = "Episode One: Lights Out on Ring Four"
serial = { id = "the-long-dark", episode = 1 }
bed = "fluorescent"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "The Penumbra Players bring you: The Long Dark." },
  { say = "announcer", text = "Penumbra Station. The last lit place before the Long Dark, a stretch of nothing so wide that light gives up halfway across. Four rings. Eleven hundred souls. One detective." },
  { say = "announcer", text = "And lately, the lights have started going out. Episode one. Lights Out on Ring Four.", gap = 0.8 },
  { sfx = "typing" },
  { say = "calder", text = "Calder. Station Security. Night shift. The heater's broken. The kettle's broken. The coffee's been broken since I got here, eleven years ago." },
  { say = "calder", text = "On Penumbra Station you learn two things fast. Keep a torch in your coat. And never ask Dov Haskett about the Lamp, unless you've got an hour." },
  { sfx = "phone-ring" },
  { say = "calder", text = "Calder." },
  { say = "haskett", text = "Detective, it's Haskett, down in the Lamp Room. Ring Four's gone dark.", fx = "phone" },
  { say = "calder", text = "Again?" },
  { say = "haskett", text = "Not like the others. Eleven minutes, dead black, then back on like nothing happened. The Lamp never blinked. The power never dropped.", fx = "phone" },
  { say = "haskett", text = "The light just went somewhere, Detective. And then it came back.", fx = "phone" },
  { say = "calder", text = "Light doesn't go anywhere, Haskett." },
  { say = "haskett", text = "That's what I've been telling it for forty years. Somebody ought to tell it again.", fx = "phone" },
  { say = "calder", text = "I'm on my way." },
  { sfx = "door-creak" },
]

[[clip]]
id = "ep-01-b"
category = "show"
title = "Episode One: Lights Out on Ring Four"
serial = { id = "the-long-dark", episode = 1 }
bed = "fluorescent"
lines = [
  { say = "announcer", text = "Ring Four. The long curve of corridor where the miners sleep. The bulbs hum. The bulbs have always hummed." },
  { say = "haskett", text = "Here's what bothers me, Detective. Look at the clocks." },
  { say = "calder", text = "They're all eleven minutes slow." },
  { say = "haskett", text = "All but one. The one at the end. Right on time." },
  { say = "calder", text = "The corridor ends at a wall, Haskett." },
  { say = "haskett", text = "It does." },
  { say = "calder", text = "Then who's that, standing at the end of it?" },
  { pause = 1.2 },
  { say = "wren", text = "Oh. I do beg your pardon. Am I in the way?" },
  { say = "calder", text = "Station Security. Who are you, and how did you get there?" },
  { say = "wren", text = "Wren. Mister Wren. And I came the usual way, Detective. I'm so sorry about your corridor." },
  { say = "wren", text = "It won't happen again. Well. It will. But I shall be sorry each time." },
  { say = "calder", text = "Stay exactly where you are." },
  { say = "wren", text = "Of course." },
  { sfx = "zap" },
  { pause = 1.5 },
  { say = "haskett", text = "Lights flickered. Detective. Detective, he's gone." },
  { say = "calder", text = "Into a wall." },
  { say = "haskett", text = "Into a wall. And the clock at the end's eleven minutes slow, now. Like the others. Like it was waiting for him to leave." },
  { sting = "crime" },
]

[[clip]]
id = "ep-01-c"
category = "show"
title = "Episode One: Lights Out on Ring Four"
serial = { id = "the-long-dark", episode = 1 }
bed = "room"
lines = [
  { say = "announcer", text = "The Lumen Bar, on Ring One. The only place on Penumbra Station where the lights have never once gone out. Mags has kept it that way for forty years. Nobody knows how. Nobody asks." },
  { say = "mags", text = "You look like you've watched a man walk into a wall, Ines." },
  { say = "calder", text = "Grey coat. Very polite. Calls himself Wren." },
  { say = "mags", text = "Oh. Him." },
  { say = "calder", text = "You know him?" },
  { say = "mags", text = "He comes in, sometimes. Late. Never through the door. Sits at the end, orders a glass of water, never drinks it." },
  { say = "calder", text = "What does he pay with?" },
  { say = "mags", text = "That's the funny thing. He pays for the dark. That's how he puts it. One dark hour, please, Mags. And he leaves a coin." },
  { say = "calder", text = "And?" },
  { say = "mags", text = "And in the morning the coin's gone, and so's the hour. I never miss it." },
  { say = "calder", text = "I finished my drink. I didn't like any of it. Not the drink, not the story, and not the way Mags had stopped polishing the glass." },
  { sfx = "zap" },
  { pause = 1.5 },
  { say = "announcer", text = "And then, for the first time in forty years, the lights in the Lumen Bar went out. Every light on Penumbra Station went with them." },
  { pause = 1.0 },
  { say = "wren", text = "Detective. I'm so sorry. I believe you're sitting in my seat.", fx = "whisper" },
  { sting = "halloween" },
  { say = "announcer", text = "Who is Mister Wren? And whose seat is it, really? Join the Penumbra Players tomorrow night, for The Long Dark." },
]

# ── Episode 2: The Man Who Paid for the Dark ──────────────────────────────────

[[clip]]
id = "ep-02-a"
category = "show"
title = "Episode Two: The Man Who Paid for the Dark"
serial = { id = "the-long-dark", episode = 2 }
bed = "room"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. The lights on Ring Four went out for eleven minutes. A polite man in a grey coat walked into a wall." },
  { say = "announcer", text = "And in the Lumen Bar, where the lights never go out, they went out. Episode two. The Man Who Paid for the Dark.", gap = 0.8 },
  { say = "calder", text = "Who's there?" },
  { say = "wren", text = "Only me. Please don't get up. I'm afraid this is the only way I know how to knock." },
  { say = "calder", text = "You turned out every light on the station to knock?" },
  { say = "wren", text = "I did ask the corridor first. It said no." },
  { say = "calder", text = "What do you want, Mister Wren?" },
  { say = "wren", text = "To introduce myself. Properly. My name is Wren, and I live next door." },
  { say = "calder", text = "Nobody lives next door. Next door is the Long Dark." },
  { say = "wren", text = "Yes." },
  { pause = 1.0 },
  { sfx = "zap" },
  { say = "mags", text = "Lights. Ines? Ines, are you all right?" },
  { say = "calder", text = "He's gone." },
  { say = "mags", text = "He's left something on the bar." },
  { say = "calder", text = "A coin. Black. Mags, look at it. There's no shine on it at all. It's like it's drinking the light." },
  { say = "mags", text = "Don't hold it too long, love. It gets cold." },
]

[[clip]]
id = "ep-02-b"
category = "show"
title = "Episode Two: The Man Who Paid for the Dark"
serial = { id = "the-long-dark", episode = 2 }
bed = "cockpit"
lines = [
  { say = "announcer", text = "The Lamp Room, deep under Ring One. A great glass furnace that has burned for forty years and never once flickered. Dov Haskett tends it. Dov Haskett talks to it. It doesn't talk back. Usually." },
  { say = "haskett", text = "Put that coin away, Detective. You're upsetting her." },
  { say = "calder", text = "It's a lamp, Haskett." },
  { say = "haskett", text = "She's the Lamp. Capital L. Now look at the meters." },
  { say = "calder", text = "They're all fine." },
  { say = "haskett", text = "They're all fine. Power's fine. Lamp's fine. Every bulb on the station, fine. But the light..." },
  { say = "calder", text = "Is leaving." },
  { say = "haskett", text = "Going out through the hull. All of it, slowly. A little more every night. Like bath water, with a very small plug." },
  { say = "calder", text = "Leaking?" },
  { say = "haskett", text = "Or being let out. Or being invited. I don't know which is worse, Detective. I've been sitting with her all week, trying to decide." },
  { sfx = "phone-ring" },
  { say = "ashby", text = "Calder. Station Master Ashby. My office. Now. And bring nothing. Especially not that coin.", fx = "phone" },
  { sfx = "phone-hangup" },
  { say = "haskett", text = "He knows about the coin." },
  { say = "calder", text = "Everybody knows about the coin, Haskett. That's the trouble with a station. The walls are thin, and the people are thinner." },
]

[[clip]]
id = "ep-02-c"
category = "show"
title = "Episode Two: The Man Who Paid for the Dark"
serial = { id = "the-long-dark", episode = 2 }
bed = "hall"
lines = [
  { say = "ashby", text = "Here's what's going to happen, Detective. The supply ship docks in six days. Until it does, nobody on this station hears the word blackout. You'll call it maintenance." },
  { say = "calder", text = "Eleven hundred people sat in the dark last night, sir. They noticed." },
  { say = "ashby", text = "They noticed maintenance." },
  { say = "calder", text = "There's a man..." },
  { say = "ashby", text = "There is no man. There is a registry. I've checked it. No Wren. There never has been. Go home, Calder." },
  { sfx = "door-creak" },
  { say = "calder", text = "I went back to my office. I put the coin in the top drawer, under the bad coffee. I locked the drawer. I put the key in my shoe. Then I sat with my back to the wall until morning." },
  { pause = 1.0 },
  { say = "calder", text = "In the morning, the drawer was still locked. The key was still in my shoe. The coin was gone." },
  { say = "calder", text = "In its place, a note. Very neat handwriting." },
  { say = "wren", text = "Thank you so much for keeping it safe. Do forgive the intrusion. W.", fx = "whisper" },
  { sting = "crime" },
  { say = "announcer", text = "Who is Mister Wren? And how does he get into a locked drawer? Join us tomorrow night, on The Long Dark." },
]

# ── Episode 3: Neat Handwriting ───────────────────────────────────────────────

[[clip]]
id = "ep-03-a"
category = "show"
title = "Episode Three: Neat Handwriting"
serial = { id = "the-long-dark", episode = 3 }
bed = "room"
lines = [
  { sting = "crime" },
  { say = "announcer", text = "Previously, on The Long Dark. Mister Wren put out every light on Penumbra Station to say hello. He left a black coin that drinks the light, and then he took it back, from a locked drawer, with a thank you note." },
  { say = "announcer", text = "Station Master Ashby says there is no Wren. The registry agrees. Episode three. Neat Handwriting.", gap = 0.8 },
  { say = "mags", text = "Hold it to the light, Ines. Go on. Look at the end of the bar." },
  { say = "calder", text = "The bar's opening night. Forty years ago. That's you, at the taps." },
  { say = "mags", text = "Nineteen, and too proud to smile. Now look at the end." },
  { say = "calder", text = "A man in a grey coat. With a glass of water." },
  { say = "mags", text = "Same coat. Same face. Same age. I've got one of these from every year, love. He's in all of them. Never a day older." },
  { say = "calder", text = "How does a man not age for forty years?" },
  { say = "mags", text = "He doesn't stand in the light long enough for it to catch him. That's what I think. Light's what ages you. Ask anybody's curtains." },
  { say = "calder", text = "I looked at the photographs a long time. In every one, he was looking at the camera. Politely. Like he was sorry to be in the picture, and glad to be asked." },
]

[[clip]]
id = "ep-03-b"
category = "show"
title = "Episode Three: Neat Handwriting"
serial = { id = "the-long-dark", episode = 3 }
bed = "cockpit"
lines = [
  { say = "announcer", text = "Back in the Lamp Room, Dov Haskett had found something. He did not like it. He showed it to the Lamp first, and the Lamp didn't like it either." },
  { say = "haskett", text = "The visitors' book, Detective. Everybody who comes into the Lamp Room signs in. Rules." },
  { say = "calder", text = "Nobody comes into the Lamp Room." },
  { say = "haskett", text = "Nobody but me. And look. Every night. Three in the morning. One letter. W. Very neat." },
  { say = "calder", text = "How far back?" },
  { say = "haskett", text = "Every page. Forty years of pages. I thought it was the night man. Never thought about it." },
  { say = "calder", text = "Who's the night man?" },
  { say = "haskett", text = "We haven't had a night man, Detective, since before they built Ring Two." },
  { pause = 1.0 },
  { say = "calder", text = "Then tonight, Haskett, I'm the night man." },
  { sting = "crime" },
  { pause = 1.0 },
  { say = "calder", text = "Two in the morning. The Lamp hummed. I sat behind a crate of spare bulbs with a torch in my lap and a cold cup of something that had been coffee." },
  { say = "calder", text = "Half past two. Haskett went home. He patted the glass on his way out, and said goodnight to her. I didn't laugh. I wanted to." },
  { say = "calder", text = "Three o'clock." },
  { sfx = "door-creak" },
  { pause = 1.2 },
  { say = "calder", text = "Nobody came in. But somebody passed me. I felt them go by, close enough to smell the cold on their coat." },
  { say = "wren", text = "Pardon me.", fx = "whisper" },
  { say = "wren", text = "So sorry. Excuse me.", fx = "whisper" },
  { say = "calder", text = "Who's there? Station Security. Stand still." },
  { pause = 1.0 },
  { say = "announcer", text = "And for the first time in forty years, the Lamp went out." },
  { sfx = "zap" },
  { pause = 2.0 },
  { say = "calder", text = "Black. Not dark. Black. The kind you can hear." },
  { sfx = "whoosh" },
  { say = "announcer", text = "A match flared. And behind it, holding it up as if it were a candle on a birthday cake, was Mister Wren." },
  { say = "wren", text = "I thought you'd want to see. Most people do." },
  { sting = "halloween" },
  { say = "announcer", text = "The Lamp is out. The detective is alone with Mister Wren. Tomorrow night, on The Long Dark." },
]

# ── Episode 4: A Match in the Lamp Room ───────────────────────────────────────

[[clip]]
id = "ep-04-a"
category = "show"
