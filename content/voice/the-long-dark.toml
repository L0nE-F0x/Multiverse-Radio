[[clip]]
id = "ep-06-b"
category = "show"
title = "Episode Six: The Tern Comes In"
serial = { id = "the-long-dark", episode = 6 }
bed = "fluorescent"
lines = [
  { say = "announcer", text = "The hold of the Tern. Two hundred crates. Ten thousand floodlights, packed in straw, bound for Station Master Ashby." },
  { say = "calder", text = "Captain. Open one." },
