bed = "organ"
dates = ["10-24", "10-25", "10-26", "10-27", "10-28", "10-29", "10-30", "10-31"]
lines = [
  { sting = "halloween" },
  { say = "announcer", text = "For Halloween, the Penumbra Players perform a traditional ghost story. The role of the ghost is played by Mister Wren, who asked for it, very politely, eleven times." },
  { say = "wren", text = "Woo. Is that right? Woo. I'm so sorry. Woo." },
  { say = "announcer", text = "He is the least frightening ghost the Players have ever cast. He apologises to every door before he walks through it." },
