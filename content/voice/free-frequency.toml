[[clip]]
id = "show-midnight-001"
category = "dj"
show = "midnight-theory"
lines = [
  { say = "kate", text = "Tonight's theory. The Nightjar isn't lost. It has never once been lost. Lost is when you don't know where you're going." },
  { say = "kate", text = "Somebody knows. And if it isn't you, operator, and it isn't me, then there's only one voice on that ship left to..." },
  { pause = 0.6 },
  { say = "kate", text = "Ask. Ask her. That's all. Nicely." },
]

[[clip]]
