# Free Frequency — drifts through the Outer Band, a different gap every local night.
#
# Static Kate broadcasts from an attic that moves, under egg-box soundproofing, beside a
# corkboard of relay-ship blueprints joined up with string. She has been tracking the
# Nightjar for years. She is fast, wry and half-right about everything, and she is sure
# HUSH can hear her. (HUSH can.) Mole is her source at the relay depot; listeners ring in
# with sightings.
#
# Her theories track the off-course arc without knowing where the listener is in it:
# retired relay ships, a harbour on old charts, a heading that keeps changing, a course
# set before the operator came aboard, a light left on, three notes on a beacon.
#
# HUSH jams her: the director sometimes cuts a line mid-sentence with a static burst and a
# `_ship` clip (`kit = "jam"`). Lines are written so the cut lands on the good bit.
#
# Tomorrow: one clip per drift frequency, `kit = "tomorrow-<MHz>"`, announcing tomorrow
# night's frequency in a code an attentive listener can work out. The director airs the
# one for tomorrow's frequency. None of the other clips names a frequency she's on.
station = "free-frequency"

[voices]
kate = { voice = "af_river", speed = 1.05, name = "Static Kate" }
mole = { voice = "am_echo", fx = "phone", name = "Mole, a Source" }
caller = { voice = "af_nova", fx = "phone", name = "A Listener" }
caller2 = { voice = "am_eric", fx = "phone", name = "Another Listener" }
hush = { voice = "af_heart", speed = 0.95, fx = "ship", name = "HUSH" }
loft = { voice = "am_fenrir", speed = 1.08, name = "Someone at the Bulkhead" }

[[show]]
id = "corkboard-hour"
name = "The Corkboard Hour"
blurb = "Static Kate goes through the string on the board, pin by pin. Some of the pins are right."
start = 19
end = 21

[[show]]
id = "midnight-theory"
name = "The Midnight Theory"
blurb = "One theory, all night, until HUSH turns it down. Pirate radio for the small hours."
start = 0
end = 3

