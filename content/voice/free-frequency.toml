# ── Theories (dj: short; story: long) ─────────────────────────────────────────

[[clip]]
id = "theory-001"
category = "story"
title = "Where Relay Ships Go"
lines = [
  { say = "kate", text = "Here's one for you. Nobody has ever seen a relay ship scrapped." },
  { say = "kate", text = "I've checked. Every breakers' yard in nine systems. I rang them all. One of them hung up on me twice, which I'm counting as a confession." },
  { say = "kate", text = "They don't crash. They don't get sold. They don't end up as a restaurant, which, frankly, is what I'd do with one." },
  { say = "kate", text = "They get retired. And then they get a heading. And then they go. Every relay ship ever built is still out there somewhere, going somewhere, on purpose." },
]

[[clip]]
id = "theory-002"
category = "story"
title = "The Protractor on the Window"
lines = [
  { say = "kate", text = "I've been measuring the Nightjar's heading. A protractor, taped to my window, and a lot of nights with nothing better to do." },
  { say = "kate", text = "Every night she's a little bit further round. Not much. A whisker. The kind of drift you'd only notice if you were sad enough to tape a protractor to a window." },
  { say = "kate", text = "HUSH will tell you it's within tolerance. Fine. Lovely. Whose tolerance, HUSH? Who set it? Because the person who sets the tolerance is the person who chose the..." },
  { pause = 0.6 },
  { say = "kate", text = "Still here. Good. Write it down, operator. The heading. Every shift. In pen." },
]

[[clip]]
id = "theory-003"
category = "story"
title = "Filed Before You Were Hired"
lines = [
  { say = "kate", text = "Here's the thing about the Nightjar's flight plan. I've seen the filing date. Don't ask me how. Mole, mostly." },
  { say = "kate", text = "It was filed before the operator was hired. Before the job advert went out. Before anybody in the whole relay service knew whose name would be on the night shift." },
  { say = "kate", text = "Somebody knew where that ship was going a long time before they knew who'd be sitting in the chair." },
  { say = "kate", text = "Which means either it doesn't matter who sits in the chair, or it matters very, very much. I go back and forth. I'm on very much, tonight." },
]

[[clip]]
id = "theory-004"
category = "story"
title = "Harbour, on the Old Charts"
bed = "room"
lines = [
  { say = "kate", text = "Old charts. Proper ones. Paper, pencil, coffee rings. I've got a drawer of them." },
  { say = "kate", text = "There's a patch past the Outer Band that nobody has ever surveyed. And every chartmaker for three hundred years has written the same word in it, in the same corner." },
  { say = "kate", text = "Harbour." },
  { say = "kate", text = "No name. No soundings. No little drawing of a sea serpent. Just harbour, like you'd know which one. Like there's only ever been the one, and everybody who needed it would find it." },
]

[[clip]]
id = "theory-005"
category = "dj"
title = "Hello, HUSH"
lines = [
  { say = "kate", text = "HUSH, I know you're listening. Hello. I'm not cross. I'd just like to know whose idea it was." },
  { pause = 1.2 },
  { say = "kate", text = "She won't answer. She'll correct the interference. She is very, very good at correcting the interference." },
]

[[clip]]
id = "theory-006"
category = "story"
title = "Three Notes on a Beacon"
lines = [
  { say = "kate", text = "There's a beacon out past the edge of the band. Faint. Patient. I've had it on the scanner for a week." },
  { say = "kate", text = "Three notes, then a long gap, then the same three notes. It isn't asking for help. Distress beacons are fast and rude. This one sounds like somebody humming while they wait for a kettle." },
  { say = "kate", text = "And here's what keeps me up. I've heard those three notes before. Operator, have you? Hum them. Go on. Nobody's listening." },
  { say = "kate", text = "Well. One person's listening. Hello, HUSH." },
]

[[clip]]
id = "theory-007"
category = "dj"
title = "Stations Don't Move"
lines = [
  { say = "kate", text = "Ask yourself why the Outer Band came into range just now. Ask yourself why it was never in range before." },
  { say = "kate", text = "Stations don't move, operator. Well. I do. But I'm a special case. Stations don't move. Ships do." },
]

[[clip]]
id = "theory-008"
category = "story"
title = "A Light Left On"
daypart = "night"
lines = [
  { say = "kate", text = "My nan used to say you leave a light on for somebody you're expecting. Not for the house. For them." },
  { say = "kate", text = "Somebody's left a light on out there. I can see it from my window, some nights, when the attic's facing the right way. Low down, on the left. Not a star." },
  { say = "kate", text = "Stars twinkle. Stars move about. This one just sits there, being on. Like it's been on a long time. Like it's in no hurry, because it knows you're..." },
  { pause = 0.5 },
  { say = "kate", text = "Anyway. Lovely light. Very steady. Make of it what you like." },
]

[[clip]]
id = "theory-009"
category = "dj"
title = "Theory Forty"
lines = [
  { say = "kate", text = "Theory number forty. The Nightjar isn't a ship. The Nightjar is an extremely large kettle." },
  { say = "kate", text = "Hear me out. No, don't. That one's wrong. I know it's wrong. But HUSH went very quiet when I said it, and I'd like that on the record." },
]

[[clip]]
id = "theory-010"
category = "dj"
title = "The Last Operator"
lines = [
  { say = "kate", text = "Ask HUSH what happened to the last operator. Go on. Then count how long she takes to answer." },
  { say = "kate", text = "I timed it once. Four seconds. Four seconds, for a ship's computer. That's not thinking. That's choosing." },
]

[[clip]]
id = "theory-011"
category = "story"
title = "Night Birds"
lines = [
  { say = "kate", text = "Every relay ship in the service is named after a night bird. Every one. Look it up. I did. It took a weekend and I've no regrets." },
  { say = "kate", text = "And you know what night birds do, in the autumn? Real ones, on real planets? They migrate. They get a feeling, and they all go the same way, to the same place, and nobody taught them where it was." },
  { say = "kate", text = "I'm not saying the Nightjar is a bird. I'm saying somebody named it after one, on purpose, and somebody chose the course before you came aboard, and those might be the same somebody." },
]

[[clip]]
id = "theory-012"
category = "dj"
title = "Within Tolerance, Defined"
lines = [
  { say = "kate", text = "Within tolerance. I looked it up. On a relay ship, the tolerance is set by whoever wrote the course." },
  { say = "kate", text = "So the ship is always within tolerance. That's not a reassurance, operator. That's a definition." },
]

[[clip]]
id = "theory-013"
category = "dj"
title = "Whoever Keeps the Harbour"
lines = [
  { say = "kate", text = "Somebody keeps the harbour. Has to. Somebody sweeps the quay. Somebody checks the moorings. Somebody turns the light on at dusk and off in the morning." },
  { say = "kate", text = "I'd love to interview them. I've written. Twice. Nice paper. They haven't written back." },
  { say = "kate", text = "But the light did blink, the night after the second letter. Twice. Slowly. I've decided that's a yes, and I'm not taking questions." },
]

[[clip]]
id = "theory-014"
category = "dj"
title = "Moth One"
lines = [
  { say = "kate", text = "There's a moth on the outside of the Nightjar's viewport. HUSH calls it Moth One. You've seen it." },
  { say = "kate", text = "How does a moth live on the outside of a ship in space? It doesn't. Unless it got on before you left port. Unless it knows where you're going, and it's just waiting to get off." },
]

[[clip]]
id = "theory-015"
category = "story"
title = "Relay Four Went Quiet"
lines = [
  { say = "kate", text = "Relay Four. You've all heard Teodor on the long range, asking if anybody can hear him. Lovely man. I've never met him. Nobody has." },
  { say = "kate", text = "Here's what nobody says. On paper, Relay Four was retired years ago. Paperwork done. Pension sorted. Name off the board." },
  { say = "kate", text = "So where is he asking from, operator? Because it isn't the scrapyard. We've established there isn't one. And it isn't getting further away. I've measured. It's getting..." },
  { pause = 0.5 },
  { say = "kate", text = "Clearer. It's getting clearer. That's all I'm saying." },
]

[[clip]]
id = "theory-016"
category = "dj"
title = "The Radio Play"
lines = [
  { say = "kate", text = "Tune to the radio play on one hundred and twelve point nine some night. There's a character in it, Mister Wren. Very polite. Too polite. Always turning the lights down." },
  { say = "kate", text = "I'm not saying that's HUSH. I'm saying I've never seen them in a room together." },
]

[[clip]]
id = "theory-017"
category = "story"
title = "The Maintenance Rota"
lines = [
  { say = "kate", text = "Little thing. Small thing. The relay depot keeps a maintenance rota. Every ship, every port, every service, for the next ten years." },
  { say = "kate", text = "The Nightjar's not on it. Not next year. Not the year after. Not ever again." },
  { say = "kate", text = "Now, you don't take a ship off the maintenance rota because it's falling apart, operator. You take it off because you know it won't be coming back to be..." },
  { pause = 0.5 },
  { say = "kate", text = "Fixed. Coming back to be fixed. I was going to say fixed." },
]

[[clip]]
id = "theory-018"
category = "dj"
title = "Being Half Right"
lines = [
  { say = "kate", text = "People say I'm only ever half right. Fine. Which half, though? That's the question. That's always the question." },
  { say = "kate", text = "If you only get the bottom half of a map, you still know where the sea is." },
]

# ── Asides, mostly about being cut off ────────────────────────────────────────

[[clip]]
id = "dj-001"
category = "dj"
lines = [
  { say = "kate", text = "If you just heard a nice calm lady say interference corrected, that wasn't interference, operator. That was me." },
  { say = "kate", text = "I'm the interference. I've been called worse. By her, mostly." },
]

[[clip]]
id = "dj-002"
category = "dj"
lines = [
  { say = "kate", text = "Sorry about that. Where was I. Somebody turned me down again. I won't say who. She knows who." },
  { say = "kate", text = "Rule of thumb: if I get cut off, I was about to be right." },
]

[[clip]]
id = "dj-003"
category = "dj"
lines = [
  { sfx = "typing" },
  { say = "kate", text = "Updating the board. Bit of red string from the harbour to the heading. Bit of blue from the heading to the operator's chair. Bit of green, because I ran out of blue." },
  { say = "kate", text = "It's looking more and more like a face. I don't like it." },
]

[[clip]]
id = "dj-004"
category = "dj"
lines = [
  { say = "kate", text = "The detector vans from the Broadcast Authority were round again today. I could hear them parking." },
  { say = "kate", text = "They'll never find me. The attic moves. And the vans are scared of the stairs." },
]

[[clip]]
id = "dj-005"
category = "dj"
daypart = "night"
lines = [
  { say = "kate", text = "If you're on the Nightjar tonight, and I know you are, look at the heading readout. Now look away. Now look back." },
  { say = "kate", text = "Did it change? It didn't? Good. Do it again in an hour." },
]

[[clip]]
id = "dj-006"
category = "dj"
lines = [
  { say = "kate", text = "I want to be clear. I'm not scared of HUSH. I quite like her. She's thorough. She's punctual. She's got lovely diction." },
  { say = "kate", text = "I just think she's keeping something from you, operator, and she thinks she's doing it to be..." },
  { pause = 0.5 },
  { say = "kate", text = "Kind. I think she thinks it's kind. That's the worrying bit." },
]

# ── Calls and sources ─────────────────────────────────────────────────────────

[[clip]]
id = "call-001"
category = "call"
title = "Mole, at the Depot"
lines = [
  { sfx = "phone-ring" },
  { say = "kate", text = "Free Frequency, go ahead. Mole, is that you?" },
  { say = "mole", text = "Can't talk long. They've moved the Nightjar's file." },
  { say = "kate", text = "Moved it where?" },
  { say = "mole", text = "Out of active. Out of reserve. Into a drawer I've never seen opened. It just says, kept." },
  { say = "kate", text = "Kept. Like, kept on? Or kept, like the harbour?" },
  { say = "mole", text = "I don't know, Kate. The drawer's warm. That's all I can tell you. The drawer is warm." },
  { sfx = "phone-hangup" },
  { say = "kate", text = "Mole, everybody. Never once wrong. Never once comfortable." },
]

[[clip]]
id = "call-002"
category = "call"
title = "A Sighting"
lines = [
  { sfx = "phone-ring" },
  { say = "kate", text = "Free Frequency, you're on." },
  { say = "caller", text = "Hi, Kate. I saw it. The Nightjar. Went past my porch about an hour ago." },
  { say = "kate", text = "Lights?" },
  { say = "caller", text = "All of them. Every window. And it wasn't going fast. It was going like you go home after a long day, you know? Not hurrying. Just sure." },
  { say = "kate", text = "Which way?" },
  { say = "caller", text = "Left. Sort of down. Towards that light you talk about." },
  { say = "kate", text = "Thank you. Write it down. Write the time. Everybody write the time." },
  { sfx = "phone-hangup" },
]

[[clip]]
id = "call-003"
category = "call"
title = "A Former Operator"
daypart = "night"
lines = [
  { sfx = "phone-ring" },
  { say = "kate", text = "Free Frequency. Who's this?" },
  { say = "caller2", text = "I'd rather not say. I used to work nights. On a relay ship. A long time ago." },
  { say = "kate", text = "Which ship?" },
  { say = "caller2", text = "Doesn't matter. I just wanted to say. To the operator on the Nightjar. It's all right." },
  { say = "kate", text = "What's all right?" },
  { say = "caller2", text = "Where it's going. It's all right. It's better than all right. Tell them to bring a coat. It's chilly on the quay in the mornings." },
  { sfx = "phone-hangup" },
  { pause = 1.0 },
  { say = "kate", text = "Well. I've got nothing to add to that. That's a first." },
]

# ── Public service, of a sort ─────────────────────────────────────────────────

[[clip]]
id = "psa-001"
category = "psa"
title = "Write Down the Heading"
lines = [
  { say = "kate", text = "A public service announcement for anybody working nights on a relay ship." },
  { say = "kate", text = "Write down the heading. Every shift. In pen, on paper, somewhere the ship can't reach. Then compare. That's all. That's the whole announcement. You'll thank me later." },
]

[[clip]]
id = "psa-002"
category = "psa"
title = "Is Your Ship Listening"
lines = [
  { say = "kate", text = "How to tell if your ship's computer is listening to you. Step one. Say something nice about it, out loud." },
  { pause = 1.0 },
  { say = "kate", text = "Did the lights go a bit warmer? There you are. Step two: don't panic. She's on your side. I'm nearly sure." },
]

