  { say = "kate", text = "Tomorrow, find the people who do the traffic on the eights. Now go down half a step. Half a megahertz. Exactly half." },
  { say = "kate", text = "Or, a hundred and fourteen, then the corners on a triangle. Two clues. I'm feeling generous. Don't get used to it." },
]

[[clip]]
id = "tomorrow-1152"
category = "dj"
kit = "tomorrow-115.2"
title = "Tomorrow, in Code"
lines = [
  { sfx = "morse" },
  { say = "kate", text = "Tomorrow night's code. A hundred and fifteen, and after the point, the wheels on a bicycle." },
  { say = "kate", text = "A normal bicycle. Not the one my uncle built. His had five, and it went sideways." },
]

[[clip]]
id = "tomorrow-11605"
category = "dj"
kit = "tomorrow-116.05"
title = "Tomorrow, in Code"
lines = [
  { sfx = "morse" },
  { say = "kate", text = "Tomorrow. One hundred and sixteen. Then a point. Then nothing at all. Then the fingers in one glove." },
  { say = "kate", text = "The nothing matters, operator. Don't skip the nothing. People always skip the nothing." },
]

[[clip]]
id = "tomorrow-11695"
category = "dj"
kit = "tomorrow-116.95"
title = "Tomorrow, in Code"
lines = [
  { sfx = "morse" },
  { say = "kate", text = "Tomorrow night, I'll be just short of a hundred and seventeen. Short by five hundredths. Five pence short of a pound." },
  { say = "kate", text = "Like a train that stops just before the platform, and everybody has to step down onto the gravel. Mind the gravel." },
]

[[clip]]
id = "tomorrow-11785"
category = "dj"
kit = "tomorrow-117.85"
title = "Tomorrow, in Code"
lines = [
  { sfx = "morse" },
  { say = "kate", text = "Tomorrow, nearly the top of the band. A hundred and seventeen. Then a point. Then seventeen lots of five." },
  { say = "kate", text = "Do the sum. Use your fingers. I won't tell. The sum is the frequency, and the frequency is where I'll be." },
]

# ── The Convergence (Saturdays, 20:00 UTC) ────────────────────────────────────

[[clip]]
id = "convergence-missing-moon"
category = "event"
event = "convergence"
kit = "missing-moon"
lines = [
  { say = "kate", text = "A moon's gone. Everybody's on about it. I'll tell you which one. The one that was in the way." },
  { say = "kate", text = "In the way of what? Look at the heading, operator. Then tell me it's a coincidence." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "kate", text = "Everywhere smells of toast. You know what toast is? Bread that's been somewhere warm and come back changed." },
  { say = "kate", text = "I'm just saying. I'm not saying anything. I'm saying it twice." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
event = "convergence"
kit = "the-song"
lines = [
  { say = "kate", text = "Everybody's humming the same song and nobody can finish it. Three notes, then nothing." },
  { say = "kate", text = "Operator, I bet you know the next bit. I bet HUSH does. I bet it's on a beacon somewhere." },
]

[[clip]]
id = "convergence-the-knock"
category = "event"
event = "convergence"
kit = "the-knock"
lines = [
  { sfx = "door-creak" },
  { say = "kate", text = "Three knocks. My door too. On an attic that moves. I didn't answer." },
  { say = "kate", text = "You don't answer the door when you know who it is. You put the kettle on and wait for them to let themselves in." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "kate", text = "The sky went a colour nobody's got a word for. I've got a word for it." },
  { say = "kate", text = "Heading. That's the colour of a heading, changing. I'd know it anywhere." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "kate", text = "There's a pigeon in the attic. Walked in like it pays rent. Sat on the board, right on the harbour pin." },
  { say = "kate", text = "Homing pigeons always know the way home. Whose home, though, little one? Whose home?" },
]

