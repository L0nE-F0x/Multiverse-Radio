# Numbers Station Omega — The Counter, coordinates withheld.
# Flat, even number readings that drift into oddly specific, personal messages. Readings
# air over the music box (over_music = true) and are framed with chimes.
# Bits: seven seven four, the geese you owe, the fox at the bottom of the mast.
station = "numbers-omega"

[voices]
host = { voice = "af_kore", speed = 0.9, fx = "radio", name = "The Counter" }

