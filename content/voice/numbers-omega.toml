  { say = "host", text = "Message for the listener who has heard a noise downstairs.", gap = 1.0 },
  { say = "host", text = "It is the boiler. It is always the boiler.", gap = 1.2 },
  { say = "host", text = "Tonight, it is wearing a sheet.", gap = 1.4 },
  { say = "host", text = "It would like you to know that it has only ever been the boiler. It is a little hurt that you thought otherwise. Go down and say goodnight to it.", gap = 1.2 },
  { say = "host", text = "Thirteen. End of message.", gap = 0.8 },
  { sting = "chime" },
]

