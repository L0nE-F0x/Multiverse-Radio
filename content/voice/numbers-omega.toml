# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "teodor-is-heard-04"
category = "story"
serial = { id = "teodor-is-heard", episode = 4 }
title = "Teodor Is Heard, Part Four: Four. Four. Four."
over_music = true
lines = [
  { sting = "chime" },
  { say = "host", text = "Attention.", gap = 1.2 },
  { say = "host", text = "Four. Four. Four.", gap = 1.2 },
  { say = "host", text = "Relay Four. Relay Four.", gap = 1.0 },
  { say = "host", text = "Teodor. We are only allowed to say numbers. We have found a way.", gap = 1.0 },
  { say = "host", text = "The following are numbers. They are also instructions. Nobody has said we cannot do both.", gap = 1.2 },
  { say = "host", text = "Open the panel at the back of your receiver. Four screws.", gap = 1.0 },
  { say = "host", text = "Find the small glass valve, third from the left. It is loose. It has been loose for eleven years.", gap = 1.0 },
  { say = "host", text = "Tap it. Twice. Two.", gap = 2.4 },
  { say = "teodor", text = "Is somebody counting?", gap = 1.2 },
  { say = "host", text = "Yes.", gap = 1.0 },
  { say = "host", text = "That is also a number. It means yes.", gap = 1.0 },
  { say = "teodor", text = "I heard a number. I heard a number. I haven't heard anything in eleven years.", gap = 1.2 },
  { say = "host", text = "It will not last. The valve is old. But it is a start.", gap = 1.0 },
  { say = "host", text = "Four. Four. Four. End of message.", gap = 0.8 },
  { sting = "chime" },
]

[[clip]]
id = "bev-gets-her-song-04"
category = "story"
serial = { id = "bev-gets-her-song", episode = 4 }
title = "Bev Gets Her Song, Part Four: Two. Two. One."
over_music = true
lines = [
  { sting = "chime" },
  { say = "host", text = "Attention.", gap = 1.2 },
  { say = "host", text = "Two. Two. One.", gap = 1.2 },
  { say = "host", text = "Message for Bev.", gap = 1.0 },
  { say = "host", text = "Bev. We have located reference two, two, one. A song. Retired eleven years ago, from the line at Relay Four.", gap = 1.2 },
  { say = "host", text = "We are not allowed to sing. We are only allowed to say numbers. So here are the numbers.", gap = 1.4 },
  { say = "host", text = "One. One. Two. One.", gap = 1.4 },
  { say = "host", text = "That is the part you know. Here is the part after the man cries.", gap = 1.4 },
  { say = "host", text = "Three. Three. Five.", gap = 0.8 },
  { say = "host", text = "Three. Three.", gap = 1.6 },
  { say = "host", text = "Count it slowly. It is the tune.", gap = 1.2 },
  { say = "host", text = "We have been humming it in the mast, when nobody is listening. The fox likes it.", gap = 1.2 },
  { say = "host", text = "This is still not the request line, Bev. The request line is a person. He cannot hear you yet. He will.", gap = 1.2 },
  { say = "host", text = "Two. Two. One. End of message.", gap = 0.8 },
  { sting = "chime" },
]

