# Afterparty at the Heat Death — 117.4, the top of the dial, the last warm place in the universe.
#
# DJ Entropy hosts: gentle, unhurried, a little sad and very kind; calls everyone "love". The
# crowd is three guys (Dov, Wendell, and a third guy who has never said his name) and Lorraine,
# a nebula about forty light years wide who has never missed a night. One warm bulb over the
# decks. The stars are going out one by one, and the beat loses a little tempo every hour (the
# director lowers the BPM through the night; the scripts only say it is slowing, never a number).
#
# The `goodnight` kit is a dedication: Entropy notices a star going out, one to three short
# eulogies, and a goodnight. Shows: The Warm-Up (20–23), The Long Fade (2–5), Morning, Anyway
# (7–10). Cross-station: Bev and the request line, Grumbel's Ladders, Greg's show (Monday).
station = "heat-death-afterparty"

[voices]
host = { voice = "bf_emma", speed = 0.9, name = "DJ Entropy" }
dov = { voice = "am_liam", speed = 0.95, name = "Dov" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
announcer = { voice = "bm_george", speed = 0.95, name = "Announcer" }

[[show]]
id = "the-warm-up"
name = "The Warm-Up"
blurb = "The universe is two degrees above absolute zero. Somebody has to warm it up."
start = 20
end = 23

[[show]]
id = "the-long-fade"
name = "The Long Fade"
blurb = "The slowest hours. The beat sinks low, the stars go out faster, and nobody leaves."
start = 2
end = 5

[[show]]
id = "morning-anyway"
name = "Morning, Anyway"
blurb = "There's no sunrise at the end of the universe. The third guy holds the lamp up high, and we call it dawn."
start = 7
end = 10

