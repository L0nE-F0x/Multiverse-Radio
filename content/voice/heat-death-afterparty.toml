# ── Goodnight: a star goes out, one to three eulogies, a goodnight ───────────

[[clip]]
id = "goodnight-open-1"
category = "dj"
kit = "goodnight"
part = "open"
lines = [
  { say = "host", text = "Excuse me, everybody. Quick dedication. Look up, just there, to the left." },
]

[[clip]]
id = "goodnight-open-2"
category = "dj"
kit = "goodnight"
part = "open"
lines = [
  { say = "host", text = "Hold on. Look up, everybody. Over there. Just going now." },
  { pause = 1.0 },
]

[[clip]]
id = "goodnight-001"
category = "dj"
kit = "goodnight"
part = "body"
lines = [
  { say = "host", text = "That was Little Wenna, a yellow star in the Brass Reach. Eleven billion years old. She warmed four planets, and a comet that kept coming back to visit." },
  { say = "host", text = "She went out just now, very quietly, the way she did everything." },
]

[[clip]]
id = "goodnight-002"
category = "dj"
kit = "goodnight"
part = "body"
lines = [
  { say = "host", text = "That was Old Corvane, a red dwarf, out past the Long Spiral. Not much to look at. Never was." },
  { say = "host", text = "But he burned for a trillion years, steady as anything, and he never once let anybody down." },
]

[[clip]]
id = "goodnight-003"
category = "dj"
kit = "goodnight"
part = "body"
lines = [
  { say = "host", text = "That was Hespera Nine. Blue, very bright, gone young. She used to be the first star out in the evening, on a little moon called Fallow, and every night a child would wish on her." },
  { say = "host", text = "The child grew up. The wish came true. Hespera never knew. So I'm telling her now." },
]

[[clip]]
id = "goodnight-004"
category = "dj"
kit = "goodnight"
part = "body"
lines = [
  { say = "host", text = "That was the Twins, two stars going round each other, out in the Quiet Arm. They went out at exactly the same moment." },
  { say = "host", text = "Neither of them had to be the one left. That's lucky, love. That's the luckiest thing I know." },
]

[[clip]]
id = "goodnight-005"
category = "dj"
kit = "goodnight"
part = "body"
lines = [
  { say = "host", text = "That was a little orange star nobody ever named. So I'm naming him now. Gloam. Small, a bit shy, out on the edge of things." },
  { say = "host", text = "Like us, really. Goodnight, Gloam. You had a name all along." },
]

[[clip]]
id = "goodnight-006"
category = "dj"
kit = "goodnight"
part = "body"
lines = [
  { say = "host", text = "That was a star called Patience, the last one in her whole galaxy. She waited a very long time for company." },
  { say = "host", text = "Then she heard the music. And she held on, just long enough, for one more drop." },
]

[[clip]]
