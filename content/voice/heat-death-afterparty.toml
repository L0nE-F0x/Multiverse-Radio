  { say = "host", text = "Did anyone hear the Quiet Corner last night? Greg's show, on the Lounge at the End of Time. I put my ear right up against the speaker." },
  { say = "host", text = "A little breathing, a long pause, and once, very softly, the word, okay. That's an honest show, love. We played it to Lorraine. She liked the pauses." },
