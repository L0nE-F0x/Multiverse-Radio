  { say = "host", text = "Someone says a moon's gone missing. Out here, love, we've been missing moons for ages. Most of them, honestly. But a new one? That's nearly news." },
  { say = "host", text = "The guys are looking under the speakers. Lorraine's checking her pockets. She hasn't got pockets." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "host", text = "Toast. Everything smells of toast. There hasn't been any toast for a hundred trillion years. Dov's crying." },
  { say = "host", text = "The third guy says, that's my nan's kitchen. That's the most he's ever said. Somebody, somewhere, is making breakfast. Good." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
event = "convergence"
kit = "the-song"
lines = [
  { say = "host", text = "Everybody's humming the same song. Even Lorraine, low and slow, from forty light years off. Nobody knows how it ends." },
  { say = "host", text = "Maybe it doesn't, love. Let's just keep humming." },
]

[[clip]]
id = "convergence-the-knock"
category = "event"
event = "convergence"
kit = "the-knock"
lines = [
  { say = "host", text = "Three knocks. Out here. There's no door. There's nothing to knock on for a very long way. The guys have gone very quiet." },
  { say = "host", text = "Come in, whoever you are. It's warm by the decks." },
]

[[clip]]
id = "convergence-wrong-colour"
category = "event"
event = "convergence"
kit = "wrong-colour"
lines = [
  { say = "host", text = "The dark has gone a colour. Out here, where nothing has had a colour for ages. Not red. Not blue. Something new. Lorraine's trying to match it." },
  { say = "host", text = "First new colour in a trillion years, love. Let's dance in it." },
]

[[clip]]
id = "convergence-the-pigeon"
category = "event"
event = "convergence"
kit = "the-pigeon"
lines = [
  { say = "host", text = "A pigeon just walked onto the dance floor. At the end of the universe. The guys have never seen a bird. It's walking round each of them, like it knows them." },
  { say = "host", text = "Now it's looking at me. Hello, love. Did you come far?" },
]
