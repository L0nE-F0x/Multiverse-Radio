  { say = "ron", text = "Why not?" },
  { say = "dibbs", text = "Because the last time, something plugged itself in.", gap = 1.2 },
  { say = "ron", text = "Right." },
  { say = "host", text = "Lovely, Ron. Send us a picture." },
  { sfx = "phone-hangup" },
]

