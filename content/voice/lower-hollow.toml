# Lower Hollow Community Radio — 89.7, Lower Hollow (population: fluctuating).
#
# A cosy little town built round the rim of an enormous, perfectly round hole. Maureen
# Pettigrew, retired volunteer, reads every notice with the same gentle urgency, including the
# ones about the hole. Councillor Dibbs has chaired the Hole Committee for thirty years and has
# never once said what the hole is. Things float up out of it; everyone politely ignores them.
#
# Modular kits (the director chains open → 1–3 bodies → close):
#   notices (psa)  — the community noticeboard: bake sales, lost pets, lost and found
#   council (news) — the Hole Committee's update; bodies are agenda items
# Running bits: Biscuit the spaniel, who is not lost, he's busy (watching the hole); things
# returned by the hole; "the hole remains". Cross-station: Greg the shadow and Hollis.
station = "lower-hollow"

[voices]
host = { voice = "af_river", name = "Maureen Pettigrew" }
dibbs = { voice = "bm_daniel", name = "Councillor Dibbs" }
ron = { voice = "am_eric", fx = "phone", name = "Ron, Rim Lane" }

[[show]]
id = "morning-notices"
name = "Morning Notices"
blurb = "Maureen with the noticeboard, the birthdays and the overnight hole report."
start = 7
end = 10

[[show]]
id = "committee-hour"
name = "The Committee Hour"
blurb = "Councillor Dibbs and the week's business. The hole remains."
start = 18
end = 20
host = "Councillor Dibbs"

[[show]]
id = "rim-watch"
name = "Rim Watch"
blurb = "Overnight with Maureen, a flask and the binoculars, keeping an eye on the hole so you don't have to."
start = 0
end = 4

