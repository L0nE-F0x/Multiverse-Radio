  { say = "ron", text = "Hello, Maureen. It's Ron, from Rim Lane." },
  { say = "host", text = "Hello, Ron. How's the knee?" },
  { say = "ron", text = "Better, thanks. Maureen, I want to put fairy lights up round the hole for the winter. All the way round." },
  { say = "host", text = "That's a lot of lights, Ron." },
