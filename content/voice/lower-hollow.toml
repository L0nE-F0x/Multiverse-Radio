  { say = "dibbs", text = "Several residents have asked the committee what the hole is. The committee thanks residents for their interest. The committee has been asked this question every week for thirty years." },
  { say = "dibbs", text = "And the committee is pleased to say that it has, after careful consideration, once again decided to move on to item three." },
]

