  { say = "dibbs", text = "The committee met on Thursday. Item one. The hole. The committee noted the hole." },
  { say = "dibbs", text = "Item two. The fence around the hole. The committee noted that the fence is now also, somewhat, in the hole. A new fence has been ordered. It will be placed slightly further back, as is customary." },
]

[[clip]]
