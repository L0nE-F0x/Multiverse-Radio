# Mirror World Polka Hour — Johnny Mirror and his reflection Ynnhoj, from the other side
# of your bathroom mirror. Ynnhoj agrees with everything, half a second too late.
# Occasionally he disagrees, which is alarming. Everyone here is left-handed.
station = "mirror-polka"

[voices]
host = { voice = "am_santa", speed = 1.08, name = "Johnny Mirror" }
ynnhoj = { voice = "am_santa", speed = 1.02, fx = "distant", name = "Ynnhoj" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }

