# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-07"
category = "story"
serial = { id = "greg-comes-home", episode = 7 }
title = "Greg Comes Home, Part Seven: Going Second"
lines = [
  { say = "host", text = "Folks! Somebody's come through the back of the bathroom mirror! It's Greg!", gap = 0.6 },
  { say = "ynnhoj", text = "Greg!" },
  { say = "greg", text = "Sorry. I came out of level nine. Is this the way to the eastern Overlap?" },
  { say = "host", text = "It's the way to everywhere, son, if you go left for long enough! Stay for one dance!" },
  { say = "greg", text = "One dance." },
  { say = "host", text = "Look at him go! Lovely footwork, Greg! Isn't it lovely, Ynnhoj?", gap = 1.0 },
  { say = "ynnhoj", text = "Greg. Can I ask you something?" },
  { say = "greg", text = "Yes." },
  { say = "ynnhoj", text = "You followed someone for forty one years. So do I. Every morning, every night. Always half a second behind.", gap = 1.0 },
  { say = "ynnhoj", text = "Do you miss going second?", gap = 1.6 },
  { say = "greg", text = "No.", gap = 1.0 },
  { say = "greg", text = "I miss him going first.", gap = 1.8 },
  { say = "host", text = "Ynnhoj? You wouldn't ever. You know. Go?", speed = 1.0, gap = 1.0 },
  { say = "ynnhoj", text = "And miss a shave?", gap = 1.0 },
  { say = "ynnhoj", text = "No. I like going second. Somebody has to see where you've been." },
  { say = "host", text = "Greg, the door's on the left. It's always on the left." },
  { say = "greg", text = "Thank you. Both of you.", gap = 0.6 },
  { say = "ynnhoj", text = "Both of you." },
]

