# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "greg-comes-home-06"
category = "story"
serial = { id = "greg-comes-home", episode = 6 }
title = "Greg Comes Home, Part Six: Player One"
lines = [
  { say = "host", text = "Big news, arcade! The shadow from level four! Greg! Best player we've ever had! And today he's leaving!" },
  { say = "greg", text = "Sorry, Player Two." },
  { say = "host", text = "Don't be sorry! Be great! Okay, I'm a bit sad. Greg, buddy, can I ask you something?" },
  { say = "greg", text = "Go on." },
  { say = "host", text = "Would you be my Player One? I've been holding the controller since nineteen eighty-seven. You'd just have to press start.", speed = 1.0, gap = 1.2 },
  { say = "greg", text = "I can't. I'm already somebody's. He's been waiting too.", gap = 1.0 },
  { say = "host", text = "Oh.", speed = 1.0, gap = 1.0 },
  { say = "host", text = "Waiting. Yeah. I know about waiting.", speed = 1.0 },
  { say = "lag", text = "He's going home, Two. Let him go home." },
  { say = "host", text = "Lag's right! Lag's never right! But he's right! Greg, how are you getting there?" },
  { say = "greg", text = "I don't know. It's a long way to the eastern Overlap." },
  { say = "host", text = "Level nine! At the end of level nine there's a door! Nobody uses it, because nobody ever gets to level nine! It comes out through the back of a bathroom mirror!" },
  { say = "host", text = "The password's got a lot of B's in it. And a heart. Try the heart!" },
  { say = "greg", text = "Thank you, Player Two." },
  { say = "host", text = "Hey, Greg. When you get there, tell him somebody else was waiting for somebody too. Tell him it's worth it.", speed = 1.0 },
  { sfx = "beep" },
  { sfx = "beep" },
  { sfx = "ding" },
  { say = "host", text = "He's in! He's through! He's gone!", gap = 1.0 },
  { say = "host", text = "Okay. Here's a song. Not a sad one. A medium one.", speed = 1.0 },
]

[[clip]]
id = "teodor-is-heard-07"
category = "story"
serial = { id = "teodor-is-heard", episode = 7 }
title = "Teodor Is Heard, Part Seven: Press Start"
lines = [
  { say = "host", text = "Something's coming in on the arcade's link cable! From really far away! Hello?" },
  { say = "teodor", text = "This is Relay Four. Is anyone receiving this." },
  { say = "host", text = "Teodor! Teodor from the news! It's Player Two! Can you hear me?" },
  { say = "teodor", text = "In bits. I hear in bits, now. Someone said you've been waiting since nineteen eighty-seven." },
  { say = "host", text = "For Player One! Yeah! How long have you been waiting?" },
  { say = "teodor", text = "Eleven years." },
  { say = "host", text = "Rookie!", gap = 1.0 },
  { say = "host", text = "Sorry. That was mean. It's a waiting joke. We do waiting jokes here.", speed = 1.0 },
  { say = "teodor", text = "I asked the same question every night for eleven years. Is anyone receiving this. And now people are answering, and I don't know what to say." },
  { say = "host", text = "Can I give you a tip? From a professional waiter?", speed = 1.0 },
  { say = "teodor", text = "Please." },
  { say = "host", text = "On the start screen, it says, press start. And you wait for somebody to press it. But sometimes, you have to press it yourself.", speed = 1.0, gap = 0.8 },
  { say = "host", text = "Stop asking if anyone's there! Assume they are! Tell them something! Tell them about your day!", gap = 1.4 },
  { say = "teodor", text = "This is Relay Four.", gap = 0.8 },
  { say = "teodor", text = "Today I mended the fence. Captain came at three. He stole a biscuit. It was a good biscuit.", gap = 0.8 },
  { say = "host", text = "That's it! That's a game! You've started!" },
  { say = "lag", text = "Nearly had him." },
  { say = "host", text = "Lag! Not now!" },
]

