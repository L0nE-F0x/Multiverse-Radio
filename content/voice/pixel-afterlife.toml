# 8-Bit Afterlife — Player Two, from the continue screen, level infinity.
# Excitable and slightly glitchy; has been waiting for Player One to press start since
# 1987. Running bits: Lag, the ghost who keeps losing; AAA, who holds every high score.
station = "pixel-afterlife"

[voices]
host = { voice = "am_echo", speed = 1.12, name = "Player Two" }
lag = { voice = "bm_lewis", speed = 0.9, fx = "cave", name = "Lag (Ghost)" }
bev = { voice = "af_nova", fx = "phone", name = "Bev" }
# v3: serials.
greg = { voice = "am_onyx", fx = "whisper", name = "Greg, a Shadow" }
teodor = { voice = "bm_daniel", fx = "distant", name = "Teodor, Relay Four" }

