  { say = "host", text = "We've got a caller! Player Three has entered the game! Hello!" },
  { say = "bev", text = "Hello, love. It's Bev. Is this the request line? The one with the little tunes?" },
  { say = "host", text = "It's the littlest tunes! What do you need?" },
  { say = "bev", text = "I'm looking for a song. It goes, da da dum, da da." },
  { say = "host", text = "Hang on! Let me try it on the arcade!" },
  { sfx = "beep", seconds = 0.4 },
  { sfx = "beep", seconds = 0.4 },
  { sfx = "beep", seconds = 0.8 },
  { say = "host", text = "Like that?" },
