lines = [
  { say = "host", text = "Did you hear it, at the end of that one? The bass got home. Months on the road, and Augustin walked it right up to the front door." },
  { say = "host", text = "And then he turned round, and started walking back. Of course he did. He's a bass player. Here's the walk back." },
]

