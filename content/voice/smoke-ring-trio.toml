# Smoke Ring Trio — 88.85, the Cumulus Room, a jazz club inside a storm cloud.
#
# Octavia Lowe hosts: velvet, unhurried, describes every solo as a kind of weather. The house
# trio is Mercy Calloway (piano), Augustin Pell (upright bass) and Silas Brushwood (brushes,
# so softly he is sometimes only a rumour). Florian the waiter crosses the cloud very carefully.
#
# Running bits: applause up here makes it rain on somebody down below (it once rained on the
# Gristwick fête); Augustin has been walking the same bass line home since spring; Florian's
# long crossing to table nine. Cross-station: Bev and her song, Grumbel's Ladders.
station = "smoke-ring-trio"

[voices]
host = { voice = "bf_isabella", speed = 0.9, name = "Octavia Lowe" }
florian = { voice = "am_liam", speed = 0.95, name = "Florian, the Waiter" }

[[show]]
id = "supper-club"
name = "The Supper Club Forecast"
blurb = "Dinner, candlelight and a light drizzle of piano. The early set, for people who still have plans."
start = 19
end = 22

[[show]]
id = "the-3am-set"
name = "The 3 AM Set"
blurb = "The diners have gone. The trio plays for each other now. You're welcome to listen, quietly."
start = 2
end = 5

[[show]]
id = "the-morning-after"
name = "The Morning After"
blurb = "Chairs on the tables, coffee on, and the trio still playing. Nobody has had the heart to tell them."
start = 6
end = 9

