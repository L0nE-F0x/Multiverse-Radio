[[clip]]
id = "dj-005"
category = "dj"
lines = [
  { say = "host", text = "A word about Silas, our drummer. Silas plays with brushes, and he plays them so softly that some nights he's only a rumour." },
  { say = "host", text = "People ask me, is there really a drummer? There is, darling. Look closely. That faint weather at the back of the stage. That's Silas." },
]

[[clip]]
id = "dj-006"
category = "dj"
title = "The Long Walk Home"
lines = [
  { say = "host", text = "Augustin, on the bass, has been walking the same bass line since the spring. It's a long walk. He doesn't hurry it." },
  { say = "host", text = "Tonight, for the first time, I think he can see home. Listen for it. Somewhere in the next tune, the bass is going to arrive." },
]

[[clip]]
id = "dj-007"
category = "dj"
