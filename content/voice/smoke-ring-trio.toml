[[clip]]
id = "dj-001"
category = "dj"
lines = [
  { say = "host", text = "That piano solo was a warm front. It came in low from the west, it lingered over the middle eight, and it left everybody slightly damp around the eyes." },
  { say = "host", text = "The bass is now clearing from the north. Lovely conditions. Stay exactly where you are." },
]

[[clip]]
id = "dj-002"
category = "dj"
title = "Please Don't Applaud"
lines = [
  { say = "host", text = "A reminder for those of you in the room. Please don't applaud. We're inside a cloud, and every time you clap, it rains on somebody down below." },
  { say = "host", text = "Last week's standing ovation fell on a village fête. They carried on. They always carry on. So in here we snap our fingers. Snapping is drizzle. Drizzle is fine." },
]

[[clip]]
id = "dj-003"
category = "dj"
title = "Florian Sets Off"
lines = [
  { say = "host", text = "Florian, our waiter, is crossing to table nine with a tray of drinks. He set off at the start of the last number." },
  { say = "host", text = "You have to go carefully, crossing a cloud. You have to believe in every single step. He's halfway. He's doing beautifully. Let's give him one more ballad." },
]

[[clip]]
id = "dj-004"
category = "dj"
title = "Florian Arrives"
lines = [
  { say = "host", text = "News from the floor. Florian has reached table nine. Table nine had drifted off towards the bandstand during the ballad, but he followed it with great dignity, and he didn't spill a drop." },
  { say = "host", text = "The ice has melted. They're delighted. Florian?", gap = 0.5 },
  { say = "florian", text = "Very good, madam. Setting off for table ten." },
