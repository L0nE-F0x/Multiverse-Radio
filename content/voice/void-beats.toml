bed = "room"
lines = [
  { sfx = "phone-ring" },
  { say = "host", text = "Oh. We have a caller. Hello, you're on Void Beats." },
  { say = "bev", text = "Hello, love. It's Bev. Is this the request line?" },
  { say = "host", text = "There's... sort of only one line. So, yes?" },
  { say = "bev", text = "Lovely. I'm trying to find a song. I heard it once, in a lift, in a different dimension. It goes... da da dum. Da da." },
