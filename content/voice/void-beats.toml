# ── Serials (one episode a day; see the other stations for the rest) ─────────

[[clip]]
id = "bev-gets-her-song-07"
category = "story"
serial = { id = "bev-gets-her-song", episode = 7 }
title = "Bev Gets Her Song, Part Seven: The Other Half"
bed = "room"
lines = [
  { sfx = "phone-ring" },
  { say = "host", text = "Oh. A caller. Hello, you're on Void Beats." },
  { say = "bev", text = "Hello, love. It's Bev. I rang before, about the song." },
  { say = "host", text = "Da da dum, da da. I still think about it every day. I was right. It's for life." },
  { say = "bev", text = "I've only got the first half, love. Stan's half. Everyone says, try the void. They say everything lost ends up in there." },
  { say = "host", text = "It's true. My keys are in there. A whole Thursday. Okay. Hum your half. I'll hold the phone up to the window." },
  { say = "bev", text = "Dum. Dum. Da dum.", speed = 0.75, gap = 2.4 },
  { say = "void", text = "Da da dum.", speed = 0.7, gap = 1.2 },
  { say = "void", text = "Da da.", speed = 0.7, gap = 2.0 },
  { say = "host", text = "That was the void. It's never done that before." },
  { say = "bev", text = "That's it. That's the bit after he cried. I haven't heard that bit since he went.", gap = 1.0 },
  { say = "host", text = "Sorry, Bev. I'm crying a bit. The probably-a-cat looks concerned." },
  { say = "bev", text = "Does it know what it's called, love?" },
  { say = "host", text = "Void? What's it called?", gap = 2.5 },
  { say = "void", text = "Hm.", gap = 1.0 },
  { say = "host", text = "It doesn't know. It just kept it safe. That's sort of what it does." },
  { say = "bev", text = "That's what Stan did. He never knew what anything was called. He just kept it." },
  { say = "host", text = "Keep going, Bev. The name's out there somewhere." },
  { say = "bev", text = "Thank you, love. Thank the void for me." },
  { say = "void", text = "Hm." },
]

