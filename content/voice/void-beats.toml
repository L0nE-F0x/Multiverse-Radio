# ══ v4: The Convergence ═══════════════════════════════════════════════════════
#
# Saturdays, 20:00 UTC: every station notices the same thing. One reaction per topic
# (SCHEMA.md, "The Convergence"); the director airs the _events open, then the tuned
# station's reaction, then the close.

[[clip]]
id = "convergence-missing-moon"
category = "event"
title = "The Convergence: A Moon Goes Missing"
event = "convergence"
kit = "missing-moon"
lines = [
  { say = "host", text = "Okay, so, everyone's saying a moon's gone missing, and nobody can agree which one." },
  { say = "host", text = "I checked. My good mug is still up on the ceiling, being a small moon. So it's not that one. Phew." },
  { say = "void", text = "Hm." },
]

[[clip]]
id = "convergence-the-smell"
category = "event"
title = "The Convergence: Toast, Everywhere"
event = "convergence"
kit = "the-smell"
lines = [
  { say = "host", text = "Does it smell like toast in here? It smells like toast everywhere, apparently." },
  { say = "host", text = "The void says it wasn't the void. The void has never made toast. The void can't reach the toaster." },
]

[[clip]]
id = "convergence-the-song"
category = "event"
title = "The Convergence: The Song Nobody Can Finish"
event = "convergence"
kit = "the-song"
lines = [
