# Void Beats — DJ Eventually, from Room 0 (which has no door).
# Running bits: sentences that never quite start, the void as a roommate who never does
# the dishes, the probably-a-cat asleep on the notes. Cross-station: Greg, Bev, Grumbel's.
station = "void-beats"

[voices]
host = { voice = "af_heart", speed = 0.92, name = "DJ Eventually" }
void = { voice = "am_onyx", speed = 0.8, fx = "cave", name = "The Void" }
bev = { voice = "bf_lily", fx = "phone", name = "Bev" }

